,"a":0,"img":[],"tags":[]},{"id":"P-6-02","no":"6-02","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"P-6-03","no":"6-03","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"P-6-04","no":"6-04","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"P-6-05","no":"6-05","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"P-6-08","no":"6-08","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"P-6-09","no":"6-09","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"P-6-11","no":"6-11","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"P-6-12","no":"6-12","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"P-6-13","no":"6-13","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"P-6-06","no":"6-06","q":"","o":[],"a":0,"img":[],"tags":[]}],"star":3}],"practice":[{"no":1,"t":"육안·현미경 사진 판독","core":"","secs":[],"point":"","items":[{"id":"P-실1-01","no":"실1-01","q":"사진과 같은 지방변성을 보이는 대표적인 장기로 옳은 것은?","o":["이자(췌장)","뇌","지라(비장)","간","폐"],"img":["path_prac_pat_001.jpg"],"tags":[],"lv":3,"a":3,"look":"다각형 실질세포의 세포질이 크고 둥근 빈 공포로 채워져 있고, 큰 공포가 있는 세포는 핵이 가장자리로 밀려 있다. 작은 공포가 여러 개 모인 세포도 섞여 있다.","e":"공포는 조직 처리 중 지방이 녹아 빠진 자리로 간세포에 중성지방이 쌓인 지방변성(fatty change, steatosis)이다. 지방 대사 중심 장기인 간이 알코올, 비만, 당뇨병 등으로 가장 흔히 보인다.","w":["① 이자(췌장)는 급성 췌장염 때 지방괴사가 생기는 장기로 지방변성 호발 장기가 아니다.","② 뇌는 허혈 시 액화괴사가 생기는 장기로 지방변성 호발 장기가 아니다.","③ 지라(비장)는 지방변성 호발 장기가 아니며, 지방변성은 간·신장·심근·골격근에 흔하다.","⑤ 폐는 지방 대사의 중심 장기가 아니어서 지방변성 호발 장기가 아니다. 지방변성은 간 외에 심장, 콩팥에서 주로 본다."],"k":"간세포 세포질 큰 지방 공포, 핵 주변부 밀림 = 간 지방변성."},{"id":"P-실1-03","no":"실1-03","q":"사진으로 알 수 있는 괴사는?","o":["응고괴사","액화괴사","건락괴사","괴저괴사","지방괴사"],"img":["path_prac_pat_003.jpg"],"tags":[],"lv":3,"a":2,"look":"위쪽 사진에 핵이 세포 가장자리를 따라 말굽 모양으로 늘어선 랑한스 거대세포(Langhans giant cell)와 유상피세포(epithelioid cell), 바깥의 림프구 띠가 있다. 아래쪽 사진에는 육아종 중심에 세포 윤곽이 사라진 무구조 호산성 괴사가 있다.","e":"유상피세포, 랑한스 거대세포, 림프구로 이루어진 육아종 중심의 무구조 괴사는 결핵의 건락괴사(caseous necrosis)다. 육안으로 치즈처럼 희고 부스러진다.","w":["① 응고괴사는 허혈로 생기며 세포 윤곽이 남고 육아종을 동반하지 않는다.","② 액화괴사는 뇌경색과 농양에서 조직이 녹는 괴사이다.","④ 괴저괴사는 세균 감염을 동반한 괴사이다.","⑤ 지방괴사는 급성 췌장염에서 보이는 괴사이다."],"k":"랑한스 거대세포 육아종 + 중심 무구조 괴사 = 건락괴사."},{"id":"P-실1-05","no":"실1-05","q":"사진의 병변에서 원인을 규명하기 위해 실시하는 검사법으로 옳은 것은?","o":["AFB staining","Gram staining","Wright staining","Elastic fiber staining","Masson trichrome staining"],"img":["path_prac_pat_005.jpg"],"tags":[],"lv":3,"a":0,"look":"왼쪽 아래에 무구조 호산성 괴사가 있고, 그 주위로 유상피세포와 여러 개의 핵을 가진 랑한스 거대세포가 모여 육아종을 이룬다. 건락괴사를 동반한 육아종 소견이다.","e":"건락성 육아종은 결핵을 먼저 의심하므로 항산성균(AFB) 염색으로 원인균을 확인한다. 지일-닐센(Ziehl-Neelsen) 염색에서 결핵균은 붉게 염색된다.","w":["② 그람염색(Gram stain)은 일반 세균을 그람양성과 음성으로 구분하며, 지질이 많은 결핵균은 잘 염색되지 않는다.","③ Wright 염색은 혈구 도말 표본에 쓰는 염색이다.","④ 탄력섬유염색은 혈관벽과 폐의 탄력섬유를, ⑤ 마손삼색염색(Masson trichrome stain)은 교원섬유와 근육을 구분하는 결합조직 염색이다."],"k":"건락성 육아종 원인 규명 = 항산성균(AFB) 염색."},{"id":"P-실1-09","no":"실1-09","q":"염색체 검사에서 아래와 같은 결과를 얻었다. 생식샘저하증을 특징으로 하는 이 유전질환으로 옳은 것은?","o":["XYY syndrome","Klinefelter syndrome","Turner syndrome","Patau syndrome","Trisomy 18"],"img":["path_prac_pat_009.jpg"],"tags":[],"lv":3,"a":2,"look":"상염색체 1~22번은 모두 2개씩이고, 성염색체 자리에는 X 염색체가 1개만 있으며 Y 염색체는 없다. 핵형은 45,X다.","e":"45,X 핵형은 터너 증후군(Turner syndrome)이다. 난소가 섬유성 띠로 남아 원발성 무월경과 불임을 보이고 저신장, 익상경(webbed neck)이 동반된다.","w":["① XYY 증후군은 Y 염색체가 하나 더 있는 별개의 성염색체 이상이다.","② 클라인펠터 증후군(Klinefelter syndrome)은 47,XXY 핵형으로 남성 생식샘저하증을 보이지만 사진처럼 X가 하나뿐이지 않다.","④ 파타우증후군은 13번 삼염색체증(47,+13)이다.","⑤ Trisomy 18은 에드워즈증후군이다."],"k":"45,X = 터너 증후군."},{"id":"P-실1-10","no":"실1-10","q":"아래와 같은 염색체 검사 결과로 추정할 수 있는 유전 질환으로 옳은 것은?","o":["터너 증후군","다운 증후군","에드워즈 증후군","클라인펠터 증후군","스타인-레벤탈 증후군"],"img":["path_prac_pat_010.jpg"],"tags":[],"lv":3,"a":1,"look":"21번 자리에 염색체가 3개 있고, 성염색체는 X와 Y가 1개씩이다. 핵형은 47,XY,+21이다.","e":"21 삼염색체증(47,+21)은 다운 증후군(Down syndrome)으로, 가장 흔한 상염색체 수적 이상이며 산모 나이가 많을수록 빈도가 높다.","w":["① 터너 증후군은 45,X 핵형이다.","③ 에드워즈 증후군은 18번 삼염색체증(47,+18)이다.","④ 클라인펠터 증후군은 47,XXY 핵형이다.","⑤ 스타인-레벤탈 증후군(Stein-Leventhal syndrome)은 다낭성 난소 증후군으로 염색체 수적 이상 질환이 아니다."],"k":"21번 염색체 3개(47,+21) = 다운 증후군."},{"id":"P-실1-11","no":"실1-11","q":"사진의 병리조직학적 소견으로 알 수 있는 염증의 종류로 옳은 것은?","o":["만성 염증","급성 염증","화농성 염증","장액성 염증","섬유소성 염증"],"img":["path_prac_pat_011.jpg"],"tags":[],"lv":3,"a":0,"look":"핵이 여러 개인 다핵거대세포가 있고, 주위에 핵이 둥글고 치우친 형질세포와 림프구, 세포질이 넓은 대식세포(화살표)가 가득 침윤해 있다. 호중구는 거의 보이지 않는다.","e":"림프구, 형질세포, 대식세포 같은 단핵세포 침윤과 다핵거대세포는 만성 염증(chronic inflammation)의 특징이다.","w":["② 급성 염증은 호중구 침윤, 부종, 충혈이 주된 소견이다.","③ 화농성 염증은 호중구가 많이 모이는 염증이다.","④ 장액성 염증은 화상 물집처럼 맑은 액체가 나오는 염증이다.","⑤ 섬유소성 염증은 섬유소가 쌓이는 염증이다."],"k":"림프구, 형질세포, 대식세포, 다핵거대세포 = 만성 염증."},{"id":"P-실1-12","no":"실1-12","q":"만성 자궁경관염 환자의 병리조직학적 소견이다. 검정 화살표와 흰 화살표가 가리키는 세포를 바르게 연결한 것은?","o":["단구-림프구","호중구-호산구","림프구-호중구","호염기구-호산구","형질세포-림프구"],"img":["path_prac_pat_012.jpg"],"tags":[],"lv":3,"a":4,"look":"검정 화살표 세포는 세포질이 비교적 넓고 핵이 한쪽으로 치우쳐 있으며 핵 옆에 밝은 무리(perinuclear halo)가 있다. 흰 화살표 세포는 세포질이 거의 없는 작고 둥근 진한 핵의 세포가 빽빽이 모여 있다.","e":"치우친 핵과 핵 주위 밝은 무리는 형질세포(plasma cell), 작고 둥근 진한 핵과 좁은 세포질은 림프구(lymphocyte)이며, 둘 다 만성 염증의 대표 세포다.","w":["① 단구는 조직으로 나가 큰포식세포가 되는 세포로 핵이 치우치고 핵 주위가 밝은 세포가 아니다.","② 호중구는 급성 염증의 주된 세포이고 호산구는 알레르기와 기생충 감염에서 증가한다.","③ 호중구는 분엽핵을 보이는 급성 염증의 주된 세포다.","④ 호염기구와 호산구는 즉시형 과민반응과 알레르기에 관련된 세포다."],"k":"치우친 핵 + 핵 주위 밝은 무리 = 형질세포, 작고 둥근 진한 핵 = 림프구."},{"id":"P-실1-13","no":"실1-13","q":"사진의 장기를 관찰하여 추정할 수 있는 육안 소견으로 옳은 것은?","o":["급성 간염","급성 위염","급성 폐렴","급성 사구체염","급성 충수돌기염"],"img":["path_prac_pat_013.jpg"],"tags":[],"lv":3,"a":4,"look":"길이 약 7~8 cm의 가늘고 굽은 관 모양 장기로, 장막 표면이 충혈되어 검붉고 일부는 황록색 삼출물로 덮여 있다. 절제된 충수돌기의 모양이다.","e":"충수돌기 장막의 충혈과 섬유소화농성 삼출물은 급성 충수돌기염(acute appendicitis)의 육안 소견이며, 진행하면 괴저와 천공이 생긴다.","w":["① 급성 간염은 큰 실질 장기인 간 전체의 병변이며 사진처럼 가늘고 굽은 관 모양 장기에 생기지 않는다.","② 위는 주머니 모양 장기로 급성 위염은 점막의 충혈, 부종, 미란이 주 소견이다.","③ 급성 폐렴은 폐 실질이 삼출물로 차서 단단해지는 경화(간화)가 육안 소견이다.","④ 급성 사구체염은 콩팥 표면의 점상 출혈(flea-bitten kidney)이 특징이다."],"k":"충혈과 삼출물로 덮인 굽은 관 모양 장기 = 급성 충수돌기염."},{"id":"P-실1-15","no":"실1-15","q":"아래와 같은 병리조직학적 소견으로 추정할 수 있는 질병으로 옳은 것은?","o":["당뇨병","폐암","결핵","간암","대장염"],"img":["path_prac_pat_015.jpg"],"tags":[],"lv":3,"a":2,"look":"분홍색 세포질의 유상피세포가 둥글게 모여 결절을 이루고, 아래쪽에 여러 핵을 가진 랑한스 거대세포가 있으며, 바깥은 섬유조직과 림프구가 둘러싼다. 중심부는 세포 윤곽이 흐린 괴사 경향을 보인다.","e":"유상피세포, 랑한스 거대세포, 림프구로 이루어진 육아종과 중심의 건락괴사는 결핵(tuberculosis)의 전형적 소견이다.","w":["① 당뇨병은 이자섬 β세포 손상, 사구체의 결절성 경화 등이 소견이며 육아종을 만들지 않는다.","② 폐암은 종양으로 건락괴사·육아종 소견과 맞지 않는다.","④ 간암은 종양으로 건락괴사·육아종 소견과 무관하다.","⑤ 대장염은 크론병을 제외하면 육아종이 특징이 아니다."],"k":"유상피세포 + 랑한스 거대세포 육아종 = 결핵."},{"id":"P-실1-16","no":"실1-16","q":"육아종성 염증 부위를 지일-닐센(Ziehl-Neelsen) 염색(acid-fast stain)한 결과 아래와 같이 붉은색으로 염색되었다. 유추할 수 있는 세균으로 옳은 것은?","o":["임균","매독균","결핵균","대장균","살모넬라"],"img":["path_prac_pat_016.jpg"],"tags":[],"lv":3,"a":2,"look":"메틸렌블루로 대조염색된 푸른 배경에서 육아종 부위 세포들 안에 붉은 자주색으로 염색된 물질이 모여 있다. 탈색 후에도 카볼푸크신의 붉은색을 유지한 항산성 양성 소견이다.","e":"결핵균(Mycobacterium tuberculosis)은 세포벽에 미콜산(mycolic acid)이 많아 산알코올로 탈색되지 않고 붉게 남는 대표적 항산성균이다.","w":["① 임균은 그람음성 쌍알균으로 여성 생식기 염증을 일으킨다.","② 매독균은 나선균으로 은 염색이나 암시야 현미경으로 본다.","④ 대장균은 그람음성 막대균으로 항산성이 없어 지일-닐센 염색에서 붉게 남지 않는다.","⑤ 살모넬라는 장티푸스를 일으키는 그람음성 막대균으로 항산성이 없다."],"k":"지일-닐센 염색에서 붉은 항산성균 = 결핵균."},{"id":"P-실1-18","no":"실1-18","q":"사진과 같이 광범위한 출혈이 있는 장기로 옳은 것은?","o":["뇌","간","폐","위","콩팥"],"img":["path_prac_pat_018.jpg"],"tags":[],"lv":3,"a":0,"look":"관상 절단면에서 대뇌 피질의 이랑과 고랑, 백질, 가쪽뇌실이 보이고, 한쪽 대뇌반구 깊은 부위에 검붉은 큰 혈종이 자리해 주변 조직을 밀어내고 있다.","e":"이랑, 고랑, 회백질과 백질, 뇌실 구조로 뇌임을 알 수 있고, 실질 안의 큰 혈종은 뇌내출혈이다. 고혈압성 뇌출혈은 기저핵, 시상에 흔하다.","w":["② 간은 소엽 구조의 실질 장기로 이랑, 고랑, 뇌실이 없다.","③ 폐는 기관지와 허파꽈리로 된 스펀지 모양 실질로 이랑과 뇌실이 없다.","④ 위는 점막 주름이 있는 주머니 모양 장기로 회색질과 백질 구분이 없다.","⑤ 콩팥은 피질, 수질, 신우로 나뉘며 이랑과 뇌실이 없다."],"k":"이랑, 백질, 뇌실 구조 + 실질 내 큰 혈종 = 뇌내출혈."},{"id":"P-실1-24","no":"실1-24","q":"자궁을 절단하였을 때 관찰된 병리해부 소견으로 추정할 수 있는 질환명으로 옳은 것은?","o":["용종","암종","포상기태","유두암종","육종"],"img":["path_prac_pat_024.jpg"],"tags":[],"lv":3,"a":2,"look":"자궁강을 반투명한 작은 물주머니가 포도송이처럼 가득 채우고 있으며 태아 구조는 보이지 않는다.","e":"융모가 수종성으로 부풀어 포도송이 모양 수포를 이루면 포상기태(hydatidiform mole)다. 영양막세포가 증식하고 혈청 hCG가 크게 오른다.","w":["① 용종(polyp)은 점막에서 돌출한 병변으로 샘종 등이 이 형태를 띤다.","② 암종은 상피에서 생긴 악성종양이다.","④ 유두암종은 갑상샘에 흔한 상피성 악성종양이다.","⑤ 육종은 비상피성 조직에서 생긴 악성종양이다."],"k":"자궁강의 포도송이 모양 수포 = 포상기태."},{"id":"P-실1-25","no":"실1-25","q":"장기의 육안 소견과 병리조직학적 소견을 통해 알 수 있는 조직의 변화로 옳은 것은?","o":["응고괴사","액화괴사","지방괴사","괴저성 괴사","섬유소양 괴사"],"img":["path_prac_pat_025.jpg"],"tags":[],"lv":3,"a":0,"look":"콩팥 세뇨관의 윤곽은 그대로 남아 있으나 가운데 부위의 세포는 핵이 사라지고 세포질이 균일한 분홍색이다. 가장자리의 세뇨관만 핵을 유지하고 있다.","e":"조직 윤곽이 남은 채 핵이 소실되고 세포질이 호산성으로 변하는 것은 응고괴사(coagulative necrosis)이며, 허혈에 의한 콩팥 경색에서 전형적이다.","w":["② 액화괴사는 뇌경색과 농양에서 조직이 녹는 괴사이다.","③ 지방괴사는 이자 효소가 지방을 분해해 칼슘 비누를 만드는 괴사다.","④ 괴저성 괴사는 세균 감염을 동반한 괴사이다.","⑤ 섬유소양 괴사는 혈관벽에 섬유소가 침착하는 괴사로 악성 고혈압이나 혈관염에서 본다."],"k":"세뇨관 윤곽 보존 + 핵 소실 = 응고괴사."},{"id":"P-실1-26","no":"실1-26","q":"잇몸의 병리조직학적 소견으로 각질진주(keratin pearl)가 특징적으로 관찰되는 질환명으로 옳은 것은?","o":["육종","샘암종","유두암종","편평세포암종","인환세포암종"],"img":["path_prac_pat_026.jpg"],"tags":[],"lv":3,"a":3,"look":"표면의 편평상피 아래 기질로 불규칙한 호산성 상피세포 둥지가 깊게 침윤하고, 둥지 중심에 층판 모양의 각질이 모여 있다.","e":"편평상피 둥지 중심에 동심원상 각질이 쌓인 각질진주는 편평세포암종(squamous cell carcinoma)의 특징이다. 중층편평상피인 구강 점막에서 가장 흔한 암이다.","w":["① 육종은 비상피성 조직의 악성종양이다.","② 샘암종은 원주(샘)세포에서 발생하는 악성종양이다.","③ 유두암종은 갑상샘에 흔한 상피성 악성종양이다.","⑤ 인환세포암종은 세포 안 점액이 핵을 가장자리로 밀어낸 반지 모양 세포가 흩어져 침윤한다."],"k":"각질진주 = 편평세포암종."},{"id":"P-실1-27","no":"실1-27","q":"편평세포암종으로 진단된 병리조직학적 사진이다. 이와 같은 암이 발생할 수 있는 부위로 옳은 것은?","o":["식도점막상피","자궁내막상피","대장점막상피","갑상샘 여포상피","위점막상피"],"img":["path_prac_pat_027.jpg"],"tags":[],"lv":3,"a":0,"look":"표면을 두꺼운 중층편평상피가 덮고 있고, 그 아래 기질에 이형 상피세포가 불규칙하게 침윤해 있다.","e":"편평세포암종은 중층편평상피로 덮인 부위에서 잘 생긴다. 보기 중 식도점막만 비각화 중층편평상피이고, 자궁내막, 대장, 위는 원주상피, 갑상샘 여포는 단층입방상피다.","w":["② 자궁내막상피는 원주세포로 덮여 있어 샘암종이 생긴다.","③ 대장점막상피는 원주세포로 덮여 있어 샘암종이 생긴다.","④ 갑상샘 여포상피는 단층입방상피로, 갑상샘에서는 편평세포암종이 아니라 유두암종이 흔하다.","⑤ 위점막상피는 원주세포로 덮여 있어 샘암종이 생긴다."],"k":"중층편평상피 장기(식도) = 편평세포암종."},{"id":"P-실1-29","no":"실1-29","q":"사진의 병리조직학적 소견으로 옳은 것은?","o":["간암","간섬유증","간경화","지방변성","간염"],"img":["path_prac_pat_029.jpg"],"tags":[],"lv":3,"a":3,"look":"중심정맥 주위의 간세포가 부풀어 있고 세포질에 크고 작은 둥근 투명 공포가 많다. 간세포삭 배열은 유지되고 섬유화나 염증세포 침윤은 뚜렷하지 않다.","e":"간세포 세포질의 둥근 투명 공포는 중성지방이 쌓인 지방변성(fatty change)이다. 파라핀 처리 중 지방이 녹아 빈 공포로 보인다.","w":["① 간암은 이형 종양세포가 두꺼운 잔기둥이나 샘 모양으로 증식하여 정상 간세포삭 배열이 무너진다.","② 간섬유증과 ③ 간경화는 섬유 격벽이 생기고, 간경화에서는 재생결절이 형성된다.","⑤ 간염은 간세포 손상과 염증이 주 소견이다."],"k":"간세포 세포질의 둥근 투명 공포 = 지방변성."},{"id":"P-실1-31","no":"실1-31","q":"병리조직학적 사진에서 공포 내에 축적된 물질로 옳은 것은?","o":["아밀로이드","점액","담즙","지방","철"],"img":["path_prac_pat_031.jpg"],"tags":[],"lv":3,"a":3,"look":"간세포 세포질에 크고 작은 둥근 투명 공포가 많고, 큰 공포는 핵을 가장자리로 밀어낸다(화살표). 가운데에는 염증세포가 모여 있다.","e":"간세포의 경계가 뚜렷한 둥근 투명 공포는 조직 처리 중 녹아 없어진 지방(중성지방) 자리다. 동결절편 지방염색으로 확인한다.","w":["① 아밀로이드는 세포 밖에 무구조 호산성 물질로 침착하며 공포를 만들지 않는다.","② 점액은 PAS 염색에 적자색으로 염색된다.","③ 담즙의 색소인 빌리루빈은 황달을 일으킨다.","⑤ 철은 황갈색 과립(혈철소)으로 보이며 프러시안블루(Prussian blue) 염색에 청색이다."],"k":"간세포의 둥근 투명 공포 = 지방."},{"id":"P-실1-32","no":"실1-32","q":"결핵성 장염의 내시경 사진이다. 병리조직검사를 통해 관찰할 수 없는 것은?","o":["형질세포","섬유모세포","종양세포","유상피세포","랑한스거대세포"],"img":["path_prac_pat_032.jpg"],"tags":[],"lv":3,"a":2,"look":"대장 내강 점막에 불규칙한 궤양과 흰 삼출물, 결절성 융기가 있고 점막이 붉게 부어 있다. 결핵성 장염의 궤양성 병변이다.","e":"결핵성 장염에서는 유상피세포, 랑한스거대세포로 된 육아종과 그 주위의 림프구, 형질세포, 섬유모세포가 관찰된다. 종양을 시사하는 이형세포는 보이지 않는다.","w":["① 형질세포는 결핵 육아종 주위에서 관찰되는 만성염증 세포이다.","② 섬유모세포는 결핵 결절 바깥을 감싸는 세포이다.","④ 유상피세포는 결핵 육아종을 이루는 활성화된 대식세포이다.","⑤ 랑한스거대세포(Langhans giant cell)는 핵이 말굽 모양으로 배열한 다핵거대세포로 결핵 육아종의 특징이다."],"k":"결핵 육아종 구성 = 유상피세포, 랑한스거대세포, 림프구, 형질세포, 섬유모세포."},{"id":"P-실1-30","no":"실1-30","q":"사진에서 관찰되는 육안적인 병변으로 옳은 것은?","o":["괴저괴사","건락괴사","응고괴사","지방괴사","액화괴사"],"img":["path_prac_pat_030.jpg"],"tags":[],"lv":3,"a":2,"look":"콩팥 절단면의 피질에서 수질 쪽으로 좁아지는 쐐기 모양의 노란색 병변이 있고, 그 경계를 따라 붉은 충혈대가 둘러싼다.","e":"종말동맥이 막혀 생긴 쐐기 모양 창백한(빈혈성) 경색은 응고괴사로 이루어지며, 콩팥, 지라, 심장처럼 단일 동맥 공급을 받는 고형 장기에서 전형적이다.","w":["① 괴저괴사는 사지나 장의 허혈 괴사에 세균 감염이 겹쳐 검게 변한 것이다.","② 건락괴사는 결핵 육아종 중심의 치즈 같은 무구조 괴사다.","④ 지방괴사는 이자와 유방 지방조직에서 분필 같은 흰 반점을 만든다.","⑤ 액화괴사는 뇌경색이나 농양에서 조직이 녹아 공동을 만든다."],"k":"콩팥 쐐기 모양 창백한 경색 = 응고괴사."},{"id":"P-실1-33","no":"실1-33","q":"아래 사진과 같이 울혈이 잘 일어나는 장기로 옳은 것은?","o":["간","지라","폐","위","콩팥"],"img":["path_prac_pat_033.jpg"],"tags":[],"lv":3,"a":2,"look":"절단면 가운데에 연골로 둘러싸인 기관지와 혈관 단면이 있고 실질이 스펀지 모양이다. 실질 전체가 붉은 자줏빛으로 혈액이 차 있다.","e":"기관지가 보이는 스펀지 모양 실질은 폐이며, 붉고 무거워진 것은 폐울혈이다. 좌심부전으로 폐정맥압이 오르면 폐에 울혈과 부종이 잘 생긴다.","w":["① 간은 우심부전에서 육두구간(nutmeg liver) 모양의 만성 울혈을 보인다.","② 지라는 적색속질과 백색속질로 된 실질 장기로 기관지와 스펀지 모양 실질이 없다.","④ 위는 점막 주름이 있는 주머니 모양 장기로 울혈 시에도 기관지 구조가 보이지 않는다.","⑤ 콩팥은 피질과 수질로 나뉘며 기관지와 스펀지 모양 실질이 없다."],"k":"기관지 보이는 붉은 스펀지 실질 = 폐울혈."},{"id":"P-실1-36","no":"실1-36","q":"병리조직학적 사진을 보고 진단할 수 있는 병변으로 옳은 것은?","o":["색소모반","기저세포암종","편평세포암종","갈색세포종","악성 흑색종"],"img":["path_prac_pat_036.jpg"],"tags":[],"lv":3,"a":4,"look":"핵이 크고 핵소체가 뚜렷한 상피모양 이형세포가 둥지를 이루어 증식하고, 세포 안팎에 흑갈색 색소 과립이 흩어져 있다.","e":"이형세포 둥지와 흑갈색 멜라닌 색소는 멜라닌세포 기원의 악성 흑색종(malignant melanoma) 소견이다.","w":["① 색소모반도 멜라닌세포 둥지와 색소를 보이지만 세포가 작고 균일하며 핵소체가 뚜렷한 이형이 없다.","② 기저세포암종은 가장자리가 울타리 모양으로 늘어선 작은 기저양 세포 무리로, 핵소체가 뚜렷한 큰 이형세포 둥지가 아니다.","③ 편평세포암종은 호산성 세포질의 각화와 각화진주를 보이며 멜라닌 색소가 없다.","④ 갈색세포종(pheochromocytoma)은 부신수질 크롬친화세포 종양으로 소포(zellballen) 모양으로 배열하며 멜라닌 색소가 없다."],"k":"이형세포 둥지 + 흑갈색 멜라닌 색소 = 흑색종."},{"id":"P-실1-37","no":"실1-37","q":"사진과 같은 변화가 가장 많이 발생하는 장기로 옳은 것은?","o":["간","뇌","폐","비장","췌장"],"img":["path_prac_qa_pat_001.jpg"],"tags":[],"lv":3,"a":0,"look":"다각형 실질세포의 세포질에 크고 작은 둥근 빈 공포가 가득 차 있고, 큰 공포는 핵을 가장자리로 밀어낸다. 지방이 처리 과정에서 녹아 빠져나간 자리로, 간세포의 지방변성(fatty change)이다.","e":"간은 지방산의 섭취, 합성, 산화와 지단백 분비가 모두 일어나는 지방대사 중심 장기다. 알코올, 비만, 당뇨병 등으로 이 과정이 막히면 지방변성이 가장 흔히 생긴다.","w":["② 뇌는 허혈 시 액화괴사가 생기는 장기로 지방변성 호발 장기가 아니다.","③ 폐는 지방 대사의 중심 장기가 아니어서 지방변성 호발 장기가 아니다.","④ 비장은 지방변성 호발 장기가 아니며, 지방변성은 간·신장·심근·골격근에 흔하다.","⑤ 췌장은 급성 췌장염 때 지방괴사가 생기는 장기로 지방변성 호발 장기가 아니다. 간 다음으로 지방변성이 흔한 장기는 심장, 콩팥, 골격근이다."],"k":"지방변성 호발 장기 = 간."},{"id":"P-실1-35","no":"실1-35","q":"간의 특수염색 사진이다. 검게 염색된 물질은 무엇인가?","o":["아밀로이드","중성 점액","지방","글리코겐","담즙"],"img":["path_prac_pat_035.jpg"],"tags":[],"lv":3,"a":2,"look":"간세포 안에 크고 작은 둥근 방울이 흑청색으로 진하게 염색되어 있고, 문맥역 주변은 염색되지 않았다.","e":"간세포 내 둥근 방울을 검게 물들이는 것은 수단블랙 B(Sudan black B)나 오스뮴산 같은 지방염색이다. 지방은 파라핀 처리에서 녹으므로 동결절편으로 염색한다.","w":["① 아밀로이드는 콩고레드(Congo red)에 주황색으로 염색되고 편광에서 사과녹색 복굴절을 보인다.","② 중성 점액과 ④ 글리코겐은 PAS 염색에 적자색이며, 글리코겐은 디아스타제(diastase) 처리 후 사라진다.","⑤ 담즙의 색소인 빌리루빈은 황달을 일으킨다."],"k":"간세포 내 둥근 방울의 흑색 염색(수단블랙 B, 오스뮴) = 지방."},{"id":"P-실1-38","no":"실1-38","q":"사진의 병변에서 원인을 규명하기 위해 실시하는 검사법으로 옳은 것은?","o":["AFB Staining","Wright staining","Gram staining","Elastic fiber staining","Masson trichrome staining"],"img":["path_prac_qa_pat_002.jpg"],"tags":[],"lv":3,"a":0,"look":"왼쪽 아래에 핵이 사라진 무구조의 분홍색 괴사 부위가 있고, 그 주변을 길쭉한 핵의 상피양세포(epithelioid cell)와 핵이 가장자리에 늘어선 다핵거대세포가 둘러싼다. 건락괴사를 동반한 육아종이다.","e":"건락괴사를 동반한 육아종은 결핵의 전형 소견이며, 결핵균은 항산성이므로 항산균(AFB) 염색인 Ziehl-Neelsen 염색으로 붉은 막대균을 확인한다.","w":["② Wright 염색은 혈구 도말 표본에 쓰는 염색이다.","③ Gram staining에서 세포벽에 지질이 많은 결핵균은 잘 염색되지 않는다.","④ 탄력섬유염색은 혈관벽과 폐의 탄력섬유를 보는 염색이다.","⑤ Masson trichrome staining은 아교섬유와 근육을 구분해 섬유화 정도를 보는 염색이다."],"k":"건락성 육아종(결핵) = 항산균 염색."},{"id":"P-실1-39","no":"실1-39","q":"염색체검사에서 아래와 같은 결과를 얻었다. 핵형으로 추정되는 유전질환은?","o":["에드워즈 증후군","XYY 증후군","파타우 증후군","터너 증후군","클라인펠터 증후군"],"img":["path_prac_qa_pat_004.jpg"],"tags":[],"lv":3,"a":3,"look":"상염색체 1~22번은 모두 2개씩 정상이고, 성염색체 자리에 X염색체 1개만 있고 Y염색체가 없다. 핵형은 45,X다.","e":"45,X 핵형은 터너 증후군(Turner syndrome)이다. 난소가 섬유성 띠(streak gonad)로 남아 일차 무월경과 불임이 나타나며, 저신장, 물갈퀴목, 대동맥축착이 동반된다.","w":["① 에드워즈 증후군(Edwards syndrome)은 18번 삼염색체증(47,+18)이다.","② XYY 증후군은 Y 염색체가 하나 더 있는 47,XYY 핵형이다.","③ 파타우 증후군(Patau syndrome)은 13번 삼염색체증(47,+13)이다.","⑤ 클라인펠터 증후군(Klinefelter syndrome)은 47,XXY 핵형이다."],"k":"45,X = 터너증후군."},{"id":"P-실1-40","no":"실1-40","q":"만성 염증의 병리조직학적 소견으로 혈관 주위에 관찰되는 세포로 옳은 것은?","o":["호중구","림프구","호산구","혈소판","호염기구"],"img":["path_prac_qa_pat_011.jpg"],"tags":[],"lv":3,"a":1,"look":"섬유화된 간질에 세포질이 거의 없는 작고 둥근 진한 핵의 세포가 혈관 주위와 간질에 흩어져 있고, 왼쪽 아래에는 이 세포들이 모여 있다. 다엽핵 세포는 거의 보이지 않는다.","e":"만성 염증의 주된 침윤 세포는 림프구, 형질세포, 대식세포 같은 단핵세포다. 작고 둥근 진한 핵의 림프구가 혈관 주위에 모여 침윤하는 것이 특징이다.","w":["① 호중구는 급성 염증의 주된 세포로 분엽핵을 보인다.","③ 호산구는 알레르기와 기생충 감염에서 증가하며 두 개로 나뉜 핵과 붉은 과립이 특징이다.","④ 혈소판은 혈전을 이루는 혈액 성분으로 염증세포가 아니다.","⑤ 호염기구는 히스타민과 관련된 세포이다."],"k":"만성 염증의 혈관 주위 침윤 = 림프구."},{"id":"P-실1-41","no":"실1-41","q":"사진과 같이 광범위하게 출혈이 있는 장기로 옳은 것은?","o":["뇌","간","폐","위","콩팥"],"img":["path_prac_qa_pat_014.jpg"],"tags":[],"lv":3,"a":0,"look":"관상면으로 자른 단면에 바깥의 회색질과 안쪽의 흰색질, 가운데의 가쪽뇌실이 보인다. 한쪽 대뇌반구 깊은 곳에 검붉은 혈종이 넓게 차 있고 뇌실 쪽으로 터져 들어간다.","e":"회색질, 흰색질, 뇌실 구조로 뇌임을 알 수 있고 실질 안 출혈은 뇌내출혈이다. 고혈압성 뇌출혈은 바닥핵과 시상에 잘 생기며 뇌실로 파급될 수 있다.","w":["② 간은 소엽 구조의 실질 장기로 회색질, 흰색질, 뇌실이 없다.","③ 폐는 기관지와 허파꽈리로 된 스펀지 모양 실질로 뇌실 구조가 없다.","④ 위는 점막 주름이 있는 주머니 모양 장기로 회색질과 흰색질 구분이 없다.","⑤ 콩팥은 피질, 수질, 신우로 나뉘며 뇌실 구조가 없다."],"k":"회색질, 흰색질, 뇌실 + 혈종 = 뇌내출혈."},{"id":"P-실1-43","no":"실1-43","q":"자궁을 절단하였을 때 관찰된 병리해부 소견으로 추정할 수 있는 질환으로 옳은 것은?","o":["용종","암종","육종","포상기태","유두암종"],"img":["path_prac_qa_pat_019.jpg"],"tags":[],"lv":3,"a":3,"look":"절개한 자궁 안을 반투명한 작은 물집 모양 덩이가 포도송이처럼 가득 채우고 있다. 정상 태아 조직은 보이지 않는다.","e":"융모가 붓고 물집처럼 커진 포도송이 모양 소포는 포상기태의 전형적 육안 소견이다. 영양막세포가 증식하며 혈중 hCG가 매우 높아진다.","w":["① 용종(polyp)은 점막에서 돌출한 병변으로 샘종 등이 이 형태를 띤다.","② 암종은 상피에서 생긴 악성종양이다.","③ 육종은 비상피성 조직에서 생긴 악성종양이다.","⑤ 유두암종은 갑상샘에 흔한 상피성 악성종양이다."],"k":"자궁 안 포도송이 모양 소포 = 포상기태."},{"id":"P-실1-44","no":"실1-44","q":"사진의 병리조직학적 소견으로 옳은 것은?","o":["간암","간염","간경화","지방변성","간섬유증"],"img":["path_prac_qa_pat_024.jpg"],"tags":[],"lv":3,"a":3,"look":"간세포 세포질이 크고 작은 둥근 빈 공포로 가득 차 있다. 큰 공포는 핵을 가장자리로 밀어내고, 작은 공포가 여러 개 모인 세포도 섞여 있다. 섬유 띠나 염증세포 침윤, 이형 세포는 뚜렷하지 않다.","e":"간세포 안에 쌓인 지방이 조직 처리 중 녹아 둥근 빈 공포로 남은 간 지방변성이다. 대포성과 소포성 지방변성이 함께 보인다.","w":["① 간암은 이형 간세포가 두꺼운 판이나 샘 모양으로 증식하며, 세포질의 둥근 빈 공포가 주 소견이 아니다.","② 간염은 간세포 손상과 염증이 주 소견이다.","③ 간경화는 섬유성 격벽이 재생결절을 둘러싸 소엽 구조가 바뀐다.","⑤ 간섬유증은 섬유 격벽이 생기는 변화이다."],"k":"간세포 안 둥근 빈 공포 = 지방변성."},{"id":"P-실1-45","no":"실1-45","q":"아래 사진과 같이 울혈이 잘 일어나는 장기로 옳은 것은?","o":["간","위","폐","지라","콩팥"],"img":["path_prac_qa_pat_028.jpg"],"tags":[],"lv":3,"a":2,"look":"폐문부에 기관지와 혈관 단면, 탄분이 침착한 검은 림프절이 보이고, 실질 전체가 짙은 붉은색으로 혈액이 차 있다.","e":"폐문 구조와 탄분 침착 림프절로 폐임을 알 수 있다. 좌심부전으로 폐정맥 유출이 막히면 폐울혈이 생기며, 폐는 울혈이 가장 잘 일어나는 장기 중 하나다.","w":["① 간은 우심부전 시 육두구간(nutmeg liver)의 만성 수동 울혈이 온다.","② 위는 점막 주름이 있는 주머니 모양 장기로 울혈 시에도 기관지 구조가 보이지 않는다.","④ 지라는 적색속질과 백색속질로 된 실질 장기로 기관지와 스펀지 모양 실질이 없다.","⑤ 콩팥은 피질과 수질로 나뉘며 기관지와 스펀지 모양 실질이 없다."],"k":"폐문 구조 + 붉게 찬 실질 = 폐울혈."}]},{"no":2,"t":"병리 소견 판독","core":"","secs":[],"point":"","items":[{"id":"P-실2-01","no":"실2-01","q":"","o":[],"a":0,"img":["path_pathfig_실2_01.jpg"],"tags":[]},{"id":"P-실2-02","no":"실2-02","q":"","o":[],"a":0,"img":["path_pathfig_실2_02.jpg"],"tags":[]},{"id":"P-실2-06","no":"실2-06","q":"","o":[],"a":0,"img":["path_pathfig_실2_06.jpg"],"tags":[]},{"id":"P-실2-07","no":"실2-07","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"P-실2-09","no":"실2-09","q":"","o":[],"a":0,"img":["path_pathfig_실2_09.jpg"],"tags":[]},{"id":"P-실2-10","no":"실2-10","q":"","o":[],"a":0,"img":["path_pathfig_실2_10.jpg"],"tags":[]},{"id":"P-실2-14","no":"실2-14","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"P-실2-18","no":"실2-18","q":"","o":[],"a":0,"img":["path_pathfig_실2_18.jpg"],"tags":[]},{"id":"P-실2-21","no":"실2-21","q":"","o":[],"a":0,"img":["path_pathfig_실2_21.jpg"],"tags":[]},{"id":"P-실2-22","no":"실2-22","q":"","o":[],"a":0,"img":["path_pathfig_실2_22.jpg"],"tags":[]},{"id":"P-실2-23","no":"실2-23","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"P-실2-24","no":"실2-24","q":"","o":[],"a":0,"img":["path_pathfig_실2_24.jpg"],"tags":[]},{"id":"P-실2-25","no":"실2-25","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"P-실2-28","no":"실2-28","q":"","o":[],"a":0,"img":["path_pathfig_실2_28.jpg"],"tags":[]},{"id":"P-실2-30","no":"실2-30","q":"","o":[],"a":0,"img":["path_pathfig_실2_30.jpg"],"tags":[]}]}],"final":{"no":0,"t":"시험 직전 최종 점검표","core":"","secs":[],"point":"","items":[]}},"C":{"code":"C","title":"진단세포학","theory":[{"no":1,"t":"검사물의 채취 및 도말","core":"객담 적합성은 먼지세포, 세포 적은 액체는 세포원심침전, 침전물 블록은 세포군집절편, 촉지 결절은 세침흡인.","secs":[{"h":"핵심정리","head":["항목","내용"],"rows":[["객담 적합성","폐포 큰포식세포(먼지세포) 확인"],["요 검체","배뇨 즉시 처리 (아침 첫 소변은 변성으로 부적합)"],["체강액","항응고제(헤파린) 사용 · 중피세포 출현"],["세침흡인검사(FNAC)","22~23 G 가는 바늘 · 갑상샘·유방·림프절"],["세포원심침전법","뇌척수액·소변처럼 세포가 적은 액체"],["세포군집절편법","침전물을 파라핀 블록으로 만들어 박절 · 위음성 감소 · 면역염색 가능"],["액상세포검사법","보존액 분산 → 수집 → 이전 · 단층 도말 · 추가 검사 가능"],["날인도말법","조직 절단면을 슬라이드에 눌러 찍음"]]},{"h":"주의 · 함정","head":["헷갈리는 지점","바른 이해"],"rows":[["편평세포만 많은 객담","구강 타액 오염, 부적합"],["자궁경부","FNAC 대상이 아니라 찰과 도말"]]}],"point":"검체별 처리법 · 도말법 정의 매칭.","items":[{"id":"C-1-01","no":"1-01","q":"세포검사 검체 중 채취 시 헤파린 등 항응고제를 넣어야 하는 것은?","o":["객담","소변","흉수, 복수 등 체강액","위 세척액","질 분비물"],"img":[],"tags":[],"lv":3,"a":2,"look":"","e":"체강액(흉수, 복수, 심낭액)은 섬유소원이 있어 응고되면 세포가 섬유소에 갇히므로 헤파린 등 항응고제를 넣어 채취한다. 소변, 객담, 질 분비물, 위액은 필요 없다.","w":["① 객담은 점액이 많아 직접 도말하거나 Saccomanno 법으로 처리한다.","② 소변은 항응고제 없이 배뇨 즉시 처리하는 검체다.","④ 위 세척액은 항응고제를 넣는 검체가 아니며, 항응고제가 필요한 것은 체강액이다.","⑤ 질 분비물은 찰과 도말한 뒤 건조되기 전에 95% 에틸알코올로 습윤 고정한다."],"k":"항응고제 필요 검체 = 체강액."},{"id":"C-1-02","no":"1-02","q":"객담 세포검사에서 검체가 침(타액)이 아닌 하기도에서 나온 적합한 검체임을 증명하는 소견은?","o":["다수의 편평상피세포","이행상피세포의 출현","형질세포의 출현","기저세포의 출현","폐포 큰포식세포(탐식세포)의 출현"],"img":[],"tags":["빈출"],"lv":3,"a":4,"look":"","e":"폐포 유래 탐식세포(폐포 큰포식세포, 먼지세포)가 있어야 적합 객담이다. 편평상피세포만 많으면 타액 오염이다.","w":["① 편평상피세포만 많은 객담은 구강 타액이 섞인 부적합 검체다.","② 이행상피세포는 방광, 요관 같은 요로를 덮는 세포다.","③ 형질세포는 항체를 생산하는 세포로 폐포 유래의 지표가 아니다.","④ 기저세포는 객담 적합성의 지표가 아니며, 적합성은 폐포 유래 탐식세포로 판정한다."],"k":"객담 적합성 = 탐식세포(먼지세포)."},{"id":"C-1-03","no":"1-03","q":"요 세포검사 검체 처리에 대한 설명으로 옳은 것은?","o":["12시간 모은 소변을 사용한다","48시간 냉장 보관 후 처리한다","24시간 모은 소변을 사용한다","배뇨 후 가능한 한 즉시 처리한다","6시간 이상 실온에 두어 세포를 침전시킨다"],"img":[],"tags":[],"lv":3,"a":3,"look":"","e":"소변은 산성이고 삼투압 변화가 커서 방치하면 세포가 빠르게 변성되므로 배뇨 즉시 처리한다. 장시간 모은 소변은 부적합하다.","w":["① 12시간 모은 소변은 오래 방치되어 세포가 변성되므로 부적합하다.","② 48시간이나 보관하면 그동안 세포가 변성되어 검사에 부적합하다.","③ 24시간 모은 소변도 장시간 방치된 검체라 세포 변성이 심하다.","⑤ 소변은 산성이고 삼투압 변화가 커서 실온에 두면 세포가 빠르게 변성된다."],"k":"요 세포검사 = 배뇨 즉시."},{"id":"C-1-04","no":"1-04","q":"체강 표면을 덮는 중피세포가 정상적으로 출현할 수 있는 검체는?","o":["소변","질 분비물","객담","복수","위액"],"img":[],"tags":[],"lv":3,"a":3,"look":"","e":"중피세포는 흉막, 복막, 심막을 덮는 세포로 흉수, 복수, 심낭액 같은 체강액에서 출현한다.","w":["① 소변에는 요로를 덮는 이행상피세포가 나오며 체강액이 아니다.","② 질 분비물에는 질과 자궁외경부에서 탈락한 표층세포와 중간세포가 나온다.","③ 객담의 적합성은 중피세포가 아니라 폐포 큰포식세포(먼지세포)로 판정한다.","⑤ 위액은 체강액이 아니므로 중피세포가 출현하는 검체가 아니다."],"k":"중피세포 = 체강액(흉수, 복수)."},{"id":"C-1-05","no":"1-05","q":"요 세포검사를 위한 소변 채취 방법으로 가장 옳은 것은?","o":["아침 첫 소변을 사용한다","첫 소변을 피한 신선뇨를 즉시 처리한다","12시간 뇨를 모은다","24시간 뇨를 모은다","삼관뇨만 검사한다"],"img":[],"tags":[],"lv":3,"a":1,"look":"","e":"아침 첫 소변은 밤새 방광에 머물러 세포 변성이 심하므로 부적합하다. 방광에 오래 머물지 않은 신선뇨(둘째 소변 등)를 받아 즉시 처리한다.","w":["① 아침 첫 소변은 밤새 방광에 머물러 세포 변성이 심하므로 부적합하다.","③ 12시간 모은 소변은 오래 방치되어 세포가 변성되므로 부적합하다.","④ 24시간 모은 소변도 장시간 방치된 검체라 세포 변성이 심하다.","⑤ 삼관뇨는 요로 부위 감별용 채취법으로 세포검사의 원칙이 아니다."],"k":"요 세포검사 = 첫 소변을 피한 신선뇨, 즉시 처리."},{"id":"C-1-06","no":"1-06","q":"객담 도말에서 먼지세포(dust cell)의 출현이 의미하는 것은?","o":["검체가 구강 타액으로 오염되었다","검체 고정이 불량하다","검체가 폐 깊은 곳(폐포)에서 배출되었다","폐암이 있다","알레르기성 천식이 있다"],"img":[],"tags":[],"lv":3,"a":2,"look":"","e":"먼지세포는 탄분을 탐식한 폐포 큰포식세포로 폐포에서 배출된 적합 객담의 지표다. 편평세포는 구강 오염, 호산구는 천식과 관련된다.","w":["① 구강 타액 오염은 편평상피세포만 많은 경우로, 먼지세포는 반대로 폐포 유래의 지표다.","② 먼지세포는 고정 상태가 아니라 객담이 폐포에서 나왔는지를 알려 주는 지표다.","④ 먼지세포는 탄분을 탐식한 폐포 큰포식세포로 암세포가 아니다.","⑤ 천식은 호산구, 쿠르쉬만 나선으로 판단한다."],"k":"먼지세포 = 폐포 유래 적합 객담."},{"id":"C-1-07","no":"1-07","q":"세포군집절편법(cell block)에 대한 설명으로 옳지 않은 것은?","o":["검체를 슬라이드에 직접 도말하는 방법이다","박절하여 조직 절편처럼 관찰한다","침전물을 파라핀에 침투시켜 블록을 만든다","객담, 소변, 체액의 침전물에 사용한다","위음성률을 낮추고 면역조직화학 검사에 활용한다"],"img":[],"tags":[],"lv":3,"a":0,"look":"","e":"침전물을 고정, 파라핀 침투, 포매하여 블록을 만들고 박절한다. 조직처럼 구조를 볼 수 있어 위음성률을 줄이고 면역염색에 쓸 수 있다.","w":["② 세포군집절편은 블록을 박절하여 조직 절편처럼 구조를 관찰한다.","③ 원심 침전한 세포 덩어리를 고정한 뒤 파라핀에 침투, 포매하여 블록을 만든다.","④ 객담, 소변, 체액 같은 비부인과 검체의 침전물에 사용한다.","⑤ 위음성률을 낮추고 연속 절편으로 면역조직화학 검사에 활용한다."],"k":"침전물 + 파라핀 블록 + 박절 = 세포군집절편법."},{"id":"C-1-08","no":"1-08","q":"세침흡인세포검사(FNAC)에 사용하는 바늘 규격으로 가장 적절한 것은?","o":["10 게이지","14~16 게이지","18 게이지","22~23 게이지","30 게이지 이상"],"img":[],"tags":["빈출"],"lv":3,"a":3,"look":"","e":"22~23 G 가는 바늘로 병소를 찔러 세포를 흡인한다. 게이지 숫자가 작을수록 바늘이 굵어 조직 생검(core biopsy)에 쓰인다.","w":["①, ② 10 게이지와 14~16 게이지는 숫자가 작아 굵은 바늘로 조직 생검(core biopsy)에 쓰인다.","③ 18 게이지도 세침흡인 규격인 22~23 게이지보다 굵은 바늘이다.","⑤ 세침흡인 바늘은 22~23 게이지이며, 30 게이지 이상은 이 규격을 벗어난다."],"k":"세침흡인 = 22~23 G 가는 바늘."},{"id":"C-1-09","no":"1-09","q":"비부인과 검체(객담, 소변, 체액)에서 위음성률을 낮추기 위해 파라핀 블록을 만들어 박절하는 방법의 가장 큰 추가 장점은?","o":["원심분리가 필요 없다","연속 절편으로 면역조직화학 염색을 할 수 있다","고정이 필요 없다","세포 수가 적은 뇌척수액에 가장 적합하다","검체 처리 시간이 가장 짧다"],"img":[],"tags":[],"lv":3,"a":1,"look":"","e":"블록에서 여러 장의 절편을 얻어 면역조직화학과 특수염색에 유리하다. 처리 시간이 길고, 세포가 매우 적은 뇌척수액에는 세포원심침전법이 적합하다.","w":["① 세포군집절편법은 남은 검체를 원심 침전하여 세포 덩어리를 모으는 데서 시작한다.","③ 원심 침전한 세포 덩어리는 고정한 뒤 파라핀에 침투시킨다.","④ 세포가 매우 적은 뇌척수액에는 세포원심침전법이 적합하다.","⑤ 고정, 조직처리, 포매, 박절을 거치므로 처리 시간이 길다."],"k":"세포군집절편법 = 파라핀 블록, 추가 염색 가능."},{"id":"C-1-10","no":"1-10","q":"호흡기 세포 진단을 위한 객담이 폐포에서 채취되었음을 판정하는 세포와 같은 계열(단핵포식세포계)의 세포는?","o":["술잔세포","비만세포","간의 쿠퍼세포","형질세포","중피세포"],"img":[],"tags":[],"lv":3,"a":2,"look":"","e":"먼지세포(폐포 큰포식세포)는 간의 쿠퍼세포, 중추신경의 미세아교세포와 같은 단핵포식세포계에 속한다.","w":["① 술잔세포는 점액 분비, ② 비만세포는 히스타민 분비, ④ 형질세포는 항체 생산 세포다.","⑤ 중피세포는 체강을 덮는 세포로 흉수와 복수에서 보인다."],"k":"객담 적합성 = 먼지세포(단핵포식세포계)."},{"id":"C-1-11","no":"1-11","q":"체표면에서 촉지되는 결절이 있어 세침흡인세포검사(FNAC)의 대표적 대상이 되는 장기는?","o":["자궁경부","갑상샘","위","식도","방광"],"img":[],"tags":["빈출"],"lv":3,"a":1,"look":"","e":"FNAC는 갑상샘, 유방, 림프절, 침샘 같은 촉지성 표재 결절에 흔히 시행한다. 자궁경부는 찰과 도말, 식도와 위는 내시경 솔질, 방광은 소변이나 세척액으로 검사한다.","w":["① 자궁경부는 세침흡인이 아니라 솔이나 주걱으로 긁는 찰과 도말로 검사한다.","③, ④ 위와 식도는 내시경 솔질로 세포를 얻는다.","⑤ 방광은 소변이나 세척액으로 세포검사를 한다."],"k":"FNAC 대표 = 갑상샘(유방, 림프절)."},{"id":"C-1-12","no":"1-12","q":"병소에 22~23 G 주사바늘을 직접 찔러 세포를 흡인하는 검사와 자연적으로 떨어져 나온 세포를 검사하는 방법을 순서대로 연결한 것은?","o":["탈락세포검사 : 세침천자흡인검사","날인도말검사 : 세포군집검사","후질원개검사 : 날인도말검사","세포군집검사 : 후질원개검사","세침천자흡인검사 : 탈락세포검사"],"img":[],"tags":[],"lv":3,"a":4,"look":"","e":"바늘로 병소에서 직접 흡인하면 세침천자흡인검사, 객담이나 소변처럼 자연 탈락한 세포를 보면 탈락세포검사다.","w":["① 탈락세포검사는 자연 탈락 세포, 세침천자흡인검사는 바늘 흡인 세포를 보므로 순서가 반대다.","② 날인도말은 조직 절단면 찍기, 세포군집검사는 침전물 블록이다.","③ 후질원개검사는 질 후원개 분비물 채취다.","④ 세포군집검사는 침전물 블록이고, 후질원개검사는 질 후원개 분비물 채취다."],"k":"바늘 흡인 = 세침천자흡인. 자연 탈락 = 탈락세포검사."},{"id":"C-1-13","no":"1-13","q":"액상세포검사법(LBC)의 장점으로 옳지 않은 것은?","o":["세포가 겹치지 않고 단층으로 도말된다","부적합 검체율이 감소한다","남은 검체로 HPV 검사 등 추가 검사를 할 수 있다","점액, 혈액 등 판독 방해 물질이 제거된다","직접 도말보다 비용이 적게 든다"],"img":[],"tags":[],"lv":3,"a":4,"look":"","e":"보존액에 분산시켜 방해 물질을 제거하고 단층 도말하며 잔여 검체로 추가 검사가 가능하다. 직접 문질러 바르는 것은 직접도말법이고, LBC는 장비와 시약 비용이 높다.","w":["① 보존액에 분산시킨 뒤 수집, 이전하여 세포가 겹치지 않는 단층 도말을 만든다.","② 세포가 고르게 분산되어 부적합 검체율이 낮아진다.","③ 남은 검체로 HPV 검사 같은 추가 검사를 할 수 있다.","④ 판독에 방해가 되는 점액, 혈액 등을 제거하고 도말한다."],"k":"액상세포검사 = 보존액 분산, 단층 도말, 추가 검사 가능."},{"id":"C-1-14","no":"1-14","q":"세포원심침전법(cytocentrifuge, cytospin)이 가장 적합한 검체는?","o":["갑상샘 세침흡인물","뇌척수액","객담","생검 조직의 절단면","자궁경부 찰과물"],"img":[],"tags":[],"lv":3,"a":1,"look":"","e":"세포가 적고 슬라이드 접착성이 낮은 액체 검체(뇌척수액, 소변)를 원심력으로 슬라이드의 좁은 면적에 모아 붙인다.","w":["① 갑상샘 결절은 세침흡인으로 세포를 채취하는 대표 부위다.","③ 객담은 점액이 많아 직접 도말하거나 Saccomanno 법으로 처리한다.","④ 생검 조직 절단면은 날인도말이다.","⑤ 자궁경부는 솔이나 주걱으로 긁는 찰과 도말로 검사한다."],"k":"세포 적은 액체(뇌척수액, 소변) = 세포원심침전법."},{"id":"C-1-15","no":"1-15","q":"날인도말법(imprint, touch smear)에 대한 설명으로 옳은 것은?","o":["검체를 보존액에 분산시켜 단층으로 도말한다","가는 바늘로 병소를 찔러 흡인한다","침전물을 파라핀에 포매한다","생검 조직의 절단면을 슬라이드에 살짝 눌러 세포를 묻힌다","원심력으로 세포를 좁은 면적에 모은다"],"img":[],"tags":[],"lv":3,"a":3,"look":"","e":"신선 조직의 절단면을 슬라이드에 가볍게 찍어 세포를 옮기는 방법으로 수술 중 신속 진단에 쓰인다.","w":["① 보존액 분산 단층 도말은 액상세포검사법, ② 가는 바늘 흡인은 세침흡인검사, ③ 침전물 파라핀 포매는 세포군집절편법, ⑤ 원심력 농축은 세포원심침전법이다."],"k":"조직 절단면을 눌러 찍음 = 날인도말법."},{"id":"C-1-16","no":"1-16","q":"부인과 검체를 보존액에 넣고 분산, 수집(막여과 또는 침전), 이전의 단계를 거쳐 도말하는 검사법은?","o":["액상세포검사법","찰과도말법","세포군집절편법","세포원심침전법","압착도말법"],"img":[],"tags":[],"lv":3,"a":0,"look":"","e":"액상세포검사법은 분산(dispersion), 수집(collection, 막여과 등), 이전(transfer)을 거쳐 단층 도말을 만든다.","w":["② 찰과도말법은 병변 표면을 기구로 긁어 얻은 세포를 도말한다.","③ 세포군집절편법은 침전물을 파라핀 블록으로 만들어 박절하는 방법이다.","④ 세포원심침전법은 세포가 적은 액체 검체를 원심력으로 슬라이드에 농축한다.","⑤ 압착도말법은 두 슬라이드 사이에 눌러 편다."],"k":"분산, 수집, 이전 = 액상세포검사법."},{"id":"C-1-17","no":"1-17","q":"뇌척수액 세포검사 시 세포원심침전법을 사용하는 이유로 옳은 것은?","o":["항응고제가 필요하기 때문이다","점액이 많아 분해가 필요하기 때문이다","조직 절편이 필요하기 때문이다","세포 수가 적어 세포를 한곳에 농축할 필요가 있기 때문이다","세포가 너무 많아 희석이 필요하기 때문이다"],"img":[],"tags":[],"lv":3,"a":3,"look":"","e":"뇌척수액은 세포와 단백질이 적어 슬라이드에 잘 붙지 않으므로 원심력으로 세포를 좁은 원형 부위에 농축시켜 붙인다.","w":["① 항응고제(헤파린)는 섬유소원이 있어 응고되는 흉수, 복수 같은 체강액에 넣는다.","② 점액이 많은 객담은 고정액과 섞어 균질화하는 Saccomanno 법으로 처리한다.","③ 파라핀 블록을 박절해 조직 절편처럼 보는 것은 세포군집절편법이다.","⑤ 뇌척수액은 세포와 단백질이 적은 검체다."],"k":"뇌척수액 = 세포원심침전법(농축)."},{"id":"C-1-18","no":"1-18","q":"세침흡인세포검사(FNAC)의 적용 대상으로 가장 적절하지 않은 것은?","o":["자궁경부의 선별검사","유방 종괴","침샘 종괴","경부 림프절 종대","갑상샘 결절"],"img":[],"tags":[],"lv":3,"a":0,"look":"","e":"자궁경부 선별검사는 솔이나 주걱으로 찰과한 도말 또는 액상세포검사로 한다. FNAC는 갑상샘, 유방, 림프절, 침샘 등 촉지되는 종괴에 쓰인다.","w":["②, ④ 유방 종괴와 림프절 종대는 만져지는 결절로 세침흡인의 대표 대상이다.","③ 침샘 종괴도 표재성 결절이라 세침흡인으로 세포를 얻는다.","⑤ 갑상샘 결절은 세침흡인으로 세포를 채취하는 대표 부위다."],"k":"FNAC = 갑상샘, 유방, 림프절. 자궁경부는 찰과 도말."},{"id":"C-1-19","no":"1-19","q":"가는 바늘로 병소에서 직접 세포를 채취하는 세침천자흡인검사의 특징으로 옳은 것은?","o":["자연 탈락한 세포만 관찰한다","반드시 전신마취가 필요하다","조직 구조(층 배열)를 완전하게 보존한다","최종 확정 진단을 대신한다","병소의 세포를 직접 얻어 진단적 가치가 높다"],"img":[],"tags":[],"lv":3,"a":4,"look":"","e":"병소에서 직접 채취하므로 탈락세포검사보다 진단적 가치가 높고 외래에서 간편하다. 조직 구조가 보존되지 않아 확정 진단은 조직검사로 한다.","w":["① 자연 탈락한 세포를 보는 것은 객담, 소변 같은 탈락세포검사다.","② 세침흡인은 외래에서 간편하게 시행하는 검사다.","③ 바늘로 흡인한 세포만 얻으므로 조직 구조가 보존되지 않는다.","④ 최종 확정 진단은 조직검사로 한다."],"k":"세침천자흡인 = 병소에서 직접 채취."},{"id":"C-1-20","no":"1-20","q":"객담 검체의 적합성 판정에 대한 설명으로 옳은 것은?","o":["술잔세포만 있으면 적합하다","중피세포가 있어야 적합하다","먼지세포가 있으면 적합하다","형질세포가 있어야 적합하다","편평상피세포가 많을수록 적합하다"],"img":[],"tags":[],"lv":3,"a":2,"look":"","e":"객담은 폐포 큰포식세포(먼지세포)가 있어야 적합하다. 술잔세포와 섬모원주세포는 기관지 상피 유래, 중피세포는 체강액에서 보인다.","w":["① 술잔세포는 기관지 상피에서도 나오므로 폐포까지 채취된 근거가 되지 못한다.","② 중피세포는 체강을 덮는 세포로 흉수와 복수에서 보인다.","④ 형질세포는 항체를 생산하는 세포다.","⑤ 편평상피세포만 많은 객담은 구강 타액이 섞인 부적합 검체다."],"k":"객담 적합성 = 먼지세포."},{"id":"C-1-21","no":"1-21","q":"도말 후 남은 검사물을 모아 파라핀 블록으로 만드는 세포군집절편법의 처리 순서로 옳은 것은?","o":["원심 침전 → 박절 → 고정 → 포매 → 염색","고정 → 박절 → 원심 침전 → 포매 → 염색","포매 → 원심 침전 → 고정 → 박절 → 염색","도말 → 건조 → 원심 침전 → 박절 → 염색","원심 침전 → 고정 → 파라핀 침투, 포매 → 박절 → 염색"],"img":[],"tags":[],"lv":3,"a":4,"look":"","e":"잔여 검체를 원심 침전하여 세포 덩어리를 모은 뒤 고정, 조직처리, 파라핀 포매, 박절, 염색 순으로 진행하며 위음성률을 줄인다.","w":["① 박절은 고정과 파라핀 포매를 마친 블록으로 해야 한다.","② 고정에 앞서 원심 침전으로 세포 덩어리를 먼저 모은다.","③ 포매는 원심 침전과 고정을 마친 뒤에 하는 단계다.","④ 세포군집절편은 도말 후 남은 검사물을 원심 침전하는 데서 시작하며 건조 단계가 없다."],"k":"세포군집절편 = 침전물 → 블록 → 박절."},{"id":"C-1-22","no":"1-22","q":"갑상샘에서 만져지는 결절에 22~23 G 바늘을 찔러 넣고 음압을 걸어 병소의 세포를 직접 얻었다. 이 세포 채취법은?","o":["세침흡인검사","탈락세포검사","찰과세포검사","날인도말검사","객담세포검사"],"img":[],"tags":[],"lv":3,"a":0,"look":"","e":"세침흡인검사(fine needle aspiration cytology, FNAC)는 병소를 찔러 음압으로 세포를 흡인한다. 갑상샘, 유방, 림프절, 침샘 같은 촉지성 종괴나 영상 유도로 접근 가능한 심부 병소에 쓴다.","w":["② 탈락세포검사는 저절로 떨어져 나온 세포를 모으는 검사다.","③ 찰과세포검사는 점막 표면을 긁어 세포를 얻는 검사다.","④ 날인도말검사는 생검 조직 절단면을 슬라이드에 찍는 방법이다.","⑤ 객담세포검사는 가래에 떨어져 나온 세포를 보는 탈락세포검사다."],"k":"22~23 G 바늘로 병소에서 직접 흡인 = 세침흡인검사."},{"id":"C-1-23","no":"1-23","q":"흉수 검체를 원심분리하고 남은 침전물을 포르말린으로 굳혀 파라핀에 포매한 뒤 박절하여 염색하였다. 도말 표본에서 놓친 세포를 더 찾아 위음성을 줄이려는 이 방법은?","o":["압착도말법","찰과도말법","세포군집절편법","세포원심침전법","액상세포검사법"],"img":[],"tags":[],"lv":3,"a":2,"look":"","e":"세포군집절편법(cell block)은 체액·객담 침전물을 고정한 뒤 파라핀에 포매하여 박절하는 방법이다. 도말에서 놓친 세포를 추가로 관찰해 위음성을 줄이고, 연속절편으로 면역조직화학 염색도 할 수 있다.","w":["① 압착도말법은 점조한 검체를 두 슬라이드 사이에 눌러 펴는 방법이다.","② 찰과도말법은 병변 표면을 긁어 얻은 세포를 슬라이드에 바로 바르는 방법이다.","④ 세포원심침전법은 세포 수가 적은 액체 검체를 원심력으로 슬라이드의 좁은 면적에 모으는 방법으로 파라핀블록을 만들지 않는다.","⑤ 액상세포검사법은 검체를 보존액에 분산시킨 뒤 수집·이전하여 단층으로 도말한다."],"k":"체액 침전물 → 파라핀블록 → 박절 = 세포군집절편법(cell block)."},{"id":"C-1-24","no":"1-24","q":"영상 유도 아래 22~23 G 가는 바늘로 간 실질의 종괴를 찔러 세포를 흡인하였다. 이 검사는?","o":["찰과세포검사","세척세포검사","날인도말검사","솔질세포검사","세침천자흡인검사"],"img":[],"tags":[],"lv":3,"a":4,"look":"","e":"세침천자흡인검사(fine needle aspiration)는 22~23 G의 가는 바늘로 병소를 직접 찔러 음압으로 세포를 흡인한다.","w":["① 찰과세포검사는 점막 표면을 긁어 세포를 얻는다.","② 세척세포검사는 생리식염수 등으로 씻어낸 액에서 세포를 얻는다.","③ 날인도말검사는 생검 조직 절단면을 슬라이드에 찍는다.","④ 솔질세포검사는 내시경 솔로 점막 표면을 문질러 세포를 얻는다."],"k":"22~23 G 바늘로 병소 흡인 = 세침천자흡인검사."},{"id":"C-1-25","no":"1-25","q":"자궁경부 솔로 채취한 세포를 보존액 용기에 헹궈 넣었다. 기기가 점액과 혈액을 걸러 낸 뒤 세포를 겹치지 않게 얇은 한 층으로 슬라이드에 옮겨 붙이는 표본 제작법은?","o":["날인도말법","세포원심침전법","찰과도말법","액상세포도말법","세포군집절편법"],"img":[],"tags":[],"lv":3,"a":3,"look":"","e":"액상세포도말법은 검체를 보존액에 분산시켜 점액·혈액 같은 방해 물질을 걸러 낸 뒤 세포를 단층으로 슬라이드에 옮기는 방법이다. 세포가 겹치지 않아 판독이 쉽다.","w":["① 날인도말법은 생검 조직의 절단면을 슬라이드에 눌러 세포를 묻히는 방법이다.","② 세포원심침전법은 원심력으로 세포를 좁은 면적에 모으는 방법으로, 보존액 분산·여과 과정이 없다.","③ 찰과도말법은 병변을 긁어 얻은 세포를 바로 바르므로 점액과 혈액이 그대로 남는다.","⑤ 세포군집절편법은 침전물을 파라핀블록으로 만들어 박절하는 방법이다."],"k":"보존액 분산 + 방해물 제거 + 단층 도말 = 액상세포도말법."},{"id":"C-1-26","no":"1-26","q":"뇌척수액과 소변처럼 세포 수가 적고 슬라이드에 잘 붙지 않는 액상 검체로 세포 손실을 줄여 표본을 만들려 한다. 알맞은 방법은?","o":["날인도말법","찰과도말법","직접도말법","세포원심침전법(cytospin)","압착도말법(squash)"],"img":[],"tags":[],"lv":3,"a":3,"look":"","e":"세포원심침전법(cytocentrifugation, cytospin)은 원심력으로 세포를 슬라이드의 좁은 원형 면적에 농축해 붙이므로 세포 손실이 적다.","w":["① 날인도말법은 생검 조직 절단면을 찍는 방법이다.","② 찰과도말법은 점막을 긁어 얻은 세포를 바르는 방법이다.","③ 직접도말법은 세포가 적은 액체에서는 세포를 거의 얻지 못한다.","⑤ 압착도말법은 작은 조직을 두 슬라이드 사이에 눌러 펴는 방법이다."],"k":"세포 적은 액체(뇌척수액, 소변) = 세포원심침전법."},{"id":"C-1-27","no":"1-27","q":"수술 중 떼어낸 림프절을 반으로 자른 뒤 그 절단면을 슬라이드에 가볍게 눌러 찍어 신속 세포진단을 하였다. 이 표본 제작법은?","o":["날인도말법(imprint)","압착도말법","찰과도말법","세포원심침전법","액상세포검사법"],"img":[],"tags":[],"lv":3,"a":0,"look":"","e":"날인도말법(imprint smear, touch smear)은 생검 조직의 절단면을 슬라이드에 가볍게 눌러 찍는 방법으로 수술 중 신속 진단에 쓴다.","w":["② 압착도말법은 작은 조직 조각을 두 슬라이드 사이에 눌러 으깨 펴는 방법이다.","③ 찰과도말법은 점막 표면을 긁어 얻은 세포를 바르는 방법이다.","④ 세포원심침전법은 세포가 적은 액상 검체를 원심력으로 농축하는 방법이다.","⑤ 액상세포검사법은 보존액에 담근 세포를 얇게 펴 바르는 방법이다."],"k":"절단면을 눌러 찍음 = 날인도말법."},{"id":"C-1-31","no":"1-31","q":"세포 수가 적은 뇌척수액 같은 액상 검체를 원심력으로 슬라이드의 일정한 부위에 직접 농축하여 도말하는 방법은?","o":["날인도말법","세포원심침전법(cytocentrifuge)","세포군집절편법","액상세포검사법","직접도말법"],"img":[],"tags":[],"lv":3,"a":1,"look":"","e":"깔때기 모양 챔버에 검체를 넣고 원심분리하여 세포는 슬라이드의 작은 원형 부위에 모으고 액체는 필터카드에 흡수시킨다. 뇌척수액, 소변에 알맞다.","w":["① 절제 조직의 절단면을 슬라이드에 찍어 도말하는 방법이다.","③ 침전물을 파라핀블록으로 만들어 박절하는 방법이다.","④ 보존액에 담은 검체를 처리해 얇은 단층 도말을 만드는 방법이다.","⑤ 직접도말법은 검체를 슬라이드에 바로 문질러 바르며 원심 농축 과정이 없다."],"k":"적은 세포를 원심력으로 슬라이드에 농축 = 세포원심침전법."},{"id":"C-1-30","no":"1-30","q":"흉수 검체로 도말 표본을 만들고 남은 침전물을 고정한 뒤 파라핀에 포매해 박절하였다. 위음성을 줄이고 면역조직화학 염색도 추가할 수 있는 이 방법은?","o":["세포원심침전법","막여과법","세포군집절편법(cell block)","액상세포검사법","날인도말법"],"img":[],"tags":[],"lv":3,"a":2,"look":"","e":"세포군집절편법(cell block)은 남은 검사물의 침전물을 고정, 파라핀 포매, 박절한다. 조직 절편처럼 관찰해 위음성률을 줄이고 면역조직화학 염색과 특수염색을 추가할 수 있다.","w":["① 세포원심침전법은 원심력으로 세포를 슬라이드에 농축하는 도말법이다.","② 막여과법은 액체를 필터에 걸러 세포를 모으는 방법으로 파라핀 블록을 만들지 않는다.","④ 액상세포검사법은 보존액 속 세포를 얇게 펴 바르는 도말법이다.","⑤ 날인도말법은 생검 조직 절단면을 슬라이드에 찍는 방법이다."],"k":"도말 후 남은 검사물로 만든 파라핀 블록 = 세포군집절편법."},{"id":"C-1-29","no":"1-29","q":"유방에 만져지는 종괴에서 저절로 떨어진 세포 대신 병소 자체의 세포를 얻으려고 22~23 G 가는 바늘로 직접 흡인하였다. 이 검사는?","o":["자연탈락세포검사","찰과세포검사","세척세포검사","세침천자흡인검사(FNA)","날인도말검사"],"img":[],"tags":[],"lv":3,"a":3,"look":"","e":"세침천자흡인검사(fine needle aspiration cytology, FNAC)는 병소에서 세포를 직접 흡인하므로 탈락세포검사보다 진단적 가치가 높다. 갑상샘, 유방, 림프절 결절에 주로 쓴다.","w":["① 자연탈락세포검사는 저절로 떨어져 나온 세포를 모으는 검사다.","② 찰과세포검사는 점막 표면을 긁어 세포를 얻는다.","③ 세척세포검사는 씻어낸 액에서 세포를 얻는다.","⑤ 날인도말검사는 생검 조직 절단면을 슬라이드에 찍는다."],"k":"22~23 G 가는 바늘로 병소에서 직접 흡인 = 세침천자흡인검사."},{"id":"C-1-32","no":"1-32","q":"갑상샘 결절의 세포 진단을 위해 주로 사용하는 세포 채취법은?","o":["세침천자흡인(FNA)","날인도말(imprint smear)","세포원심침전(cytocentrifuge)","탈락세포 검사","찰과도말"],"img":[],"tags":[],"lv":3,"a":0,"look":"","e":"갑상샘 결절처럼 만져지는 병소는 22~23 G 가는 바늘을 직접 찔러 흡인하는 세침천자흡인으로 검체를 얻는다.","w":["② 날인도말은 생검 조직의 절단면을 슬라이드에 찍어 세포를 옮기는 방법이다.","③ 세포원심침전은 뇌척수액처럼 세포가 적은 액체 검체를 원심력으로 농축한다.","④ 탈락세포 검사는 객담, 소변처럼 자연히 떨어진 세포를 본다.","⑤ 찰과도말은 자궁경부처럼 표면을 긁어 채취한다."],"k":"갑상샘 결절 = 세침천자흡인."},{"id":"C-1-28","no":"1-28","q":"척수천자로 얻은 뇌척수액이 0.5 mL 정도로 적고 세포도 드물다. 세포를 최대한 모아 표본을 만드는 방법은?","o":["직접도말법","세포원심침전법(cytospin)","날인도말법(imprint)","찰과도말법","압착도말법(squash)"],"img":[],"tags":[],"lv":3,"a":1,"look":"","e":"뇌척수액은 세포 수가 매우 적어 직접 도말로는 세포를 거의 얻지 못한다. 세포원심침전법(cytocentrifugation, cytospin)은 원심력으로 세포를 작은 원형 영역에 농축한다.","w":["① 직접도말법은 세포가 적은 뇌척수액에서는 세포를 거의 얻지 못한다.","③ 날인도말법은 생검 조직 절단면을 찍는 방법이다.","④ 찰과도말법은 점막을 긁어 얻은 세포를 바르는 방법이다.","⑤ 압착도말법은 작은 조직을 슬라이드 사이에 눌러 펴는 방법이다."],"k":"소량 뇌척수액 = 세포원심침전법."},{"id":"C-1-34","no":"1-34","q":"자궁경부 탈락세포를 액상세포검사(LBC)로 처리할 때 검체를 채취해 보존액 용기에 헹궈 넣는 기구는?","o":["객담 채취 용기","소변 채취 컵","빗자루 모양 자궁경부 솔(cervical broom)","요추천자 바늘","세침흡인 주사기"],"img":[],"tags":[],"lv":3,"a":2,"look":"","e":"빗자루 모양 솔로 자궁경부 바깥면과 변형대를 긁은 뒤 솔을 보존액 용기에 헹구거나 솔머리를 떼어 넣는다.","w":["① 객담은 자연 탈락한 호흡기 세포를 보는 검체로 적합성은 먼지세포로 판정한다.","② 소변은 채취 후 즉시 처리하는 요 세포검사 검체다.","④ 요추천자로 얻는 뇌척수액은 세포가 적어 세포원심침전법으로 도말한다.","⑤ 세침흡인 주사기는 촉지되는 종괴에서 가는 바늘로 세포를 흡인하는 기구다."],"k":"자궁경부 솔 + 보존액 용기 = 자궁경부 액상세포검사."},{"id":"C-1-35","no":"1-35","q":"액상세포검사법(liquid-based cytology, LBC)의 표본 제작 방법으로 옳은 것은?","o":["검체를 보존액에 넣어 분산, 수집, 이전 단계를 거쳐 얇은 층으로 도말한다","생검 조직의 절단면을 슬라이드에 눌러 찍는다","원심력으로 세포를 슬라이드의 좁은 면적에 모은다","침전물을 파라핀에 포매하여 박절한다","두 장의 슬라이드 사이에 검체를 놓고 눌러 펼친다"],"img":[],"tags":[],"lv":3,"a":0,"look":"","e":"채취 기구를 보존액에 헹궈 분산하고 막여과나 침강으로 수집해 슬라이드에 이전하므로 혈액과 점액이 줄고 세포가 얇은 층으로 고르게 도말된다.","w":["② 날인도말법, ③ 세포원심침전법, ④ 세포군집절편법(cell block), ⑤ 압착도말법의 설명이다."],"k":"액상세포검사법 = 분산, 수집, 이전."},{"id":"C-1-36","no":"1-36","q":"갑상샘처럼 체표면에서 촉지되는 결절의 세포를 채취하는 방법으로 가장 적절한 것은?","o":["탈락세포검사","찰과세포검사","가는바늘흡인세포검사(FNAC)","세척세포검사","자궁경부 펀치생검"],"img":[],"tags":[],"lv":3,"a":2,"look":"","e":"가는바늘흡인세포검사(fine needle aspiration cytology, FNAC)는 22~23 G 바늘을 병소에 직접 찔러 흡인하며 갑상샘, 유방, 림프절 결절이 대표 대상이다.","w":["① 탈락세포검사는 객담, 소변처럼 자연적으로 떨어져 나온 세포를 본다.","② 찰과세포검사는 자궁경부, 기관지처럼 표면을 긁거나 솔로 문질러 세포를 얻는다.","④ 세척세포검사는 방광 세척액처럼 장기를 씻어 낸 액체의 세포를 보는 방법이다.","⑤ 펀치생검은 원형 칼날로 자궁경부 조직을 떼어 내는 조직검사다."],"k":"갑상샘 결절 = 가는바늘흡인세포검사(FNAC)."}],"star":4},{"no":2,"t":"염색(Papanicolaou)","core":"","secs":[],"point":"","items":[{"id":"C-2-01","no":"2-01","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"C-2-02","no":"2-02","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"C-2-03","no":"2-03","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"C-2-04","no":"2-04","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"C-2-05","no":"2-05","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"C-2-06","no":"2-06","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"C-2-07","no":"2-07","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"C-2-08","no":"2-08","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"C-2-09","no":"2-09","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"C-2-10","no":"2-10","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"C-2-11","no":"2-11","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"C-2-12","no":"2-12","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"C-2-13","no":"2-13","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"C-2-14","no":"2-14","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"C-2-15"  검체의 세포를 원심력으로 슬라이드 위 좁은 면적에 침전시켜 붙인다. 뇌척수액, 소변처럼 세포가 적은 검체에 쓴다.","w":["① 포매는 포매기(embedding center), ⑤ 탈수, 투명, 침투는 자동조직처리기로 한다.","② 염색은 헤마톡실린, OG6, EA로 핵과 세포질을 물들이는 과정이다.","③ 봉입은 탈수, 투명 후 표본을 봉입제로 덮는 마지막 과정이다."],"k":"슬라이드 깔때기 원심 장비 = 세포원심침전."},{"id":"C-실1-04","no":"실1-04","q":"세포검사실에서 ThinPrep 표본 제작에 사용하는 장비이다. 이 표본 제작의 단계는?","o":["세포분산-세포수집-세포이전","세포분산-세포응집-세포도말","세포수집-세포분산-세포이전","세포응집-세포도말-세포이전","세포이전-세포분산-세포도말"],"img":["cyto_prac_cyto_004.jpg"],"tags":[],"lv":3,"a":0,"look":"보존액 바이알 위로 필터 실린더가 내려와 꽂히는 ThinPrep 처리기 내부다.","e":"ThinPrep은 실린더 회전으로 점액과 세포 덩어리를 흩는 세포분산, 진공으로 필터 막에 세포를 모으는 세포수집, 필터를 슬라이드에 눌러 옮기는 세포이전 순서로 진행한다.","w":["② 분산 다음은 응집이 아니라 필터 막에 세포를 모으는 수집 단계다.","③ 첫 단계는 점액과 세포 덩어리를 흩는 세포분산이다.","④ 세포응집은 액상세포검사 단계가 아니며 과정은 분산으로 시작한다.","⑤ 세포이전은 분산과 수집을 거친 뒤 마지막에 한 번 하는 단계다."],"k":"ThinPrep = 분산, 수집(필터), 이전."},{"id":"C-실1-05","no":"실1-05","q":"유방에서 세침흡인기로 세포 검체를 채취하는 광경이다. 이와 같은 방식으로 세포를 채취하는 부위는?","o":["자궁목","자궁내막","갑상샘","방광","십이지장"],"img":["cyto_prac_cyto_005.jpg"],"tags":[],"lv":3,"a":2,"look":"주사기를 권총형 흡인 손잡이에 끼우고, 한 손으로 병변을 고정한 채 가는 바늘을 피부를 통해 찔러 넣고 있다.","e":"세침흡인세포검사(fine needle aspiration cytology, FNAC)는 만져지는 표재성 종괴에서 세포를 흡인한다. 유방과 함께 갑상샘 결절이 대표 적용 부위다.","w":["① 자궁목은 세침흡인이 아니라 찰과 도말로 세포를 얻는다.","④ 방광은 소변이나 세척액으로 세포검사를 한다."],"k":"촉지 종괴 세침흡인 = 유방, 갑상샘."},{"id":"C-실1-06","no":"실1-06","q":"세포 검체를 채취한 뒤 세포가 겹치지 않도록 단층 표본을 만드는 장비들이다. 이 검사법은?","o":["직접 찰과도말법","액상세포도말법","자궁내막흡인도말법","신속도말법","후질원개 도말법"],"img":["cyto_prac_cyto_007.jpg"],"tags":[],"lv":3,"a":1,"look":"ThinPrep 처리기와 필터 단계 모식도(세포 분산, 세포 수집, 세포 이전), SurePath용 PrepMate와 PrepStain 장비가 함께 제시되어 있다.","e":"검체를 보존액에 담은 뒤 장비로 혈액과 점액을 줄이고 세포를 얇은 단층으로 붙이는 방법이 액상세포검사(liquid-based cytology, LBC)다.","w":["① 직접 찰과도말법은 기구를 슬라이드에 바로 문질러 세포가 겹치기 쉽다.","⑤ 후질원개 도말법은 질 후원개 분비물을 채취하는 방법이다."],"k":"단층 표본 장비(ThinPrep, SurePath) = 액상세포도말법."},{"id":"C-실1-07","no":"실1-07","q":"세포도말표본 제작을 위해 다음 부속품을 사용하는 장비는?","o":["Saccomanno","Touch print","Cytocentrifuge","Thinprep","Surepath"],"img":["cyto_prac_cyto_008.jpg"],"tags":[],"lv":3,"a":2,"look":"플라스틱 검체 깔때기(cytofunnel)를 슬라이드와 겹쳐 금속 클립 홀더에 끼워 조립하고 있다.","e":"검체 깔때기와 슬라이드를 한 조로 고정해 회전자에 넣는 것은 세포원심분리기(Cytocentrifuge)의 부속품이다.","w":["① Saccomanno 법은 객담을 고정액과 섞어 균질화한 뒤 원심 침전하는 방법이다.","② Touch print(날인도말)는 조직 절단면을 슬라이드에 찍는 방법으로 이 부속품을 쓰지 않는다.","④ ThinPrep은 필터 실린더와 보존액 바이알, ⑤ SurePath는 밀도 구배 원심과 침강 챔버를 쓴다."],"k":"깔때기 + 슬라이드 클립 = Cytocentrifuge."},{"id":"C-실1-08","no":"실1-08","q":"Pap 염색에 사용하는 염색 용액들이다. C 용액에 들어가는 성분이 아닌 것은?","o":["Orange G","Light green","Eosin Y","Bismarck brown","95% ethanol"],"img":["cyto_prac_cyto_009.jpg"],"tags":[],"lv":3,"a":0,"look":"A는 검은 보라색 헤마톡실린(hematoxylin), B는 주황색 OG-6, C는 녹색 EA 용액이다.","e":"EA 용액은 Light green SF와 Eosin Y를 주성분으로 하고 제조법에 따라 Bismarck brown이 들어가며, 용매는 95% 에탄올이다. Orange G는 B 용액(OG-6)의 성분이다.","w":["② Light green은 비각화 세포질을 청록색, ③ Eosin Y는 표층세포 세포질, 섬모, 핵소체를 분홍색으로 염색하는 EA 성분이다.","④ Bismarck brown은 EA-36 등에 들어가는 성분이다.","⑤ 95% ethanol은 EA 용액의 용매로 C 용액에 들어간다."],"k":"녹색 EA = Light green + Eosin Y, Orange G는 OG-6."},{"id":"C-실1-09","no":"실1-09","q":"Papanicolaou 염색에서 각화성 세포질과 글리코겐을 염색하는 시약은?","o":["ethanol","hematoxylin","OG-6","EA-50","xylene"],"img":["cyto_prac_cyto_011.jpg"],"tags":[],"lv":3,"a":2,"look":"시험관 가운데 주황색 용액에 OG-6 라벨이 붙어 있다.","e":"OG-6는 Orange G가 주성분인 세포질 염료로 각질과 글리코겐을 오렌지색으로 염색한다.","w":["① ethanol은 도말의 고정과 탈수에 쓰는 알코올이다.","② hematoxylin은 핵을 염색하는 시약이다.","④ EA-50은 비각화 세포질을 청록색, 표층세포 세포질을 분홍색으로 염색한다.","⑤ xylene은 탈수 후 표본을 투명하게 하는 투명제다."],"k":"각질, 글리코겐 = OG-6."},{"id":"C-실1-10","no":"실1-10","q":"부인과 Pap 염색표본이다. 세포 위의 갈색 침착물이 생긴 원인은?","o":["고정 후 건조에 의한 인공산물","투명 후 건조에 의한 인공산물","Orange G 과염에 의한 인공산물","헤마톡실린 침착에 의한 인공산물","봉입제 오염"],"img":["cyto_prac_cyto_012.jpg"],"tags":[],"lv":3,"a":1,"look":"편평세포 핵 주위와 세포질 위에 갈색의 미세한 과립이 덮여 세포가 금갈색으로 보이고 핵 구조가 가려진다.","e":"자일렌 투명 후 봉입 전에 표본이 마르면 세포 표면에 공기가 갇혀 갈색 굴절성 과립으로 보이며, 이를 콘플레이크 인공산물(cornflake artifact)이라 한다.","w":["① 고정 전 건조는 핵이 커지고 흐릿해지는 공기건조 인공산물을 만든다.","④ 헤마톡실린 침착은 산화된 헤마톡실린을 여과하지 않았을 때 생기는 침전물이다."],"k":"투명 후 건조 = 갈색 콘플레이크 인공산물."},{"id":"C-실1-11","no":"실1-11","q":"액상세포도말 표본 제작 기구이다. 검체의 종류는?","o":["객담","소변","복강액","뇌척수액","자궁경부 탈락세포"],"img":["cyto_prac_cyto_014.jpg"],"tags":[],"lv":3,"a":4,"look":"보존액 용기 안에 빗자루 모양 솔이 들어 있고, 다른 사진은 채취 솔의 머리를 보존액 바이알에 떼어 넣는 장면이다.","e":"빗자루 모양 솔로 자궁경부를 문질러 솔째 또는 헹궈서 보존액에 담는 방식은 자궁경부 액상세포검사다.","w":["① 객담은 점액이 많아 직접 도말하거나 Saccomanno 법으로 처리한다.","②, ④ 소변과 뇌척수액은 세포가 적어 세포원심침전법으로 도말한다.","③ 복강액은 항응고제를 넣어 채취하고 침전물로 세포군집절편을 만들기도 한다."],"k":"빗자루 솔 + 보존액 = 자궁경부 액상세포검사."},{"id":"C-실1-13","no":"실1-13","q":"일반적인 부인과 세포 검진에서 세포 검체를 채취하여 도말하는 부위는?","o":["질풀 + 바깥자궁목","질측벽","편평-원주경계부 + 속자궁목","속자궁목 + 자궁속막","자궁속막"],"img":["cyto_prac_cyto_019.jpg"],"tags":[],"lv":3,"a":2,"look":"왼쪽은 자궁목관솔(cytobrush)을 굴려 도말하는 모습, 오른쪽은 주걱(spatula)으로 채취한 검체를 펴 바르는 모습이다.","e":"자궁경부암은 편평-원주경계부(squamocolumnar junction)의 변형대에서 주로 발생하므로 주걱으로 편평-원주경계부를, 솔로 속자궁목을 채취한다.","w":["① 질풀과 바깥자궁목만으로는 편평-원주경계부와 속자궁목이 빠진다.","② 질측벽은 호르몬 평가용 채취 부위다.","④ 속자궁목과 자궁속막에는 자궁경부암 호발 부위인 편평-원주경계부가 빠져 있다.","⑤ 자궁속막에는 자궁경부암 호발 부위인 편평-원주경계부가 빠져 있다."],"k":"부인과 검진 = 편평-원주경계부 + 속자궁목."},{"id":"C-실1-16","no":"실1-16","q":"질, 자궁경부 도말을 파파니콜라우(Papanicolaou) 염색한 표본이다. 사진의 세포에 보이는 인공산물(cornflaking)의 원인은?","o":["전고정액으로 고정","자일렌 사용 후 건조","적정 시간 이상 청색화","EA50 염색액에서 장시간 염색","불완전 탈수 단계에서 장시간 방치"],"img":["cyto_prac_cyto_078.jpg"],"tags":[],"lv":3,"a":1,"look":"분홍색 편평세포 세포질 위에 갈색의 작은 과립이 빽빽하게 덮여 핵과 세포질이 흐리게 가려진다.","e":"콘플레이킹(cornflaking)은 자일렌(xylene) 처리 후 봉입 전에 표본이 건조되어 세포 표면에 공기가 갇혀 생기는 갈색 굴절성 과립 인공산물이다.","w":["③ 청색화는 헤마톡실린 염색 후 핵을 청색으로 바꾸는 과정이다.","④ EA50은 비각화 세포질을 청록색, 표층세포 세포질을 분홍색으로 염색한다.","⑤ 불완전 탈수는 물이 남아 자일렌이 뿌옇게 흐려지고 염색이 흐릿해진다."],"k":"콘플레이킹 = 봉입 전 자일렌 건조."},{"id":"C-실1-20","no":"실1-20","q":"세포원심분리기이다. 이 장비로 도말표본을 만들기에 적합한 검체는?","o":["객담","뇌척수액","염증성 흉수액","자궁경부 검체","혈액이 많은 복수액"],"img":["cyto_prac_qa_cyto_019.jpg"],"tags":[],"lv":3,"a":1,"look":"소형 원심기 본체와 깔때기가 달린 슬라이드 홀더를 장착한 회전판(rotor)이 보이는 세포원심분리기(cytocentrifuge)다.","e":"세포원심분리기는 세포가 적은 소량의 액체를 슬라이드의 좁은 원형 면적에 농축해 붙이며, 세포가 가장 적은 뇌척수액이 대표 검체다.","w":["① 객담은 점액이 많아 직접 도말하거나 Saccomanno 법으로 처리한다.","③, ⑤ 염증성 흉수액과 혈액이 많은 복수액은 세포가 많아 일반 원심 후 도말하거나 세포군집절편을 만든다.","④ 자궁경부 검체는 솔이나 주걱으로 긁는 찰과 도말로 검사한다."],"k":"세포 적은 액체(뇌척수액) = 세포원심분리."},{"id":"C-실1-21","no":"실1-21","q":"객담 세포도말표본이다. 검체의 적합성을 알기 위한 세포는?","o":["꽃가루","술잔세포","먼지세포","화생세포","방기저세포"],"img":["cyto_prac_qa_cyto_020.jpg"],"tags":[],"lv":3,"a":2,"look":"분홍색 점액 줄기 사이에 둥근 핵과 넉넉한 세포질을 가진 크기가 고른 둥근 세포가 많이 흩어져 있다.","e":"폐포대식세포(alveolar macrophage), 곧 먼지세포(dust cell)는 폐포에만 있으므로 보여야 깊은 기도에서 나온 적합한 객담이다. 없으면 침(타액) 검체로 본다.","w":["② 술잔세포(goblet cell)는 기관지 상피에서도 나오므로 폐포까지 채취되었다는 근거가 되지 못한다.","④ 화생세포는 자궁경부 변형대에서 거미 모양 세포질 돌기를 보이는 세포다.","⑤ 방기저세포는 둥글고 N/C비가 큰 편평세포로 객담 적합성과 무관하다."],"k":"객담 적합성 = 폐포대식세포(먼지세포)."},{"id":"C-실1-22","no":"실1-22","q":"자궁경부 질도말 검체를 습윤고정하였다. 그 이유는?","o":["핵소체를 잘 보기 위해","세포막을 잘 보기 위해","세포가 slide에 잘 붙기 위해","세포 소기관을 잘 관찰하기 위해","세포의 형태를 잘 보존하기 위해"],"img":["cyto_prac_qa_cyto_022.jpg"],"tags":[],"lv":3,"a":4,"look":"도말한 슬라이드를 고정액이 담긴 염색통에 마르기 전에 바로 담그는 습윤고정 장면이다.","e":"도말 직후 95% 에탄올에 담그는 습윤고정은 공기 건조로 핵이 부풀고 흐려지는 인공산물을 막아 세포와 핵의 형태를 보존한다. 파파니콜로 염색(Papanicolaou stain)의 전제 조건이다.","w":["① 핵소체를 보는 것은 염색의 역할이며, 습윤고정은 세포 전체의 형태를 보존하려는 것이다.","② 세포막만이 아니라 핵과 세포질을 포함한 세포 전체의 형태를 보존하려는 것이다.","③ 세포 부착은 부착제나 코팅 슬라이드의 역할이다.","④ 세포 소기관은 광학현미경의 Pap 염색 표본으로 관찰하는 대상이 아니다."],"k":"습윤고정 = 건조 방지, 세포 형태 보존."},{"id":"C-실1-24","no":"실1-24","q":"갑상선 병변을 알기 위해 세침흡인 세포검사를 실시하는 모습이다. 같은 방법을 사용할 수 있는 부위는?","o":["방광","대장","유방","자궁","기관지"],"img":["cyto_prac_qa_cyto_024.jpg"],"tags":[],"lv":3,"a":2,"look":"주사기를 흡인용 손잡이에 끼워 목 앞쪽 갑상선 부위에 가는 바늘을 찔러 넣고 있다.","e":"세침흡인(fine needle aspiration, FNA)은 만져지거나 초음파로 보이는 덩이에 가는 바늘을 넣어 세포를 흡인하며, 갑상선, 유방, 림프절, 침샘 같은 표재성 장기에 쓴다.","w":["① 방광은 소변이나 세척액으로 세포검사를 한다.","④ 자궁경부는 솔이나 주걱으로 긁는 찰과 도말로 검사한다.","⑤ 기관지는 솔로 문질러 세포를 얻는 찰과세포검사를 한다."],"k":"세침흡인 = 갑상선, 유방 등 표재성 덩이."}]},{"no":2,"t":"정상 세포·호르몬 평가","core":"","secs":[],"point":"","items":[{"id":"C-실2-01","no":"실2-01","q":"","o":[],"a":0,"img":["cyto_prac_cyto_013.jpg"],"tags":[]},{"id":"C-실2-02","no":"실2-02","q":"","o":[],"a":0,"img":["cyto_prac_cyto_015.jpg"],"tags":[]},{"id":"C-실2-03","no":"실2-03","q": ems":[{"id":"T-1-01","no":"1-01","q":"해부학 교육이나 박물관 전시용으로 장기의 색조를 보존하는 데 쓰는 고정법은?","o":["완충 글루타르알데하이드","카이저링(Kaisering)법","젠커(Zenker) 용액","수사(Susa) 용액","부앵(Bouin) 용액"],"img":[],"tags":[],"lv":3,"a":1,"look":"","e":"카이저링법은 포르말린, 초산칼륨, 질산칼륨으로 장기의 자연색을 보존해 교육, 전시용 표본에 쓴다. 진단용은 10% 중성 완충 포르말린, 전자현미경용은 글루타르알데하이드다.","w":["① 완충 글루타르알데하이드는 전자현미경 1차 고정액이다.","③ 젠커 용액은 승홍과 중크롬산칼륨을 함유해 탈승홍이 필요하다.","④ 수사 용액은 승홍과 포르말린을 함유하며 종양과 피부 생검 고정에 좋다.","⑤ 부앵 용액은 피크린산 때문에 조직이 노랗게 물든다."],"k":"교육, 전시용 장기 고정 = 카이저링."},{"id":"T-1-02","no":"1-02","q":"독물학(약물, 독극물) 검사를 위한 조직을 운송할 때 올바른 처리는?","o":["글루타르알데하이드에 고정한다","무수 에탄올에 고정한다","고정하지 않고 동결 상태로 유지한다","젠커 용액에 고정한다","10% 포르말린에 고정한다"],"img":[],"tags":[],"lv":3,"a":2,"look":"","e":"고정액은 조직 내 화학 성분을 변화시키거나 녹여내므로 독물 분석용 조직은 고정하지 않고 동결해 운송한다. 효소조직화학, 지방 염색용 조직도 같다.","w":["① 글루타르알데하이드는 전자현미경용 1차 고정액이다.","② 무수 알코올은 글리코겐 같은 수용성 성분을 보존하는 고정액이다.","④ 젠커 용액은 승홍을 함유해 고정 후 탈승홍이 필요한 고정액이다.","⑤ 10% 포르말린은 일반 목적의 조직을 운반할 때 쓰는 고정액이다."],"k":"독물학 검체 = 고정 없이 동결."},{"id":"T-1-03","no":"1-03","q":"조직 고정 시 고정액의 양으로 가장 적절한 것은?","o":["조직 부피의 5배 미만","조직이 잠기지 않을 정도","조직 부피의 10~20배","조직 부피의 1~3배","조직 부피의 50~100배"],"img":[],"tags":[],"lv":3,"a":2,"look":"","e":"고정액은 조직 부피의 10~20배를 써야 농도가 유지되고 조직 전체에 충분히 침투한다. 탈회액도 조직 부피의 10~20배를 쓰고 매일 교환한다.","w":["① 5배 미만은 권장량(10~20배)보다 적어 고정이 불충분해진다.","② 조직이 잠기지 않으면 고정액이 닿지 않는 부분이 고정되지 않는다.","④ 1~3배는 권장량(10~20배)보다 훨씬 적어 고정액 농도가 유지되지 않는다.","⑤ 50~100배는 권장량(10~20배)보다 지나치게 많다."],"k":"고정액 양 = 조직 부피의 10~20배."},{"id":"T-1-04","no":"1-04","q":"조직 검체의 채취 방법(생검법)에 해당하지 않는 것은?","o":["시험절제","침생검","동결절편법","펀치생검","소파술"],"img":[],"tags":[],"lv":3,"a":2,"look":"","e":"동결절편법은 채취된 조직을 얼려 박절하는 표본 제작법이다. 시험절제, 소파, 펀치생검, 침생검은 검체 채취법이다.","w":["① 시험절제는 병변 조직을 잘라 얻는 검체 채취법이다.","② 침생검은 투과침으로 실질장기, ④ 펀치생검은 원형 칼날로 피부·자궁경부, ⑤ 소파술은 큐렛으로 자궁내막을 채취한다."],"k":"동결절편은 표본 제작법. 채취법 아님."},{"id":"T-1-05","no":"1-05","q":"젠커(Zenker) 용액으로 고정한 조직의 승홍 색소를 제거하는 탈승홍 과정의 시약 순서로 옳은 것은?","o":["티오황산나트륨 → 루골 요오드","루골 요오드 → 티오황산나트륨","페로시안화칼륨 → 염산","수산화칼륨 → 80% 에탄올","포화 탄산리튬 → 산알코올"],"img":[],"tags":[],"lv":3,"a":1,"look":"","e":"승홍 함유 고정액은 흑갈색 수은 침착물을 남긴다. 루골 요오드로 요오드화 수은을 만든 뒤 티오황산나트륨(하이포)으로 요오드를 제거한다. 포화 탄산리튬은 피크린산 제거용이다.","w":["① 순서가 거꾸로다. 티오황산나트륨은 요오드를 지우는 단계이므로 요오드 처리 뒤에 쓴다.","③ 페로시안화칼륨과 염산은 철을 증명하는 프러시안 블루 반응 시약이다.","④ 수산화칼륨과 80% 에탄올은 포르말린 색소를 제거하는 Verocay법 시약이다.","⑤ 포화 탄산리튬은 피크린산 색소 제거에, 산알코올은 분별에 쓴다."],"k":"탈승홍 = 요오드 → 티오황산나트륨.","ref":[{"img":"ref_src3_ppt04_fig_s_13_jpg.jpg","cap":"젠커액 고정 조직의 승홍색소(흑갈색)"}]},{"id":"T-1-06","no":"1-06","q":"고정 후 탈승홍 조작이 필요한 고정액은?","o":["카르노이(Carnoy) 용액","젠커(Zenker) 용액","겐드르(Gendre) 용액","로스만(Rossman) 용액","부앵(Bouin) 용액"],"img":[],"tags":[],"lv":3,"a":1,"look":"","e":"탈승홍은 승홍(염화제2수은) 함유 고정액인 젠커, 헬리(Helly), 수사(Susa)에서 필요하다. 부앵은 피크린산, 카르노이는 알코올, 클로로포름, 초산으로 구성된다.","w":["① 카르노이 용액은 알코올, 클로로포름, 빙초산으로 구성된다.","③ 겐드르 용액, ④ 로스만 용액은 알코올 계열 글리코겐 고정액이다.","⑤ 부앵 용액은 피크린산 고정액으로 황색 색소가 남는다."],"k":"승홍 함유 = 젠커, 헬리, 수사. 탈승홍 필요.","ref":[{"img":"ref_src3_ppt04_fig_s_13_jpg.jpg","cap":"젠커액 고정 조직의 승홍색소(흑갈색)"}]},{"id":"T-1-07","no":"1-07","q":"포르말린을 함유한 복합 고정액을 모두 고른 것은?\n가. 카르노이(Carnoy) 용액\n나. 부앵(Bouin) 용액\n다. 뮐러(Müller) 용액\n라. 수사(Susa) 용액","o":["가, 나, 다","가, 다","나, 라","라","가, 나, 다, 라"],"img":[],"tags":[],"lv":3,"a":2,"look":"","e":"부앵 용액은 피크린산, 포르말린, 빙초산이고, 수사 용액은 승홍, 포르말린, 초산 등을 함유한다. 카르노이는 알코올, 클로로포름, 빙초산이고, 뮐러는 중크롬산칼륨과 황산나트륨으로 포르말린이 없다.","w":["① 가. 카르노이와 다. 뮐러는 포르말린이 없어 포함될 수 없다.","② 가. 카르노이와 다. 뮐러는 모두 포르말린이 없는 고정액이다.","④ 라. 수사뿐 아니라 나. 부앵도 포르말린을 함유한다.","⑤ 가. 카르노이와 다. 뮐러는 포르말린이 없어 전부를 고를 수 없다."],"k":"포르말린 함유 = 부앵, 수사. 카르노이, 뮐러는 없음."},{"id":"T-1-08","no":"1-08","q":"바늘(침)생검으로 검체를 채취하는 장기를 모두 고른 것은?\n가. 간\n나. 비장\n다. 콩팥\n라. 위","o":["가, 나, 다","가, 다","나, 라","라","가, 나, 다, 라"],"img":[],"tags":[],"lv":3,"a":0,"look":"","e":"바늘생검은 간, 콩팥, 비장 같은 실질장기에 투과침을 찔러 조직을 얻는다. 위는 관강장기로 내시경 생검을 한다.","w":["② 가, 다 외에 나. 비장도 투과침으로 생검하는 실질장기다.","③ 라. 위는 내시경 생검 대상이며 가. 간과 다. 콩팥이 빠졌다.","④ 라. 위는 바늘생검이 아니라 내시경 생검 대상이다.","⑤ 라. 위는 관강장기로 바늘생검 대상이 아니다."],"k":"바늘생검 = 실질장기(간, 콩팥, 비장)."},{"id":"T-1-09","no":"1-09","q":"간과 콩팥 질환의 조직 진단을 위한 채취 방법으로 가장 적절한 것은?","o":["침생검","소파생검","내시경 절제","펀치생검","원추생검"],"img":[],"tags":[],"lv":3,"a":0,"look":"","e":"간과 콩팥은 실질장기로, 피부를 통해 투과침을 찔러 가느다란 조직을 얻는 침생검이 표준이다.","w":["② 소파생검은 자궁내막, ④ 펀치생검은 피부·자궁경부, ⑤ 원추생검은 자궁경부 전용이다.","③ 내시경 절제는 조기 위암, 대장암 같은 관강장기 병변을 제거하는 방법이다."],"k":"간, 콩팥 = 침(바늘)생검.","ref":[{"img":"ref_src3_pdf3_imgrgb_p_011_023_jpg.jpg","cap":"간 바늘생검 조직과 생검 바늘"}]},{"id":"T-1-10","no":"1-10","q":"다음 고정제 중 침투가 가장 느려 충분한 고정에 가장 오랜 시간이 필요한 것은?","o":["글루타르알데하이드","빙초산","포르말린","삼염화초산","염화제2수은"],"img":[],"tags":[],"lv":3,"a":0,"look":"","e":"글루타르알데하이드는 침투가 매우 느려 1 mm 이하 작은 조직에만 쓰며 전자현미경 1차 고정에 사용한다. 빙초산과 승홍은 침투가 빠르다.","w":["② 빙초산은 침투가 신속한 고정제다.","③ 포르말린은 침투는 빠르나 가교 형성이 느리다.","④ 삼염화초산은 침투가 빠르고 탈회 작용도 있다.","⑤ 염화제2수은(승홍)은 침투가 빠른 고정제다."],"k":"침투 최저속, 고정시간 최장 = 글루타르알데하이드."},{"id":"T-1-11","no":"1-11","q":"자궁경부 병변을 원추(원뿔) 모양으로 절제하는 생검의 목적으로 옳은 것은?","o":["진단과 함께 조기 병변을 제거하기 위함이다","콩팥 토리를 확보하기 위함이다","방광 전층을 확보하기 위함이다","간 실질의 섬유화 정도를 평가하기 위함이다","폐의 폐포 구조를 보존하기 위함이다"],"img":[],"tags":[],"lv":3,"a":0,"look":"","e":"원추(원뿔)생검은 변형대를 포함해 원뿔 모양으로 절제하므로 진단과 동시에 이형성증, 상피내암 등 조기 병변을 제거한다.","w":["② 토리 포함 여부 확인은 콩팥 침생검에서 하는 일이다.","③ 방광은 내강 조직을 내시경 생검으로 채취하는 장기다.","④ 간 실질은 투과침을 쓰는 바늘생검으로 얻는다.","⑤ 폐는 기관지로 고정액을 주입해 팽창시킨 채 고정한다."],"k":"원추생검 = 자궁경부. 진단 겸 치료."},{"id":"T-1-12","no":"1-12","q":"포르말린 고정 조직의 면역조직화학 검사에서 항원부활(antigen retrieval)이 필요한 이유는?","o":["포르말린이 지질을 녹여내기 때문이다","포르말린이 단백질 아미노기 사이에 메틸렌 가교를 형성하여 항원결정기를 가리기 때문이다","포르말린이 핵산을 분해하기 때문이다","포르말린이 조직을 탈회시키기 때문이다","포르말린이 조직을 과도하게 수축시키기 때문이다"],"img":[],"tags":[],"lv":3,"a":1,"look":"","e":"포르말린은 단백질 아미노기 사이에 메틸렌 가교를 형성해 항원결정기를 가린다. 열처리나 효소 처리로 항원을 다시 노출시키는 것이 항원부활이다.","w":["① 지질을 녹이는 것은 알코올과 자일렌이다.","④ 포르말린에는 탈회 작용이 없으며 탈회는 산이나 EDTA로 한다.","⑤ 포르말린은 수축이 비교적 적은 고정제다."],"k":"포르말린 메틸렌 가교 → 항원 은폐 → 항원부활.","ref":[{"img":"ref_src3_ppt04_fig_s_07_jpg.jpg","cap":"포름알데히드의 메틸렌 가교 형성"}]},{"id":"T-1-13","no":"1-13","q":"부앵(Bouin) 용액에서 빙초산의 역할로 옳은 것은?","o":["효소 활성을 유지한다","조직을 탈수한다","피크린산에 의한 조직 수축을 억제한다","핵을 매염한다","지방을 보존한다"],"img":[],"tags":[],"lv":3,"a":2,"look":"","e":"부앵 용액은 피크린산, 포르말린, 빙초산으로 구성되며, 조직을 팽윤시키는 빙초산이 피크린산에 의한 수축을 상쇄한다.","w":["① 효소 증명에 유용한 고정제는 아세톤이다.","② 고정과 동시에 탈수를 겸하는 고정제는 에틸알코올이다.","④ 매염 작용은 빙초산이 아니라 승홍, 중크롬산 같은 고정액이 한다.","⑤ 빙초산은 지질과 탄수화물을 고정하지 못하며, 지방 증명에는 사산화오스뮴을 쓴다."],"k":"부앵의 빙초산 = 피크린산 수축 방지."},{"id":"T-1-14","no":"1-14","q":"투과침을 이용한 침생검으로 조직을 채취하는 장기를 모두 고른 것은?\n가. 간\n나. 위\n다. 콩팥\n라. 자궁경부","o":["가, 나, 다","가, 다","나, 라","라","가, 나, 다, 라"],"img":[],"tags":[],"lv":3,"a":1,"look":"","e":"침생검은 간, 콩팥 등 실질장기에 쓴다. 위는 내시경 생검, 자궁경부는 펀치생검이나 원추생검을 한다.","w":["① 나. 위는 내시경 생검 대상이라 포함될 수 없다.","③ 나. 위와 라. 자궁경부는 모두 침생검 대상이 아니다.","④ 라. 자궁경부는 펀치생검이나 원추생검으로 채취한다.","⑤ 나. 위와 라. 자궁경부는 침생검 대상이 아니다."],"k":"침생검 = 간, 콩팥."},{"id":"T-1-15","no":"1-15","q":"수술로 적출된 신선한 위를 고정하는 방법으로 옳은 것은?","o":["절개하지 않고 통째로 고정액에 넣는다","동결시켜 운송한다","3등분하여 전자현미경용, 면역형광용, 광학현미경용으로 나눈다","기관을 통해 고정액을 주입한다","대만곡을 따라 절개하여 펼치고 코르크판에 핀으로 고정한 뒤 점막면을 아래로 하여 고정액에 띄운다"],"img":[],"tags":[],"lv":3,"a":4,"look":"","e":"위, 장 같은 관강장기는 절개해 점막을 펼치고 핀으로 고정한 뒤 고정액에 넣어야 수축하거나 말리지 않는다. 주입고정은 폐, 3등분은 콩팥 생검의 처리법이다.","w":["① 관강장기를 통째로 넣으면 수축하거나 말려 점막이 고르게 고정되지 않는다.","② 동결 운송은 독물학 검체, ③ 3등분은 콩팥 생검, ④ 기관 주입고정은 폐의 처리법이다."],"k":"관강장기(위) = 펼쳐서 핀 고정.","ref":[{"img":"ref_src3_ppt04_fig_s_17_jpg.jpg","cap":"담금고정 전처리: 펼쳐 핀 고정"}]},{"id":"T-1-17","no":"1-17","q":"원형의 칼날을 돌려 원통형 조직을 얻는 펀치생검(punch biopsy)을 주로 시행하는 부위는?","o":["자궁내막, 농양","피부, 자궁경부","위, 대장","간, 콩팥","폐, 방광"],"img":[],"tags":[],"lv":3,"a":1,"look":"","e":"펀치생검은 피부, 자궁경부처럼 표면에서 접근 가능한 병변에 쓴다. 간, 콩팥은 침생검, 자궁내막은 소파생검, 위, 대장은 내시경 생검이다.","w":["① 자궁내막과 농양은 소파생검, ④ 간과 콩팥은 투과침 생검 대상이다.","③ 위, 대장은 내시경으로 조직을 얻는 관강장기다.","⑤ 방광 같은 내강 장기는 내시경 생검으로 조직을 얻는다."],"k":"펀치생검 = 피부, 자궁경부.","ref":[{"img":"ref_src3_pdf3_imgrgb_p_007_003_jpg.jpg","cap":"피부 펀치생검 조직(윗면·옆면·이등분)"}]},{"id":"T-1-18","no":"1-18","q":"포름알데하이드 원액(약 37~40%)을 1 : 9로 희석한 10% 포르말린 속 실제 포름알데하이드 농도는?","o":["약 0.4%","약 1%","약 4%","약 10%","약 40%"],"img":[],"tags":[],"lv":3,"a":2,"look":"","e":"10% 포르말린은 포르말린 원액(37~40% 포름알데하이드)을 10%로 희석한 것이므로 실제 포름알데하이드 농도는 약 3.7~4%다.","w":["① 0.4%는 실제 농도(약 4%)의 10분의 1에 불과하다.","② 1%는 실제 포름알데하이드 농도(약 4%)보다 훨씬 낮다.","④ 10%는 포르말린 원액 기준의 희석 비율이며 포름알데하이드 농도가 아니다.","⑤ 약 40%는 희석하지 않은 포르말린 원액의 농도다."],"k":"10% 포르말린 = 포름알데하이드 약 4%."},{"id":"T-1-19","no":"1-19","q":"적출한 자궁의 내강을 열어 관찰할 때 흔히 사용하는 절개 형태로 옳은 것은?","o":["내시경 점막밑 박리","큐렛 소파","투과침 천자","원형 펀치","T자 또는 Y자 절개"],"img":[],"tags":[],"lv":3,"a":4,"look":"","e":"적출 자궁은 T자 또는 Y자 절개로 내강을 연다. 원추 절제는 자궁경부, 투과침은 간, 콩팥, 큐렛은 자궁내막, 원형 펀치는 피부, 자궁경부에 쓴다.","w":["① 내시경 점막밑 박리는 조기 위암이나 조기 대장암을 내시경으로 제거하는 방법이다.","② 큐렛 소파는 자궁내막이나 농양 같은 병소를 긁어 채취하는 소파생검이다.","③ 투과침 천자는 간, 콩팥 같은 실질장기에서 조직을 얻는 바늘생검이다.","④ 원형 펀치는 피부나 자궁경부에서 원통형 조직을 얻는 펀치생검이다."],"k":"적출 자궁 = T자, Y자 절개. 원추생검은 자궁경부."},{"id":"T-1-20","no":"1-20","q":"예리한 큐렛(curette)으로 자궁내막을 긁어 조직을 채취하는 방법은?","o":["펀치생검","소파생검","흡인생검","절제생검","바늘생검"],"img":[],"tags":[],"lv":3,"a":1,"look":"","e":"소파생검(시험소파술)은 큐렛으로 자궁내막이나 병소를 긁어 채취한다. 흡인생검은 음압, 펀치생검은 원형 칼날, 바늘생검은 투과침을 쓴다.","w":["① 펀치생검은 원형 칼날로 피부나 자궁경부 조직을 떼어 낸다.","③ 흡인생검은 음압으로 세포나 조직을 빨아들인다.","④ 절제생검은 병변 전체를 잘라 낸다.","⑤ 바늘생검은 투과침으로 간, 콩팥 같은 실질장기를 채취한다."],"k":"큐렛으로 긁음 = 소파생검."},{"id":"T-1-21","no":"1-21","q":"간이나 콩팥의 조직 진단을 위한 생검법의 이름과 사용 기구의 연결로 옳은 것은?","o":["소파생검 : 원형 칼날","절제생검 : 큐렛","바늘생검 : 투과침","내시경생검 : 투과침","펀치생검 : 투과침"],"img":[],"tags":[],"lv":3,"a":2,"look":"","e":"간과 콩팥은 투과침을 이용한 바늘생검으로 채취한다. 펀치생검은 원형 칼날, 소파생검은 큐렛을 쓴다.","w":["① 소파생검은 원형 칼날이 아니라 큐렛을 쓴다.","② 큐렛은 소파생검 기구이며 절제생검은 병변 전체를 잘라 낸다.","④ 내시경생검은 내시경 집게를 쓴다.","⑤ 펀치생검은 투과침이 아니라 원형 칼날을 쓴다."],"k":"간, 콩팥 = 바늘생검(투과침).","ref":[{"img":"ref_src3_pdf3_imgrgb_p_011_023_jpg.jpg","cap":"간 바늘생검 조직과 생검 바늘"}]},{"id":"T-1-22","no":"1-22","q":"신선한 상태로 광학현미경용, 면역형광용, 전자현미경용으로 3등분하여 처리해야 하는 생검 검체는?","o":["간","췌장","위","콩팥","폐"],"img":[],"tags":[],"lv":3,"a":3,"look":"","e":"콩팥 생검은 사구체 질환 진단을 위해 광학현미경(포르말린), 면역형광(동결), 전자현미경(글루타르알데하이드)용으로 나누어 처리한다.","w":["① 간은 투과침으로 얻는 실질장기이며 3등분 처리는 콩팥 생검에서 한다.","② 췌장은 3등분 처리 대상이 아니며 3등분은 콩팥 사구체 질환 진단에 한다.","③ 위는 내시경으로 점막 조직을 얻는 관강장기다.","⑤ 폐는 기관지로 고정액을 주입해 고정하는 장기다."],"k":"콩팥 생검 = 광학, 면역형광, 전자 3등분."},{"id":"T-1-23","no":"1-23","q":"피부나 자궁경부의 표재성 병변 진단에 흔히 쓰는 생검법의 특징으로 옳은 것은?","o":["원형 칼날을 돌려 원통형의 작은 조직을 얻는다","큐렛으로 병소를 긁는다","병변 전체를 넓게 절제한다","내시경으로 점막 전체를 박리한다","투과침으로 실질 장기를 찌른다"],"img":[],"tags":[],"lv":3,"a":0,"look":"","e":"피부와 자궁경부는 원형 칼날(펀치)로 원통형 조직을 떼어내는 펀치생검을 흔히 시행한다.","w":["② 큐렛으로 병소를 긁는 것은 자궁내막이나 농양에 쓰는 소파생검이다.","③ 병변 전체를 절제하는 것은 절제생검이다.","④ 내시경으로 점막하층까지 박리하는 것은 조기 위암, 대장암에 쓰는 점막밑박리절제술이다.","⑤ 투과침으로 찌르는 것은 간, 콩팥 같은 실질장기의 바늘생검이다."],"k":"피부, 자궁경부 = 펀치생검."},{"id":"T-1-24","no":"1-24","q":"고정 후 조직에 남은 수은 색소를 요오드화 과정으로 제거해야 하는 고정 성분은?","o":["아세톤","포르말린","빙초산","피크린산","승홍(염화제2수은)"],"img":[],"tags":[],"lv":3,"a":4,"look":"","e":"승홍(HgCl2)은 조직에 흑갈색 결정성 침착물을 남기므로 요오드와 티오황산나트륨으로 제거한다(탈승홍).","w":["① 아세톤은 효소조직화학용 고정제다.","② 포르말린은 산성 포르말린 헤마틴을 남긴다.","③ 빙초산은 조직을 팽윤시켜 피크린산의 수축을 상쇄하는 고정제다.","④ 피크린산은 황색 색소를 남기며 알코올이나 탄산리튬으로 제거한다."],"k":"요오드화 제거 = 승홍.","ref":[{"img":"ref_src3_ppt04_fig_s_13_jpg.jpg","cap":"젠커액 고정 조직의 승홍색소(흑갈색)"}]},{"id":"T-1-25","no":"1-25","q":"수술로 절제한 폐 조직을 고정하는 방법으로 가장 적절한 것은?","o":["전자레인지 가열 고정","조직을 펼쳐 핀으로 고정","기관지를 통해 고정액을 주입하는 주입고정","동결 후 운송","고정 없이 즉시 박절"],"img":[],"tags":[],"lv":3,"a":2,"look":"","e":"폐는 공기 때문에 고정액에 뜨고 폐포가 허탈되므로 기관지나 주사기로 고정액을 주입해 폐포를 팽창시킨 상태로 고정한다.","w":["① 마이크로파(전자레인지) 가열은 알데히드 고정 시간을 단축하는 촉진법이다.","② 핀 고정은 위, 장 같은 관강장기의 방법이다.","④ 동결 운송은 독물학 검체의 처리법이다.","⑤ 고정하지 않으면 자가용해와 부패가 진행된다."],"k":"폐 = 주입고정.","ref":[{"img":"ref_src3_ppt04_fig_s_19_jpg.jpg","cap":"폐의 주입고정: 기관지로 고정액 주입"}]},{"id":"T-1-26","no":"1-26","q":"피크린산을 함유한 고정액은?","o":["젠커(Zenker) 용액","헬리(Helly) 용액","부앵(Bouin) 용액","카르노이(Carnoy) 용액","오르트(Orth) 용액"],"img":[],"tags":[],"lv":3,"a":2,"look":"","e":"부앵 용액은 포화 피크린산, 포르말린, 빙초산으로 구성된다. 오르트는 중크롬산칼륨과 포르말린, 헬리와 젠커는 승홍과 중크롬산칼륨을 함유한다.","w":["① 젠커 용액은 승홍, 중크롬산칼륨, 빙초산이다.","② 헬리 용액은 승홍, 중크롬산칼륨, 포르말린이다.","④ 카르노이 용액은 알코올, 클로로포름, 빙초산이다.","⑤ 오르트 용액은 중크롬산칼륨과 포르말린이다."],"k":"피크린산 = 부앵.","ref":[{"img":"ref_src3_ppt04_fig_s_12_jpg.jpg","cap":"부앵액: 피크린산으로 노란색"}]},{"id":"T-1-27","no":"1-27","q":"피크린산 고정액에 초산을 혼합하는 이유는?","o":["조직 수축을 억제하기 위해","고정을 완화하기 위해","단백질 변성을 증가시키기 위해","탈수력을 억제하기 위해","염색력을 증진하기 위해"],"img":[],"tags":[],"lv":3,"a":0,"look":"","e":"피크린산은 조직을 수축시키고 초산은 팽창시키므로 함께 쓰면 서로 상쇄된다.","w":["② 초산은 핵단백을 침전시켜 오히려 고정을 돕는다.","③ 초산은 단백질 변성을 늘리려는 것이 아니라 조직을 팽윤시켜 수축을 상쇄한다.","④ 초산을 섞는 목적은 탈수력 억제가 아니라 피크린산의 조직 수축 억제다.","⑤ 염색력 증진은 에오신에 빙초산을 넣는 이유다."],"k":"피크린산 + 초산 = 수축 억제."},{"id":"T-1-28","no":"1-28","q":"고정제의 침투 속도 비교로 옳은 것은?","o":["염화제2수은이 가장 느리다","글루타르알데하이드가 가장 느리다","모든 고정제의 침투 속도는 같다","빙초산이 가장 느리다","무수 에탄올이 가장 느리다"],"img":[],"tags":[],"lv":3,"a":1,"look":"","e":"글루타르알데하이드는 침투가 가장 느려 작은 조직 조각에만 쓴다. 빙초산, 승홍, 알코올은 침투가 빠르다.","w":["① 염화제2수은(승홍)은 침투가 빠른 고정제다.","③ 고정제마다 침투력이 달라 포르말린은 실온에서 1시간에 약 1 mm 침투한다.","④ 빙초산은 침투가 신속한 고정액이다.","⑤ 알코올은 침투가 신속해 두께 3~4 mm 조직을 2~4시간에 고정한다."],"k":"침투 최저속 = 글루타르알데하이드."},{"id":"T-1-29","no":"1-29","q":"소파생검(시험소파술)의 적용 부위로 옳은 것은?","o":["방광 벽 전층","간, 콩팥 같은 실질장기","피부의 작은 결절","폐의 말초 종괴","자궁내막, 농양 등 긁어낼 수 있는 병소"],"img":[],"tags":[],"lv":3,"a":4,"look":"","e":"소파생검은 큐렛으로 자궁내막이나 농양 부위를 긁어 채취한다. 실질장기는 바늘생검, 피부 결절은 펀치생검이다.","w":["① 방광은 내강 조직을 내시경 생검으로 채취하는 장기다.","② 간, 콩팥 같은 실질장기는 투과침을 쓰는 바늘생검으로 채취한다.","③ 피부 병변은 원형 칼날로 원통형 조직을 얻는 펀치생검으로 채취한다.","④ 폐는 바늘 형태 기구로 깊은 부위 장기를 검사하는 침생검 대상이다."],"k":"큐렛 소파 = 자궁내막, 농양."},{"id":"T-1-30","no":"1-30","q":"간이나 콩팥의 조직 진단에 사용하지 않는 생검법은?","o":["경정맥 간생검","경피적 침생검","바늘생검","소파생검","초음파 유도하 침생검"],"img":[],"tags":[],"lv":3,"a":3,"look":"","e":"간과 콩팥은 바늘(침)생검을 쓴다. 소파생검은 자궁내막, 농양 등 긁어낼 수 있는 부위에 쓰며 실질장기에는 쓰지 않는다.","w":["① 경정맥 간생검은 출혈 위험이 큰 환자의 간 조직 채취법이다.","② 경피적 침생검은 피부를 통해 투과침을 찔러 간, 콩팥 조직을 얻는다.","③ 바늘생검은 간, 콩팥의 표준 생검법이다.","⑤ 초음파 유도하 침생검은 영상으로 위치를 보며 하는 바늘생검이다."],"k":"간, 콩팥 = 바늘생검."},{"id":"T-1-31","no":"1-31","q":"조직 고정의 1차 목적인 자가용해(autolysis) 방지와 관련된 세포소기관은?","o":["골지체","세포질그물","용해소체","사립체","리보솜"],"img":[],"tags":[],"lv":3,"a":2,"look":"","e":"세포가 죽으면 용해소체의 가수분해효소가 유출되어 자기 조직을 분해한다(자가용해). 고정은 이 효소를 불활성화해 자가용해를 막는다.","w":["① 골지체는 합성된 단백질을 저장, 농축, 분비하고 용해소체를 형성한다.","② 세포질그물은 물질 수송의 통로이며 단백질과 스테로이드 호르몬 합성에 관여한다.","④ 사립체는 ATP를 합성해 에너지를 만든다.","⑤ 리보솜은 mRNA 정보에 따라 단백질을 합성한다."],"k":"자가용해 = 용해소체.","ref":[{"img":"ref_src3_ppt04_fig_s_03_jpg.jpg","cap":"고정이 잘된 조직과 자가융해 조직"}]},{"id":"T-1-32","no":"1-32","q":"조기 위암이나 조기 대장암을 내시경으로 점막하층까지 박리하여 한 덩어리로 제거하는 방법은?","o":["원뿔생검술","소파생검술","바늘생검술","내시경 점막밑박리절제술","펀치생검술"],"img":[],"tags":[],"lv":3,"a":3,"look":"","e":"점막밑박리절제술(endoscopic submucosal dissection, ESD)은 조기 위장관 암을 내시경으로 점막하층까지 박리해 일괄 절제하며, 검체는 핀으로 펼쳐 고정한다.","w":["① 원뿔생검술은 자궁경부 병변을 원뿔 모양으로 절제해 진단과 조기 병변 제거를 겸한다.","② 소파생검술은 큐렛으로 자궁내막이나 농양을 긁어 채취한다.","③ 바늘생검술은 투과침으로 간, 콩팥 같은 실질장기 조직을 얻는다.","⑤ 펀치생검술은 원형 칼날로 피부나 자궁경부의 원통형 조직을 얻는다."],"k":"조기 위암, 대장암 내시경 절제 = 점막밑절제술(ESD).","ref":[{"img":"ref_src3_pdf3_imgrgb_p_010_008_jpg.jpg","cap":"내시경점막밑절제술 실제 과정"}]},{"id":"T-1-33","no":"1-33","q":"미고정 콩팥 생검 조직을 나누기 전에 반드시 확인해야 할 것은?","o":["조직의 무게","피막 보존 상태","토리(사구체)의 포함 여부","출혈 부위","동결 상태"],"img":[],"tags":[],"lv":3,"a":2,"look":"","e":"콩팥 생검은 사구체 질환 진단이 목적이므로 해부현미경 등으로 토리 포함 여부를 확인한 뒤 광학, 면역형광, 전자현미경용으로 나눈다.","w":["⑤ 동결은 토리를 확인하고 3등분한 뒤 면역형광용 조직에만 한다."],"k":"콩팥 생검 = 토리 포함 확인."},{"id":"T-1-34","no":"1-34","q":"부앵(Bouin) 용액의 구성 성분 조합으로 옳은 것은?","o":["피크린산, 포르말린, 빙초산","알코올, 클로로포름, 빙초산","중크롬산칼륨, 황산나트륨","승홍, 중크롬산칼륨, 포르말린","글루타르알데하이드, 인산완충액"],"img":[],"tags":[],"lv":3,"a":0,"look":"","e":"부앵은 피크린산, 포르말린, 빙초산이다. 헬리는 승홍, 중크롬산칼륨, 포르말린, 카르노이는 알코올, 클로로포름, 빙초산, 뮐러는 중크롬산칼륨과 황산나트륨이다.","w":["② 알코올, 클로로포름, 빙초산은 카르노이 용액이다.","③ 중크롬산칼륨과 황산나트륨은 뮐러 용액이다.","④ 승홍, 중크롬산칼륨, 포르말린은 헬리 용액이다.","⑤ 글루타르알데하이드와 인산완충액은 전자현미경 고정액이다."],"k":"부앵 = 피크린산 + 포르말린 + 빙초산.","ref":[{"img":"ref_src3_ppt04_fig_s_12_jpg.jpg","cap":"부앵액: 피크린산으로 노란색"}]},{"id":"T-1-36","no":"1-36","q":"실질장기에 투과침을 찔러 가느다란 원통형 조직을 얻는 생검법의 대상 장기가 아닌 것은?","o":["간","위","전립샘","콩팥","유방"],"img":[],"tags":[],"lv":3,"a":1,"look":"","e":"바늘생검은 간, 콩팥, 전립샘, 유방 같은 실질 조직에 쓴다. 위는 관강장기로 내시경 생검을 한다.","w":["①, ④ 간과 콩팥은 투과침으로 조직을 얻는 바늘생검의 대표 장기다.","③ 전립샘도 바늘 형태 기구로 깊은 부위 조직을 얻는 침생검 대상이다.","⑤ 유방은 굵은 바늘을 삽입해 조직을 얻는 중심부바늘생검을 흔히 시행한다."],"k":"투과침 바늘생검 = 실질장기."},{"id":"T-1-35","no":"1-35","q":"불규칙 질출혈 환자의 자궁내막 병변을 진단하기 위해 큐렛으로 내막을 긁어 조직을 얻었다. 이 채취법은?","o":["펀치생검","절개생검","원뿔생검","절제생검","소파생검"],"img":[],"tags":[],"lv":3,"a":4,"look":"","e":"큐렛으로 긁어 채취하는 방법은 소파생검(시험소파술)이다. 절개생검은 병변 일부를, 절제생검은 병변 전체를 잘라낸다.","w":["① 펀치생검은 원형 칼날로 피부나 자궁경부 조직을 떼어 낸다.","② 절개생검은 병변 일부를, ④ 절제생검은 병변 전체를 잘라 낸다.","③ 원뿔생검은 자궁경부 병변을 원뿔 모양으로 절제한다."],"k":"큐렛 = 소파생검."},{"id":"T-1-37","no":"1-37","q":"자궁경부에서 진단과 조기암 제거를 동시에 목적으로 시행하는 생검법은?","o":["내시경생검","액상생검","원뿔생검","소파생검","바늘생검"],"img":[],"tags":[],"lv":3,"a":2,"look":"","e":"원뿔(원추)생검은 변형대를 포함해 원뿔 모양으로 절제하므로 진단과 동시에 상피내암 등 조기 병변을 제거한다.","w":["① 내시경생검은 위, 대장 같은 관강장기에서 조직을 얻는다.","④ 소파생검은 자궁내막 채취법이다.","⑤ 바늘생검은 투과침으로 간, 콩팥 같은 실질장기를 채취한다."],"k":"자궁경부 진단 + 조기암 제거 = 원뿔생검."},{"id":"T-1-38","no":"1-38","q":"수술로 떼어 낸 폐엽이 쭈그러진 채 검사실에 왔다. 허파꽈리 구조를 잘 보존하려면 어떻게 고정하는가?","o":["기관지를 통한 주입고정","증기고정","동결고정","열 고정","혈관 관류고정"],"img":[],"tags":[],"lv":3,"a":0,"look":"","e":"폐는 기관지로 고정액을 주입해 팽창시킨 상태로 고정한다. 관류고정은 동물 실험에서 혈관으로 고정액을 흘려보내는 방법이다.","w":["② 증기고정은 작은 표본이나 도말에 쓰는 특수 고정이다.","③ 동결고정은 수술 폐엽의 일반 고정법이 아니다.","④ 열 고정은 세균 도말 등에 쓴다.","⑤ 혈관 관류고정은 주로 동물 실험에서 쓴다."],"k":"폐 = 기관지 주입고정.","ref":[{"img":"ref_src3_ppt04_fig_s_19_jpg.jpg","cap":"폐의 주입고정: 기관지로 고정액 주입"}]},{"id":"T-1-39","no":"1-39","q":"조직 고정에 대한 설명으로 옳지 않은 것은?","o":["세포와 조직의 형태를 원형에 가깝게 보존한다","일부 고정액은 염색 시 매염 작용을 한다","자가용해와 부패를 막는다","고정 시간이 길수록 좋은 표본을 얻는다","조직을 적당히 단단하게 한다"],"img":[],"tags":[],"lv":3,"a":3,"look":"","e":"과고정은 조직을 과도하게 굳히고 항원성과 염색성을 떨어뜨리므로 적정 시간 고정이 원칙이다.","w":["① 세포와 조직의 형태를 원형에 가깝게 보존하는 것은 고정의 목적이다.","② 승홍, 중크롬산 같은 고정액은 매염 작용을 한다.","③ 자가용해와 부패 방지는 고정의 주된 목적이다.","⑤ 조직을 적당히 단단하게 하는 것은 고정의 효과다."],"k":"과고정은 해롭다. 고정 시간은 적정하게."},{"id":"T-1-40","no":"1-40","q":"떼어 낸 조직을 고정액에 담그는 이유로 옳지 않은 것은?","o":["세균 증식에 의한 부패를 막는다","조직 효소를 활성화한다","자가용해를 막는다","단백질을 응고시켜 조직을 굳힌다","일부 고정액은 염색의 매염 작용을 돕는다"],"img":[],"tags":[],"lv":3,"a":1,"look":"","e":"고정은 효소를 불활성화하여 자가용해를 막으므로 효소 활성화는 고정의 목적과 반대다. 효소조직화학에는 동결절편을 쓴다.","w":["① 부패 방지는 고정의 목적이다.","③ 자가용해 방지는 고정의 목적이다.","④ 단백질 응고로 조직을 굳히는 것은 고정의 작용이다.","⑤ 매염 작용은 일부 고정액의 부수 효과다."],"k":"고정은 효소를 불활성화한다.","ref":[{"img":"ref_src3_ppt04_fig_s_03_jpg.jpg","cap":"고정이 잘된 조직과 자가융해 조직"}]},{"id":"T-1-41","no":"1-41","q":"고정의 목적을 모두 고른 것은?\n가. 미생물에 의한 부패 방지\n나. 염색 시 매염 작용\n다. 조직 내 화학물질의 용해 및 손실 방지\n라. 용해소체 효소의 활성화","o":["가, 나, 다","가, 다","나, 라","라","가, 나, 다, 라"],"img":[],"tags":[],"lv":3,"a":0,"look":"","e":"고정은 부패 방지, 매염 작용, 성분 손실 방지를 목적으로 한다. 용해소체 효소는 고정으로 불활성화되어야 한다.","w":["② 나. 매염 작용도 고정의 목적인데 빠졌다.","③ 라. 용해소체 효소 활성화는 고정 목적이 아니다.","④ 라. 고정은 효소를 불활성화하므로 목적이 될 수 없다.","⑤ 라. 효소 활성화가 포함되어 있어 틀리다."],"k":"고정 목적 = 부패 방지, 매염, 손실 방지. 효소 활성화는 함정."},{"id":"T-1-42","no":"1-42","q":"조직에 승홍 색소가 남아 제거 처리가 필요한 고정액은?","o":["10% 포르말린","젠커(Zenker) 용액","부앵(Bouin) 용액","카르노이(Carnoy) 용액","뮐러(Müller) 용액"],"img":[],"tags":[],"lv":3,"a":1,"look":"","e":"젠커 용액은 승홍을 함유하여 수은 색소가 남으므로 요오드와 티오황산나트륨으로 탈승홍한다.","w":["① 10% 포르말린은 승홍이 없어 탈승홍이 필요 없고 포르말린 색소를 남길 수 있다.","③ 부앵 용액은 피크린산, ④ 카르노이 용액은 알코올 계열, ⑤ 뮐러 용액은 중크롬산칼륨 고정액이다."],"k":"승홍 색소 = 젠커.","ref":[{"img":"ref_src3_ppt04_fig_s_13_jpg.jpg","cap":"젠커액 고정 조직의 승홍색소(흑갈색)"}]},{"id":"T-1-43","no":"1-43","q":"사구체 질환이 의심되는 환자의 콩팥이나 간 실질 질환을 조직학적으로 진단하려 할 때 주로 쓰는 생검 방법은?","o":["소파생검","펀치생검","절개생검","바늘생검","내시경생검"],"img":[],"tags":[],"lv":3,"a":3,"look":"","e":"간, 콩팥 같은 깊은 실질 장기는 피부를 통해 투과침을 찔러 원통형 조직을 얻는 바늘생검(needle biopsy)으로 진단한다.","w":["① 소파생검은 자궁내막처럼 긁어내 조직을 얻는 방법이다.","② 펀치생검은 피부 같은 표면 병변을 원형 칼로 뚫어 얻는다.","③ 절개생검은 수술로 병변 일부를 잘라내는 방법이다.","⑤ 내시경생검은 위장관이나 기관지 점막 병변에 쓴다."],"k":"간, 콩팥 생검 = 바늘생검."},{"id":"T-1-44","no":"1-44","q":"기관지를 통해 고정액을 주입하여 팽창시킨 상태로 고정하는 주입고정이 가장 적합한 장기는?","o":["간","폐","콩팥","지라","갑상샘"],"img":[],"tags":[],"lv":3,"a":1,"look":"","e":"폐는 공기를 함유해 고정액에 뜨므로 담금고정이 고르지 않다. 기관지로 고정액을 주입해 허파꽈리를 팽창시킨 채 고정한다.","w":["① 간 같은 실질장기는 1 cm 이하 두께로 잘라 10~20배 고정액에 담금고정한다.","③ 콩팥은 피질, 수질, 신우가 한 면에 나오도록 잘라 담금고정한다.","④ 지라는 공기를 품지 않은 실질장기라 잘라서 담금고정한다.","⑤ 갑상샘은 공기가 없는 실질장기라 일반 담금고정으로 충분하다."],"k":"폐 = 기관지 경유 주입고정.","ref":[{"img":"ref_src3_ppt04_fig_s_19_jpg.jpg","cap":"폐의 주입고정: 기관지로 고정액 주입"}]},{"id":"T-1-45","no":"1-45","q":"바늘생검(needle biopsy)으로 조직을 얻어 조직병리학적 진단을 하는 대표 장기는?","o":["자궁내막","피부","위 점막","자궁경부","간"],"img":[],"tags":[],"lv":3,"a":4,"look":"","e":"간, 콩팥 같은 깊은 실질 장기는 투과침으로 원통형 조직을 얻는 바늘생검으로 진단한다.","w":["① 자궁내막은 큐렛으로 긁는 소파생검, ② 피부는 원형 칼날의 펀치생검, ③ 위 점막은 내시경생검으로 얻는다.","④ 자궁경부는 펀치생검이나 원뿔생검으로 조직을 얻는다."],"k":"간, 콩팥 = 바늘생검.","ref":[{"img":"ref_src3_pdf3_imgrgb_p_011_023_jpg.jpg","cap":"간 바늘생검 조직과 생검 바늘"}]},{"id":"T-1-46","no":"1-46","q":"용해소체(lysosome)에 대한 설명으로 옳은 것은?","o":["단백질을 합성한다.","ATP를 생성한다.","분비물을 농축하고 포장한다.","산성 가수분해효소를 함유하여 사후 자가용해를 일으킨다.","지질과 스테로이드를 합성한다."],"img":[],"tags":[],"lv":3,"a":3,"look":"","e":"세포가 죽으면 용해소체의 산성 가수분해효소가 흘러나와 자가용해가 일어나며, 고정은 이 효소 작용을 멈춘다.","w":["① 리보솜, ② 사립체, ③ 골지기관, ⑤ 활면세포질그물의 기능이다."],"k":"용해소체 = 산성 가수분해효소, 자가용해."},{"id":"T-1-47","no":"1-47","q":"내시경 점막밑절제술(endoscopic submucosal dissection)의 주된 대상 병변은?","o":["자궁경부 상피내 병변","조기 위암, 조기 대장암","간 실질 질환","자궁내막 병변","피부 병변"],"img":[],"tags":[],"lv":3,"a":1,"look":"","e":"점막밑절제술은 조기 위암, 조기 대장암을 내시경으로 점막하층까지 박리해 한 덩어리로 제거하는 진단 겸 치료 시술이다.","w":["① 원뿔생검술, ③ 바늘생검술, ④ 소파생검술, ⑤ 펀치생검술의 대상이다."],"k":"점막밑절제술 = 조기 위암, 조기 대장암.","ref":[{"img":"ref_src3_pdf3_imgrgb_p_010_008_jpg.jpg","cap":"내시경점막밑절제술 실제 과정"}]},{"id":"T-1-49","no":"1-49","q":"표본제작 전에 토리(사구체) 포함 유무를 반드시 확인해야 하는 미고정 생검 조직은?","o":["간 침생검","위 내시경 생검","콩팥 침생검","자궁경부 원뿔생검","전립샘 침생검"],"img":[],"tags":[],"lv":3,"a":2,"look":"","e":"콩팥 질환 진단은 토리 병변 평가에 달려 있으므로, 광학현미경, 면역형광, 전자현미경용으로 나누기 전에 토리 포함 여부를 확인한다.","w":["①, ⑤ 간과 전립샘 침생검은 실질장기 조직을 얻는 바늘생검으로 토리 확인 대상이 아니다.","② 위 내시경 생검은 관강장기의 점막 조직을 얻는 방법이다.","④ 자궁경부 원뿔생검 검체는 시계 방향으로 12조각을 내어 각각 블록을 만든다."],"k":"콩팥 침생검 = 토리 포함 확인 후 분할."},{"id":"T-1-50","no":"1-50","q":"소파생검(curettage biopsy)에서 조직을 채취하는 방법은?","o":["병변 전체를 잘라낸다","병변의 일부를 잘라낸다","예리한 큐렛(curet)으로 병변 부위를 긁어낸다","원형 칼날을 돌려 원통형 조직을 얻는다","자궁경부를 원뿔 모양으로 절제한다"],"img":[],"tags":[],"lv":3,"a":2,"look":"","e":"소파생검은 예리한 큐렛으로 자궁내막처럼 긁어낼 수 있는 병변 조직을 긁어 채취한다.","w":["① 절제생검, ② 절개생검, ④ 펀치생검, ⑤ 원뿔생검의 방법이다."],"k":"소파생검 = 큐렛으로 긁어냄."},{"id":"T-1-48","no":"1-48","q":"주입고정(injection fixation)이 가장 적합한 장기는?","o":["간","위","폐","콩팥","자궁"],"img":[],"tags":[],"lv":3,"a":2,"look":"","e":"폐는 공기를 품어 담금고정만 하면 떠오르고 허탈되므로, 기관지로 고정액을 주입해 팽창시킨 채 고정한다.","w":["① 간과 ④ 콩팥 같은 실질장기는 담금고정한다.","② 위는 절개하여 펼친 뒤 핀으로 고정한다.","⑤ 자궁은 T자로 절개한 뒤 고정하는 장기다."],"k":"주입고정 = 폐(기관지 경유).","ref":[{"img":"ref_src3_ppt04_fig_s_19_jpg.jpg","cap":"폐의 주입고정: 기관지로 고정액 주입"}]},{"id":"T-1-51","no":"1-51","q":"기관지를 통해 고정액을 주입하여 팽창시킨 채 고정하는 주입고정(injection fixation)을 주로 하는 장기는?","o":["간","폐","콩팥","갑상샘","작은창자"],"img":[],"tags":[],"lv":3,"a":1,"look":"","e":"폐는 공기를 품어 고정액에 담그면 떠오르고 허탈되므로, 기관지로 고정액을 주입해 팽창시킨 채 고정한다.","w":["① 간 같은 실질장기는 1 cm 이하 두께로 잘라 10~20배 고정액에 담금고정한다.","③ 콩팥은 피질, 수질, 신우가 한 면에 나오도록 잘라 담금고정한다.","④ 갑상샘은 공기가 없는 실질장기라 일반 담금고정으로 충분하다.","⑤ 작은창자 같은 관강장기는 절개해 펼친 뒤 핀으로 고정한다."],"k":"주입고정 = 폐.","ref":[{"img":"ref_src3_ppt04_fig_s_19_jpg.jpg","cap":"폐의 주입고정: 기관지로 고정액 주입"}]},{"id":"T-1-52","no":"1-52","q":"주입고정(injection fixation)을 표준 고정법으로 쓰는 수술 검체는?","o":["간","폐","위","콩팥 생검","림프절"],"img":[],"tags":[],"lv":3,"a":1,"look":"","e":"폐는 고정액에 뜨고 폐포가 허탈되므로 기관지로 고정액을 주입해 팽창시킨 채 고정한다. 그래야 폐포 구조와 종괴 경계가 보존된다.","w":["① 간 같은 실질 장기는 담금고정을 한다.","③ 위 같은 관강장기는 절개하여 점막을 펼치고 핀으로 고정한 뒤 고정액에 담근다.","④ 콩팥 생검은 광학현미경용, 면역형광용, 전자현미경용으로 나누어 처리한다.","⑤ 림프절은 피막을 절개해 담금고정하며 림프종 진단에는 B-5를 쓴다."],"k":"폐 = 기관지 경유 주입고정.","ref":[{"img":"ref_src3_ppt04_fig_s_19_jpg.jpg","cap":"폐의 주입고정: 기관지로 고정액 주입"}]}],"star":4},{"no":2,"t":"조직처리: 탈수·투명·침투·포매","core":"","secs":[],"point":"","items":[{"id":"T-2-01","no":"2-01","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"T-2-02","no":"2-02","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"T-2-03","no":"2-03","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"T-2-04","no":"2-04","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"T-2-05","no":"2-05","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"T-2-06","no":"2-06","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"T-2-07","no":"2-07","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"T-2-08","no":"2-08","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"T-2-09","no":"2-09","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"T-2-10","no":"2-10","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"T-2-11",
