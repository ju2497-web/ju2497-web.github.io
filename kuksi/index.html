o":[],"a":0,"img":[],"tags":[]},{"id":"T-11-17","no":"11-17","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"T-11-18","no":"11-18","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"T-11-19","no":"11-19","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"T-11-20","no":"11-20","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"T-11-21","no":"11-21","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"T-11-22","no":"11-22","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"T-11-23","no":"11-23","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"T-11-24","no":"11-24","q":"","o":[],"a":0,"img":[],"tags":[]}],"star":2}],"practice":[{"no":1,"t":"검체채취·생검 및 고정","core":"","secs":[],"point":"","items":[{"id":"T-실1-01","no":"실1-01","q":"육안 사진이다. 장기는?","o":["지라","이자","가슴샘","전립샘","갑상샘"],"img":["tech2_prac_tech_001.jpg"],"tags":[],"lv":3,"a":4,"look":"붉은 갈색의 광택 있는 좌우 두 엽이 가운데의 좁은 협부로 이어져 나비(H자) 모양을 이룬다.","e":"좌엽과 우엽이 협부(isthmus)로 연결된 나비 모양의 붉은 장기는 갑상샘(thyroid gland)이다.","w":["① 지라는 암적색 붉은속질에 회백색 백색속질이 흩어진 절단면을 보인다.","③ 가슴샘도 두 엽이지만 길쭉하고 성인에서는 지방으로 대치되어 노란빛을 띤다."],"k":"좌우 엽 + 협부(나비 모양) = 갑상샘."},{"id":"T-실1-02","no":"실1-02","q":"장기의 육안 사진이다. 효과적인 고정 방법은?","o":["가열고정","관류고정","동결고정","주입고정","증기고정"],"img":["tech2_prac_tech_002.jpg"],"tags":[],"lv":3,"a":3,"look":"흉막에 탄분 침착이 있는 해면 모양 실질과 기관지 단면이 보이고, 절단면 위쪽에 회백색 종괴가 있는 폐 절제 검체다.","e":"폐(lung)는 공기 때문에 담금고정만으로는 뜨고 허탈되므로, 기관지로 고정액을 주입하는 주입고정(injection fixation)으로 팽창시킨 채 고정해야 폐포 구조와 종괴 경계가 보존된다.","w":["① 가열고정은 자가용해가 잘 일어나 거의 쓰지 않는다.","② 관류고정은 혈관계로 고정액을 흘려 넣는 방법으로 주로 실험동물 전신 고정에 쓴다.","③ 동결고정은 조직을 얼려 고정하는 방법이다.","⑤ 증기고정은 오스뮴산이나 포름알데히드 증기로 도말이나 작은 조직을 고정한다."],"k":"폐 절제 검체 = 기관지 경유 주입고정."},{"id":"T-실1-03","no":"실1-03","q":"젠커 용액(Zenker solution)에 고정된 조직의 염색 표본이다. 왼쪽은 H&E 염색, 오른쪽은 편광현미경 사진이다. 승홍 색소를 제거할 때 사용하는 시약은?","o":["70% alcohol-ammonia water","hydrogen peroxide-picric acid","Lugol's iodine-sodium thiosulfate","80% alcohol-potassium hydroxide","potassium permanganate-ammonia water"],"img":["tech2_prac_tech_003.jpg"],"tags":[],"lv":3,"a":2,"look":"H&E 표본에 세포와 무관하게 흑갈색 과립상 침착물이 흩어져 있고, 편광현미경에서 같은 침착물이 밝게 빛난다. 승홍(염화제이수은)이 든 고정액에 의한 수은 색소다.","e":"수은 색소는 루골 요오드(Lugol's iodine)로 녹여 낸 뒤, 남은 요오드의 노란색을 티오황산나트륨(sodium thiosulfate, 하이포 용액)으로 제거한다. 탈수은은 염색 전에 한다.","w":["①, ④ 알코올성 암모니아수와 알코올성 수산화칼륨은 포르말린 색소 제거에 쓴다.","② 과산화수소는 멜라닌 탈색에, 알코올성 피크르산은 포르말린 색소 제거에 쓴다.","⑤ 과망간산칼륨은 멜라닌 탈색이나 산화 전처리에 쓰는 산화제다."],"k":"수은 색소 = 요오드로 제거, 티오황산나트륨으로 요오드 제거."},{"id":"T-실1-06","no":"실1-06","q":"콩팥 침생검조직의 진단을 위해 조직을 나누고 있다. 검사에 앞서 먼저 확인해야 할 사항은?","o":["침생검 길이","속질 포함 유무","신유두 포함 유무","종양세포 침범 유무","토리(사구체) 포함 유무"],"img":["tech2_prac_tech_006.jpg"],"tags":[],"lv":3,"a":4,"look":"콩팥 침생검 조직을 칼날로 나누어 광학현미경(LM), 면역형광현미경(IFM), 전자현미경(EM)용으로 배분하는 모식도이며, 조직의 피질 쪽과 수질 쪽이 표시되어 있다.","e":"사구체 질환 진단은 토리(glomerulus) 소견에 달려 있으므로 나누기 전에 실체현미경으로 토리 포함 여부를 확인하고, 광학, 면역형광, 전자현미경 검사에 고루 들어가게 나눈다.","w":["② 콩팥 침생검 검체에 반드시 포함되어야 하는 부위는 속질이 아니라 피질이다."],"k":"콩팥 침생검 분배 전 확인 = 토리 포함 여부."},{"id":"T-실1-08","no":"실1-08","q":"피부에서 펀치를 사용하여 조직을 생검하고 있다. 다음 중 이와 유사한 방법으로 조직을 생검하는 부위는?","o":["폐","콩팥","간장","자궁목","자궁속막"],"img":["tech2_prac_tech_008.jpg"],"tags":[],"lv":3,"a":3,"look":"원통형 칼날의 펀치를 피부에 대고 눌러 돌려 병변을 원기둥 모양으로 도려내는 펀치생검(punch biopsy) 그림이다.","e":"자궁목(cervix)은 피부처럼 표면에서 직접 접근할 수 있어 질확대경(colposcope)으로 병변을 확인한 뒤 펀치 겸자로 펀치생검을 한다.","w":["①, ②, ③ 폐, 콩팥, 간장은 침생검(needle biopsy)을 한다.","⑤ 자궁속막은 큐렛으로 긁어내는 소파생검(curettage)을 한다."],"k":"펀치생검 = 피부, 자궁목."},{"id":"T-실1-09","no":"실1-09","q":"육안 사진이다. 장기는?","o":["심장(heart)","자궁(uterus)","콩팥(kidney)","허파(lung)","갑상샘(thyroid)"],"img":["tech2_prac_tech_009.jpg"],"tags":[],"lv":3,"a":2,"look":"주위 지방에 싸인 장기에서 가느다란 관(요관)이 나오고, 절단면에 바깥 피질과 짙은 적갈색 수질, 가운데 콩팥깔때기와 문부 지방이 보인다.","e":"요관이 이어진 콩팥문, 피질과 수질의 구분, 콩팥 주위 지방이 함께 있는 것은 근치적 콩팥절제술 검체인 콩팥(kidney)이다.","w":["② 자궁은 서양배 모양의 근육성 장기로 두꺼운 근육층과 가운데 삼각형 내강이 보인다.","④ 허파는 해면상 실질에 검은 탄분 색소와 기관지 단면이 보인다.","⑤ 갑상샘은 좌우 두 엽이 좁은 협부로 이어진 나비 모양이다."],"k":"요관 + 피질·수질 + 주위 지방 = 콩팥."},{"id":"T-실1-10","no":"실1-10","q":"폐 엽절제 검체이다. 조직을 고정하는 방법은?","o":["이등분으로 나누어 고정","지방을 제거한 후 고정","기관지를 경유하여 주입고정","얇은 조각으로 나누어 고정","일단 침수고정한 후 절개 후 재고정"],"img":["tech2_prac_tech_010.jpg"],"tags":[],"lv":3,"a":2,"look":"흉막으로 싸인 폐엽 절단면에 해면상 실질과 기관지, 혈관 단면이 고르게 펼쳐져 있다. 팽창 상태로 고정되어야 이런 단면을 얻는다.","e":"폐는 공기 때문에 담금고정만으로는 뜨고 허탈되므로 기관지로 고정액을 주입해 팽창시킨 뒤 고정해야 폐포 구조와 병변 경계가 보존된다.","w":["① 반으로 잘라 표본을 만드는 것은 표피가 포함되게 자르는 피부 검체의 절취법이다.","④ 얇게 잘라 고정하는 것은 고정 시간이 길어지는 충실성 조직인 간, 비장에 쓰는 방법이다.","⑤ 담금고정을 먼저 하면 폐가 떠올라 고정액 침투가 불량하다."],"k":"폐 엽절제 = 기관지 경유 주입고정."},{"id":"T-실1-11","no":"실1-11","q":"H&E 염색을 마친 조직표본에서 관찰된 소견이다. 혈관 안의 짙은 갈색 색소는 무엇 때문에 생긴 것인가?","o":["헤마톡실린을 여과하지 않았을 때","산성화된 포르말린을 고정액으로 사용하였을 때","투명이 불충분할 때","탈수가 불충분할 때","조직절편이 건조되었을 때"],"img":["tech2_prac_tech_029.jpg"],"tags":[],"lv":3,"a":1,"look":"적혈구가 가득 찬 혈관 안에 흑갈색의 미세한 과립이 적혈구 위에 흩뿌려져 있고, 혈액이 적은 주변 조직에는 거의 없다. 혈액이 많은 부위에 몰리는 세포 밖 색소라는 점이 포르말린 색소를 시사한다.","e":"포르말린이 산화되어 생긴 개미산으로 산성화된 포르말린이 헤모글로빈과 반응해 포르말린 색소(acid formaldehyde hematin)를 만든다. 중성 완충 포르말린으로 예방한다.","w":["① 헤마톡실린을 여과하지 않으면 산화 피막의 청흑색 침착물이 혈관과 무관하게 전체에 얹힌다.","③ 투명 불충분과 ④ 탈수 불충분은 조직이 뿌옇게 흐려지는 혼탁으로 나타난다."],"k":"혈액 많은 부위의 흑갈색 과립 = 산성 포르말린에 의한 포르말린 색소."},{"id":"T-실1-13","no":"실1-13","q":"사진의 장기는?","o":["간","방광","이자","자궁","갑상샘"],"img":["tech2_prac_tech_048.jpg"],"tags":[],"lv":3,"a":3,"look":"가운데 서양배 모양의 근육성 장기가 앞뒤로 절개되어 두꺼운 근육층과 가운데 삼각형 내강이 보이고, 양옆으로 난관과 둥근 난소가 붙어 있다. 자궁, 양쪽 부속기 절제 검체이다.","e":"두꺼운 평활근 벽과 내막으로 둘러싸인 삼각형 내강, 양쪽에 연결된 난관과 난소는 자궁(uterus)의 육안 구조다.","w":["⑤ 갑상샘은 좌우 두 엽이 좁은 협부로 이어진 나비 모양이다."],"k":"양옆에 난관, 난소가 붙은 두꺼운 근육성 장기 = 자궁."},{"id":"T-실1-14","no":"실1-14","q":"근육을 고정하기 위한 사진이다. 사진의 기구는?","o":["핀셋","겸자","가위","지지대","고정대"],"img":["tech2_prac_tech_115.jpg"],"tags":[],"lv":3,"a":1,"look":"U자 모양 끝을 가진 기구가 근육 조각의 양 끝을 물어 늘어난 상태로 잡고 있고, 이후 근육을 꺼내 작은 조각으로 나누는 과정이 그려져 있다.","e":"근육 생검 조직은 그대로 고정하면 수축해 인공산물이 생기므로 근육용 겸자(clamp)로 양 끝을 물어 휴지 길이를 유지한 채 고정한다.","w":["① 핀셋은 포매할 때 조직을 눌러 포매틀 바닥에 밀착시키는 데 쓴다."],"k":"근육 수축 방지 고정 = 근육용 겸자(clamp)."},{"id":"T-실1-15","no":"실1-15","q":"사진과 같은 장기에서 조직 병리진단을 위한 생검 검체를 채취하는 방법은?","o":["표층생검","바늘생검","펀치생검","시험소파술","내시경 생검"],"img":["tech2_prac_qa_tech_001.jpg"],"tags":[],"lv":3,"a":1,"look":"강낭콩 모양의 장기를 세로로 연속 절단해 겉질과 속질(콩팥 피라미드), 콩팥문 주위 지방이 드러난 콩팥(kidney) 절제 검체다.","e":"콩팥은 체표나 내강에서 접근할 수 없는 실질 장기여서 피부로 바늘을 찔러 조직 심(core)을 얻는 바늘생검(needle biopsy)을 한다.","w":["③ 펀치생검은 피부 등 표면 조직을 원기둥 모양으로 뚫어 얻는다.","④ 시험소파술은 자궁내막처럼 내강 표면을 긁어 낸다.","⑤ 내시경 생검은 위, 대장 같은 관강장기에서 조직을 얻는다."],"k":"콩팥 실질 생검 = 바늘생검."},{"id":"T-실1-16","no":"실1-16","q":"사진의 장기와 같은 방법으로 고정하는 검체는?","o":["자궁","허파","콩팥","대장","유방"],"img":["tech2_prac_qa_tech_002.jpg"],"tags":[],"lv":3,"a":3,"look":"점막 주름(rugae)이 보이는 위(stomach) 절제 검체를 큰굽이를 따라 절개해 판 위에 넓게 펼쳐 놓은 모습이다.","e":"위와 대장 같은 관상 소화관은 그대로 고정하면 뒤틀리므로 세로로 절개해 점막면이 위로 오게 판에 펴서 핀으로 고정한 뒤 고정액에 넣는다.","w":["① 자궁은 T자형 또는 Y자형으로 절개해 내막을 노출시킨 뒤 고정한다.","② 허파는 기관지로 고정액을 주입해, ③ 콩팥은 일정한 두께로 잘라 고정한다."],"k":"관상 소화관(위, 대장) = 절개 후 판에 펴서 핀 고정."},{"id":"T-실1-18","no":"실1-18","q":"아래 사진의 장기를 고정하는 방법은?","o":["증기고정","담금고정","주입고정","동결고정","극초단파고정"],"img":["tech2_prac_qa_tech_004.jpg"],"tags":[],"lv":3,"a":2,"look":"해면상 실질 속에 확장된 기관지 내강이 여러 개 뚫려 있고 아래쪽에 가슴막이 붙은 폐(lung) 절단면이다.","e":"폐는 공기 때문에 고정액에 담그면 떠올라 침투가 불량하므로, 기관(지)으로 고정액을 주입해 부풀린 뒤 고정하는 주입고정(injection fixation)을 한다.","w":["① 증기고정은 오스뮴산이나 포르말린 증기로 얇은 도말이나 작은 조직을 고정하는 특수법이다.","② 폐는 담금고정만 하면 떠올라 고정액 침투가 불량하다.","④ 동결고정은 조직을 얼려 고정하는 방법이다.","⑤ 극초단파(마이크로파) 고정은 알데히드 고정 시간을 단축하는 촉진법이다."],"k":"폐 = 기관지 주입고정."},{"id":"T-실1-20","no":"실1-20","q":"사진과 같은 장기의 명칭은?","o":["폐","자궁","비장","신장","림프절"],"img":["tech2_prac_qa_tech_006.jpg"],"tags":[],"lv":3,"a":2,"look":"왼쪽은 매끈한 피막과 오목한 문(hilum)을 가진 암적색 장기의 바깥면이고, 오른쪽 절단면은 균일한 암적색 바탕에 작은 회백색 점과 문 부위 혈관이 보인다.","e":"암적색 붉은속질에 회백색 백색속질이 흩어진 절단면은 비장(spleen)의 특징이다.","w":["① 폐는 해면상 실질에 검은 탄분 색소와 기관지 단면이 보인다.","② 자궁은 서양배 모양의 근육성 장기로 두꺼운 근육층과 가운데 삼각형 내강이 보인다.","④ 신장은 강낭콩 모양으로 절단면에 겉질과 속질, 콩팥문 주위 지방이 보인다."],"k":"암적색 절단면 + 백색속질 점 = 비장."},{"id":"T-실1-17","no":"실1-17","q":"사진의 장기 명칭은?","o":["간","폐","신장","자궁","흉선"],"img":["tech2_prac_qa_tech_003.jpg"],"tags":[],"lv":3,"a":3,"look":"서양배 모양의 큰 몸통에 원통형 자궁경부(cervix)와 자궁입구가 왼쪽으로 이어지고, 위쪽에 난관과 난소 같은 부속기가 붙어 있는 자궁(uterus) 적출 검체다.","e":"배 모양 몸통, 아래로 좁아지는 경부와 외자궁구, 몸통 위쪽 양옆의 부속기는 자궁의 형태다.","w":["② 폐는 해면상 실질에 검은 탄분 색소와 기관지 단면이 보인다.","③ 신장은 강낭콩 모양으로 절단면에 겉질과 속질, 콩팥문 주위 지방이 보인다.","⑤ 흉선은 지방이 많은 엽상 구조로 색이 옅다."],"k":"배 모양 몸통 + 경부 + 부속기 = 자궁."},{"id":"T-실1-21","no":"실1-21","q":"사진과 같은 장기의 명칭은?","o":["이자","부신","흉선","전립샘","갑상샘"],"img":["tech2_prac_qa_tech_007.jpg"],"tags":[],"lv":3,"a":4,"look":"좌우 두 엽이 가운데의 좁은 협부(isthmus)로 연결된 나비 모양(H자형)의 적갈색 장기다.","e":"좌엽과 우엽을 협부가 잇는 나비 모양 구조는 갑상샘(thyroid gland)이다.","w":["③ 흉선은 지방이 많은 엽상 구조로 색이 옅다."],"k":"두 엽 + 협부(나비 모양) = 갑상샘."},{"id":"T-실1-23","no":"실1-23","q":"사진과 같이 절취된 조직 장기의 명칭은 무엇인가?","o":["식도","소장","혈관","담관","충수돌기"],"img":["tech2_prac_qa_tech_009.jpg"],"tags":[],"lv":3,"a":4,"look":"지름 1 cm 남짓한 관상 장기를 가로로 둥글게 잘라 점막, 점막밑층, 근육층이 동심원으로 보이고, 장간막 지방이 붙어 있으며, 오른쪽 카세트 위쪽에는 끝부분을 세로로 자른 조직편이 들어 있다.","e":"몸통은 가로로, 끝(tip)은 세로로 잘라 함께 넣는 것은 충수돌기(appendix)의 표준 절취법이다.","w":[],"k":"작은 관상 단면 + 간막 지방 + 끝 세로 절취 = 충수돌기."},{"id":"T-실1-24","no":"실1-24","q":"내시경 점막밑 절제술을 이용하여 채취한 검체이다. 장기명은?","o":["간","위","폐","비장","대뇌"],"img":["tech2_prac_qa_tech_010.jpg"],"tags":[],"lv":3,"a":1,"look":"얇은 원반 모양의 점막 조각을 가장자리마다 핀으로 꽂아 판 위에 평평하게 펼친 내시경 절제 검체다.","e":"내시경 점막밑 절제술(endoscopic submucosal dissection, ESD)은 위 같은 관강 장기의 점막 병변을 한 덩어리로 떼어 내며, 검체는 판에 펴서 핀으로 고정한다.","w":["① 간은 실질 장기로 투과침을 찔러 조직을 얻는 바늘생검을 한다.","③ 폐는 기관지로 고정액을 주입해 부풀린 채 고정한다.","④ 비장은 실질 장기로 투과침을 이용한 바늘생검을 한다.","⑤ 대뇌는 통째로 매달아 포르말린에 장시간 담가 고정한다."],"k":"ESD 검체 = 위 점막, 핀으로 펴서 고정."},{"id":"T-실1-26","no":"실1-26","q":"사진은 육안조직 표본이다. 장기명은?","o":["간","폐","비장","콩팥","심장"],"img":["tech2_prac_qa_tech_012.jpg"],"tags":[],"lv":3,"a":1,"look":"해면상 실질에 검은 탄분 색소가 흩어져 있고 작은 기관지 내강이 뚫려 있으며, 왼쪽 가장자리에 가슴막이 보인다.","e":"검은 탄분 침착, 기관지 단면, 해면상 실질은 폐(lung)의 육안 소견이다.","w":["③ 비장은 암적색 붉은속질에 회백색 백색속질이 흩어진 절단면을 보인다.","④ 콩팥은 강낭콩 모양으로 절단면에 겉질과 속질, 콩팥문 주위 지방이 보인다."],"k":"탄분 색소 + 기관지 단면 = 폐."},{"id":"T-실1-28","no":"실1-28","q":"사진과 같은 노란색 시약이 담긴 고정액은?","o":["Boüin 용액","Müller 용액","Zenker 용액","Carnoy 용액","formalin 용액"],"img":["tech2_prac_qa_tech_015.jpg"],"tags":[],"lv":3,"a":0,"look":"용기에 담긴 고정액이 선명한 노란색이다.","e":"Bouin 용액은 피크르산(picric acid) 포화수용액, 포르말린, 빙초산으로 구성되며 피크르산 때문에 노란색을 띠고 조직도 노랗게 물든다.","w":["② Müller 용액과 ③ Zenker 용액은 중크롬산칼륨을 포함해 주황색을 띤다.","④ Carnoy 용액은 무수에탄올, 클로로포름, 빙초산 혼합액으로 무색이다.","⑤ 포르말린 용액은 무색이다."],"k":"노란색 고정액 = Bouin(피크르산)."},{"id":"T-실1-29","no":"실1-29","q":"사진과 같은 기구를 이용하여 절취하는 부위는?","o":["위","근육","척수","소장","자궁경부"],"img":["tech2_prac_qa_tech_016.jpg"],"tags":[],"lv":3,"a":1,"look":"집게 끝의 사각형 틀 양쪽에 가느다란 붉은 조직 띠가 팽팽하게 물려 있는 근생검 클램프(muscle biopsy clamp)다.","e":"골격근은 떼어 내면 수축해 인공 변화가 생기므로, 근생검 클램프로 원래 길이로 물린 채 절취하고 고정하거나 동결한다.","w":["① 위는 절개해 펼친 뒤 코르크판에 핀으로 고정한다.","④ 소장 같은 관강장기는 절개해 펼친 뒤 핀으로 고정한다.","⑤ 자궁경부는 펀치생검이나 원추절제술로 얻는다."],"k":"근생검 클램프 = 골격근 수축 방지."},{"id":"T-실1-30","no":"실1-30","q":"H&E 염색을 완성한 후 조직 표본 내에서 관찰된 것이다. 짙은 갈색 색소는 무엇 때문에 생긴 것인가?","o":["탈수가 불충분할 때","투명이 불충분할 때","조직절편이 건조되었을 때","헤마톡실린을 여과하지 않았을 때","산성화된 포르말린을 고정액으로 사용하였을 때"],"img":["tech2_prac_qa_tech_035.jpg"],"tags":[],"lv":3,"a":4,"look":"적혈구가 많은 출혈 부위에 흑갈색의 미세 과립과 덩어리 색소가 세포 밖에 흩어져 있다. 색소는 적혈구가 모인 곳에 집중된다.","e":"산성화된 포르말린이 헤모글로빈과 반응해 산헤마틴(acid hematin), 즉 포르말린 색소를 만들어 혈액이 많은 부위에 흑갈색 과립으로 침착한다. 피크르산 포화알코올로 제거한다.","w":["① 탈수 불충분은 혼탁과 봉입 후 작은 물방울을, ② 투명 불충분은 파라핀 침투 불량과 혼탁을 만든다.","④ 헤마톡실린 미여과 시에는 산화 침전물이 청자색 찌꺼기로 얹힌다."],"k":"출혈 부위 흑갈색 과립 = 산성 포르말린 색소(산헤마틴)."},{"id":"T-실1-25","no":"실1-25","q":"아래와 같이 고정하는 장기명은?","o":["폐","위","자궁","대뇌","골격근"],"img":["tech2_prac_qa_tech_011.jpg"],"tags":[],"lv":3,"a":1,"look":"절개해 펼친 관상 장기의 점막면이 위로 오도록 코르크 판에 놓고 가장자리를 바늘로 고정했으며, 점막에 주름이 보인다.","e":"위는 그대로 고정하면 뒤틀리므로 큰굽이(greater curvature)를 절개해 코르크 판에 펴서 핀으로 고정한 뒤 고정액에 넣는다.","w":["① 폐는 기관지로 고정액을 주입해 고정한다.","③ 자궁은 T자형 또는 Y자형으로 절개해 내막을 노출시킨다.","④ 대뇌는 통째로 매달아 포르말린에 장시간 담가 고정한다.","⑤ 골격근은 클램프로 길이를 유지한 상태로 고정하거나 동결한다."],"k":"위 = 큰굽이 절개 후 코르크 판에 핀 고정."},{"id":"T-실1-27","no":"실1-27","q":"사진의 장기명은?","o":["간","폐","비장","콩팥","심장"],"img":["tech2_prac_qa_tech_014.jpg"],"tags":[],"lv":3,"a":1,"look":"검은 탄분 색소가 침착된 해면상 실질 속에 황백색 종괴가 있고, 위쪽에 연골성 기관지 벽이 보인다.","e":"탄분 침착, 기관지 구조, 해면상 실질은 폐(lung)의 소견이며, 황백색 종괴는 폐종양 절제 검체에서 흔히 본다.","w":["③ 비장은 암적색 붉은속질에 회백색 백색속질이 흩어진 절단면을 보인다.","④ 콩팥은 강낭콩 모양으로 절단면에 겉질과 속질, 콩팥문 주위 지방이 보인다."],"k":"탄분 + 기관지 + 종괴 = 폐."}]},{"no":2,"t":"조직처리: 탈수·투명·침투·포매","core":"","secs":[],"point":"","items":[{"id":"T-실2-02","no":"실2-02","q":"","o":[],"a":0,"img":["tech2_prac_tech_022.jpg"],"tags":[]},{"id":"T-실2-04","no":"실2-04","q":"","o":[],"a":0,"img":["tech2_prac_tech_031.jpg"],"tags":[]},{"id":"T-실2-06","no":"실2-06","q":"","o":[],"a":0,"img":["tech2_prac_qa_tech_017.jpg"],"tags":[]},{"id":"T-실2-07","no":"실2-07","q":"","o":[],"a":0,"img":["tech2_prac_qa_tech_020.jpg"],"tags":[]},{"id":"T-실2-10","no":"실2-10","q":"","o":[],"a":0,"img":["tech2_prac_qa_tech_098.jpg"],"tags":[]}]},{"no":3,"t":"박절·동결절편 및 봉입","core":"","secs":[],"point":"","items":[{"id":"T-실3-01","no":"실3-01","q":"","o":[],"a":0,"img":["tech2_prac_tech_011.jpg"],"tags":[]},{"id":"T-실3-02","no":"실3-02","q":"","o":[],"a":0,"img":["tech2_prac_tech_012.jpg"],"tags":[]},{"id":"T-실3-03","no":"실3-03","q":"","o":[],"a":0,"img":["tech2_prac_tech_013.jpg"],"tags":[]},{"id":"T-실3-04","no":"실3-04","q":"","o":[],"a":0,"img":["tech2_prac_tech_014.jpg"],"tags":[]},{"id":"T-실3-05","no":"실3-05","q":"","o":[],"a":0,"img":["tech2_prac_tech_015.jpg"],"tags":[]},{"id":"T-실3-06","no":"실3-06","q":"","o":[],"a":0,"img":["tech2_prac_tech_018.jpg"],"tags":[]},{"id":"T-실3-07","no":"실3-07","q":"","o":[],"a":0,"img":["tech2_prac_tech_019.jpg"],"tags":[]},{"id":"T-실3-08","no":"실3-08","q":"","o":[],"a":0,"img":["tech2_prac_tech_020.jpg"],"tags":[]},{"id":"T-실3-09","no":"실3-09","q":"","o":[],"a":0,"img":["tech2_prac_tech_023.jpg"],"tags":[]},{"id":"T-실3-10","no":"실3-10","q":"","o":[],"a":0,"img":["tech2_prac_tech_030.jpg"],"tags":[]},{"id":"T-실3-11","no":"실3-11","q":"","o":[],"a":0,"img":["tech2_prac_tech_032.jpg"],"tags":[]},{"id":"T-실3-13","no":"실3-13","q":"","o":[],"a":0,"img":["tech2_prac_tech_034.jpg"],"tags":[]},{"id":"T-실3-14","no":"실3-14","q":"","o":[],"a":0,"img":["tech2_prac_tech_035.jpg"],"tags":[]},{"id":"T-실3-15","no":"실3-15","q":"", 포질비가 높은 미성숙 이형세포가 특징이다.","④ 재생병변은 손상 뒤 같은 종류의 상피가 다시 자라는 것으로 다른 상피로 대치되지 않는다."],"k":"원주상피 자리에 이형 없는 성숙 편평상피 = 편평상피화생."},{"n":2,"s":"병리학","q":"만성 좌심부전으로 사망한 환자의 부검 조직에서 혈철소를 탐식한 대식세포, 이른바 심부전세포가 다수 보였다. 이 세포가 관찰된 장기는?","o":["뇌","폐","콩팥","간","부신"],"img":[],"a":1,"e":"심부전세포는 좌심부전에 따른 폐울혈 때 폐포 안에서 볼 수 있다. 폐포로 빠져나온 적혈구를 대식세포가 탐식해 혈철소가 쌓인 세포다.","w":["① 뇌는 좌심부전의 폐울혈과 관련된 심부전세포가 나타나는 곳이 아니다.","③ 콩팥에는 심부전세포가 나타나지 않는다.","④ 간은 우심부전 때 울혈이 생기지만 심부전세포는 폐포에서 본다.","⑤ 부신에는 심부전세포가 나타나지 않는다."],"k":"심부전세포(헤모시데린 탐식 대식세포) = 폐울혈."},{"n":3,"s":"병리학","q":"불임으로 검사를 받은 남성의 말초혈액 염색체 분석에서 핵형이 47,XXY로 나왔다. 의심되는 질환은?","o":["안젤만증후군","터너증후군","프라더-윌리증후군","클라인펠터증후군","고양이울음증후군"],"img":[],"a":3,"e":"47,XXY는 X염색체가 하나 많은 남성으로 클라인펠터증후군이다. 성염색체 수 이상에 속하며 남성 생식샘 기능 저하를 보인다.","w":["① 안젤만증후군은 15번 염색체 일부 결실이나 각인 이상으로 생긴다.","② 터너증후군은 45,X인 여성이다.","③ 프라더-윌리증후군은 15번 염색체 일부 결실이나 각인 이상으로 생긴다.","⑤ 고양이울음증후군은 5번 염색체 단완 결실이다."],"k":"47,XXY = 클라인펠터증후군."},{"n":4,"s":"병리학","q":"건락괴사가 특징적으로 나타나는 질병은?","o":["Sarcoidosis(유육종증)","신장경색증","결핵","뇌 연화증","디프테리아"],"img":[],"a":2,"e":"건락괴사는 결핵 육아종의 특징이다. 신장경색증은 응고괴사, 뇌 연화증은 액화괴사, 디프테리아는 위막성 염증, 유육종증은 비건락성 육아종을 보인다.","w":["① 유육종증은 건락괴사가 없는 비건락성 육아종을 만든다.","② 신장경색증은 허혈에 의한 응고괴사이다.","④ 뇌 연화증은 뇌의 액화괴사이다.","⑤ 디프테리아는 위막성 염증을 일으킨다."],"k":"건락괴사 = 결핵."},{"n":5,"s":"조직학","q":"인체의 조직은 구조와 기능에 따라 네 가지 기본조직으로 나눈다. 이 네 가지에 포함되지 않는 것은?","o":["상피조직(epithelium)","근육조직","결합조직","지방조직","신경조직"],"img":[],"a":3,"e":"4대 기본조직은 상피, 결합(결체), 근육, 신경조직이며 지방조직은 결합조직에 속한다.","w":["① 상피조직은 4대 기본조직의 하나다.","② 근육조직은 4대 기본조직의 하나다.","③ 결합조직은 4대 기본조직의 하나다.","⑤ 신경조직은 4대 기본조직의 하나다."],"k":"4대 기본조직 = 상피, 결합, 근육, 신경. 지방은 결합조직."},{"n":6,"s":"조직학","q":"근육 절편에서 가로무늬가 보이고, 이웃한 세포가 사이원반(intercalated disc)으로 이어져 한 덩어리처럼 함께 수축하는 근육은?","o":["뼈대근(골격근)","심장근","민무늬근","적색근","근상피세포"],"img":[],"a":1,"e":"사이원반이라는 특화된 세포 간 연접을 만드는 근육은 심장근이다. 사이원반으로 이어진 심장근세포는 한 덩어리처럼 함께 수축한다.","w":["① 뼈대근은 가로무늬가 있지만 다핵 융합세포로 사이원반이 없다.","③ 민무늬근은 가로무늬와 사이원반이 없다.","④ 적색근은 뼈대근섬유의 한 종류로 사이원반이 없다.","⑤ 근상피세포는 샘꽈리를 둘러싸는 수축성 세포로 사이원반이 없다."],"k":"사이원반 = 심장근."},{"n":7,"s":"조직학","q":"중층편평상피로 덮여 있는 부위는?","o":["방광","자궁내경부","기관지","자궁외경부","작은창자"],"img":[],"a":3,"e":"질과 맞닿는 자궁외경부는 마찰에 견디도록 중층편평상피로 덮여 있다. 자궁내경부는 단층원주, 방광은 이행, 기관지는 거짓중층원주, 작은창자는 단층원주다.","w":["① 방광은 이행상피로 덮여 있다.","② 자궁내경부는 점액을 분비하는 단층원주상피로 덮여 있다.","③ 기관지는 거짓중층섬모원주상피로 덮여 있다.","⑤ 작은창자는 단층원주상피로 덮여 있다."],"k":"자궁외경부 = 중층편평상피, 자궁내경부 = 단층원주상피."},{"n":8,"s":"조직학","q":"같은 종류의 상피조직끼리 연결한 것으로 잘못된 것은?","o":["질-구강","위-소장","식도-피부","기관지-기관","대장-방광"],"img":[],"a":4,"e":"대장은 단층원주상피, 방광은 이행상피로 서로 다르다. 나머지 보기는 모두 같은 종류의 상피끼리 짝지어져 있다.","w":["① 질과 구강은 모두 중층편평상피이다.","② 위와 소장은 모두 단층원주상피이다.","③ 식도와 피부는 모두 중층편평상피이며 피부는 각화형이다.","④ 기관지와 기관은 모두 거짓중층섬모원주상피이다."],"k":"대장 = 단층원주상피, 방광 = 이행상피."},{"n":9,"s":"진단조직학","q":"피부의 색소 병변이나 자궁경부 병터에 원통형 칼날을 대고 돌려 눌러 작은 원기둥 모양의 조직을 떼어 내는 생검법은?","o":["세침흡인","절개생검","원뿔생검","펀치생검","소파생검"],"img":[],"a":3,"e":"펀치생검은 원통형 칼날로 피부나 자궁경부의 병터를 원기둥 모양으로 뚫어 채취하는 방법이다.","w":["① 세침흡인은 가는 바늘로 세포를 흡인하는 세포검사이다.","② 절개생검은 병변 일부를 칼로 잘라 내는 방법이다.","③ 원뿔생검은 자궁경부를 원뿔 모양으로 넓게 절제하는 방법이다.","⑤ 소파생검은 큐렛으로 조직을 긁어 채취하는 방법이다."],"k":"원통형 칼날로 피부·자궁경부 채취 = 펀치생검."},{"n":10,"s":"진단조직학","q":"포르말린에 고정한 조직은 메틸렌블루 같은 염기성 염료에 더 잘 염색되는 경향이 있다. 그 이유로 옳은 것은?","o":["조직 단백질의 아미노기와 결합","중금속 이온과 결합하여 매염","조직의 카르복실기를 차단","조직 내 지질을 용출","염료의 분자량을 증가"],"img":[],"a":0,"e":"포름알데하이드는 단백질의 아미노기(염기성기)와 결합해 이를 막는다. 그 결과 산성기가 상대적으로 많아져 염기성 염료와의 친화력이 커진다.","w":["② 포르말린은 중금속을 포함하지 않으며 매염 작용을 하지 않는다.","③ 카르복실기가 막히면 오히려 염기성 염료와의 결합이 줄어든다.","④ 지질 용출은 염기성 염료 친화력과 관계가 없다.","⑤ 고정액은 염료의 분자량을 바꾸지 않는다."],"k":"포르말린 + 아미노기 결합 → 산성기 우세 → 염기성 염료 친화력 증가."},{"n":11,"s":"진단조직학","q":"간세포판을 따라 가는 흑색 섬유가 이어져 보이는 은 염색 표본이다. 이 염색으로 증명하는 것은?","o":["탄력섬유","망상 섬유","교원 섬유","Amyloid","Glycogen"],"img":[],"a":1,"e":"세망(망상)섬유는 호은성이어서 은 염색에서 간세포판을 따라 가는 흑색 섬유로 보인다.","w":["① 탄력섬유는 Verhoeff, 알데하이드 푹신 염색으로 증명한다.","③ 교원섬유는 Masson 삼색, Van Gieson 염색으로 증명한다.","④ 아밀로이드는 콩고 레드 염색으로 증명한다.","⑤ 글리코겐은 PAS, Best carmine 염색으로 증명한다."],"k":"은 염색에서 흑색 가는 섬유 = 세망섬유(호은성)."},{"n":12,"s":"진단조직학","q":"파라핀 포매 시 포매 온도의 기준이 되는 경파라핀의 융점은?","o":["58℃","40℃","70℃","50℃","25℃"],"img":[],"a":0,"e":"포매용 경파라핀의 융점은 약 56~58℃이며 이에 맞추어 포매 온도를 유지한다.","w":["② 40℃는 연파라핀 수준으로 포매용 기준이 아니다.","③ 70℃는 융점보다 지나치게 높아 조직이 굳고 수축한다.","④ 50℃는 포매용 경파라핀 융점보다 낮다.","⑤ 25℃는 실온으로 파라핀이 굳어 있는 온도다."],"k":"포매용 경파라핀 융점 = 56~58℃."},{"n":13,"s":"진단조직학","q":"헤마톡실린으로 핵을 일부러 진하게 염색한 뒤 산-알코올에 잠깐 담가 여분의 색을 빼고 핵만 선명하게 남겼다. 이 염색 방식은?","o":["진행성염색법","퇴행성염색법","이염성염색","음성염색법","형광염색법"],"img":[],"a":1,"e":"과염색한 뒤 산-알코올로 분별하는 방식은 퇴행성염색법이다. 일부러 진하게 염색한 뒤 색을 빼서 핵만 선명하게 남긴다.","w":["① 진행성염색법은 분별 없이 원하는 농도까지만 염색한다.","③ 이염성염색은 염료 본래 색과 다른 색으로 염색되는 현상을 이용한다.","④ 음성염색법은 배경을 염색해 대상을 드러내는 방법이다.","⑤ 형광염색법은 형광색소를 이용해 형광현미경으로 본다."],"k":"과염색 후 산-알코올 분별 = 퇴행성염색."},{"n":14,"s":"진단조직학","q":"헤마톡실린-에오신 염색에서 조직을 과염색한 후 탈색(분별)하여 원하는 부분만 남기는 방법은?","o":["퇴행성염색","진행성염색","혼합염색","생체내염색","변색성염색"],"img":[],"a":0,"e":"퇴행성염색은 과염색 후 분별하여 원하는 구조만 남기는 방법이다. H&E에서는 산-알코올로 분별한 뒤 청색화한다.","w":["② 진행성염색은 분별 없이 염색 시간으로 농도를 조절한다.","③ 혼합염색은 여러 염료를 섞어 한 번에 염색하는 방식이다.","④ 생체내염색은 살아 있는 생체에 염료를 주입해 염색하는 방법이다.","⑤ 변색성염색은 이염성 현상을 이용하며 분별을 기준으로 한 분류가 아니다."],"k":"과염색 후 분별 = 퇴행성염색."},{"n":15,"s":"진단조직학","q":"실시간 열순환기(real-time thermal cycler)와 온도 프로그램 화면이 있는 기기를 사용하는 검사는?","o":["면역화학검사","분자병리","효소항체검사","전자현미경 검사","특수화학검사"],"img":[],"a":1,"e":"실시간 PCR 열순환기는 핵산을 증폭해 분석하는 분자병리 검사에 사용한다.","w":["① 면역화학검사는 항원항체반응을 이용하며 열순환기를 쓰지 않는다.","③ 효소항체검사는 효소 표지 항체로 항원을 검출하는 면역검사이다.","④ 전자현미경 검사는 초미세구조를 관찰하는 검사로 핵산 증폭이 없다.","⑤ 특수화학검사는 조직 성분을 화학반응으로 염색하는 검사이다."],"k":"실시간 PCR 열순환기 = 분자병리 검사."},{"n":16,"s":"진단조직학","q":"유전분 검출에 사용되는 염색은?\n가. Congo red 나. Crystal violet 다. Methyl violet 라. Oil red O","o":["가, 나, 다","가, 다","나, 라","가, 나, 라","가, 나, 다, 라"],"img":[],"a":0,"e":"Congo red와 변색성 염료인 Crystal violet, Methyl violet이 유전분 검출에 쓰인다.","w":["② 크리스탈 바이올렛(나)도 아밀로이드 변색성 염색에 쓰이므로 빠진 조합이다.","③ 라(Oil red O)는 지방 염색이다.","④ 라(Oil red O)는 지방 염색이고 메틸 바이올렛(다)이 빠졌다.","⑤ 라(Oil red O)는 지방 염색이다."],"k":"아밀로이드 = 콩고 레드, 크리스탈 바이올렛, 메틸 바이올렛."},{"n":17,"s":"진단조직학","q":"심근 조직을 Masson 삼색 염색하였더니 근섬유 사이의 아교섬유가 파란색으로 염색되었다. 파란색 염색 시약은?","o":["Aniline blue","Toluidine blue","basic fuchsin","Methylene blue","Weigert’s HX"],"img":[],"a":0,"e":"Masson 삼색 염색에서 아교섬유는 aniline blue로 청색, 근섬유는 적색, 핵은 Weigert 철헤마톡실린으로 흑색이다.","w":["② 톨루이딘 블루는 비만세포 과립 등의 이염색에 쓴다.","③ 염기성 푹신은 Ziehl-Neelsen 항산성 염색 등에 쓴다.","④ 메틸렌 블루는 Ziehl-Neelsen 대조염색 등에 쓴다.","⑤ Weigert 철헤마톡실린은 Masson 삼색 염색에서 핵을 흑색으로 염색한다."],"k":"Masson 삼색 아교섬유 청색 = 아닐린 블루."},{"n":18,"s":"진단조직학","q":"조직 내 크고 작은 지방 방울이 적색으로 염색된 표본이다. 이 염색 과정으로 옳은 것은?","o":["파라핀 절편","지용성 봉입제 사용","Carnoy 고정액 사용","동결절편에 시행","염료의 분자량 차이에 의한 염색"],"img":[],"a":3,"e":"지질은 파라핀 처리 중 녹으므로 지방염색은 동결절편에 시행하고 수용성 봉입제로 봉입한다.","w":["① 파라핀 절편은 처리 중 유기용매에 지질이 녹아 지방염색에 쓸 수 없다.","② 지용성 봉입제는 지질을 녹이므로 수용성 봉입제를 쓴다.","③ Carnoy 고정액은 알코올, 클로로폼을 함유해 지질을 녹인다.","⑤ 지방 염색은 염료가 지질에 녹아드는 물리적 용해 원리로 염색된다."],"k":"지방 염색 = 동결절편 + 수용성 봉입제."},{"n":19,"s":"진단조직학","q":"부정출혈이 있는 환자에게서 날카로운 숟가락 모양 기구(큐렛)로 자궁내막을 긁어내 조직검사를 의뢰하였다. 이 생검법은?","o":["절개생검","바늘생검","소파생검","내시경생검","세침흡인"],"img":[],"a":2,"e":"소파생검(curettage)은 날카로운 큐렛으로 자궁내막이나 병터 조직을 긁어 채취하는 방법이다.","w":["① 절개생검은 병변의 일부를 칼로 잘라 내는 방법이다.","② 바늘생검은 굵은 바늘을 찔러 원기둥 모양 조직을 얻는 방법이다.","④ 내시경생검은 내시경을 통해 겸자로 점막을 떼어 내는 방법이다.","⑤ 세침흡인은 가는 바늘로 세포를 흡인하는 세포검사이다."],"k":"큐렛으로 긁어 채취 = 소파생검."},{"n":20,"s":"진단조직학","q":"Toluidine blue로 비만세포 과립을 이염색(metachromasia)한 표본이다. 이 염색의 봉입제로 맞는 것은?","o":["Resin gum","Permount","매니큐어","Glycerin","Canada balsam"],"img":[],"a":3,"e":"이염성은 탈수하면 약해지므로 탈수, 투명을 거치지 않는 글리세린 같은 수용성 봉입제를 쓴다.","w":["① Resin gum은 탈수, 투명이 필요한 비수용성 봉입제이다.","② Permount는 합성수지 비수용성 봉입제이다.","③ 매니큐어는 봉입제가 아니라 덮개유리 가장자리를 밀봉할 때 쓴다.","⑤ Canada balsam은 탈수, 투명이 필요한 천연수지 비수용성 봉입제이다."],"k":"이염색(톨루이딘 블루) 봉입 = 수용성 봉입제(글리세린)."},{"n":21,"s":"진단조직학","q":"봉입제는 수용성과 비수용성(합성수지)으로 나뉜다. 글리세린젤리 같은 수용성 봉입제에 관한 설명으로 옳은 것은?","o":["반드시 무수알코올로 탈수한 뒤 사용한다","지방 염색 표본의 봉입에 사용된다","합성수지 봉입제보다 굴절률이 높다","H&E 염색 표본의 일상 봉입에 주로 쓴다","자일렌에 녹여 사용한다"],"img":[],"a":1,"e":"수용성 봉입제는 알코올·자일렌을 거치면 녹아 나오는 지방 염색 표본처럼 탈수·투명을 할 수 없는 표본에 사용한다.","w":["① 수용성 봉입제는 탈수 과정 없이 물에서 바로 봉입한다.","③ 수용성 봉입제는 합성수지 봉입제보다 굴절률이 낮다.","④ H&E 표본은 탈수·투명 후 합성수지 봉입제로 봉입한다.","⑤ 자일렌에 녹여 쓰는 것은 비수용성 합성수지 봉입제이다."],"k":"수용성 봉입제 = 지방 염색 등 탈수 불가 표본."},{"n":22,"s":"진단조직학","q":"열순환기에서 변성, 결합, 신장 단계를 반복하여 표적 DNA를 늘리는 과정을 나타낸 모식도이다. 무엇에 관한 설명인가?","o":["제자리부합법","중합연쇄반응","유세포분석","면역조직화학","FANA"],"img":[],"a":1,"e":"중합연쇄반응(PCR)은 변성, 결합, 신장을 반복해 표적 DNA를 증폭한다.","w":["① 제자리부합법은 조직 위에서 탐식자를 결합시키는 검사로 증폭 순환이 없다.","③ 유세포분석은 형광 표지 세포를 레이저로 하나씩 측정한다.","④ 면역조직화학은 항원항체반응으로 조직 내 항원을 검출한다.","⑤ FANA는 형광 항핵항체 검사로 자가항체를 검출한다."],"k":"변성, 결합, 신장 반복 = 중합연쇄반응(PCR)."},{"n":23,"s":"진단세포학","q":"자궁경부 검체가 보존액 용기에 담겨 왔다. 검사실에서 검체를 흔들어 세포를 고르게 흩은 뒤 필터막으로 세포를 모아 슬라이드에 옮겨 붙였다. 이 세포검사법은?","o":["날인도말법","직접도말법","세포원심분리법","액상세포검사법","흡인도말법"],"img":[],"a":3,"e":"액상세포검사법은 보존액 속 세포를 분산시키고, 막여과로 수집한 뒤 슬라이드로 이전하는 과정을 거친다.","w":["① 날인도말법은 조직 절단면을 슬라이드에 눌러 세포를 묻힌다.","② 직접도말법은 채취한 검체를 슬라이드에 바로 바른다.","③ 세포원심분리법은 원심력으로 세포를 모으며 막여과를 쓰지 않는다.","⑤ 흡인도말법은 주사기로 흡인한 검체를 슬라이드에 바르는 방법이다."],"k":"분산 → 막여과 수집 → 이전 = 액상세포검사법."},{"n":24,"s":"진단세포학","q":"부인과 세포 도말에서 한 세포 안의 여러 핵이 서로 눌려 맞물리고 핵 안이 균질한 젖빛유리 모양이다. 의심되는 감염원은?","o":["Actinomyces","Gardnerella vaginalis","Herpes simplex virus","Trichomonas vaginalis","Cytomegalovirus"],"img":[],"a":2,"e":"다핵, 핵 성형(molding), 젖빛유리 핵은 단순포진바이러스 감염 소견이다.","w":["① Actinomyces는 방사상 털뭉치 모양 집락을 만들며 IUD 착용과 관련된다.","② Gardnerella vaginalis는 짧은 막대균이 편평세포를 덮은 실마리세포를 만든다.","④ Trichomonas vaginalis는 서양배 모양 충체와 핵주위 투명대가 특징이다.","⑤ Cytomegalovirus는 단핵 거대세포에 크고 진한 핵내 봉입체를 만든다."],"k":"다핵 + 핵 성형 + 젖빛유리 핵 = HSV."},{"n":25,"s":"진단세포학","q":"주사기를 끼워 한 손으로 음압을 걸 수 있게 만든 주사기 손잡이(holder)가 사용되는 검사는?","o":["액상세포검사법","자궁원추생검","신장침생검","세포원심분리","세침흡인검사"],"img":[],"a":4,"e":"주사기 손잡이는 가는 바늘로 음압을 걸어 세포를 흡인하는 세침흡인검사(FNA)에 쓴다.","w":["① 액상세포검사법은 채취 기구를 보존액에 넣어 처리하며 음압 손잡이를 쓰지 않는다.","② 자궁원추생검은 메스나 전기 고리로 원뿔 모양 조직을 절제한다.","③ 신장침생검은 조직 코어를 얻는 굵은 생검침을 쓴다.","④ 세포원심분리는 액체 검체의 세포를 원심력으로 슬라이드에 모으는 장비 처리법이다."],"k":"주사기 손잡이(음압) = 세침흡인검사."},{"n":26,"s":"진단세포학","q":"각화성 편평세포암종을 질도말표본에서 관찰할 때 특징적인 세포학적 소견은?","o":["감자 모양의 핵","청록색 세포질의 세포가 합포체 모양으로 모인다","작고 균일한 세포가 주로 보인다","판상(sheet)으로 도말되며 큰 핵소체가 보인다","올챙이 및 방추형 세포"],"img":[],"a":4,"e":"각화성 편평세포암종은 오렌지G에 물드는 각화 세포질을 가진 올챙이형, 방추형 등 기이한 모양의 세포가 특징이며 세포 크기와 모양이 매우 다양하다.","w":["① 감자 모양 핵은 각화성 편평세포암종의 특징 소견이 아니다.","② 청록색 세포질의 세포가 합포체 모양으로 모이는 것은 비각화성 편평세포암종의 소견이다.","③ 작고 균일한 세포가 주로 보이는 것은 소세포암종 등에서 보는 소견으로, 크기와 모양이 매우 다양한 각화성 편평세포암종과 다르다.","④ 판상 배열과 큰 핵소체는 수복세포 소견이다.","청록색 세포질의 합포체 집단은 비각화성 편평세포암종, 판상 배열과 큰 핵소체는 수복세포의 소견이다."],"k":"올챙이형, 방추형 각화 세포 = 각화성 편평세포암종."},{"n":27,"s":"진단세포학","q":"PAP 염색 시 불완전 탈수 다음 단계에 쓰이며 각화세포와 글리코겐을 염색하는 시약은?","o":["95% 에탄올","무수 에탄올","Bismarck brown","Light green","Orange G 6"],"img":[],"a":4,"e":"OG-6는 불완전 탈수 뒤에 사용하며 각화세포와 글리코겐을 염색한다. Pap 염색에서 헤마톡실린 다음, EA 앞에 쓰는 세포질 염색액이다.","w":["① 95% 에탄올은 탈수, 세척에 쓰는 알코올로 염료가 아니다.","② 무수 에탄올은 최종 탈수 단계에 쓴다.","③ Bismarck brown은 EA의 구성 성분이다.","④ Light green은 EA의 구성 성분으로 비각화세포 세포질을 청록색으로 염색한다."],"k":"불완전 탈수 후 각화세포 염색 = OG-6."},{"n":28,"s":"진단세포학","q":"객담 세포검사 표본이 침이 아니라 폐 깊은 곳까지 내려간 하기도 검체로 인정받으려면 반드시 확인되어야 하는 세포는?","o":["섬모원주세포","술잔세포","편평상피세포","먼지세포(폐포대식세포)","중피세포"],"img":[],"a":3,"e":"먼지세포(폐포대식세포)는 폐포에 있으므로 객담에서 관찰되면 폐포에서 나온 적합한 검체로 판정한다.","w":["① 섬모원주세포는 기관지 상피에서 떨어져 나오며 폐포 유래의 근거는 아니다.","② 술잔세포는 기도 상피에 있는 점액 분비세포이다.","③ 편평상피세포는 구강에서 유래하며 많으면 침 오염을 뜻한다.","⑤ 중피세포는 흉막 등 체강을 덮는 세포로 흉수에서 관찰된다."],"k":"객담 적합성 = 먼지세포(폐포대식세포)."},{"n":29,"s":"진단세포학","q":"Pap 도말에서 핵주위 공동과 이핵을 보이는 공동세포가 관찰되는 것은?","o":["Trichomonas","Actinomyces","Herpes simplex virus","CMV","HPV"],"img":[],"a":4,"e":"공동세포는 HPV 감염의 특징적 세포 변화이다. 핵주위에 경계가 뚜렷한 넓은 공동이 있고 핵이 커지거나 두 개로 보인다.","w":["① Trichomonas는 서양배 모양 충체와 핵주위 투명대가 특징이다.","② Actinomyces는 방사상 털뭉치 모양 균집락을 만든다.","③ Herpes simplex virus는 다핵, 핵 성형, 젖빛유리 핵을 만든다.","④ CMV는 거대세포에 크고 진한 핵내 봉입체를 만든다."],"k":"공동세포(핵주위 공동 + 이핵) = HPV."},{"n":30,"s":"진단세포학","q":"질도말표본에서 주상세포(navicular cell)가 특징적으로 출현하는 시기는?","o":["배란기","월경기","임신기","증식기","폐경기"],"img":[],"a":2,"e":"주상세포는 프로게스테론 영향으로 중간세포에 당원이 침착된 세포로, 임신 중인 여성의 질도말에 특징적으로 나타난다.","w":["① 배란기는 에스트로겐 작용으로 표층세포가 우세하다.","② 월경기는 혈액과 자궁내막세포가 보인다.","④ 증식기는 에스트로겐 작용으로 표층세포가 늘어난다.","⑤ 폐경기는 에스트로겐 결핍으로 기저곁세포가 우세하다."],"k":"주상세포 = 임신기(프로게스테론)."}],"practice":[{"n":1,"s":"병리학","q":"자궁경부 조직 사진이다. 기저층부터 표층까지 이형세포가 상피 전체를 차지하고 성숙 방향이 사라졌지만, 기저막 아래 간질에는 종양세포가 보이지 않는다. 진단은?","o":["경도 이형성증","중등도 이형성증","편평세포 화생","미세침윤 편평세포암","상피내암"],"img":["mock1_m0009.jpg"],"a":4,"e":"이형세포가 상피 전층을 대치하고 극성이 소실되었으나 기저막이 온전하므로 상피내암이다.","w":["① 경도 이형성증은 이형세포가 상피 아래쪽 약 1/3에 머문다.","② 중등도 이형성증은 이형세포가 상피 아래쪽 약 2/3까지 차지한다.","③ 편평세포 화생은 원주상피가 성숙한 편평상피로 바뀐 것으로 이형성이 없다.","④ 미세침윤암은 기저막을 뚫고 간질로 소량 침윤한 상태이다."],"k":"전층 대치 + 극성 소실 + 기저막 온전 = 상피내암."},{"n":2,"s":"병리학","q":"꼬인 소장 고리가 검붉게 변한 사진이다. 이처럼 혈류가 막혔을 때 조직의 최종 상태는?","o":["수포 형성","울혈","혈전","조직괴사","화생"],"img":["mock1_m0011.jpg"],"a":3,"e":"염전으로 혈류가 막혀 생긴 소장의 출혈성 경색으로, 최종 상태는 조직괴사다.","w":["① 수포 형성은 피부 표피 아래 액체가 고이는 소견으로 혈류 차단의 결과가 아니다.","② 울혈은 정맥 유출 장애로 혈액이 고인 상태로 괴사 이전 단계이다.","③ 혈전은 혈관 안에서 혈액이 굳은 덩어리로 혈류 차단의 원인이 될 수 있다.","⑤ 화생은 만성 자극에 적응해 한 성숙세포가 다른 성숙세포로 바뀌는 것으로 급성 혈류 차단의 결과가 아니다."],"k":"혈류 차단의 최종 결과 = 괴사(경색)."},{"n":3,"s":"조직학","q":"H&E 염색 표본이다. 사진의 조직이 속하는 기본조직은?","o":["신경조직","상피조직","결합조직","지방조직","근육조직"],"img":["mock1_m0013.jpg"],"a":2,"e":"균질한 바탕질 속 연골소강에 연골세포가 든 유리연골이다. 연골은 혈액, 뼈와 함께 특수 결합조직에 속한다.","w":["① 신경조직은 신경세포와 신경아교세포로 이루어진다.","② 상피조직은 세포가 밀착해 표면을 덮고 바탕질이 거의 없다.","④ 지방조직은 결합조직에 속하며 4대 기본조직의 하나가 아니다.","⑤ 근육조직은 수축성 근섬유로 이루어진다."],"k":"연골 = 특수 결합조직."},{"n":4,"s":"조직학","q":"H&E 염색 표본이다. 사진의 근육처럼 소화기계, 생식기계, 호흡기계를 구성하며 손상을 받으면 유사분열 능력이 있는 근육은?","o":["백색근육","민무늬근육","뼈대근육","적색근육","심장근육"],"img":["mock1_m0015.jpg"],"a":1,"e":"가로무늬가 없고 방추형 세포 중앙에 길쭉한 핵이 하나씩 있는 민무늬근육은 내장 벽을 이루며, 손상되면 세포가 유사분열해 재생할 수 있다.","w":["① 백색근육은 뼈대근육 섬유의 한 유형이다.","③ 뼈대근육은 유사분열하지 않고 위성세포로 제한적으로만 재생한다.","④ 적색근육은 뼈대근육 섬유의 한 유형이다.","⑤ 심장근육은 손상되면 거의 재생되지 않고 섬유조직으로 대치된다.","뼈대근육은 유사분열하지 않고 위성세포로 제한적으로만 재생하며, 심장근육은 거의 재생하지 않는다. 백색근육과 적색근육은 뼈대근육 섬유의 유형이다."],"k":"내장 근육 + 분열 재생 가능 = 민무늬근."},{"n":5,"s":"진단조직학","q":"콩팥을 염색한 사진이다. 사용한 염료는?","o":["FITC","Methylene blue","Hematoxylin","Congo red","Crystal violet"],"img":["mock1_m0017.jpg"],"a":0,"e":"사구체가 녹색 형광을 내는 면역형광염색으로, 표지 색소는 FITC이다. FITC로 표지한 항체가 사구체에 침착된 면역글로불린이나 보체에 결합해 녹색으로 빛난다.","w":["② Methylene blue는 광학현미경용 염기성 염료다.","③ Hematoxylin은 광학현미경에서 핵을 청색으로 염색한다.","④ Congo red는 아밀로이드 염색으로 편광에서 사과녹색 복굴절을 보이며 형광 표지 색소가 아니다.","⑤ Crystal violet은 아밀로이드 변색성 염색 등에 쓰는 광학현미경용 염료다."],"k":"녹색 형광 면역형광염색 = FITC."},{"n":6,"s":"진단조직학","q":"사진은 골격근 조직의 PTAH 염색 표본이다. 이 염색에 맞는 고정액은?","o":["Bouin","NBF","B-5","Henry","Zenker"],"img":["mock1_m0019.jpg"],"a":4,"e":"가로무늬가 청색으로 보이는 PTAH 염색은 Zenker 고정에서 가장 좋은 결과를 얻는다.","w":["① Bouin은 피크린산 고정액으로 PTAH의 최적 고정액이 아니다.","② NBF 고정 조직도 염색할 수 있지만 Zenker 고정이 가장 좋은 결과를 낸다.","③ B-5는 림프절, 조혈조직 고정에 주로 쓴다.","④ Henry 고정액은 PTAH의 기준 고정액이 아니다."],"k":"PTAH 염색 고정 = Zenker."},{"n":7,"s":"진단조직학","q":"사진은 진균 균사를 흑색으로 나타낸 GMS 염색이다. 은 반응 전에 균 세포벽 다당류를 산화해 알데하이드를 만드는 시약은?","o":["크롬산(chromic acid)","과요오드산(periodic acid)","질산은(silver nitrate)","개미산(formic acid)","피크르산(picric acid)"],"img":["mock1_m0021.jpg"],"a":0,"e":"사진은 흑색 균사가 보이는 GMS 염색으로, 크롬산이 세포벽 다당류를 산화해 알데하이드를 만들고 이것이 메텐아민 은을 환원한다.","w":["② 과요오드산은 PAS 염색의 산화제다.","③ 질산은은 은 용액의 재료이지 산화제가 아니다.","④ 개미산은 탈회제로 쓴다.","⑤ 피크르산은 고정액(부앵액) 성분이다."],"k":"GMS 산화제 = 크롬산."},{"n":8,"s":"진단조직학","q":"위 점막의 특수염색 사진이다. 점액을 붉게 발색시키는 데 사용된 시약은?","o":["Periodic acid","Alcian blue","Schiff 시약","aniline blue","Acid fuchsin"],"img":["mock1_m0023.jpg"],"a":2,"e":"PAS 염색에서 과요오드산 산화로 생긴 알데히드기가 Schiff 시약과 반응하여 점액이 적자색으로 발색된다.","w":["① Periodic acid는 다당류를 산화해 알데히드를 만드는 산화제이며 발색시키지 않는다.","② Alcian blue는 산성 점액을 청색으로 염색한다.","④ Aniline blue는 Masson 삼색 염색에서 교원섬유를 청색으로 염색한다.","⑤ Acid fuchsin은 Van Gieson 염색 등에서 교원섬유를 적색으로 염색한다."],"k":"PAS 발색 = Schiff 시약(적자색)."},{"n":9,"s":"진단조직학","q":"사진의 표본에 알맞은 것은?","o":["Epoxy","동결절편","카보왁스","Gelatin","파라핀절편"],"img":["mock1_m0025.jpg"],"a":1,"e":"지방 방울이 적색으로 염색된 지방염색 표본으로, 지방이 녹지 않게 동결절편으로 만든다.","w":["① Epoxy는 전자현미경용 포매제이다.","③ 카보왁스는 수용성 왁스 포매제로 탈수를 생략하지만 지방 보존의 표준이 아니다.","④ Gelatin 포매는 동결절편 보조에 쓰는 포매 방법으로 사진의 표본 제작법이 아니다.","⑤ 파라핀절편은 처리 중 지방이 녹아 빈 공포로 남는다."],"k":"지방 염색 = 동결절편."},{"n":10,"s":"진단조직학","q":"림프절을 변색성 염료로 염색한 사진이다. 사용된 변색성 염료에 해당하는 시약은?","o":["eosin Y","acid fuchsin","orange G","aniline blue","toluidine blue"],"img":["mock1_m0027.jpg"],"a":4,"e":"청색 림프구 옆 비만세포 과립이 적자색으로 이염된 톨루이딘블루 염색이다.","w":["① eosin Y는 변색성이 없는 산성 염료다.","② acid fuchsin은 변색성이 없는 산성 염료다.","③ orange G는 변색성이 없는 산성 염료다.","④ aniline blue는 변색성이 없는 산성 염료다."],"k":"비만세포 과립 적자색 이염 = 톨루이딘 블루."},{"n":11,"s":"진단조직학","q":"면역조직화학염색 사진이다. 사용한 발색제는?","o":["methenamine silver","AEC","Schiff","DAB","PAP"],"img":["mock1_m0029.jpg"],"a":3,"e":"갈색 양성 산물은 과산화효소와 DAB의 반응으로 생긴다. DAB는 과산화수소 존재하에 산화되어 알코올에 녹지 않는 갈색 침전을 만든다.","w":["① Methenamine silver는 GMS 염색 등에 쓰는 은 시약이다.","② AEC는 적색 산물을 만드는 발색제로 갈색이 아니다.","③ Schiff 시약은 PAS, Feulgen 반응에 쓴다.","⑤ PAP는 발색제가 아니라 과산화효소-항과산화효소 복합체 검출법이다."],"k":"갈색 발색 = DAB."},{"n":12,"s":"진단세포학","q":"세포검사 목적으로 쓰는 sample cassette 사진이다. 이용하는 방법은?","o":["세포 군집 절편","세포원심침전법","세침천자흡인","변형대 채취법","액상자궁세포검사"],"img":["mock1_m0031.jpg"],"a":0,"e":"조직 카세트에 세포침전물을 넣어 파라핀 블록을 만드는 세포군집절편법이다.","w":["② 세포원심침전법은 깔때기와 슬라이드를 쓴다.","③ 세침천자흡인은 주사기와 가는 바늘을 쓴다.","④ 변형대 채취법은 자궁경부 이행대에서 세포를 채취하는 방법이다.","⑤ 액상자궁세포검사는 보존액 바이알을 쓴다."],"k":"세포침전물 카세트 = 세포군집절편법."},{"n":13,"s":"진단세포학","q":"프로게스테론의 혈중농도가 높은 시기에 채취한, 내분비 검사용 질도말 표본이다. 우세하게 관찰되는 세포상은?","o":["기저세포","표재세포","중간세포","무핵세포","기저곁세포(방기저세포)"],"img":["mock1_m0033.jpg"],"a":2,"e":"청록색 세포질과 소포성 핵을 가진 중간세포만 보이며 이는 프로게스테론 우세 시기의 세포상이다.","w":["① 기저세포는 위축된 상피에서나 보이며 정상 주기에서 우세하지 않다.","② 표재세포는 에스트로겐 우세 시기에 늘어나며 분홍색 세포질과 농축핵을 가진다.","④ 무핵세포는 각화된 세포로 내분비 검사의 지표 세포가 아니다.","⑤ 기저곁세포는 폐경 후 에스트로겐 결핍 시 우세하다."],"k":"프로게스테론 우세 = 중간세포 우세."},{"n":14,"s":"진단세포학","q":"가려움증과 동통이 있는 여성의 질 도말표본 사진이다. 관찰되는 거짓균사, 포자가 특징인 미생물은?","o":["질편모충","칸디다","임균","렙토트릭스","방선균"],"img":["mock1_m0035.jpg"],"a":1,"e":"분절된 분홍색 거짓균사와 타원형 포자가 보이면 칸디다 감염이다. 칸디다는 가려움증과 흰 분비물을 동반하는 흔한 질 진균 감염이다.","w":["① 질편모충은 서양배 모양 충체와 핵주위 투명대가 특징이다.","③ 임균은 그람음성 쌍구균으로 세포 안에서 보인다.","④ 렙토트릭스는 분절이 없는 가늘고 긴 막대균이다.","⑤ 방선균은 방사상 털뭉치 모양 집락을 만든다."],"k":"거짓균사 + 포자 = 칸디다."},{"n":15,"s":"진단세포학","q":"사진은 세포 도말 표본 제작 과정이다. 세포판독에 방해가 되는 점액 등을 제거하고 세포가 겹치지 않도록 보존액에 분산시켜 유리슬라이드에 단층으로 도말하는 이 방법은?","o":["흡인도말법","압착도말법","날인도말법","커버글라스도말법","액상세포도말법"],"img":["mock1_m0037.jpg"],"a":4,"e":"빗자루 솔 머리를 보존액 바이알에 넣는 단계로, 액상세포도말법의 검체 처리 과정이다.","w":["① 흡인도말법은 흡인한 검체를 직접 슬라이드에 편다.","② 압착도말법은 두 슬라이드 사이에 검체를 눌러 편다.","③ 날인도말법은 조직 절단면을 슬라이드에 찍어 낸다.","④ 커버글라스도말법은 보존액을 쓰지 않는 직접 도말이다."],"k":"보존액 분산, 단층 도말 = 액상세포도말법."},{"n":16,"s":"진단세포학","q":"베데스다 분류에 따른 이 도말표본의 진단은?","o":["HSIL","샘암종","LSIL","각화성편평상피암","비각화성편평상피암"],"img":["mock1_m0039.jpg"],"a":3,"e":"꼬리 모양과 섬유형의 각화 악성 편평세포는 각화성 편평상피암 소견이다. 오렌지색 각화 세포질과 농축된 과염색 핵이 함께 보인다.","w":["① HSIL은 핵세포질비가 높은 미성숙 이형세포로 기이한 각화세포가 없다.","② 샘암종은 핵소체가 뚜렷한 원주형 세포가 샘 모양 집단을 이룬다.","③ LSIL은 공동세포와 경도 핵 이상을 보이는 표층, 중간세포 병변이다.","⑤ 비각화성 편평상피암은 호염기성 세포질 세포가 합포체를 이루고 각화가 적다."],"k":"올챙이, 섬유형 각화 악성세포 = 각화성 편평상피암."}]},{"no":2,"theory":[{"n":1,"s":"병리학","q":"","o":[],"img":[]},{"n":2,"s":"병리학","q":"","o":[],"img":[]},{"n":3,"s":"병리학","q":"","o":[],"img":[]},{"n":4,"s":"병리학","q":"","o":[],"img":[]},{"n":5,"s":"조직학","q":"","o":[],"img":[]},{"n":6,"s":"조직학","q":"","o":[],"img":[]},{"n":7,"s":"조직학","q":"","o":[],"img":[]},{"n":8,"s":"조직학","q":"","o":[],"img":[]},{"n":9,"s":"진단조직학","q":"","o":[],"img":[]},{"n":10,"s":"진단조직학","q":"","o":[],"img":[]},{"n":11,"s":"진단조직학","q":"","o":[],"img":[]},{"n":12,"s":"진단조직학","q":"","o":[],"img":[]},{"n":13,"s":"진단조직학","q":"","o":[],"img":[]},{"n":14,"s":"진단조직학","q":"","o":[],"img":[]},{"n":15,"s":"진단조직학","q":"","o":[],"img":[]},{"n":16,"s":"진단조직학","q":"","o":[],"img":[]},{"n":17,"s":"진단조직학","q":"","o":[],"img":[]},{"n":18,"s":"진단조직학","q":"","o":[],"img":[]},{"n":19,"s":"진단조직학","q":"","o":[],"img":[]},{"n":20,"s":"진단조직학","q":"","o":[],"img":[]},{"n":21,"s":"진단조직학","q":"","o":[],"img":[]},{"n":22,"s":"진단조직학","q":"","o":[],"img":[]},{"n":23,"s":"진단세포학","q":"","o":[],"img":[]},{"n":24,"s":"진단세포학","q":"","o":[],"img":[]},{"n":25,"s":"진단세포학","q":"","o":[],"img":[]},{"n":26,"s":"진단세포학","q":"","o":[],"img":[]},{"n":27,"s":"진단세포학","q":"","o":[],"img":[]},{"n":28,"s":"진단세포학","q":"","o":[],"img":[]},{"n":29,"s":"진단세포학","q":"","o":[],"img":[]},{"n":30,"s":"진단세포학","q":"","o":[],"img":[]}],"practice":[{" practice":[{"n":1,"s":"병리학","q":"","o":[],"img":["mock2_m0451.jpg"]},{"n":2,"s":"병리학","q":"","o":[],"img":["mock2_m0303.jpg"]},{"n":3,"s":"조직학","q":"","o":[],"img":["mock2_m0453.jpg"]},{"n":4,"s":"조직학","q":"","o":[],"img":["mock2_m0455.jpg"]},{"n":5,"s":"진단조직학","q":"","o":[],"img":["mock2_m0457.jpg"]},{"n":6,"s":"진단조직학","q":"","o":[],"img":["mock2_m0459.jpg"]},{"n":7,"s":"진단조직학","q":"","o":[],"img":["mock2_m0461.jpg"]},{"n":8,"s":"진단조직학","q":"","o":[],"img":["mock2_m0463.jpg"]},{"n":9,"s":"진단조직학","q":"","o":[],"img":["mock2_m0465.jpg"]},{"n":10,"s":"진단조직학","q":"","o":[],"img":["mock2_m0467.jpg"]},{"n":11,"s":"진단조직학","q":"","o":[],"img":["mock2_m0469.jpg"]},{"n":12,"s":"진단세포학","q":"","o":[],"img":["mock2_m0411.jpg"]},{"n":13,"s":"진단세포학","q":"","o":[],"img":["mock2_m0471.jpg"]},{"n":14,"s":"진단세포학","q":"","o":[],"img":["mock2_m0473.jpg"]},{"n":15,"s":"진단세포학","q":"","o":[],"img":["mock2_m0475.jpg"]},{"n":16,"s":"진단세포학","q":"","o":[],"img":["mock2_m0477.jpg"]}]}],"SM":{"P":[{"no":"P1","theory":[{"q":"유방암 환자의 전이 여부를 확인하기 위해 감시림프절 생검을 시행하는 부위는?","o":["겨드랑 림프절","복막 표면","뇌","간 문맥","뼈"],"a":0,"e":"유방암은 림프행성 전이가 주된 경로이며 유방 림프는 대부분 겨드랑 림프절로 배액된다. 따라서 감시림프절 생검으로 겨드랑 림프절 전이를 먼저 확인한다.","w":["② 체강 표면을 따라 퍼지는 파종성 전이는 난소암에서 흔하다.","③ 뇌는 유방암이 진행한 뒤 혈행성으로 전이하는 장기이다.","④ 간 문맥을 통한 전이는 대장암에서 흔하다.","⑤ 뼈는 유방암이 진행한 뒤 혈행성으로 전이하는 장기이다."],"k":"유방암 = 림프행성 전이, 겨드랑 감시림프절 생검","img":[],"s":"병리학","src":"P-5-26","ty":"역변환","n":1},{"q":"동결절편을 수단 III(Sudan III)로 염색했을 때 적황색~적색으로 나타나는 물질은?","o":["글리코겐","아밀로이드","3가 철(혈철소)","칼슘염","지방"],"a":4,"e":"지방은 파라핀 절편 과정에서 알코올과 자일렌에 녹으므로 동결절편을 만들어 수단 III나 오일레드 O로 염색하며, 적황색~적색으로 나타난다.","w":["① 글리코겐은 PAS 염색으로 증명한다.","② 아밀로이드는 콩고레드로 증명한다.","③ 3가 철(혈철소)은 프러시안 블루로 증명한다.","④ 칼슘염은 폰코사(von Kossa) 염색으로 증명한다."],"k":"수단 III·오일레드 O(동결절편) = 지방","img":[],"s":"병리학","src":"P-2-12","ty":"역변환","n":2},{"q":"허혈로 세포 안이 산성화되면 구조 단백질과 분해효소가 함께 변성되어, 핵은 사라져도 세포 윤곽이 며칠 유지되는 응고괴사가 생긴다. 대부분의 경색은 응고괴사로 나타나지만 한 장기에서는 예외적으로 액화괴사가 일어난다. 그 경색은?","o":["심근경색","콩팥 경색","비장 경색","뇌경색","폐경색"],"a":3,"e":"뇌는 지질이 많고 단백질 변성보다 효소에 의한 자가분해가 우세하여 경색이 액화괴사로 나타난다. 심장, 콩팥, 비장의 허혈 경색은 세포 윤곽이 보존되는 응고괴사다.","w":["① 심근경색은 응고괴사의 대표 예다.","② 콩팥 경색은 쐐기 모양의 응고괴사(빈혈성 경색)로 나타난다.","③ 비장 경색도 응고괴사로 나타난다.","⑤ 폐경색은 이중 혈액 공급으로 출혈성 경색이 되며 액화괴사가 아니다."],"k":"경색 = 응고괴사, 단 뇌경색 = 액화괴사.","img":[],"s":"병리학","src":"M24-이2","ty":"부정전환","n":3},{"q":"뼈, 근육, 섬유, 지방 같은 간엽성(비상피성) 조직에서 기원한 악성종양을 육종이라 하며, 상피 기원 악성종양인 암종과 구별한다. 육종(sarcoma)에 해당하는 것은?","o":["기저세포암종","샘암종","이행상피암종","편평상피암종","섬유육종"],"a":4,"e":"섬유육종은 섬유모세포 기원의 악성 간엽성 종양으로 육종이다.","w":["① 기저세포암종은 상피성 악성종양으로 암종이다.","② 샘암종은 샘상피에서 생긴 암종이다.","③ 이행상피암종은 이행상피에서 생긴 암종이다.","④ 편평상피암종은 편평상피에서 생긴 암종이다."],"k":"섬유육종 = 육종, 상피 기원 악성 = 암종","img":[],"s":"병리학","src":"P-5-11","ty":"부정전환","n":4},{"q":"노화, 폐용, 영양 결핍 등으로 정상 크기에 도달했던 장기의 부피가 줄어드는 적응을 위축(atrophy)이라 한다. 위축에서 일어나는 세포 변화는?","o":["다른 성숙세포로 대치","비정상 물질 축적","세포 크기만 증가","세포 크기·수 감소","세포 수 증가"],"a":3,"e":"위축은 조직이나 장기를 이루는 세포의 크기나 수가 줄어 장기가 작아지는 변화이다.","w":["① 다른 성숙세포로 대치되는 것은 화생이다.","② 세포 안에 비정상 물질이 쌓이는 가역적 손상은 변성이다.","③ 세포 수 변화 없이 크기만 커지는 것은 비대이다.","⑤ 세포의 수가 늘어나는 것은 증식이다."],"k":"위축 = 세포 크기·수 감소로 장기 축소","img":[],"s":"병리학","src":"M19-이4","ty":"역변환","n":5},{"q":"동맥이 막혀 조직으로 가는 혈류가 차단되면 산소 공급이 끊긴 세포에 시간에 따라 변화가 진행된다. 혈류가 막힌 조직에서 일어나는 변화의 순서로 옳은 것은?","o":["가역 손상 → ATP 고갈 → 괴사","ATP 고갈 → 괴사 → 가역 손상","ATP 고갈 → 가역 손상 → 괴사","가역 손상 → 괴사 → ATP 고갈","괴사 → 가역 손상 → ATP 고갈"],"a":2,"e":"혈류가 차단되면 ATP가 고갈되어 가역적 손상을 거친 뒤 비가역적 괴사에 이른다. 혈류 차단이 지속된 조직의 최종 상태는 조직괴사(경색)이다.","w":["① ATP 고갈이 먼저 일어나 가역적 손상을 일으킨다.","② 가역적 손상은 괴사보다 앞선 단계이다.","④ ATP 고갈은 손상의 시작이므로 마지막에 올 수 없다.","⑤ 조직괴사는 최종 상태이므로 처음에 올 수 없다."],"k":"혈류 차단 → ATP 고갈 → 가역적 손상 → 조직괴사(경색)","img":[],"s":"병리학","src":"M22-이4","ty":"변형","n":6},{"q":"종양은 기원 조직(상피, 비상피)과 성질(양성, 악성)에 따라 분류한다. 상피에서 기원하여 침윤과 전이를 하는 악성 상피성 종양에 해당하는 것은?","o":["이행상피암종","기형종","샘종","지방종","섬유육종"],"a":0,"e":"악성 상피성 종양은 암종이며, 이행상피에서 생긴 이행상피암종이 이에 속한다.","w":["② 기형종은 배세포 기원 종양이다.","③ 샘종은 양성 상피성 종양이다.","④ 지방종은 양성 비상피성 종양이다.","⑤ 섬유육종은 악성 비상피성 종양(육종)이다."],"k":"암종 = 악성 상피성 종양","img":[],"s":"병리학","src":"P-5-09","ty":"역변환","n":7},{"q":"고혈압 환자의 좌심실 심근은 작업량이 늘어도 세포 수를 늘리지 못하고 세포 크기만 키워(비대) 적응한다. 세포의 분열 능력에 따라 분류할 때 심근세포가 속하는 세포는?","o":["안정세포","예비세포","줄기세포","불안정세포","영구세포"],"a":4,"e":"심근세포는 분열하지 못하는 영구세포이므로 작업량이 늘면 수 대신 개개 세포의 크기를 키우는 비대로 적응한다.","w":["① 안정세포는 평소 분열하지 않다가 손상 시에만 분열하는 세포로 간세포와 콩팥세뇨관상피 등이며 심근세포는 해당하지 않는다.","② 예비세포는 화생 때 분화 방향이 바뀌는 세포로 심근세포의 분류가 아니다.","③ 줄기세포는 불안정세포 조직에서 계속 분열해 소실 세포를 보충하는 세포이다.","④ 불안정세포는 표피와 골수 조혈세포 등이며 심근세포는 해당하지 않는다."],"k":"심근 = 영구세포 → 과형성 대신 비대","img":[],"s":"병리학","src":"P-2-02","ty":"변형","n":8},{"q":"생체 안에서 국소의 세포와 조직이 병적 손상으로 죽는 것을 괴사(necrosis)라 한다. 괴사의 성질로 옳지 않은 것은?","o":["가역적 손상","주위 염증반응","핵농축·핵붕괴","세포막 파괴","혈류 차단으로 발생"],"a":0,"e":"괴사는 생체 안 일부 세포와 조직의 비가역적 죽음이다. 원인 제거 시 회복되는 것은 변성이나 세포종창 같은 가역적 손상이다.","w":["② 새어 나온 내용물이 주위에 염증반응을 일으킨다.","③ 핵농축, 핵붕괴, 핵융해는 괴사의 핵 변화이다.","④ 괴사에서는 세포막 파괴로 내용물이 새어 나온다.","⑤ 혈관공급이 끊기면 그 국소 조직이 괴사한다."],"k":"괴사 = 비가역적 국소 세포 죽음, 염증 동반","img":[],"s":"병리학","src":"M28-이4","ty":"부정전환","n":9},{"q":"악성종양의 병기를 정해 치료 방침과 예후를 판정할 때 TNM 분류를 쓴다. TNM 분류에서 N 항목이 평가하는 것은?","o":["영역 림프절 전이","원발 종양 크기","종양 분화도","자궁경부 세포 소견","원격전이"],"a":0,"e":"TNM 분류는 원발 종양 크기(T), 영역 림프절 전이(N), 원격전이(M)를 조합해 병기를 정하며 치료 방침과 예후 판정에 쓴다.","w":["② 원발 종양의 크기와 침윤 범위는 T이다.","③ 분화도는 TNM이 아니라 조직학적 등급(grade)으로 나타낸다.","④ 자궁경부 세포 소견은 베데스다 분류로 보고한다.","⑤ 원격전이는 M이다."],"k":"TNM: T = 종양 크기, N = 림프절, M = 원격전이","img":[],"s":"병리학","src":"M27-이1","ty":"역변환","n":10},{"q":"장기간 흡연자의 기관지 생검에서 섬모 원주상피가 성숙한 중층편평상피로 바뀌어 있었다. 이 변화의 성질은?","o":["가역적 적응","세포 수 증가","기질 침윤","전암 병변","세포 크기 증가"],"a":0,"e":"성숙세포가 만성 자극으로 다른 성숙세포로 대치되는 화생으로, 흡연자 기관지의 편평상피화생이 대표적이며 원인이 제거되면 회복되는 가역적 변화이다.","w":["② 세포 수만 증가하는 것은 과형성이다.","③ 기저막을 뚫고 기질로 침윤한 것은 침윤암이다.","④ 핵 이상을 동반한 전암 병변은 이형성증이다.","⑤ 세포 크기만 증가하는 것은 비대이다."],"k":"화생 = 성숙세포 → 다른 성숙세포, 가역적 적응","img":[],"s":"병리학","src":"M16-이1","ty":"변형","n":11},{"q":"괴사는 원인과 장기에 따라 응고괴사, 액화괴사, 건락괴사, 지방괴사 등으로 형태가 달라진다. 괴사 형태와 대표 질환의 연결로 옳은 것은?","o":["건락괴사 - 급성 췌장염","지방괴사 - 결핵","건락괴사 - 결핵","응고괴사 - 뇌경색","액화괴사 - 심근경색"],"a":2,"e":"건락괴사는 결핵 육아종 중심에 생기는 치즈 모양의 무구조 괴사이다. 심근경색은 응고괴사, 뇌경색은 액화괴사, 급성 췌장염은 지방괴사를 보인다.","w":["① 급성 췌장염은 지방괴사를 보인다.","② 지방괴사는 급성 췌장염에서 보인다.","④ 뇌경색은 응고괴사가 아니라 액화괴사를 보인다.","⑤ 심근경색은 응고괴사를 보인다."],"k":"결핵 = 건락괴사, 심근경색 = 응고, 뇌경색 = 액화, 췌장염 = 지방괴사","img":[],"s":"병리학","src":"M21-이2","ty":"변형","n":12},{"q":"종양 절제 표본의 육안과 현미경 소견으로 양성과 악성을 판정하려 한다. 악성종양의 소견에 해당하지 않는 것은?","o":["침윤성 증식","N/C ratio 증가","전이","피막 형성","핵분열 증가"],"a":3,"e":"피막을 형성하여 경계가 뚜렷한 것은 양성종양의 특징이다. 핵분열 증가, N/C ratio 증가, 침윤, 전이는 악성 소견이다.","w":["① 침윤성 증식은 악성종양의 특징이다.","② N/C ratio 증가는 악성 소견이다.","③ 전이는 악성종양에서만 일어난다.","⑤ 핵분열 증가는 악성 소견이다."],"k":"피막 형성 = 양성종양, 침윤·전이·N/C비 증가 = 악성","img":[],"s":"병리학","src":"M16-이3","ty":"부정전환","n":13},{"q":"세포 분열을 하지 못해 손상이나 작업량 증가에 비대로만 적응하는 세포는?","o":["골수 조혈세포","표피 기저세포","소화관 점막상피세포","심근세포","구강 점막상피세포"],"a":3,"e":"비대는 세포 수 변화 없이 개개 세포의 크기가 커지는 적응으로, 분열하지 못하는 영구세포인 심근세포에서 대표적이다.","w":["① 골수 조혈세포는 평생 분열하는 불안정세포이다.","② 표피 기저세포는 평생 분열하는 불안정세포이다.","③ 소화관 점막상피는 계속 분열하는 불안정세포이다.","⑤ 구강 점막상피는 계속 분열하는 불안정세포이다."],"k":"비대의 대표 세포 = 심근세포(영구세포)","img":[],"s":"병리학","src":"P-2-21","ty":"변형","n":14},{"q":"세포자멸사(apoptosis)는 카스파제 활성으로 진행되는 에너지 의존성 세포사로, 세포막이 유지된 채 세포가 조각난다. 세포자멸사의 조직 소견으로 옳지 않은 것은?","o":["세포 수축","개별 세포 단위 발생","염색질 응축","자멸소체의 탐식","주위 호중구 침윤"],"a":4,"e":"세포자멸사는 세포자멸소체가 탐식되어 염증이 생기지 않는다. 호중구 침윤은 괴사의 소견이다.","w":["① 세포자멸사에서는 세포가 수축한다.","② 세포자멸사는 개별 세포 단위로 일어난다.","③ 세포자멸사에서는 염색질이 응축된다.","④ 세포막에 싸인 세포자멸소체가 대식세포에 탐식된다."],"k":"세포자멸사 = 수축, 염색질 응축, 자멸소체, 염증 없음","img":[],"s":"병리학","src":"P-1-13","ty":"부정전환","n":15},{"q":"샘을 이루는 원주(샘)상피세포에서 유래하고, 피막에 싸여 팽창성으로 자라며 전이하지 않는 종양은?","o":["평활근종","샘암종","섬유종","지방종","샘종"],"a":4,"e":"샘종은 샘을 이루는 원주(샘)상피세포에서 유래하는 양성 상피성 종양이다.","w":["① 평활근종은 평활근의 양성종양으로 상피성이 아니다.","② 샘암종은 샘상피에서 유래하지만 악성종양이다.","③ 섬유종은 섬유모세포에서 유래하는 양성 비상피성 종양이다.","④ 지방종은 지방세포에서 유래하는 양성 비상피성 종양이다."],"k":"원주(샘)상피 양성 = 샘종, 악성 = 샘암종","img":[],"s":"병리학","src":"M19-이3","ty":"역변환","n":16},{"q":"나이가 들면서 장기가 작아지고 갈색을 띠게 되는 변화를 갈색위축이라 한다. 갈색위축에 대한 설명으로 옳은 것을 모두 고른 것은?\n가. 리포푸신이 쌓인다\n나. 심장과 간에서 흔하다\n다. 혈철소가 쌓여 생긴다\n라. 소모성 위축이다","o":["다, 라","가, 나, 라","가, 나, 다, 라","나, 다","가, 나"],"a":1,"e":"갈색위축은 리포푸신이 쌓이는 소모성 위축으로 간과 심장에서 흔하다. 혈철소 축적은 갈색위축의 원인이 아니다.","w":["① 다는 틀리고 가와 나가 빠졌다.","③ 다는 틀린 설명이다. 혈철소가 아니라 리포푸신이 쌓인다.","④ 다는 틀리고 가와 라가 빠졌다.","⑤ 라도 옳은 설명인데 빠졌다."],"k":"갈색위축 = 리포푸신, 심장·간, 소모성 위축","img":[],"s":"병리학","src":"M7-이1","ty":"변형","n":17},{"q":"화생과 이형성증은 모두 만성 자극을 받은 상피에서 볼 수 있지만 하나는 적응이고 하나는 전암 병변이다. 이형성증에는 있고 화생에는 없는 소견은?","o":["성숙세포 간 대치","기저막 침윤","정상 적응","세포 수만 증가","핵 이형"],"a":4,"e":"화생은 한 성숙세포가 다른 성숙세포로 대치되는 것으로 핵 이상이 없고, 이형성증은 핵 비대와 과염색, 극성 소실을 보이는 전암 병변이다.","w":["① 성숙세포가 다른 성숙세포로 대치되는 것은 화생의 소견이다.","② 기저막을 뚫는 것은 침윤암이며 화생과 이형성증 모두 침윤하지 않는다.","③ 화생은 적응 현상이고 이형성증은 전암 병변이다.","④ 세포 수만 늘어나는 것은 과형성이다."],"k":"화생 = 세포 대치(핵 정상), 이형성증 = 핵 이형(전암)","img":[],"s":"병리학","src":"M4-이1","ty":"변형","n":18},{"q":"혈관 안의 혈액량이 늘어난 상태는 기전에 따라 충혈과 울혈로 나뉜다. 급성염증 부위가 선홍색으로 붉어지는 충혈(hyperemia)의 기전은?","o":["이동 물질의 혈관 폐쇄","정맥혈의 수동 정체","혈관 파열","동맥혈의 능동 유입 증가","미량 출혈"],"a":3,"e":"충혈은 동맥혈이 능동적으로 늘어 병터가 붉어지는 것이다. 울혈은 정맥혈 정체, 잠혈은 화학검사로만 확인되는 소량 출혈이다.","w":["① 이동한 물질이 혈관을 막는 것은 색전이다.","② 정맥혈이 수동적으로 정체되는 것은 울혈이다.","③ 혈관 파열로 혈액이 밖으로 나가는 것은 출혈이다.","⑤ 화학검사로만 확인되는 미량 출혈은 잠혈이다."],"k":"충혈 = 능동적 동맥혈 증가(선홍색)","img":[],"s":"병리학","src":"M17-이4","ty":"역변환","n":19},{"q":"생검 조직에서 유상피세포로 된 육아종이 관찰되었으나, 육아종 중심부에 건락괴사가 없었다. 이러한 비건락성 육아종을 특징으로 하는 특이성 염증은?","o":["유육종증","간경변증","매독","결핵","봉와직염"],"a":0,"e":"유육종증은 건락괴사가 없는 비건락성 육아종이 특징인 특이성 염증이다. 건락괴사의 유무가 결핵과 유육종증을 구별한다.","w":["② 간경변증은 섬유화와 재생결절로 특이성 염증이 아니다.","③ 매독은 3기에 고무종을 만든다.","④ 결핵은 건락괴사를 동반한 육아종을 만든다.","⑤ 봉와직염은 미만성 화농성 염증이다."],"k":"유육종증 = 비건락성 육아종, 결핵 = 건락성 육아종","img":[],"s":"병리학","src":"P-3-21","ty":"역변환","n":20},{"q":"대장 종양 선별을 위해 대변 검체에서 혈색소의 과산화효소 유사 활성이나 면역화학 반응으로 검출하는, 육안으로는 보이지 않는 미량 출혈을 무엇이라 하는가?","o":["충혈","울혈","각혈","토혈","잠혈"],"a":4,"e":"잠혈은 미량이라 육안 색 변화로 알 수 없고 혈색소의 과산화효소 유사 활성이나 면역화학 반응 검사로만 검출된다. 대변 잠혈검사는 대장 종양 선별에 쓰인다.","w":["① 충혈은 동맥혈이 능동적으로 늘어난 것이다.","② 울혈은 정맥혈이 정체된 것으로 출혈이 아니다.","③ 각혈은 기도나 폐의 피를 기침과 함께 뱉는 것이다.","④ 토혈은 상부 위장관 출혈을 입으로 토하는 것이다."],"k":"잠혈 = 화학·면역화학 검사로만 확인되는 미량 출혈","img":[],"s":"병리학","src":"P-4-11","ty":"역변환","n":21}],"practice":[{"q":"사진의 만성 육아종성 염증에서 건락괴사 옆에 모인 다핵 세포는?","o":["형질세포","심부전세포","랑한스 거대세포","거품세포","먼지세포"],"a":2,"e":"사진은 건락괴사 옆에 랑한스 거대세포와 유상피세포, 림프구가 모인 결핵성 육아종이다.","w":["① 형질세포는 핵이 치우친 단핵세포로 다핵 세포가 아니다.","② 심부전세포는 폐울혈 때 혈철소를 탐식한 대식세포다.","④ 거품세포는 지질을 탐식한 대식세포로 죽상경화반에 있다.","⑤ 먼지세포는 탄분을 탐식한 대식세포다."],"k":"결핵 육아종의 다핵 세포 = 랑한스 거대세포","img":["mock1_m0335.jpg"],"s":"병리학","src":"M11-실2","ty":"역변환","n":1},{"q":"사진은 만성염증의 특수형인 육아종성 염증의 현미경 소견이다. 사진과 같은 염증을 보이는 대표 질환은?","o":["봉와직염","결핵","디프테리아","급성 충수돌기염","알레르기 비염"],"a":1,"e":"유상피세포와 거대세포가 결절을 이루고 림프구가 둘러싸는 육아종성 염증은 만성염증의 특수형이며 결핵이 대표적이다.","w":["① 봉와직염은 호중구가 조직 사이로 퍼지는 화농성 염증이다.","③ 디프테리아는 위막성 염증을 일으킨다.","④ 급성 충수돌기염은 충혈과 섬유소화농성 삼출물을 보이는 급성염증이다.","⑤ 알레르기 비염은 호산구가 증가하는 과민반응 염증이다."],"k":"유상피세포 결절 + 림프구 = 육아종성 염증(결핵)","img":["mock1_m0143.jpg"],"s":"병리학","src":"M5-실1","ty":"변형","n":2},{"q":"사진은 핵형 분석 결과이다. 상염색체와 성염색체의 수를 각각 세어 판정할 때 이 핵형의 이상 유형은?","o":["상염색체 삼염색체증","성염색체 수 이상","21번 삼염색체","X 추가된 남성 핵형","5번 단완 결실"],"a":1,"e":"사진은 상염색체가 정상이고 성염색체가 X 하나뿐인 45,X 핵형으로, 성염색체 수 이상인 터너증후군이다.","w":["① 사진은 상염색체가 정상이다.","③ 21번 염색체가 3개인 것은 다운증후군이다.","④ X가 하나 더 있는 47,XXY는 클라인펠터증후군이다.","⑤ 5번 단완 결실은 고양이울음증후군이다."],"k":"45,X = 터너증후군(성염색체 수 이상)","img":["mock1_m0459.jpg"],"s":"병리학","src":"M15-실2","ty":"변형","n":3},{"q":"이 환자의 병리조직검사에서 핵이 말굽 모양으로 배열한 다핵거대세포가 관찰되었다. 이 세포는?","o":["형질세포","랑한스거대세포","섬유모세포","술잔세포","비만세포"],"a":1,"e":"결핵성 장염에서는 유상피세포와 랑한스거대세포로 된 육아종이 보이며, 랑한스거대세포는 핵이 말굽 모양으로 배열한 다핵거대세포이다.","w":["① 형질세포는 육아종 주위의 만성염증 세포로 다핵거대세포가 아니다.","③ 섬유모세포는 결핵 결절 바깥을 감싸는 세포이다.","④ 술잔세포는 점액을 분비하는 세포이다.","⑤ 비만세포는 히스타민을 분비하는 세포이다."],"k":"말굽 모양 핵 배열 다핵거대세포 = 랑한스거대세포(결핵)","img":["path_prac_pat_032.jpg"],"s":"병리학","src":"P-실1-32","ty":"변형","look":"대장 내강 점막에 불규칙한 궤양과 흰 삼출물, 결절성 융기가 있고 점막이 붉게 부어 있다. 결핵성 장염의 궤양성 병변이다.","n":4},{"q":"사진 아래쪽에 보이는 무구조의 호산성 괴사가 특징적으로 나타나는 질환은?","o":["뇌경색","신장경색","심근경색","급성 췌장염","결핵"],"a":4,"e":"사진 위쪽은 랑한스 거대세포가 있는 육아종, 아래쪽은 무구조의 호산성 괴사로 결핵의 건락괴사이다.","w":["① 뇌경색은 조직이 녹는 액화괴사를 보인다.","② 신장경색은 응고괴사를 보인다.","③ 심근경색은 세포 윤곽이 남는 응고괴사를 보인다.","④ 급성 췌장염은 지방괴사를 보인다."],"k":"랑한스 거대세포 + 무구조 호산성 괴사 = 결핵(건락괴사)","img":["mock2_m0079.jpg"],"s":"병리학","src":"M27-실2","ty":"역변환","n":5},{"q":"사진에서 붉은 항산성균 주위의 푸른 배경을 만든 대조염색 시약은?","o":["헤마톡실린","에오신","산알코올","메틸렌블루","카볼푸크신"],"a":3,"e":"지일-닐센 염색에서 결핵균은 미콜산이 많은 세포벽 때문에 산알코올로 탈색되지 않고 카볼푸크신의 붉은색을 유지하며, 배경은 메틸렌블루로 대조염색되어 푸르게 보인다.","w":["① 헤마톡실린은 H&E 염색의 핵 염료이다.","② 에오신은 H&E 염색의 세포질 염료이다.","③ 산알코올은 염색이 아니라 탈색에 쓰인다.","⑤ 카볼푸크신은 항산성균을 붉게 염색하는 1차 염료이다."],"k":"지일-닐센: 카볼푸크신(붉음) → 산알코올 탈색 → 메틸렌블루 대조염색","img":["path_prac_pat_016.jpg"],"s":"병리학","src":"P-실1-16","ty":"변형","look":"메틸렌블루로 대조염색된 푸른 배경에서 육아종 부위 세포들 안에 붉은 자주색으로 염색된 물질이 모여 있다. 탈색 후에도 카볼푸크신의 붉은색을 유지한 항산성 양성 소견이다.","n":6},{"q":"사진은 톨루이딘 블루 염색에서 보라색 과립을 가진 세포이다. 이 세포가 급성염증 때 분비하는 히스타민의 작용은?","o":["항체 생산","기생충 손상","혈관 확장·투과성 증가","점액 분비","혈관 수축·투과성 감소"],"a":2,"e":"톨루이딘 블루에서 이염성 과립을 보이는 비만세포는 급성염증에서 히스타민을 분비해 혈관 확장과 혈관 투과성 증가를 일으킨다.","w":["① 항체 생산은 형질세포의 기능이다.","② 주요염기성단백으로 기생충을 손상시키는 것은 호산구이다.","④ 점액 분비는 술잔세포의 기능이다.","⑤ 히스타민은 혈관을 확장하고 투과성을 높인다."],"k":"비만세포 → 히스타민 → 혈관 확장, 투과성 증가","img":["mock1_m0257.jpg"],"s":"병리학","src":"M9-실1","ty":"변형","n":7},{"q":"사진처럼 허혈로 손상된 뇌 조직에서 나타나는 괴사 형태는?","o":["건락괴사","응고괴사","액화괴사","괴저괴사","지방괴사"],"a":2,"e":"혈관공급이 중단되어 뇌 조직이 연화된 소견이다. 뇌는 허혈인데도 응고괴사가 아니라 조직이 녹는 액화괴사를 보인다.","w":["① 건락괴사는 결핵에서 보인다.","② 응고괴사는 심장과 콩팥 같은 고형 장기 경색에서 보인다.","④ 괴저괴사는 세균 감염을 동반한 괴사이다.","⑤ 지방괴사는 급성 췌장염에서 보인다."],"k":"뇌 허혈 = 액화괴사","img":["mock2_m0147.jpg"],"s":"병리학","src":"M20-실2","ty":"변형","n":8},{"q":"사진은 핵형 분석 결과이다. 수가 달라진 염색체를 확인할 때 이 핵형을 보이는 질환이 주로 생기는 기전은?","o":["13번 염색체 추가","X 염색체 1개 소실","감수분열 비분리","5번 단완 결실","18번 염색체 추가"],"a":2,"e":"사진은 21번 삼염색체증 핵형으로 다운증후군이다. 다운증후군은 대부분 감수분열 비분리로 생기며 산모 나이가 많을수록 위험하다.","w":["① 13번 염색체 추가는 파타우증후군이다.","② X 염색체 하나의 소실은 터너증후군이다.","④ 5번 단완 결실은 고양이울음증후군의 기전이다.","⑤ 18번 염색체 추가는 에드워즈증후군이다."],"k":"다운증후군 = 대부분 감수분열 비분리(산모 나이)","img":["mock2_m0305.jpg"],"s":"병리학","src":"M25-실2","ty":"변형","n":9}]},{"no":"P2","theory":[{"n":1,"s":"병리학","q":"","o":[],"img":[]},{"n":2,"s":"병리학","q":"","o":[],"img":[]},{ ,"img":[]},{"n":14,"s":"병리학","q":"","o":[],"img":[]},{"n":15,"s":"병리학","q":"","o":[],"img":[]},{"n":16,"s":"병리학","q":"","o":[],"img":[]},{"n":17,"s":"병리학","q":"","o":[],"img":[]},{"n":18,"s":"병리학","q":"","o":[],"img":[]},{"n":19,"s":"병리학","q":"","o":[],"img":[]},{"n":20,"s":"병리학","q":"","o":[],"img":[]},{"n":21,"s":"병리학","q":"","o":[],"img":[]}],"practice":[{"n":1,"s":"병리학","q":"","o":[],"img":["mock1_m0175.jpg"]},{"n":2,"s":"병리학","q":"","o":[],"img":["mock1_m0427.jpg"]},{"n":3,"s":"병리학","q":"","o":[],"img":["path_pathfig_실2_22.jpg"]},{"n":4,"s":"병리학","q":"","o":[],"img":["mock1_m0079.jpg"]},{"n":5,"s":"병리학","q":"","o":[],"img":[]},{"n":6,"s":"병리학","q":"","o":[],"img":["mock2_m0303.jpg"]},{"n":7,"s":"병리학","q":"","o":[],"img":["mock1_m0397.jpg"]},{"n":8,"s":"병리학","q":"","o":[],"img":["path_prac_pat_012.jpg"]},{"n":9,"s":"병리학","q":"","o":[],"img":["mock2_m0043.jpg"]}]}],"H":[{"no":"H1","theory":[{"q":"위 절제 표본을 H&E로 염색하여 위벽을 관강 쪽부터 바깥쪽까지 관찰하였다. 위벽을 이루는 층에 해당하지 않는 것은?","o":["장막","점막하층","근육층","점막","겉질"],"a":4,"e":"위벽은 안쪽부터 점막, 점막하층, 근육층, 장막으로 이루어진다. 겉질과 속질의 구분은 콩팥과 부신 같은 장기에 쓰는 말이다.","w":["① 장막은 위벽의 가장 바깥층이다.","② 점막하층은 점막 바깥에 있는 결합조직층이다.","③ 근육층은 속빗, 중간돌림, 바깥세로의 3층이다.","④ 점막은 관강에 닿는 위벽의 가장 안쪽 층이다."],"k":"위벽 = 점막, 점막하층, 근육층, 장막. 겉질·속질은 콩팥, 부신.","img":[],"s":"조직학","src":"M23-이6","ty":"부정전환","n":1},{"q":"H&E 표본에서 여러 층의 세포 중 표층 세포가 크고 둥근 돔 모양이며, 장기가 늘어난 정도에 따라 세포 모양과 층수가 달라지는 이행상피가 관찰되었다. 이 상피로 덮인 장기는?","o":["기관","방광","폐포","위","갑상샘 여포"],"a":1,"e":"이행상피는 방광처럼 팽창과 수축을 반복하는 요로에만 있으며, 장기가 늘어나고 줄어듦에 따라 세포 모양과 층수가 달라진다.","w":["① 기관은 거짓중층섬모원주상피로 덮인다.","③ 폐포는 단층편평상피로 덮인다.","④ 위는 단층원주상피로 덮인다.","⑤ 갑상샘 여포는 단층입방상피로 둘러싸인다."],"k":"이행상피 = 요로(방광).","img":[],"s":"조직학","src":"H-9-04","ty":"역변환","n":2},{"q":"단핵포식계(세망내피계) 세포가 많이 분포하는 장기끼리 묶인 것은?","o":["비장, 췌장","림프절, 갑상샘","골수, 콩팥","비장, 림프절, 골수","편도, 침샘"],"a":3,"e":"단핵포식계(세망내피계) 세포는 비장, 림프절, 골수, 편도 같은 림프·조혈 장기와 간(쿠퍼세포)에 많다.","w":["① 비장은 많지만 췌장은 샘 장기로 단핵포식계 세포가 많지 않다.","② 림프절은 많지만 갑상샘은 내분비샘으로 많지 않다.","③ 골수는 많지만 콩팥은 단핵포식계 세포가 많은 장기가 아니다.","⑤ 편도는 많지만 침샘은 외분비샘으로 많지 않다."],"k":"세망내피계 풍부 = 비장, 림프절, 골수, 편도.","img":[],"s":"조직학","src":"M2-이5","ty":"부정전환","n":3},{"q":"여러 장기의 점막을 H&E로 염색하여 표면 상피를 확인하였다. 장기와 표면 상피의 연결로 옳지 않은 것은?","o":["기관지 : 거짓중층섬모원주상피","방광 : 이행상피","식도 : 비각화 중층편평상피","큰창자 : 단층원주상피","작은창자 : 중층원주상피"],"a":4,"e":"작은창자는 미세융모가 있는 단층원주상피로 덮인다.","w":["① 기관지는 거짓중층섬모원주상피로 덮인다.","② 방광은 이행상피로 덮인다.","③ 식도는 비각화 중층편평상피로 덮인다.","④ 큰창자는 단층원주상피로 덮인다."],"k":"작은창자 = 단층원주상피(미세융모).","img":[],"s":"조직학","src":"H-8-08","ty":"부정전환","n":4},{"q":"사이원반은 근육세포끼리 맞닿는 곳에서 진한 계단 모양 선으로 보이는 연접 구조다. H&E 표본에서 사이원반이 관찰되는 근육의 특징끼리 묶인 것은?","o":["가로무늬 있음, 가장자리 다핵","가로무늬 있음, 중앙 핵","가로무늬 없음, 중앙 핵","가로무늬 없음, 맘대로근","가로무늬 있음, 맘대로근"],"a":1,"e":"사이원반은 심장근에만 있다. 심장근은 가로무늬가 있고 핵이 중앙에 한두 개 있는 제대로근이다.","w":["① 가장자리에 핵이 여러 개 있는 것은 뼈대근이다.","③ 가로무늬가 없는 것은 민무늬근으로 사이원반이 없다.","④ 가로무늬가 없는 민무늬근은 제대로근이며 사이원반이 없다.","⑤ 가로무늬가 있는 맘대로근은 뼈대근이며 심장근은 제대로근이다."],"k":"사이원반 = 심장근(가로무늬 + 중앙 핵 + 제대로근).","img":[],"s":"조직학","src":"M8-이5","ty":"부정전환","n":5},{"q":"말이집(myelin)은 축삭을 감싸는 막으로, 신경계 부위에 따라 이를 만드는 아교세포가 다르다. 아교세포와 그 세포가 말이집을 만드는 부위의 연결로 옳지 않은 것은? (만들지 않으면 '없음')","o":["별아교세포 : 중추","희소돌기아교세포 : 중추","위성세포 : 없음","미세아교세포 : 없음","신경집세포 : 말초"],"a":0,"e":"말이집은 말초신경계에서 신경집세포(슈반세포), 중추신경계에서 희소돌기아교세포가 만든다. 별아교세포는 지지와 혈액뇌장벽에 관여하며 말이집을 만들지 않는다.","w":["② 중추신경계 말이집은 희소돌기아교세포가 만든다.","③ 위성세포는 말초 신경절 세포체를 둘러싸며 말이집을 만들지 않는다.","④ 미세아교세포는 탐식 작용을 하며 말이집을 만들지 않는다.","⑤ 말초신경계 말이집은 신경집세포(슈반세포)가 만든다."],"k":"말초 말이집 = 슈반세포. 중추 말이집 = 희소돌기아교세포. 별아교세포는 없음.","img":[],"s":"조직학","src":"H-5-07","ty":"부정전환","n":6},{"q":"결합조직은 세포, 섬유, 바탕질로 이루어지며 세포 사이 공간이 넓다. 결합조직에 속하는 세포가 아닌 것은?","o":["비만세포","연골세포","이행상피세포","섬유모세포","지방세포"],"a":2,"e":"이행상피세포는 요로를 덮는 상피세포다. 섬유모세포, 지방세포, 비만세포는 결합조직 세포이고, 연골은 특수 결합조직이다.","w":["① 비만세포는 결합조직의 세포 성분이다.","② 연골세포는 특수 결합조직인 연골의 세포다.","④ 섬유모세포는 결합조직에 가장 많은 고유 세포다.","⑤ 지방세포는 결합조직의 세포 성분이다."],"k":"결합조직 세포 = 섬유모, 지방, 비만세포 등.","img":[],"s":"조직학","src":"H-3-10","ty":"부정전환","n":7},{"q":"소장 점막 H&E 표본에서 호산성 과립을 가진 파네트세포(Paneth cell)를 찾으려 한다. 파네트세포가 있는 위치와 분비 물질의 연결로 옳은 것은?","o":["결합조직 : 히스타민","위 바닥샘 : 펩시노겐","위 바닥샘 : 염산","소장 장샘 바닥 : 라이소자임","큰창자 점막 : 디펜신"],"a":3,"e":"파네트세포는 소장 장샘 바닥에 있으며 호산성 과립에 라이소자임과 디펜신을 담아 장내 세균을 조절한다. 큰창자에는 파네트세포가 없다.","w":["① 결합조직에서 히스타민을 저장하는 세포는 비만세포다.","② 위 바닥샘에서 펩시노겐을 분비하는 세포는 으뜸세포다.","③ 위 바닥샘에서 염산을 분비하는 세포는 벽세포다.","⑤ 큰창자에는 파네트세포가 없다."],"k":"파네트세포 = 소장 장샘 바닥, 호산성 과립, 라이소자임.","img":[],"s":"조직학","src":"H-7-20","ty":"부정전환","n":8},{"q":"부검에서 적출한 장기의 육안 표본이다. 피막과 주위 지방에 싸여 있고, 오목한 문으로 요관, 동맥, 정맥이 드나들며, 절단면에서 겉질, 피라미드 모양 속질, 깔때기가 구분된다. 이 장기는?","o":["갑상샘","심장","콩팥","자궁","허파"],"a":2,"e":"오목한 문으로 요관이 나오고 절단면에서 겉질, 피라미드 모양 속질, 콩팥깔때기가 구분되는 장기는 콩팥이다.","w":["① 갑상샘은 좌우엽이 협부로 이어진 나비 모양이다.","② 심장은 대혈관이 이어진 원뿔 모양 근육성 장기다.","④ 자궁은 두꺼운 근육층 안쪽에 속막이 있다.","⑤ 허파는 해면 모양 실질에 기관지가 들어간다."],"k":"문에서 요관 + 겉질·속질·깔때기 = 콩팥.","img":[],"s":"조직학","src":"H-9-05","ty":"역변환","n":9},{"q":"세포의 높이와 너비가 비슷하고 둥근 핵이 중앙에 있는 세포가 한 층으로 늘어선 상피가 있다. 이 상피로 덮이는 구조는?","o":["폐포","갑상샘 여포","식도","방광","기관지"],"a":1,"e":"갑상샘 여포와 콩팥 세뇨관은 분비와 흡수를 하는 단층입방상피로 덮인다.","w":["① 폐포는 단층편평상피로 덮인다.","③ 식도는 비각화 중층편평상피로 덮인다.","④ 방광은 이행상피로 덮인다.","⑤ 기관지는 거짓중층섬모원주상피로 덮인다."],"k":"단층입방 = 갑상샘 여포, 콩팥세관.","img":[],"s":"조직학","src":"M17-이6","ty":"역변환","n":10},{"q":"부신을 절단하면 바깥쪽 겉질과 안쪽 속질이 구분되며, 겉질은 다시 세 층으로 나뉜다. 부신 겉질을 바깥쪽부터 이루는 3층은?","o":["점막, 점막하층, 근육층","경막, 지주막, 연막","토리층, 다발층, 그물층","피막, 백색속질, 적색속질","바닥층, 가시층, 과립층"],"a":2,"e":"부신은 겉질과 속질로 구성된 내분비기관이며, 겉질은 토리층, 다발층, 그물층의 3층이고 속질은 카테콜아민을 분비한다.","w":["① 점막, 점막하층, 근육층은 위장관 벽의 층이다.","② 경막, 지주막, 연막은 뇌척수막이다.","④ 백색속질과 적색속질은 비장의 구조다.","⑤ 바닥층, 가시층, 과립층은 표피의 층이다."],"k":"부신 겉질 = 토리층, 다발층, 그물층.","img":[],"s":"조직학","src":"H-10-01","ty":"변형","n":11},{"q":"갑상샘 H&E 표본에서 크기가 다양한 둥근 여포가 모여 있으며, 여포상피의 높이는 기능 상태에 따라 달라진다. 갑상샘 여포를 이루는 구조나 성분이 아닌 것은?","o":["콜로이드","여포상피세포","거짓중층섬모원주상피","티로글로불린","단층입방상피"],"a":2,"e":"정상 갑상샘 여포는 단층입방상피로 둘러싸이고 내부는 티로글로불린을 포함한 콜로이드로 차 있다. 거짓중층섬모원주상피는 기관과 기관지의 호흡상피다.","w":["① 여포 내부는 콜로이드로 차 있다.","② 여포는 여포상피세포가 둘러싸며 그 높이는 기능 상태에 따라 변한다.","④ 콜로이드에는 티로글로불린이 들어 있다.","⑤ 갑상샘 여포는 단층입방상피로 둘러싸인다."],"k":"갑상샘 여포 = 단층입방상피 + 콜로이드(티로글로불린).","img":[],"s":"조직학","src":"H-10-04","ty":"부정전환","n":12},{"q":"간 H&E 표본에서 육각형 간소엽을 관찰하였다. 간소엽의 구조에 대한 설명으로 옳은 것을 모두 고른 것은?\n가. 중심에 중심정맥이 있다\n나. 간세포판 사이로 동모양혈관이 뻗는다\n다. 모서리의 문맥역에 소엽간 담관이 있다\n라. 중심정맥은 간삼조에 포함된다","o":["가, 나, 다","나, 라","가, 다","라","가, 나, 다, 라"],"a":0,"e":"간소엽은 중심정맥을 중심으로 간세포판과 동모양혈관이 방사상으로 배열하고, 모서리 문맥역에 간문맥 가지, 간동맥 가지, 소엽간 담관(간삼조)이 있다. 중심정맥은 간삼조가 아니다.","w":["② 라는 틀린 설명이고 가, 다가 빠졌다.","③ 나(동모양혈관)도 옳은 설명이므로 빠지면 안 된다.","④ 라는 틀린 설명이다. 중심정맥은 소엽 중심에 있어 간삼조에 포함되지 않는다.","⑤ 라가 포함되어 틀리다."],"k":"간삼조 = 문맥, 간동맥, 담관. 중심정맥은 소엽 중심.","img":[],"s":"조직학","src":"H-7-07","ty":"변형","n":13},{"q":"히스타민과 헤파린을 담은 과립을 가진 결합조직 세포는?","o":["파네트세포","섬유모세포","형질세포","비만세포","멜라닌세포"],"a":3,"e":"비만세포 과립에는 혈관 확장과 투과성 증가를 일으키는 히스타민과 항응고 작용의 헤파린이 있다.","w":["① 파네트세포는 라이소자임과 디펜신을 분비한다.","② 섬유모세포는 교원섬유와 바탕질을 합성한다.","③ 형질세포는 항체(면역글로불린)를 생산한다.","⑤ 멜라닌세포는 표피 바닥층에서 멜라닌을 만든다."],"k":"비만세포 = 히스타민, 헤파린.","img":[],"s":"조직학","src":"H-3-04","ty":"역변환","n":14},{"q":"몸을 이루는 기본조직은 상피, 결합, 근육, 신경조직의 4가지다. 지방세포가 모여 이루어진 지방조직이 속하는 기본조직은?","o":["상피조직","결합조직","림프조직","근육조직","신경조직"],"a":1,"e":"4대 기본조직은 상피, 결합, 근육, 신경조직이며, 지방조직은 결합조직의 한 유형이다.","w":["① 상피조직은 세포가 빽빽하고 세포외 기질이 거의 없다.","③ 림프조직은 기본조직 분류가 아니다.","④ 근육조직은 수축하는 조직이다.","⑤ 신경조직은 흥분을 전도하는 조직이다."],"k":"지방조직 = 결합조직의 유형.","img":[],"s":"조직학","src":"H-1-06","ty":"역변환","n":15},{"q":"결합조직은 세포, 섬유, 바탕질로 이루어지며 고유 결합조직과 특수 결합조직으로 나뉜다. 결합조직끼리 바르게 묶은 것은?","o":["표피, 식도 상피, 지방조직","신경조직, 연골, 혈액","연골, 뼈대근, 지방조직","힘줄, 연골, 뼈","표피, 힘줄, 뼈"],"a":3,"e":"힘줄, 연골, 뼈, 지방조직, 혈액은 모두 결합조직이다. 표피와 식도 상피는 중층편평상피로 상피조직이다.","w":["① 표피와 식도 상피는 상피조직이다.","② 신경조직은 별개의 기본조직이다.","③ 뼈대근은 근육조직이다.","⑤ 표피는 상피조직이다."],"k":"결합조직 = 힘줄, 연골, 뼈, 지방, 혈액.","img":[],"s":"조직학","src":"H-3-14","ty":"부정전환","n":16},{"q":"음식물이 지나가는 통로인 식도의 점막을 H&E로 염색하여 표면 상피를 관찰하였다. 식도 점막을 덮는 상피는?","o":["거짓중층섬모원주상피","단층원주상피","비각화 중층편평상피","이행상피","단층입방상피"],"a":2,"e":"마찰이 심한 통로인 식도는 여러 층으로 보호하는 비각화 중층편평상피로 덮여 있다.","w":["① 거짓중층섬모원주상피는 기관지를 덮는다.","② 단층원주상피는 위와 소장을 덮는다.","④ 이행상피는 방광을 덮는다.","⑤ 단층입방상피는 갑상샘 여포와 콩팥세관을 덮는다."],"k":"식도 = 비각화 중층편평상피.","img":[],"s":"조직학","src":"M16-이5","ty":"역변환","n":17},{"q":"세포질에는 일정한 구조와 기능을 가진 세포소기관과, 세포가 만든 산물을 담은 알갱이가 함께 있다. 세포소기관끼리만 묶은 것은?","o":["사립체, 리보솜, 중심체","중심체, 리보솜, 분비과립","골지체, 글리코겐 과립, 사립체","리보솜, 지방방울, 골지체","사립체, 중심체, 멜라닌 과립"],"a":0,"e":"사립체, 리보솜, 골지체, 중심체는 세포소기관이다. 분비과립, 글리코겐 과립, 지방방울, 멜라닌 과립은 세포가 만들거나 저장한 산물(세포질 함유물)로 세포소기관이 아니다.","w":["② 분비과립은 분비물을 담은 알갱이로 세포소기관이 아니다.","③ 글리코겐 과립은 저장 산물로 세포소기관이 아니다.","④ 지방방울은 저장 산물로 세포소기관이 아니다.","⑤ 멜라닌 과립은 색소 산물로 세포소기관이 아니다."],"k":"세포소기관 = 사립체, 리보솜, 골지체, 중심체. 과립·방울은 함유물.","img":[],"s":"조직학","src":"M18-이6","ty":"부정전환","n":18},{"q":"대동맥 벽, 탄력연골, 폐, 진피에 풍부하며 Verhoeff 염색으로 증명하는 섬유는?","o":["근섬유","탄력섬유","신경섬유","세망섬유","교원섬유"],"a":1,"e":"탄력섬유는 탄력동맥 중막, 폐, 탄력연골, 진피에 많으며, 탄력판이 층층이 있는 대동맥이 Verhoeff 염색의 양성 대조 조직으로 쓰인다.","w":["① 근섬유는 근육조직의 세포다.","③ 신경섬유는 신경조직의 성분이다.","④ 세망섬유는 은 염색에 흑색으로 염색되며 림프절, 간, 비장의 지지망을 이룬다.","⑤ 교원섬유는 힘줄과 인대에 가장 많다."],"k":"탄력섬유 = 대동맥, Verhoeff.","img":[],"s":"조직학","src":"H-3-02","ty":"역변환","n":19},{"q":"납작한 세포 한 층으로 되어 확산과 여과 같은 물질 교환에 적합한 상피가 덮는 곳은?","o":["식도","위","토리주머니 벽쪽층","방광","콩팥세관"],"a":2,"e":"단층편평상피는 폐포, 혈관과 림프관 내피, 토리주머니 벽쪽층을 덮으며 얇아서 확산과 여과에 적합하다.","w":["① 식도는 중층편평상피로 덮인다.","② 위는 단층원주상피로 덮인다.","④ 방광은 이행상피로 덮인다.","⑤ 콩팥세관은 단층입방상피로 덮인다."],"k":"단층편평 = 폐포, 내피, 토리주머니 벽쪽층.","img":[],"s":"조직학","src":"H-2-12","ty":"역변환","n":20},{"q":"세포의 가장 바깥에서 필요한 물질은 받아들이고 노폐물은 내보내는 등 세포 안팎의 물질 출입을 선택적으로 조절하는 구조는?","o":["세포막","핵공","용해소체","사립체","활면소포체"],"a":0,"e":"세포막은 선택적 투과막으로 세포 안팎의 물질 투과와 배출을 조절한다.","w":["② 핵공은 핵과 세포질 사이의 물질 이동 통로다.","③ 용해소체는 세포 내 소화를 한다.","④ 사립체는 ATP를 합성한다.","⑤ 활면소포체는 스테로이드 호르몬을 합성한다."],"k":"물질 투과와 배출 = 세포막.","img":[],"s":"조직학","src":"M27-이6","ty":"역변환","n":21}],"practice":[{"q":"근조직의 H&E 염색 표본이다. 사진 근육세포의 모양과 핵의 위치를 볼 때 관찰되는 소견은?","o":["방추형 세포, 중앙 단핵","사이원반","가지 친 근섬유","가장자리 다핵","가로무늬"],"a":0,"e":"가로무늬와 사이원반이 없고 방추형 세포 중앙에 길쭉한 핵이 하나 있으면 평활근육이다.","w":["② 사이원반은 심장근육의 특징이다.","③ 가지를 치는 근섬유는 심장근육의 소견이다.","④ 핵이 가장자리에 여러 개 있는 것은 뼈대근육이다.","⑤ 가로무늬는 뼈대근육과 심장근육에 있다."],"k":"가로무늬 없음 + 방추형 + 중앙 핵 = 평활근육.","img":["hist_prac_histo_033.jpg"],"s":"조직학","src":"H-실1-21","ty":"변형","look":"가로무늬가 없는 방추형 근세포가 나란히 배열되고, 길쭉한 시가 모양의 핵이 세포 중앙에 하나씩 있다.","n":1},{"q":"육안 사진이다. 이 장기를 현미경으로 볼 때 기본 구조는?","o":["토리와 세관","백색속질과 적색속질","랑게르한스섬","가슴샘소체","콜로이드가 찬 여포"],"a":4,"e":"좌우 두 엽이 좁은 협부로 이어진 나비 모양 장기는 갑상샘이며, 단층입방상피로 덮인 여포 안에 콜로이드가 차 있다.","w":["① 토리와 세관은 콩팥의 구조다.","② 백색속질과 적색속질은 지라의 구조다.","③ 랑게르한스섬은 이자의 내분비 부분이다.","④ 가슴샘소체는 가슴샘의 특징이다."],"k":"나비 모양 + 협부 = 갑상샘 = 콜로이드 여포.","img":["mock1_m0403.jpg"],"s":"조직학","src":"M15-실3","ty":"변형","n":2},{"q":"H&E 염색 사진이다. 사진 가운데 있는 관 구조와 그 벽을 관찰할 때 이 구조의 소견으로 옳은 것은?","o":["단층원주상피, 얇은 민무늬근","C자 모양 유리연골","백색속질, 적색속질","토리, 보먼주머니","콜로이드가 찬 여포"],"a":0,"e":"사진 가운데 관은 세기관지로, 연골 없이 단층원주상피와 얇은 민무늬근으로 둘러싸이고 주위를 얇은 벽의 폐포가 둘러싼다.","w":["② C자 유리연골이 벽을 지지하는 것은 기관이다.","③ 백색속질과 적색속질은 지라의 구조다.","④ 토리와 보먼주머니는 콩팥소체다.","⑤ 콜로이드가 찬 여포는 갑상샘이다."],"k":"세기관지 = 연골 없음 + 단층원주상피 + 얇은 민무늬근.","img":["hist_prac_qa_histo_007.jpg"],"s":"조직학","src":"H-실1-36","ty":"변형","look":"가운데 연골 없이 단층원주상피와 얇은 민무늬근으로 둘러싸인 세기관지(bronchiole)가 있고, 주위를 얇은 벽의 폐포(alveolus)가 그물처럼 둘러싼다. 옆에 동반 혈관이 보인다.","n":3},{"q":"근육의 가로단면 H&E 표본이다. 근육섬유의 굵기와 단면 모양, 핵의 수와 위치를 보고 판정할 때 이 근육의 종류는?","o":["심장근","혈관평활근","민무늬근","뼈대근","내장근"],"a":3,"e":"사진처럼 굵은 다각형 섬유의 가장자리에 핵이 여러 개 있으면 골격근(뼈대근)이다.","w":["① 심장근은 핵이 중앙에 있고 사이원반이 있다.","② 혈관평활근은 민무늬근으로 핵이 중앙에 있다.","③ 민무늬근은 핵이 중앙에 있고 가로무늬가 없다.","⑤ 내장근은 민무늬근으로 핵이 중앙에 있다."],"k":"굵은 다각형 섬유 + 가장자리 다핵 = 뼈대근.","img":["mock1_m0081.jpg"],"s":"조직학","src":"M3-실3","ty":"역변환","n":4},{"q":"H&E 염색 사진이다. 상피 아래에서 두꺼운 판을 이루는 연골의 종류는?","o":["뼈","섬유연골","탄력연골","치밀결합조직","유리연골"],"a":4,"e":"호흡상피 아래를 연골막에 싸인 두꺼운 유리연골판이 지지하며, 이는 기관과 기관지의 소견이다.","w":["① 뼈는 연골이 아니라 특수결합조직인 뼈조직이다.","② 섬유연골은 굵은 아교섬유 다발 사이에 연골세포가 한 줄로 늘어서며 연골막이 없다.","③ 탄력연골은 탄력섬유가 많으며 귓바퀴, 후두덮개에 있다.","④ 치밀결합조직은 연골세포와 연골방이 없다."],"k":"호흡상피 + 유리연골판 = 기관지(기관).","img":["hist_prac_qa_histo_016.jpg"],"s":"조직학","src":"H-실1-44","ty":"변형","look":"위쪽에 거짓중층섬모원주상피와 점막고유층이 있고, 그 아래에 연골세포가 연골방 안에 흩어진 두꺼운 유리연골판이 연골막에 싸여 있다.","n":5},{"q":"근육조직의 가로단면 H&E 염색표본이다. 근육섬유의 굵기와 핵의 위치로 근육 종류를 판정할 때, 이 근육의 특징으로 옳지 않은 것은?","o":["가로무늬","수의적 조절","다핵 근육섬유","사이원반 연결","가장자리 핵"],"a":3,"e":"단면이 굵고 핵이 주변부에 있는 다핵 근육섬유는 뼈대근육이다. 사이원반은 심장근에만 있는 연접이다.","w":["① 뼈대근육은 가로무늬가 있다.","② 뼈대근육은 수의적으로 조절된다.","③ 뼈대근육은 다핵 근육섬유로 이루어진다.","⑤ 뼈대근육은 핵이 섬유 가장자리에 있다."],"k":"뼈대근육 = 다핵, 가장자리 핵, 가로무늬, 수의. 사이원반은 심장근.","img":["hist_prac_histo_007.jpg"],"s":"조직학","src":"H-실1-03","ty":"부정전환","look":"굵은 다각형 근육섬유 단면이 근육다발을 이루고, 핵이 섬유 가장자리(근육섬유막 바로 아래)에 납작하게 놓인다.","n":6},{"q":"H&E 염색 사진이다. 사진 근육의 섬유 모양과 핵의 위치로 근육 종류를 판정할 때, 이 근육이 손상된 뒤의 재생 방식은?","o":["화생","유사분열로 쉬운 재생","안정세포의 분열","위성세포의 제한적 재생","불안정세포의 지속 분열"],"a":3,"e":"굵은 다각형 섬유에 가장자리 다핵을 가진 사진의 근육은 뼈대근육이며, 손상되면 위성세포에 의해 제한적으로만 재생된다.","w":["① 화생은 한 성숙세포가 다른 성숙세포로 대치되는 적응 현상이다.","② 유사분열로 쉽게 재생하는 것은 민무늬근이다.","③ 자극 시 분열하는 안정세포는 간세포, 섬유모세포다.","⑤ 평생 분열하는 불안정세포는 표피 기저세포, 원주상피세포다."],"k":"뼈대근 재생 = 위성세포, 제한적.","img":["hist_prac_qa_histo_043.jpg"],"s":"조직학","src":"H-실1-58","ty":"변형","look":"굵고 크기가 비슷한 다각형 근육섬유 가로단면이 빽빽하며, 각 섬유의 핵이 세포막 바로 아래 가장자리에 여러 개 붙어 있다.","n":7},{"q":"간 문맥부위의 H&E 염색표본이다. 화살표가 가리키는 관을 덮는 상피는?","o":["거짓중층섬모원주상피","중층편평상피","단층입방상피","이행상피","단층편평상피(내피)"],"a":2,"e":"화살표는 문맥역의 소엽사이담관으로, 입방상피세포로 둘러싸인 작은 관이다. 문맥역에는 간문맥 가지, 간동맥 가지, 담관이 함께 있다.","w":["① 거짓중층섬모원주상피는 기관과 기관지를 덮는다.","② 중층편평상피는 식도와 피부를 덮는다.","④ 이행상피는 방광과 요관을 덮는다.","⑤ 내피로 덮인 것은 혈관과 림프관이다."],"k":"문맥역의 입방상피 관 = 담관.","img":["hist_prac_histo_022.jpg"],"s":"조직학","src":"H-실1-12","ty":"변형","look":"문맥역의 넓고 벽이 얇은 혈관 옆 결합조직 속에서, 입방상피세포로 둘러싸인 작은 관을 화살표가 가리킨다.","n":8},{"q":"육안 사진이다. 이 장기의 절단면에서 구분되는 구조로 옳은 것은?","o":["점막, 근층, 장막","폐포와 기관지","겉질, 속질, 콩팥깔때기","백색속질, 적색속질","좌우엽과 협부"],"a":2,"e":"사진은 콩팥으로, 절단면에서 겉질, 속질, 콩팥깔때기가 구분되고 문에서 요관이 이어진다.","w":["① 점막, 근층, 장막은 위장관 벽의 층이다.","② 폐포와 기관지는 허파의 구조다.","④ 백색속질과 적색속질은 지라의 구조다.","⑤ 좌우엽과 협부는 갑상샘의 구조다."],"k":"겉질 + 속질 + 깔때기 + 요관 = 콩팥.","img":["mock1_m0399.jpg"],"s":"조직학","src":"M13-실3","ty":"변형","n":9}]},{"no":"H2","theory":[{"n":1,"s":"조직학","q":"","o":[],"img":[]},{"n":2,"s":"조직학","q":"","o":[],"img":[]},{"n":3,"s":"조직학","q":"","o":[],"img":[]},{"n":4,"s":"조직학","q":"","o":[],"img":[]},{"n":5,"s":"조직 []},{"n":11,"s":"조직학","q":"","o":[],"img":[]},{"n":12,"s":"조직학","q":"","o":[],"img":[]},{"n":13,"s":"조직학","q":"","o":[],"img":[]},{"n":14,"s":"조직학","q":"","o":[],"img":[]},{"n":15,"s":"조직학","q":"","o":[],"img":[]},{"n":16,"s":"조직학","q":"","o":[],"img":[]},{"n":17,"s":"조직학","q":"","o":[],"img":[]},{"n":18,"s":"조직학","q":"","o":[],"img":[]},{"n":19,"s":"조직학","q":"","o":[],"img":[]},{"n":20,"s":"조직학","q":"","o":[],"img":[]},{"n":21,"s":"조직학","q":"","o":[],"img":[]}],"practice":[{"n":1,"s":"조직학","q":"","o":[],"img":["hist_prac_histo_045.jpg"]},{"n":2,"s":"조직학","q":"","o":[],"img":["mock2_m0047.jpg"]},{"n":3,"s":"조직학","q":"","o":[],"img":["hist_prac_histo_026.jpg"]},{"n":4,"s":"조직학","q":"","o":[],"img":["hist_gichul_2022_05.jpg"]},{"n":5,"s":"조직학","q":"","o":[],"img":["hist_prac_histo_042.jpg"]},{"n":6,"s":"조직학","q":"","o":[],"img":["hist_prac_qa_histo_035.jpg"]},{"n":7,"s":"조직학","q":"","o":[],"img":["mock1_m0271.jpg"]},{"n":8,"s":"조직학","q":"","o":[],"img":["mock2_m0453.jpg"]},{"n":9,"s":"조직학","q":"","o":[],"img":["mock2_m0083.jpg"]}]}],"C":[{"no":"C1","theory":[{"q":"베데스다 체계로 자궁경부 도말을 판독할 때 고등급 편평상피내병변(HSIL)에는 중등도 이형성증부터 상피내암종까지 포함된다. HSIL 세포에서 관찰되는 소견은?","o":["미성숙 세포질, 높은 N/C비","3차원 집단, 로제트 배열","배경의 종양소인","매끈한 핵막","성숙 세포질의 핵 비대"],"a":0,"e":"HSIL 세포는 세포질이 적은 미성숙 세포로 N/C비가 높고 핵이 과염색되며 핵막이 불규칙하다. 중등도, 고도 이형성증과 상피내암종이 포함되며 종양소인은 없다.","w":["② 3차원 집단과 로제트 배열은 샘암종 소견이다.","③ 종양소인은 침윤성 편평세포암종의 배경 소견이며 HSIL에는 없다.","④ HSIL 세포는 핵막이 불규칙하다.","⑤ 성숙한 세포질에 핵만 커지는 것은 LSIL 소견이다."],"k":"HSIL = 미성숙 세포 + 높은 N/C비 + 불규칙한 핵막.","img":[],"s":"진단세포학","src":"C-8-28","ty":"역변환","n":1},{"q":"조직 구조와 침윤 여부를 관찰하여 최종 확정 진단을 내리는 검사는?","o":["액상세포검사","질 도말 성숙지수 검사","파라핀 블록 조직검사","자궁경부 세포도말검사","세포원심침전 도말검사"],"a":2,"e":"파라핀 블록 조직검사는 조직 구조와 침윤 여부를 볼 수 있어 최종 확정 진단을 내린다. 세포검사는 신속하고 반복 채취가 쉬우며 환자 부담이 적다.","w":["① 액상세포검사는 세포를 단층으로 도말하는 세포검사다.","② 성숙지수 검사는 호르몬 평가에 쓰는 세포검사다.","④ 자궁경부 세포도말검사는 신속하고 반복 채취가 쉬운 세포검사다.","⑤ 세포원심침전 도말검사는 세포가 적은 액체 검체의 세포검사다."],"k":"최종 확정 진단 = 조직검사.","img":[],"s":"진단세포학","src":"C-3-08","ty":"역변환","n":2},{"q":"Papanicolaou 염색의 EA 용액에 들어 있는 염료를 모두 고른 것은?\n가. light green\n나. eosin Y\n다. Bismarck brown\n라. hematoxylin","o":["가, 나, 다","가, 다","나, 라","라","가, 나, 다, 라"],"a":0,"e":"EA 용액은 light green, eosin Y, Bismarck brown으로 구성된 세포질 염색액이다. hematoxylin은 핵 염색액이다.","w":["② eosin Y(나)도 EA 성분이다.","③ hematoxylin(라)은 핵 염색액이며 light green(가)이 빠져 있다.","④ hematoxylin(라)은 EA 성분이 아니다.","⑤ hematoxylin(라)은 핵 염색액이므로 제외한다."],"k":"EA = light green + eosin Y + Bismarck brown.","img":[],"s":"진단세포학","src":"M18-이23","ty":"변형","n":3},{"q":"Pap 염색한 질도말표본에서 성숙 편평세포의 핵 주위에 넓은 공동이 있고 이핵을 보이는 세포가 출현하였다. 이 세포 변화를 일으키는 감염원은?","o":["HPV","Actinomyces","Chlamydia","Leptothrix","CMV"],"a":0,"e":"핵주위 공동과 이핵을 보이는 세포는 공동세포(koilocyte)로, 인유두종바이러스(HPV) 감염의 대표적 세포학적 특징이다.","w":["② 방선균은 방사상 털뭉치 모양 집락을 만든다.","③ 클라미디아는 화생세포 세포질 안의 봉입체로 나타난다.","④ 렙토트릭스는 가늘고 긴 실 모양 세균으로 트리코모나스와 함께 나온다.","⑤ CMV는 올빼미 눈 모양 핵내 봉입체를 가진 거대세포를 만든다."],"k":"핵주위 공동 + 이핵 = 공동세포 = HPV.","img":[],"s":"진단세포학","src":"M17-이24","ty":"변형","n":4},{"q":"자궁경부 도말에서 이형세포를 양성과 악성으로 감별할 때 세포 증식, 염색질, 핵막, 핵소체, N/C비를 비교한다. 악성종양세포의 특징이 아닌 것은?","o":["세포 증식 증가","염색질 과염색","고른 염색질, 매끈한 핵막","큰 핵소체","N/C비 증가"],"a":2,"e":"고른 염색질과 매끈한 핵막은 성숙 편평상피화생 같은 양성 세포의 핵 소견이다. 세포 증식 증가, 큰 핵소체, 진한 염색질, 큰 N/C비는 악성종양세포의 특징이다.","w":["① 세포 증식 증가는 악성종양세포의 특징이다.","② 염색질이 진하게 염색되는 것은 악성종양세포의 특징이다.","④ 큰 핵소체는 악성종양세포의 특징이다.","⑤ N/C비 증가는 악성종양세포의 특징이다."],"k":"고른 염색질 + 매끈한 핵막 = 양성 소견.","img":[],"s":"진단세포학","src":"M13-이28","ty":"부정전환","n":5},{"q":"Pap 염색한 질도말에서 에스트로겐 영향이 클 때 우세해지는 표층(표재)세포를 관찰한다. 표층세포의 소견으로 옳지 않은 것은?","o":["소포성 핵, 청록색 세포질","넓고 얇은 다각형 세포질","가장 성숙한 편평세포","작고 농축된 핵","오렌지·분홍색 세포질"],"a":0,"e":"소포성 핵과 청록색(호염기성) 세포질은 중간세포의 특징이다. 표층세포는 핵이 농축되고 세포질이 넓은 호산성 다각형이다.","w":["② 표층세포의 세포질은 넓고 얇은 다각형이다.","③ 표층세포는 가장 성숙한 편평세포다.","④ 표층세포의 핵은 작고 농축되어 있다.","⑤ 표층세포의 세포질은 OG6와 에오신에 오렌지 또는 분홍색으로 염색된다."],"k":"소포성 핵 + 청록색 세포질 = 중간세포.","img":[],"s":"진단세포학","src":"C-2-01","ty":"부정전환","n":6},{"q":"부인과 세포도말에서는 감염, 호르몬 상태, 손상과 재생에 따라 특징적인 세포가 출현한다. 세포와 관련 상태의 연결로 옳지 않은 것은?","o":["수복세포 : 손상 후 재생","공동세포 : 임신","예비세포 : 화생 전 단계","주상세포 : 임신","다핵 거대조직구 : 방사선 조사"],"a":1,"e":"공동세포는 HPV 감염의 특징 세포다. 임신기에 보이는 것은 글리코겐이 쌓인 중간세포인 주상세포다.","w":["① 수복세포는 조직 손상 후 재생 과정에서 나타난다.","③ 예비세포는 화생의 전 단계 세포다.","④ 주상세포는 임신기에 보이는 글리코겐이 쌓인 중간세포다.","⑤ 다핵 거대조직구는 폐경기나 방사선 조사 후에 보인다."],"k":"공동세포 = HPV, 주상세포 = 임신.","img":[],"s":"진단세포학","src":"C-8-15","ty":"부정전환","n":7},{"q":"베데스다 체계에서 부인과 검체에 원주세포 또는 화생세포가 포함되었는지 확인하는 목적은?","o":["염증 정도 판정","변형대 채취 여부 확인","HPV 감염 확인","호르몬 상태 평가","자궁내막 병변 확인"],"a":1,"e":"원주세포 또는 화생세포는 변형대에서 유래하므로, 이 세포가 있어야 변형대가 채취된 적합한 검체로 판정한다.","w":["① 염증 정도는 호중구 등 염증세포로 판단한다.","③ HPV 감염은 공동세포로 확인한다.","④ 호르몬 상태는 성숙지수로 평가한다.","⑤ 자궁내막 병변은 45세 이상 여성의 자궁내막세포 출현으로 의심한다."],"k":"원주세포·화생세포 = 변형대 채취 확인 = 검체 적합성.","img":[],"s":"진단세포학","src":"M21-이29","ty":"역변환","n":8},{"q":"Pap 염색에서 EA 성분인 라이트 그린(light green)이 청록색으로 염색하는 부위는?","o":["세포의 핵","산성 점액","과각화 무핵세포","비각화 중간세포의 세포질","성숙 표층세포의 세포질"],"a":3,"e":"라이트 그린은 중간세포, 기저곁세포 같은 비각화 세포의 호염기성 세포질을 청록색으로 염색한다.","w":["① 핵은 헤마톡실린으로 염색한다.","② 산성 점액은 알시안 블루로 염색한다.","③ 과각화 무핵세포는 OG-6에 오렌지색으로 염색된다.","⑤ 성숙 표층세포 세포질은 에오신 Y에 분홍색으로 염색된다."],"k":"라이트 그린 = 비각화 세포질 청록색.","img":[],"s":"진단세포학","src":"C-2-11","ty":"역변환","n":9},{"q":"갑상샘 결절처럼 만져지는 병소에서 세포를 얻기 위해 세침천자흡인검사를 시행한다. 이 검사에서 세포를 얻는 방법은?","o":["침전물 파라핀 포매","절단면 날인","가는 바늘로 음압 흡인","솔·주걱으로 찰과","자연 탈락 세포 수집"],"a":2,"e":"세침천자흡인검사는 22~23 G의 가는 바늘로 조직·기관의 병소를 직접 찔러 음압으로 세포를 채취한다.","w":["① 침전물을 파라핀에 포매하는 것은 세포군집절편법이다.","② 절단면을 눌러 찍는 것은 날인도말법이다.","④ 솔이나 주걱으로 긁는 것은 찰과도말법이다.","⑤ 자연 탈락 세포를 모으는 것은 탈락세포검사다."],"k":"세침천자흡인 = 22~23 G 바늘로 병소 직접 흡인.","img":[],"s":"진단세포학","src":"M24-이29","ty":"역변환","n":10},{"q":"자궁경부 질도말에서 단순포진 바이러스(HSV) 감염을 다른 질 감염과 구별하려 한다. HSV 감염을 시사하는 소견은?","o":["거짓균사와 포자","서양배 모양 충체","표면을 덮은 구간균","젖빛유리 핵, 다핵","핵주위 공동, 이핵"],"a":3,"e":"HSV 감염 세포는 핵이 젖빛유리 양상으로 혼탁해지고 핵막이 두꺼워지며 다핵 거대세포와 봉입체를 보인다.","w":["① 거짓균사와 포자는 칸디다 소견이다.","② 서양배 모양 충체는 트리코모나스다.","③ 구간균이 표면을 덮는 실마리세포는 가드네렐라 소견이다.","⑤ 핵주위 공동과 이핵은 HPV 감염의 공동세포 소견이다."],"k":"HSV = 젖빛유리 핵 + 다핵 거대세포.","img":[],"s":"진단세포학","src":"M13-이30","ty":"부정전환","n":11},{"q":"자궁경부 도말에서 각화가 뚜렷하지 않은 큰 암세포가 출현하여 비각화성 대세포 편평세포암종이 의심된다. 이 암종의 세포학적 소견으로 옳지 않은 것은?","o":["세포의 대소부동","감자 모양의 핵","뚜렷한 핵소체","올챙이 모양 세포","배경의 종양 소인"],"a":3,"e":"비각화성 대세포 편평세포암종은 감자 모양의 핵, 뚜렷한 핵소체, 세포의 대소부동을 보이며 배경에 종양소인이 관찰된다. 오렌지색 세포질의 올챙이 모양 세포는 각화성 편평세포암종 소견이다.","w":["① 세포의 대소부동이 보인다.","② 감자 모양의 핵은 비각화성 대세포형의 특징이다.","③ 뚜렷한 핵소체가 보인다.","⑤ 배경에 종양 소인이 관찰된다."],"k":"비각화성 대세포 = 감자 모양 핵 + 핵소체 + 종양 소인.","img":[],"s":"진단세포학","src":"M22-이28","ty":"부정전환","n":12},{"q":"마지막 월경 시작일(LMP)이 12월 20일인 28일 주기 여성에서 분비기에 해당하는 검체 채취일은?","o":["1월 2일","1월 10일","12월 22일","12월 28일","12월 31일"],"a":1,"e":"12월 20일을 1일째로 세면 1월 10일은 22일째로 분비기(15~28일)다. 연도가 바뀌어도 날짜를 이어서 센다.","w":["① 1월 2일은 14일째로 배란기다.","③ 12월 22일은 3일째로 월경기다.","④ 12월 28일은 9일째로 증식기다.","⑤ 12월 31일은 12일째로 증식기다."],"k":"15~28일째 = 분비기.","img":[],"s":"진단세포학","src":"C-4-13","ty":"역변환","n":13},{"q":"가려움증과 통증을 호소하는 여성의 질도말에서 진균 감염에 의한 질염이 의심된다. 이 도말에서 보이는 소견은?","o":["서양배 모양 충체","거짓균사와 포자","화생세포 내 봉입체","표면을 덮은 구간균","핵주위 공동"],"a":1,"e":"가려움증과 통증을 동반하는 칸디다 질염은 진균 감염으로, 도말에 거짓균사와 포자가 보인다.","w":["① 서양배 모양 충체는 원충인 트리코모나스다.","③ 화생세포 세포질 안의 봉입체는 클라미디아 소견이다.","④ 구간균이 덮은 실마리세포는 세균인 가드네렐라 소견이다.","⑤ 핵주위 공동을 가진 공동세포는 바이러스인 HPV 감염 소견이다."],"k":"진균(칸디다) = 거짓균사 + 포자.","img":[],"s":"진단세포학","src":"C-6-06","ty":"역변환","n":14},{"q":"에스트로겐이 최고조인 배란기의 질 도말 성숙지수(MI)로 가장 알맞은 것은?","o":["0 : 100 : 0","0 : 5 : 95","50 : 50 : 0","80 : 20 : 0","100 : 0 : 0"],"a":1,"e":"성숙지수는 기저곁세포 : 중간세포 : 표층세포 순이며, 0 : 5 : 95처럼 표층세포가 대부분인 우방편재가 배란기 소견이다.","w":["① 0 : 100 : 0은 중간세포만 있는 도말이다.","③, ④ 기저곁세포가 많은 좌방편재는 폐경기나 수유기 소견이다.","⑤ 100 : 0 : 0은 기저곁세포만 있는 위축 도말이다."],"k":"배란기 = 표층세포 우세(0 : 5 : 95).","img":[],"s":"진단세포학","src":"M28-이29","ty":"역변환","n":15},{"q":"질도말 배경에 호중구가 많고 렙토트릭스가 함께 보여 질트리코모나스(Trichomonas vaginalis) 감염이 의심된다. 이 감염을 뒷받침하는 소견은?","o":["실마리세포","호중구 포탄볼","거짓균사와 발아포자","털뭉치 모양 집락","핵주위 공동과 이핵"],"a":1,"e":"트리코모나스 감염 도말에서는 호중구가 뭉친 포탄볼, 편평세포의 핵주위 투명대, 서양배 모양 충체, 렙토트릭스 동반이 보인다.","w":["① 실마리세포는 가드네렐라에 의한 세균성 질증 소견이다.","③ 거짓균사와 발아포자는 칸디다증 소견이다.","④ 털뭉치 모양 집락은 방선균 소견이다.","⑤ 핵주위 공동과 이핵은 HPV 감염의 공동세포 소견이다."],"k":"트리코모나스 = 포탄볼 + 핵주위 투명대 + 렙토트릭스.","img":[],"s":"진단세포학","src":"C-6-07","ty":"부정전환","n":16},{"q":"자궁경부에서 채취한 세포를 보존액이 든 용기에 담아 장비로 처리하는 액상세포도말법을 시행한다. 이 방법으로 만든 도말의 특징은?","o":["절단면 날인 도말","파라핀 박절 절편","점액 제거된 단층 도말","긁은 세포의 직접 도말","좁은 원형 부위 농축"],"a":2,"e":"액상세포도말법은 보존액으로 점액 등 판독 방해 물질을 제거하고 세포를 분산시켜 겹치지 않게 단층으로 도말한다.","w":["① 절단면을 눌러 찍는 것은 날인도말법이다.","② 침전물을 파라핀에 포매해 박절하는 것은 세포군집절편법이다.","④ 긁어낸 세포를 바로 펴 바르는 것은 찰과도말법이다.","⑤ 원심력으로 작은 원형 부위에 모으는 것은 세포원심침전법이다."],"k":"액상세포도말법 = 보존액 분산 + 단층 도말.","img":[],"s":"진단세포학","src":"M12-이25","ty":"역변환","n":17},{"q":"베데스다 체계에서 45세 이상 여성의 자궁경부 도말에 양성으로 보이는 자궁내막세포가 출현하면 반드시 보고한다. 그 이유는?","o":["에스트로겐 결핍 평가","HPV 감염 시사","변형대 채취 확인","염증성 배경 시사","자궁내막 병변 가능성"],"a":4,"e":"45세 이상 여성에서 양성으로 보이는 자궁내막세포가 출현하면 자궁내막 병변 가능성이 있어 반드시 보고한다.","w":["① 에스트로겐 결핍은 기저곁세포 우세로 평가한다.","② HPV 감염은 공동세포로 시사된다.","③ 변형대 채취 여부는 원주세포 또는 화생세포로 판단한다.","④ 염증성 배경은 호중구 증가로 나타난다."],"k":"45세 이상 + 자궁내막세포 = 자궁내막 병변 가능성으로 보고.","img":[],"s":"진단세포학","src":"C-8-21","ty":"역변환","n":18},{"q":"28일 주기 여성에서 배란 후 프로게스테론 영향을 받는 분비기에 자궁-질 도말을 채취하였다. 이 도말의 소견은?","o":["깨끗한 배경의 낱개 표층세포","혈액과 자궁내막세포","판상의 무핵 각화세포","주상세포 군집과 나핵","기저곁세포 우세"],"a":3,"e":"분비기에는 프로게스테론 영향으로 중간세포와 주상세포가 군집하고, 되더라인 간균이 늘어 세포융해가 일어나 나핵이 보인다.","w":["① 깨끗한 배경의 낱개 표층세포는 배란기 소견이다.","② 혈액과 자궁내막세포는 월경기 소견이다.","③ 무핵 각화세포는 과각화 소견이다.","⑤ 기저곁세포 우세 위축 도말은 폐경기 소견이다."],"k":"분비기 = 주상세포 + 중간세포 군집 + 나핵 + 되더라인 간균.","img":[],"s":"진단세포학","src":"M20-이23","ty":"역변환","n":19}],"practice":[{"q":"자궁-질 도말표본이다. 28일 주기 여성에서 마지막 월경일부터 14일째 채취한 이 도말의 우세한 세포와 성숙지수(MI)의 연결로 옳은 것은?","o":["중간세포 : 0 : 95 : 5","표층세포 : 0 : 0 : 100","기저곁세포 : 100 : 0 : 0","표층세포 : 100 : 0 : 0","중간세포 : 0 : 70 : 30"],"a":1,"e":"깨끗한 배경에 호산성 표층세포만 낱개로 흩어진 배란기 도말로, 성숙지수는 기저곁 : 중간 : 표층 순이므로 0 : 0 : 100이다.","w":["① 중간세포 우세 0 : 95 : 5는 분비기처럼 프로게스테론 영향을 받은 도말이다.","③ 기저곁세포 100%는 폐경기 같은 위축 도말이다.","④ 100 : 0 : 0은 기저곁세포 100%를 뜻하므로 표층세포 우세와 맞지 않는다.","⑤ 사진에는 중간세포 군집 없이 표층세포만 보인다."],"k":"배란기 = 표층세포 우세, MI 0 : 0 : 100.","img":["mock1_m0167.jpg"],"s":"진단세포학","src":"M5-실14","ty":"변형","n":1},{"q":"사진은 자궁경부 질도말 검체를 마르기 전에 고정액에 바로 담그는 습윤고정 장면이다. 고정하기 전에 도말을 공기 건조시키면 세포에 나타나는 인공산물은?","o":["핵 위 흑청색 결정","갈색 굴절성 침착물","오렌지색 과염색","핵 팽대와 흐림","슬라이드 부착 증가"],"a":3,"e":"습윤고정은 공기 건조로 핵이 부풀고 흐려지는 인공산물을 막아 세포와 핵의 형태를 보존하기 위해 도말 직후 95% 에탄올에 담그는 것이다.","w":["① 흑청색 결정은 헤마톡실린 침전물을 여과하지 않았을 때 생긴다.","② 갈색 굴절성 침착물(cornflaking)은 자일렌 투명 후 봉입 전에 건조되었을 때 생긴다.","③ 오렌지색 과염색은 OG-6 과염색 때 나타난다.","⑤ 세포 부착은 부착제나 코팅 슬라이드의 역할이다."],"k":"고정 전 공기건조 = 핵 팽대, 흐림.","img":["cyto_prac_qa_cyto_022.jpg"],"s":"진단세포학","src":"C-실1-22","ty":"변형","look":"도말한 슬라이드를 고정액이 담긴 염색통에 마르기 전에 바로 담그는 습윤고정 장면이다.","n":2},{"q":"부인과 세포 도말 표본이다. 이 소견은 베데스다 체계에서 어디에 해당하는가?","o":["LSIL","음성(상피내 병변 없음)","샘암종","편평세포암종","HSIL"],"a":4,"e":"미성숙 화생형 세포질에 N/C비가 높은 이형 핵을 가진 세포는 고도 형성이상 소견이며, 베데스다 체계의 HSIL에 해당한다.","w":["① LSIL은 경도 형성이상으로 성숙한 세포질을 유지한 채 핵만 커진다.","② 화생세포라면 핵이 둥글고 염색질이 고르며 핵막이 매끈해 음성으로 판정한다.","③ 샘암종은 핵이 겹친 3차원 집단과 로제트 배열을 보인다.","④ 편평세포암종은 각화된 기이한 이형 세포와 종양 소인을 보인다."],"k":"화생형 세포질 + 높은 N/C비 이형 핵 = 고도 형성이상 = HSIL.","img":["cyto_prac_cyto_057.jpg"],"s":"진단세포학","src":"C-실4-03","ty":"변형","look":"분홍색 성숙 편평세포 옆에 청록색 세포질을 가진 화생형 세포들이 판상으로 모여 있으며, 핵이 커지고 진하며 핵막이 불규칙해 핵 대 세포질 비(N/C비)가 높다.","n":3},{"q":"45세 여성의 질도말표본으로, HSV 감염세포가 관찰된다. 사진의 세포에서 HSV 감염을 뒷받침하는 소견은?","o":["화생세포 내 봉입체","올빼미눈 핵내 봉입체","간유리 핵, 염색질 변연화","넓은 핵주위 공동","거짓균사와 발아포자"],"a":2,"e":"사진은 여러 핵이 서로 눌린 다핵 거대세포로, 핵은 균질한 간유리 모양이고 염색질이 핵막 쪽으로 밀려 핵막이 두껍게 보인다.","w":["① 화생세포 세포질 안의 봉입체는 Chlamydia 소견이다.","② 올빼미눈 모양 핵내 봉입체는 CMV 소견이다.","④ 핵주위 공동은 HPV 공동세포 소견이다.","⑤ 거짓균사와 발아포자는 Candida 소견이다."],"k":"HSV = 간유리 핵 + 염색질 변연화 + 다핵 성형.","img":["cyto_prac_qa_cyto_038.jpg"],"s":"진단세포학","src":"C-실3-34","ty":"역변환","look":"여러 개의 핵이 서로 눌려 맞물린 다핵 거대세포가 보이며, 핵은 균질한 간유리 모양이고 염색질이 핵막 쪽으로 밀려 핵막이 두껍게 보인다.","n":4},{"q":"30세 여성의 자궁경부 도말 표본이다. 사진에서 주를 이루는 세포의 세포질을 Pap 염색에서 분홍색으로 염색하는 성분은?","o":["톨루이딘 블루","라이트 그린","알시안 블루","헤마톡실린","에오신 Y"],"a":4,"e":"사진의 주된 세포는 농축핵과 호산성 다각형 세포질을 가진 표층세포이며, 성숙 표층세포 세포질은 에오신 Y에 분홍색으로 염색된다.","w":["① 톨루이딘 블루는 이염성 염료다.","② 라이트 그린은 중간세포 같은 비각화 세포의 세포질을 청록색으로 염색한다.","③ 알시안 블루는 산성 점액 염료다.","④ 헤마톡실린은 핵을 염색한다."],"k":"표층세포 분홍색 세포질 = 에오신 Y.","img":["cyto_prac_cyto_039.jpg"],"s":"진단세포학","src":"C-실2-14","ty":"변형","look":"대부분 크고 얇은 다각형 세포이며 호산성 세포질(사진에서는 분홍 보라색)에 작고 진한 점 모양 농축핵을 가진다. 청록색 중간세포는 일부만 섞여 있다.","n":5},{"q":"사진의 기구를 사용하는 검사로 세포를 채취하기에 가장 알맞은 부위는?","o":["소변","갑상샘 결절","뇌척수액","자궁경부","객담"],"a":1,"e":"주사기를 권총형 흡인 손잡이에 끼운 세침흡인 기구로, 갑상샘 결절은 세침흡인으로 세포를 채취하는 대표 부위다.","w":["① 소변은 자연 탈락한 세포를 모으는 탈락세포검사 검체다.","③ 뇌척수액은 세포가 적어 세포원심침전법으로 도말한다.","④ 자궁경부는 솔이나 주걱으로 긁는 찰과 도말로 검사한다.","⑤ 객담은 직접 도말하거나 Saccomanno 법으로 처리한다."],"k":"세침흡인 기구 = 갑상샘 결절.","img":["mock1_m0069.jpg"],"s":"진단세포학","src":"M2-실14","ty":"변형","n":6},{"q":"HPV에 감염된 여성의 질도말표본이다. 사진의 세포를 만든 바이러스가 일으키는 병변은?","o":["노인성 질염","칸디다증","방선균 감염","콘딜로마","세균성 질증"],"a":3,"e":"사진은 경계가 뚜렷한 핵주위 공동, 핵 비대, 이핵을 보이는 공동세포로, HPV 감염 병변인 콘딜로마의 특징 세포다.","w":["① 노인성 질염은 기저곁세포 우세와 청색 얼룩이 특징이다.","② 칸디다증은 거짓균사와 포자가 특징이다.","③ 방선균 감염은 털뭉치 모양 집락이 특징이다.","⑤ 세균성 질증은 가드네렐라의 실마리세포가 특징이다."],"k":"공동세포 = HPV = 콘딜로마.","img":["mock2_m0447.jpg"],"s":"진단세포학","src":"M29-실16","ty":"변형","n":7},{"q":"부인과 세포도말표본이다. 사진 가운데에서 핵 부스러기를 탐식한 큰 세포의 이름은?","o":["수복세포","실마리세포","공동세포","가염체 대식세포","랑한스 거대세포"],"a":3,"e":"크기와 성숙도가 다른 림프구 사이에 핵 부스러기를 탐식한 큰 가염체 대식세포(tingible body macrophage)가 있어 여포성경관염 소견이다.","w":["① 수복세포는 판상으로 배열하는 재생 상피세포다.","② 실마리세포는 구간균이 표면을 덮은 편평세포다.","③ 공동세포는 HPV 감염에서 핵주위 공동을 보이는 편평세포다.","⑤ 랑한스 거대세포는 결핵 육아종에서 보인다."],"k":"림프구 + 가염체 대식세포(tingible body macrophage) = 여포성경관염.","img":["cyto_prac_cyto_023.jpg"],"s":"진단세포학","src":"C-실3-05","ty":"변형","look":"크기와 성숙도가 다른 림프구가 빽빽하고, 가운데에 핵 부스러기를 탐식한 큰 대식세포(tingible body macrophage)가 있다.","n":8},{"q":"부인과 세포도말표본이다. 사진에 보이는 탐식성 세포인 조직구의 핵과 세포질 특징은?","o":["편재핵, 바퀴살 염색질","소포성 핵, 청록색 세포질","농축핵, 호산성 세포질","콩팥 모양 핵, 거품 세포질","작은 핵, 극소량 세포질"],"a":3,"e":"조직구는 거품 모양 세포질과 콩팥 모양 핵을 가진 탐식성 세포다.","w":["① 핵이 편재하고 바퀴살 염색질을 보이는 것은 형질세포다.","② 소포성 핵과 청록색 세포질은 중간세포다.","③ 농축핵과 호산성 세포질은 표층세포다.","⑤ 작고 세포질이 거의 없는 것은 림프구다."],"k":"조직구 = 거품 모양 세포질 + 콩팥 모양 핵.","img":["mock2_m0291.jpg"],"s":"진단세포학","src":"M24-실12","ty":"역변환","n":9},{"q":"사진의 sample cassette를 이용하는 세포군집절편법에서 표본을 만드는 방법은?","o":["침전물 파라핀 블록","보존액 분산 단층 도말","솔로 변형대 찰과","깔때기 원심 농축","세침 병소 흡인"],"a":0,"e":"세포군집절편법은 조직 카세트에 세포 침전물을 넣어 고정, 파라핀 포매한 뒤 박절하여 검사한다.","w":["② 보존액에 분산해 단층 도말하는 것은 액상세포검사다.","③ 솔로 변형대를 긁는 것은 변형대 채취법이다.","④ 깔때기와 슬라이드로 원심 농축하는 것은 세포원심침전법이다.","⑤ 바늘로 병소를 흡인하는 것은 세침천자흡인이다."],"k":"세포군집절편 = 침전물 파라핀 블록.","img":["mock1_m0031.jpg"],"s":"진단세포학","src":"M1-실12","ty":"역변환","n":10},{"q":"생검 후 채취한 부인과 세포도말에서 사진과 같이 조직 손상 후 재생 과정에서 나타나는 조직수복세포가 관찰되었다. 이 세포의 소견으로 옳지 않은 것은?","o":["판 안의 호중구","뚜렷한 핵소체","판상(sheet) 배열","한 방향 흐름 배열","무핵세포 집단"],"a":4,"e":"조직수복세포는 결합성 판으로 한 방향으로 흐르듯 배열하고 핵소체가 뚜렷하며 판 안에 호중구가 섞인다. 무핵세포 집단은 과각화 소견이다.","w":["① 조직수복세포의 판 안과 배경에 호중구가 섞여 있다.","② 조직수복세포는 핵소체가 뚜렷하다.","③ 조직수복세포는 결합성 판으로 도말된다.","④ 조직수복세포는 한 방향으로 흐르듯 배열한다."],"k":"수복세포 = 판상 + 흐르는 배열 + 뚜렷한 핵소체.","img":["mock1_m0355.jpg"],"s":"진단세포학","src":"M11-실13","ty":"부정전환","n":11}]},{"no":"C2","theory":[{"n":1,"s":"진단세포학","q":"","o":[],"img":[]},{"n":2,"s":"진단세포학","q":"","o":[],"img":[]},{"n":3,"s":"진단세포학","q":"","o":[],"img":[]},{"n":4,"s":"진단세포학","q":"","o":[],"img":[]},{"n":5,"s":"진단세포학","q":"","o":[],"img":[]},{"n":6,"s":"진단세포학","q":"","o":[],"img":[]},{"n":7,"s":"진단세포학","q":"","o":[],"img":[]},{"n":8,"s":"진단세포학","q":"","o":[],"img":[]},{"n":9,"s":"진단세포학","q":"","o":[],"img":[]},{"n":10,"s":"진단세포학","q":"","o":[],"img":[]},{"n":11,"s":"진단세포학","q":"","o":[],"img":[]},{"n":12,"s":"진단세포학","q":"","o":[],"img":[]},{"n":13,"s":"진단세포학","q":"","o":[],"img":[]},{"n":14,"s":"진단세포학","q":"","o":[],"img":[]},{"n":15,"s":"진단세포학","q":"","o":[],"img":[]},{"n":16,"s":"진단세포학","q":"","o":[],"img":[]},{"n":17,"s":"진단세포학","q":"","o":[],"img":[]},{"n":18,"s":"진단세포학","q":"","o":[],"img":[]},{"n":19,"s":"진단세포학","q":"","o":[],"img":[]}],"practice":[{"n":1,"s":"진단세포학","q":"","o":[],"img":["cyto_prac_qa_cyto_034.jpg"]},{"n":2,"s":"진단세포학","q":"","o":[],"img":["cyto_prac_qa_cyto_009.jpg"]},{"n":3,"s":"진단세포학","q":"","o":[],"img":["mock1_m0385.jpg"]}
