<!doctype html>
<html lang="ko">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#34388C">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="description" content="임상병리사 국가시험 조직병리 4과목 문제은행 · 모의고사 30회 · 실기 사진 판독 · 쉬는 시간 3분 게임">
<title>조직병리 국시 문제은행</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=Noto+Serif+KR:wght@700;800&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 휴대폰 한 손 사용. 위 짧은 바, 아래 5칸 탭, 문제 화면은 이전·★·다음 하단 고정.
   색: H&E 표본의 헤마톡실린 청자색(주색)과 에오신 분홍(강조). 과목마다 표본 염색에서 따온 점 색을 하나씩 둔다. */
:root{
  --bg:#F3F2F7; --surface:#FFFFFF; --sunk:#ECEAF3; --line:#DDDAE6; --ink:#1B1927; --muted:#5D596F;
  --hema:#34388C; --hema-2:#4B50B0; --hema-soft:#E5E6F7; --eosin:#BD3C65; --eosin-soft:#FBE6EE;
  --ok:#1B7550; --ok-soft:#DEF1E7; --bad:#AE3138; --bad-soft:#FBE3E3; --warn:#8A5300; --warn-soft:#FFF0D5; --gold:#B57F00; --gold-soft:#FFF4D6;
  --s-P:#BD3C65; --s-H:#34388C; --s-T:#1F7A8C; --s-C:#7A4FB0;
  --f-display:"Noto Serif KR","Nanum Myeongjo",serif;
  --f-body:"IBM Plex Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,monospace;
  --shadow:0 1px 2px rgba(27,25,39,.05),0 6px 18px rgba(27,25,39,.06);
  --fs:15px; --tabh:62px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12111A; --surface:#1C1A27; --sunk:#252333; --line:#34314A; --ink:#ECEAF4; --muted:#A9A4BC;
  --hema:#A9ACF4; --hema-2:#C1C3FA; --hema-soft:#282A4A; --eosin:#F08BAA; --eosin-soft:#3A2130;
  --ok:#6DD3A2; --ok-soft:#163429; --bad:#F2878C; --bad-soft:#3A1E23; --warn:#F1C06A; --warn-soft:#342914; --gold:#F2C35A; --gold-soft:#332811;
  --s-P:#F08BAA; --s-H:#A9ACF4; --s-T:#6CC6D6; --s-C:#C3A2F0;
  --shadow:none; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12111A; --surface:#1C1A27; --sunk:#252333; --line:#34314A; --ink:#ECEAF4; --muted:#A9A4BC;
  --hema:#A9ACF4; --hema-2:#C1C3FA; --hema-soft:#282A4A; --eosin:#F08BAA; --eosin-soft:#3A2130;
  --ok:#6DD3A2; --ok-soft:#163429; --bad:#F2878C; --bad-soft:#3A1E23; --warn:#F1C06A; --warn-soft:#342914; --gold:#F2C35A; --gold-soft:#332811;
  --s-P:#F08BAA; --s-H:#A9ACF4; --s-T:#6CC6D6; --s-C:#C3A2F0;
  --shadow:none; color-scheme:dark}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;word-break:keep-all;overflow-wrap:anywhere;-webkit-tap-highlight-color:transparent}
body.fs1{--fs:16.5px} body.fs2{--fs:18px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:20;background:var(--bg)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--eosin);outline-offset:2px}
.wrap{max-width:720px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 calc(var(--tabh) + 92px + env(safe-area-inset-bottom,0px))}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:var(--bg);display:flex;align-items:center;gap:8px;min-height:52px;border-bottom:1px solid var(--line)}
.back{border:0;background:transparent;font-size:26px;line-height:1;padding:4px 12px 6px 0;color:var(--ink)}
.title{flex:1;min-width:0;font-weight:700;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.3}
.title small{display:block;font-weight:500;font-size:12px;color:var(--muted)}
.brand{font-family:var(--f-display);font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px;flex:1}
.brand i{display:inline-flex;gap:3px}.brand i::before,.brand i::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--hema)}.brand i::after{background:var(--eosin)}
.trialpill{font-size:11.5px;font-weight:700;color:var(--eosin);background:var(--eosin-soft);border-radius:999px;padding:3px 9px}
nav.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:4px max(8px,env(safe-area-inset-right,0px)) calc(4px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--muted);min-height:48px}
nav.tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav.tabbar button[aria-current="page"]{color:var(--hema)}
.badge{font-family:var(--f-mono);font-size:10px;background:var(--eosin);color:var(--surface);border-radius:999px;padding:0 5px;margin-left:2px}
h1{font-family:var(--f-display);font-size:22px;line-height:1.35;margin:16px 0 4px;text-wrap:balance}
h2{font-size:15px;margin:24px 0 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
h2 small{font-weight:500;font-size:12.5px;color:var(--muted)}
.lede{color:var(--muted);font-size:13.5px;margin:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:var(--shadow)}












.today{margin-top:10px;display:grid;gap:8px}
.tile{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:13px 14px;min-height:62px}
.tile .ic{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;font-size:18px}
.tile .t{flex:1;min-width:0;font-weight:600;font-size:14.5px;line-height:1.35}
.tile .t small{display:block;font-weight:400;color:var(--muted);font-size:12.5px}
.tile .n{font-family:var(--f-mono);font-size:15px;color:var(--muted)}
.tile .arrow{color:var(--muted);font-size:18px}
.ic.hema{background:var(--hema-soft);color:var(--hema)}.ic.eo{background:var(--eosin-soft);color:var(--eosin)}.ic.gold{background:var(--gold-soft);color:var(--gold)}.ic.ok{background:var(--ok-soft);color:var(--ok)}





.bar{display:block;height:6px;background:var(--sunk);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--sc,var(--ok));border-radius:3px}

.seg{display:flex;gap:4px;background:var(--sunk);border-radius:999px;padding:3px;margin:14px 0 6px;width:max-content;max-width:100%;overflow-x:auto}
.seg button{border:0;background:transparent;color:var(--muted);font-size:13.5px;font-weight:600;padding:6px 14px;border-radius:999px;white-space:nowrap}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.chlist{display:grid;gap:8px;margin-top:8px}
.ch{display:grid;grid-template-columns:40px 1fr auto;gap:12px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;text-align:left;width:100%}
.ch .no{font-family:var(--f-mono);font-size:13px;color:var(--hema);background:var(--hema-soft);border-radius:10px;text-align:center;padding:7px 0}
.ch.master .no{background:var(--gold-soft);color:var(--gold)}
.ch.locked{opacity:.62}
.ch .t{font-weight:600;font-size:14.5px;min-width:0;display:flex;flex-direction:column;gap:4px}
.ch .sub{font-size:12px;color:var(--muted);font-weight:400}
.ch .n{font-variant-numeric:tabular-nums;font-size:12.5px;color:var(--muted);text-align:right;white-space:nowrap}
.stars{color:var(--eosin);letter-spacing:1px}
.search{display:flex;gap:8px;margin-top:12px}
.search input{flex:1;min-width:0;font:inherit;font-size:15px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.core{background:var(--hema-soft);border-radius:10px;padding:10px 14px;font-weight:600}
.point{font-size:13.5px;color:var(--muted);border-top:1px dashed var(--line);margin-top:14px;padding-top:10px}
.tblwrap{overflow-x:auto;margin-top:6px}
table.t{border-collapse:collapse;width:100%;font-size:13.5px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
table.t th{color:var(--muted);font-weight:500;font-size:12px}
table.t td:first-child{font-weight:600;width:36%}
.sec.trap table.t td:first-child{color:var(--eosin)}
h3{font-size:14px;margin:14px 0 0;color:var(--hema)}
details.sum{margin-top:14px}
details.sum summary{list-style:none;display:flex;justify-content:space-between;align-items:center;font-weight:700;padding:13px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.sum summary::-webkit-details-marker{display:none}
details.sum summary::after{content:"펼치기";font-size:12.5px;font-weight:500;color:var(--muted)}
details.sum[open] summary::after{content:"접기"}
details.sum .card{margin-top:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.btn{border:1px solid var(--line);background:var(--surface);font-size:14.5px;font-weight:600;padding:11px 16px;border-radius:12px;min-height:46px}
.btn.primary{background:var(--hema);border-color:var(--hema);color:var(--surface)}
.btn.eosin{background:var(--eosin);border-color:var(--eosin);color:var(--surface)}
.btn.gold{background:var(--gold);border-color:var(--gold);color:var(--surface)}
.btn.wide{flex:1}
.btn:disabled{opacity:.4;cursor:default}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}
.mode{display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px}
.mode b{font-size:14.5px}.mode span{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.mode:disabled{opacity:.45}
.mode.main{grid-column:1/-1;background:var(--hema);border-color:var(--hema);color:#fff;padding:14px}.mode.main span{color:inherit;opacity:.85}
.mastery{display:flex;align-items:center;gap:12px;margin-top:12px;padding:12px 14px;border-radius:14px;background:var(--gold-soft);color:var(--gold);font-weight:600;font-size:14px}
.mastery .big{font-size:24px}
.qtop{display:flex;align-items:center;gap:10px;margin-top:10px;font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.pbar{flex:1;height:5px;background:var(--sunk);border-radius:3px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--eosin);border-radius:3px}
.qcard{margin-top:10px}
.qhead{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-size:12px;color:var(--muted)}
.pill{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:999px;background:var(--hema-soft);color:var(--hema)}
.pill.eo{background:var(--eosin-soft);color:var(--eosin)}.pill.ok{background:var(--ok-soft);color:var(--ok)}.pill.bad{background:var(--bad-soft);color:var(--bad)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.stem{font-size:calc(var(--fs) + 1.5px);font-weight:600;margin:10px 0 14px;line-height:1.6;white-space:pre-line}
.qimg{display:block;max-width:100%;max-height:440px;margin:0 auto 6px;border-radius:12px;border:1px solid var(--line);background:var(--sunk);cursor:zoom-in}
.imgph{display:grid;place-items:center;height:180px;border-radius:12px;border:1px dashed var(--line);color:var(--muted);font-size:13px;margin-bottom:14px}
.imgnote{font-size:11.5px;color:var(--muted);text-align:center;margin:0 0 12px}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:28px 1fr;gap:8px;align-items:start;text-align:left;font-size:var(--fs);background:var(--surface);border:1.5px solid var(--line);border-radius:14px;padding:12px 13px;width:100%;min-height:50px;transition:border-color .12s,background .12s}
@media (hover:hover){.opt:hover:not(:disabled){border-color:var(--hema)}}
.opt .k{font-weight:700;color:var(--hema);font-size:16px;line-height:1.5}
.opt.sel{border-color:var(--hema);background:var(--hema-soft)}
.opt.correct{border-color:var(--ok);background:var(--ok-soft)}.opt.correct .k{color:var(--ok)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}.opt.wrong .k{color:var(--bad)}
.opt:disabled{cursor:default;color:var(--ink)}
.verdict{margin-top:14px;border-radius:12px;padding:10px 14px;font-weight:700}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}.verdict.no{background:var(--bad-soft);color:var(--bad)}
.exp{display:grid;gap:10px;margin-top:12px;font-size:var(--fs)}
.exp section{border-top:1px solid var(--line);padding-top:10px}
.exp h4{margin:0 0 4px;font-size:12px;letter-spacing:.06em;color:var(--hema)}
.exp p{margin:0}
.exp .look h4{color:var(--warn)}.exp .wr h4{color:var(--bad)}
.exp .key{background:var(--sunk);border-radius:10px;padding:8px 12px;font-weight:600}
.dock{position:fixed;left:0;right:0;bottom:calc(var(--tabh) + env(safe-area-inset-bottom,0px));z-index:7;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) 8px max(16px,env(safe-area-inset-left,0px))}
.dock .in{max-width:720px;margin:0 auto;display:grid;grid-template-columns:1fr auto 1.4fr;gap:8px}
.starbtn{border:1px solid var(--line);background:var(--surface);border-radius:12px;width:52px;font-size:20px;color:var(--muted)}
.starbtn[aria-pressed="true"]{color:var(--gold);border-color:var(--gold)}
.dots{display:flex;flex-wrap:wrap;gap:4px;margin-top:12px}
.dots button{width:34px;height:32px;border:1px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;font-family:var(--f-mono);font-size:11px;padding:0}
.dots button.done{background:var(--hema-soft);color:var(--hema)}
.dots button.cur{border-color:var(--eosin);color:var(--eosin);font-weight:700}
.rounds{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:10px}
.rnd{position:relative;border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 2px;text-align:center}
.rnd b{display:block;font-family:var(--f-mono);font-size:16px}
.rnd span{font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
.rnd.done{border-color:var(--ok);background:var(--ok-soft)}.rnd.done span{color:var(--ok)}
.rnd.locked{opacity:.55}
.rnd.prog{border-color:var(--eosin);border-style:dashed}.rnd.prog span{color:var(--eosin)}
.rnd .free{position:absolute;top:-7px;left:50%;transform:translateX(-50%);font-size:10px;font-weight:700;background:var(--eosin);color:#fff;border-radius:999px;padding:0 6px}
.score{font-family:var(--f-mono);font-size:46px;color:var(--hema);line-height:1.1}
.celebrate{text-align:center;padding:22px 16px}

@media (prefers-reduced-motion:no-preference){@keyframes pop{from{transform:scale(.4)}to{transform:none}}}
table.sc{border-collapse:collapse;width:100%;font-size:14px;font-variant-numeric:tabular-nums;margin-top:10px}
table.sc th,table.sc td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left}
table.sc .r{text-align:right}
.empty{color:var(--muted);font-size:14px;background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:20px;margin-top:12px;text-align:center}
.wl{display:grid;gap:8px;margin-top:10px}
.wi{display:grid;grid-template-columns:auto 1fr;gap:10px;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;font-size:13.5px;width:100%}
.wi small{color:var(--muted)}
.statrow{display:grid;grid-template-columns:84px 1fr 46px;gap:10px;align-items:center;font-size:13.5px;padding:8px 0;border-bottom:1px solid var(--line)}
.statrow:last-child{border-bottom:0}
.statrow .v{text-align:right;font-family:var(--f-mono);font-size:12.5px;color:var(--muted)}
.trend{display:flex;align-items:flex-end;gap:4px;height:110px;margin-top:10px;padding-bottom:18px}
.trend div{flex:1;min-width:6px;background:var(--hema-2);border-radius:4px 4px 0 0;position:relative}
.trend div span{position:absolute;bottom:-18px;left:50%;transform:translateX(-50%);font-family:var(--f-mono);font-size:10px;color:var(--muted)}
.settings{display:grid;gap:12px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;flex-wrap:wrap}
.confirm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:12px;font-size:13.5px;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--tabh) + 84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);font-size:13.5px;padding:8px 14px;border-radius:999px;z-index:30;white-space:nowrap}
dialog.zoom{border:0;padding:0;background:transparent;max-width:96vw;max-height:94vh}
dialog.zoom::backdrop{background:rgba(10,10,20,.88)}
dialog.zoom img{display:block;max-width:96vw;max-height:94vh;border-radius:8px}
footer{margin-top:28px;font-size:12px;color:var(--muted)}
input[type=date]{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:6px 8px}
/* 짝 맞추기 */






@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}


/* 머리줄 기록 버튼 */



footer .link{background:none;border:0;padding:0;color:var(--hema);text-decoration:underline;text-underline-offset:3px;font-size:12px}
/* 이 앱이 다른 점 */


.why-h{font-family:var(--f-display);font-size:19px;margin:0 30px 6px 0;display:block;line-height:1.4;color:var(--hema)}
.whyin .why-h{margin:0 0 6px;text-align:center}
.why-lead{margin:0 0 12px;font-size:13.5px;color:var(--ink);line-height:1.6}
.why-l{list-style:none;margin:0;padding:0;display:grid;gap:10px;text-align:left}
.why-l li{display:grid;grid-template-columns:30px 1fr;gap:8px;align-items:start;font-size:13px;color:var(--muted);line-height:1.5}
.why-l li>span{font-size:18px;line-height:1.3}
.why-l b{display:block;color:var(--ink);font-size:14px}
.whyin{margin:16px 0 12px;padding-top:14px;border-top:1px dashed var(--line)}
table.lockt{font-size:13.5px}
table.lockt th{font-size:12px;color:var(--muted);font-weight:500}
table.lockt td:first-child{text-align:left;font-weight:600}
table.lockt .free{color:var(--eosin);font-weight:700}
table.lockt tr.sum td{font-weight:700;border-top:2px solid var(--line)}
table.lockt tr.mk td{color:var(--hema);font-weight:600}
/* 게임 */





.game span:last-child{font-size:12px;opacity:.9;line-height:1.45}


























/* 모의고사 나눠 풀기 */
.parts{display:grid;gap:8px;margin-top:12px}
.part .ic{font-family:var(--f-mono);font-size:15px;font-weight:600}
.part.full .ic{background:var(--ok-soft);color:var(--ok)}
/* 문항 보조 */
.stem u{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-color:var(--eosin)}
.bogi{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 14px;margin:-6px 0 14px;display:grid;gap:4px;font-size:var(--fs)}
.exp .links h4{color:var(--hema)}
.lk{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:start;text-align:left;width:100%;background:transparent;border:0;border-top:1px dashed var(--line);padding:8px 0;font-size:13.5px}
.lk small{color:var(--muted)}
.btn.small{min-height:34px;padding:5px 12px;font-size:12.5px;font-weight:500;color:var(--muted)}
.dots button.ok{background:var(--ok-soft);color:var(--ok);border-color:var(--ok)}
.dots button.no{background:var(--bad-soft);color:var(--bad);border-color:var(--bad)}
table.t.guide td:first-child{width:28%}
/* 오류 신고 */
.rpt{display:grid;gap:8px;border:1px solid var(--line);background:var(--sunk);border-radius:12px;padding:12px}
.rchips{display:flex;flex-wrap:wrap;gap:6px}
.rchip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 11px;font-size:13px}
.rchip[aria-pressed="true"]{border-color:var(--eosin);background:var(--eosin-soft);color:var(--eosin);font-weight:600}
.rpt textarea{font:inherit;font-size:14px;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;resize:vertical}
/* 목차 */
.sumrow{display:grid;grid-template-columns:repeat(4,1fr);margin-top:12px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.sumrow div{padding:10px 6px;text-align:center;border-left:1px solid var(--line)}.sumrow div:first-child{border-left:0}
.sumrow b{display:block;font-family:var(--f-mono);font-size:17px;color:var(--hema)}.sumrow span{font-size:11.5px;color:var(--muted)}
details.subjblk{margin-top:12px;background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--sc);border-radius:12px;overflow:hidden}
details.subjblk summary{list-style:none;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline;padding:14px 14px 12px;cursor:pointer}
details.subjblk summary::-webkit-details-marker{display:none}
details.subjblk .sn{font-family:var(--f-display);font-size:18px;font-weight:800}
details.subjblk .sm{font-size:12.5px;color:var(--muted);text-align:right}
details.subjblk summary .bar{grid-column:1/-1;height:4px}
details.subjblk summary::after{content:"챕터 목록 펼치기";grid-column:1/-1;font-size:11.5px;color:var(--muted)}
details.subjblk[open] summary::after{content:"접기"}
.parts2{padding:0 14px 14px}
.parthd{display:flex;justify-content:space-between;align-items:baseline;font-weight:700;font-size:13.5px;color:var(--hema);margin:10px 0 4px;padding-bottom:4px;border-bottom:2px solid var(--hema-soft)}
.parthd small{font-weight:500;color:var(--muted);font-size:12px}
.toclist{display:grid}
.tocrow{display:grid;grid-template-columns:34px 1fr auto;gap:10px;align-items:center;text-align:left;background:transparent;border:0;border-bottom:1px solid var(--line);padding:10px 2px;width:100%}
.tocrow:last-child{border-bottom:0}
.tocrow .no{font-family:var(--f-mono);font-size:12.5px;color:var(--hema);font-weight:600}
.tocrow .t{font-weight:600;font-size:14.5px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tocrow .sub{font-size:12px;color:var(--muted);font-weight:400}
.tocrow .n{font-family:var(--f-mono);font-size:12.5px;color:var(--hema);text-align:right}.tocrow .n small{color:var(--muted)}
.tocrow.locked{opacity:.55}
.tocrow.extra .no{font-family:var(--f-body);font-size:11px;color:var(--eosin)}
.why-l{margin:0;padding-left:20px;display:grid;gap:10px;font-size:13.5px;color:var(--muted);line-height:1.6}
.why-l b{display:block;color:var(--ink);font-size:14px}
/* 잠금 */
.freebeta{margin-top:16px;background:var(--ok-soft);color:var(--ok);border-radius:12px;padding:12px 14px;font-size:14px;line-height:1.6}
.codebox{margin-top:18px;padding-top:14px;border-top:1px dashed var(--line);text-align:left}
.codebox label{font-weight:700;font-size:14px}
.codebox input{text-transform:uppercase;letter-spacing:.08em;font-family:var(--f-mono)}
.codebox .lede{margin-top:6px}
.buybar{margin-top:10px;border-color:var(--eosin);background:var(--eosin-soft)}
.lock{text-align:center;padding:22px 18px;margin-top:16px}
.lock .ico{font-size:34px}
.lock h2{justify-content:center;font-family:var(--f-display);font-size:20px;margin:8px 0 4px}
.lock ul{text-align:left;margin:14px auto;max-width:340px;padding-left:20px;font-size:14px;line-height:1.8}
.price{font-family:var(--f-mono);font-size:28px;font-weight:600;color:var(--eosin)}
@media (max-width:420px){h1{font-size:20px}}
@media (prefers-reduced-motion:no-preference){.qcard{animation:rise .16s ease-out}@keyframes rise{from{transform:translateY(4px)}to{transform:none}}}
</style>

<script type="module">
let DATA = {"H":{"code":"H","title":"조직학","theory":[{"no":1,"t":"세포·조직학 총론","core":"소기관 기능 + 재생능(불안정·안정·영구) + 4대 기본조직.","secs":[{"h":"핵심정리","head":["항목","내용"],"rows":[["4대 기본조직","상피·결합·근육·신경 (지방=결합조직 유형)"],["세포막","인지질 이중층 · 선택적 물질 투과·배출"],["용해소체(lysosome)","산성 가수분해효소 · 자가용해(autolysis)"],["사립체(미토콘드리아)","ATP 생성"],["리보솜·과립세포질그물(RER)","단백질 합성"],["세포질 호염기성","RNA 증가 (핵 호염기성 = DNA)"],["재생능","불안정세포(표피·소화관·조혈, 계속 분열) / 안정세포(간·섬유모, 필요 시) / 영구세포(신경·심근, 재생 거의 불가)"],["유사분열 전기(prophase)","핵막·핵소체 소실 · 염색체 형성"],["현미경","광학(조직절편) · 투과전자(TEM, 초미세 내부·산화프로필렌 치환) · 주사전자(SEM, 표면)"]]},{"h":"주의 · 함정","head":["헷갈리는 지점","바른 이해"],"rows":[["영구세포","신경세포·심근세포 (간·섬유모세포는 재생 가능)"],["4대 기본조직 아님","지방조직 (결합조직 유형)"],["세포질 호염기성=RNA / 핵 호염기성=DNA 구별"],["세포소기관 아님","분비과립(세포 산물)"]]},{"h":"세포소기관 즉답표","head":["세포소기관","기능"],"rows":[["핵","유전정보(DNA)·유전자 발현"],["리보솜·과립세포질그물(RER)","단백질 합성"],["활면세포질그물(SER)","지질·스테로이드 합성·해독·Ca 저장"],["골지체","수정·포장·분비소포 형성"],["용해소체(lysosome)","산성 가수분해효소·분해·자가용해"],["사립체(미토콘드리아)","ATP 생성(산화적 인산화)"]]}],"point":"소기관 기능·재생능·4대조직·유사분열·현미경. 연계: 자가용해=고정으로 방지, TEM=산화프로필렌 치환.","items":[{"id":"H-1-01","no":"1-01","q":"산성 가수분해효소를 함유하여 사후 세포의 자가용해(autolysis)를 일으키는 세포소기관은?","o":["사립체(미토콘드리아)","리보솜","활면세포질그물","골지체","용해소체"],"img":[],"tags":[],"lv":3,"a":4,"look":"","e":"용해소체는 산성 가수분해효소로 세포 내 소화를 하며, 세포가 죽으면 효소가 유출되어 자가용해를 일으킨다. 조직 고정의 1차 목적이 자가용해 방지다.","w":["① 사립체는 ATP 생성, ③ 활면세포질그물은 지질, 스테로이드 합성과 해독, ④ 골지체는 단백질 수정과 포장을 한다."],"k":"자가용해 = 용해소체(산성 가수분해효소). 고정의 목적 = 자가용해 방지."},{"id":"H-1-02","no":"1-02","q":"형질세포의 세포질이 H&E 염색에서 짙은 호염기성을 보이는 원인이 되는 성분은?","o":["글리코겐","케라틴","지질","DNA","RNA"],"img":[],"tags":[],"lv":3,"a":4,"look":"","e":"형질세포는 항체를 활발히 합성하여 리보솜과 과립세포질그물의 RNA가 풍부하므로 세포질이 호염기성이다. 핵의 호염기성은 DNA 때문이다.","w":["① 글리코겐은 H&E에서 잘 보이지 않고 PAS로 본다."],"k":"세포질 호염기성 = RNA. 핵 호염기성 = DNA."},{"id":"H-1-03","no":"1-03","q":"다음 중 손상 후 재생 능력이 가장 낮은 세포는?","o":["편평상피세포","간세포","원주상피세포","섬유모세포","심근세포"],"img":[],"tags":["빈출"],"lv":3,"a":4,"look":"","e":"심근세포와 신경세포는 분열 능력을 거의 잃은 영구세포로 손상 시 섬유성 반흔으로 대치된다. 편평, 원주상피는 불안정세포, 간세포와 섬유모세포는 안정세포다.","w":[],"k":"영구세포 = 심근, 신경세포."},{"id":"H-1-04","no":"1-04","q":"세포소기관과 그 기능의 연결로 옳은 것은?","o":["과립세포질그물 : DNA 합성","염색질 : DNA를 포함하여 유전정보를 담는다","용해소체 : 영양분을 분해하여 에너지 생산","골지체 : ATP 생성","사립체 : 세포 내 소화"],"img":[],"tags":[],"lv":3,"a":1,"look":"","e":"염색질은 DNA와 히스톤의 복합체로 유전정보를 담는다. 과립세포질그물은 단백질 합성, 사립체는 ATP 생성, 골지체는 수정과 포장, 용해소체는 세포 내 소화를 한다.","w":[],"k":"염색질 = DNA. 에너지 생산은 사립체."},{"id":"H-1-06","no":"1-06","q":"인체의 4대 기본조직에 해당하지 않는 것은?","o":["신경조직","결합조직","상피조직","근육조직","지방조직"],"img":[],"tags":[],"lv":3,"a":4,"look":"","e":"4대 기본조직은 상피, 결합, 근육, 신경조직이며, 지방조직은 결합조직의 한 유형이다.","w":[],"k":"4대 기본조직 = 상피, 결합, 근육, 신경. 지방은 결합조직."},{"id":"H-1-07","no":"1-07","q":"유사분열 단계와 그 특징의 연결로 옳은 것은?","o":["중기 : 핵막이 다시 형성된다","후기 : 염색질이 응축하기 시작한다","말기 : 자매염색분체가 양극으로 이동한다","전기 : 핵막과 핵소체가 소실되고 염색체가 형성된다","전기 : 염색체가 적도판에 배열된다"],"img":[],"tags":[],"lv":3,"a":3,"look":"","e":"전기에는 염색질이 응축해 염색체가 되고 핵막과 핵소체가 사라진다. 중기는 적도판 배열, 후기는 염색분체의 양극 이동, 말기는 핵막 재형성과 세포질 분열이다.","w":[],"k":"전기 = 핵막, 핵소체 소실 + 염색체 형성."},{"id":"H-1-08","no":"1-08","q":"세포막(형질막)의 기능으로 옳은 것은?","o":["핵과 세포질 사이의 물질 이동 통로다","세포 안팎의 물질을 선택적으로 투과, 배출한다","세포 내 소화 작용을 한다","ATP를 합성한다","스테로이드 호르몬을 합성한다"],"img":[],"tags":[],"lv":3,"a":1,"look":"","e":"세포막은 인지질 이중층으로 물질의 선택적 투과와 배출을 조절한다. 세포 내 소화는 용해소체, 스테로이드 합성은 활면세포질그물, ATP 합성은 사립체다.","w":[],"k":"세포막 = 선택적 물질 투과, 배출."},{"id":"H-1-09","no":"1-09","q":"다음 중 세포소기관이 아니라 세포의 산물(봉입물)에 해당하는 것은?","o":["골지체","과립세포질그물","분비과립","사립체","중심체"],"img":[],"tags":[],"lv":3,"a":2,"look":"","e":"분비과립은 세포가 만든 분비 산물을 담은 것으로, 세포소기관이 아니라 세포 산물(봉입물)로 분류한다.","w":[],"k":"분비과립 = 세포 산물. 소기관 아님."},{"id":"H-1-05","no":"1-05","q":"세포의 재생 능력 분류에서 영구세포(permanent cell)에 해당하는 것은?","o":["표피 기저세포","간세포","섬유모세포","심근세포","골수 조혈세포"],"img":[],"tags":[],"lv":3,"a":3,"look":"","e":"영구세포는 신경세포, 심근세포, 골격근세포다. 간세포와 섬유모세포는 안정세포, 표피 기저세포와 조혈세포는 불안정세포다.","w":[],"k":"영구세포 = 신경, 심근(골격근 포함)."},{"id":"H-1-10","no":"1-10","q":"지방조직(adipose tissue)이 속하는 기본조직은?","o":["결합조직","상피조직","근육조직","신경조직","독립된 제5의 기본조직"],"img":[],"tags":[],"lv":3,"a":0,"look":"","e":"지방조직은 지방세포가 모인 특수 결합조직이며, 기본조직은 상피, 결합, 근육, 신경의 4가지뿐이다.","w":[],"k":"지방조직 = 결합조직의 한 유형."},{"id":"H-1-11","no":"1-11","q":"뇌경색 후 소실된 부위가 신경세포로 재생되지 않고 신경아교세포로 채워지는 이유로 옳은 것은?","o":["신경세포가 영구세포이기 때문이다","신경세포가 결합조직이기 때문이다","신경세포에 용해소체가 없기 때문이다","신경세포가 불안정세포이기 때문이다","신경세포가 안정세포이기 때문이다"],"img":[],"tags":[],"lv":3,"a":0,"look":"","e":"신경세포는 분열 능력이 없는 영구세포이므로 손상되면 재생되지 않고 신경아교세포 증식(아교증)으로 대치된다.","w":[],"k":"신경세포 = 영구세포. 재생 불가."},{"id":"H-1-12","no":"1-12","q":"투과전자현미경(TEM)에 대한 설명으로 옳은 것은?","o":["초박절편에 중금속 전자염색을 하여 세포 내부 초미세구조를 관찰한다","형광 색소를 이용하여 항원을 관찰한다","가시광선을 이용하여 조직 절편을 관찰한다","복굴절성 물질을 관찰한다","시료 표면의 입체 구조를 관찰하는 데 주로 쓴다"],"img":[],"tags":[],"lv":3,"a":0,"look":"","e":"TEM은 초박절편을 우라닐 아세테이트, 납 등 중금속으로 전자염색해 세포 내부 초미세구조를 본다. 표면 입체 구조는 주사전자현미경으로 관찰한다.","w":[],"k":"초미세구조 + 전자염색 = 투과전자현미경."},{"id":"H-1-13","no":"1-13","q":"전자현미경 표본 제작 과정에서 산화프로필렌(propylene oxide)의 역할로 옳은 것은?","o":["1차 고정제","탈회제","전자염색제","탈수 후 에폭시 수지 포매 전의 치환제(중간제)","2차 고정제"],"img":[],"tags":[],"lv":3,"a":3,"look":"","e":"전자현미경 표본은 글루타르알데하이드 1차 고정, 사산화오스뮴 2차 고정, 알코올 탈수 후 산화프로필렌으로 치환하고 에폭시 수지에 포매한다.","w":["② 탈회제는 산이나 EDTA다.","③ 전자염색제는 우라닐 아세테이트와 구연산납이다."],"k":"산화프로필렌 = 전자현미경 표본의 치환제."},{"id":"H-1-14","no":"1-14","q":"손상 시 분열하여 재생할 수 있는 세포가 아닌 것은?","o":["섬유모세포","원주상피세포","간세포","이행상피세포","심장근육세포"],"img":[],"tags":[],"lv":3,"a":4,"look":"","e":"심장근육세포는 영구세포로 재생이 불가능하다. 간세포, 섬유모세포는 안정세포, 원주상피와 이행상피세포는 불안정세포로 재생된다.","w":[],"k":"재생 불가 = 심근, 신경세포."},{"id":"H-1-15","no":"1-15","q":"산화프로필렌(propylene oxide)을 치환제로 사용하여 세포내 초미세구조를 관찰할 수 있는 현미경은?","o":["광학","편광","형광","전자","위상차"],"img":[],"tags":[],"lv":3,"a":3,"look":"","e":"전자현미경 표본은 탈수 후 에폭시 수지가 잘 스며들도록 산화프로필렌으로 치환해 포매하며, 세포 소기관 같은 초미세구조를 관찰한다.","w":[],"k":"산화프로필렌 치환 + 초미세구조 = 전자현미경."},{"id":"H-1-16","no":"1-16","q":"심장근육세포(cardiac muscle cell)가 손상되었을 때의 재생 양상으로 옳은 것은?","o":["영구세포로 분열하지 못하여 섬유성 반흔으로 대치된다","불안정세포로 평생 계속 분열하여 재생된다","안정세포로 자극을 받으면 분열하여 재생된다","위성세포(satellite cell)가 분화하여 재생된다","화생으로 다른 성숙 세포로 대치된다"],"img":[],"tags":[],"lv":3,"a":0,"look":"","e":"심장근육세포는 출생 후 분열 능력을 거의 잃은 영구세포(permanent cell)이므로 손상되면 재생되지 못하고 섬유성 반흔으로 대치된다.","w":["② 표피 기저세포, 원주상피세포 같은 불안정세포의 양상이다.","③ 간세포, 섬유모세포 같은 안정세포의 양상이다.","④ 위성세포에 의한 제한적 재생은 뼈대근(골격근)의 특징이다."],"k":"심장근육세포 = 영구세포, 반흔 치유."}],"star":3},{"no":2,"t":"상피조직","core":"","secs":[],"point":"","items":[{"id":"H-2-01","no":"2-01","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"H-2-02","no":"2-02","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"H-2-03","no":"2-03","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"H-2-04","no":"2-04","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"H-2-05","no":"2-05","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"H-2-06","no":"2-06","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"H-2-07","no":"2-07","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"H-2-08","no":"2-08","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"H-2-09","no":"2-09","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"H-2-10","no":"2-10","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"H-2-11","no":"2-11","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"H-2-13","no":"2-13","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"H-2-12","no":"2-12","q":"","o":[],"a":0,"img":[],"tags":[]}],"star":3},{"no":3,"t":"결합조직·골조직","core":"","secs":[],"point":"","items":[{"id":"H-3-01","no":"3-01","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"H-3-02","no":"3-02","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"H-3-03","no":"3-03","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"H-3-04","no":"3-04","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"H-3-05","no":"3-05","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"H-3-06","no":"3-06","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"H-3-07","no":"3-07","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"H-3-08","no":"3-08","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"H-3-09","no":"3-09","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"H-3-10","no":"3-10","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"H-3-11","no":"3-11","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"H-3-12","no":"3- us group)를 이루고 바탕질이 균질한 청자색이며 바깥을 연골막이 둘러싼다.","e":"균질한 바탕질과 연골소강 속 연골세포 무리는 유리연골(hyaline cartilage)이며, 기관의 C자 모양 연골고리가 유리연골이다.","w":[],"k":"연골소강 속 연골세포 무리 + 균질 바탕질 = 유리연골."},{"id":"H-실1-03","no":"실1-03","q":"근육조직의 가로단면 H&E 염색표본이다. 근육의 종류는?","o":["심근","내장근육","뼈대근육","민무늬근육","혈관벽근육"],"img":["hist_prac_histo_007.jpg"],"tags":[],"lv":3,"a":2,"look":"굵은 다각형 근육섬유 단면이 근육다발을 이루고, 핵이 섬유 가장자리(근육섬유막 바로 아래)에 납작하게 놓인다.","e":"단면이 굵고 핵이 주변부에 있는 다핵 근육섬유는 뼈대근육(skeletal muscle)이다.","w":["① 심근은 핵이 섬유 중앙에 1~2개 있고 섬유가 가지를 친다.","②, ④, ⑤ 민무늬근육은 가는 방추형 세포의 작은 단면 중앙에 핵이 있다."],"k":"굵은 다각형 섬유 + 주변부 핵 = 뼈대근육."},{"id":"H-실1-04","no":"실1-04","q":"위의 저배율 H&E 염색표본이다. 혈관과 결합조직이 많이 존재하는 층은?","o":["A","B","C","D","E"],"img":["hist_prac_histo_012.jpg"],"tags":[],"lv":3,"a":1,"look":"B는 위주름(ruga) 속으로 뻗어 들어간 옅게 염색된 성긴 결합조직으로, 굵은 혈관 단면이 여러 개 보인다.","e":"점막밑층(submucosa)은 굵은 혈관, 림프관, 점막밑신경얼기를 포함한 결합조직으로 위주름의 심지를 이룬다.","w":[],"k":"위주름 심지의 혈관 많은 결합조직 = 점막밑층."},{"id":"H-실1-07","no":"실1-07","q":"H&E 염색표본이다. 해당되는 장기는?","o":["편도","이자","가슴샘","림프절","지라(비장)"],"img":["hist_prac_histo_016.jpg"],"tags":[],"lv":3,"a":4,"look":"림프구가 모인 림프소절(백색속질) 안에 중심동맥 단면이 보이고, 그 주위로 적혈구가 많아 붉은 적색속질이 넓게 퍼져 있다.","e":"중심동맥을 품은 백색속질과 적혈구가 찬 적색속질의 조합은 지라(spleen)의 특징이다.","w":["③ 가슴샘은 가슴샘소체가 특징이며 림프소절이 없다.","④ 림프절은 피막밑굴, 겉질 림프소절, 속질끈이 있고 적색속질이 없다."],"k":"백색속질(중심동맥) + 적색속질 = 지라."},{"id":"H-실1-10","no":"실1-10","q":"소화관의 H&E 염색표본이다. 어느 부위이며, 화살표가 가리키는 구조는?","o":["위－림프소절","식도－점막하샘","샘창자－브룬너샘","주름창자－림프소절","돌창자－파이어소절"],"img":["hist_prac_histo_019.jpg"],"tags":[],"lv":3,"a":3,"look":"융모 없이 술잔세포가 가득한 곧은 창자샘이 나란히 배열하고, 점막 아래쪽에서 점막밑층으로 불룩하게 뻗은 림프구 덩어리를 화살표가 가리킨다.","e":"융모가 없고 술잔세포가 많은 곧은 창자샘은 주름창자(잘록창자, colon)의 특징이며, 화살표는 단독 림프소절이다.","w":["① 위는 위오목과 위샘이 있고 술잔세포가 없다.","③ 샘창자는 융모와 점막밑층 브룬너샘, ⑤ 돌창자는 융모와 파이어소절이 특징이다."],"k":"융모 없음 + 술잔세포 많은 창자샘 = 주름창자(잘록창자)."},{"id":"H-실1-11","no":"실1-11","q":"창자점막의 H&E 염색표본이다. 어느 부위에서 볼 수 있는가?","o":["식도점막","위점막","빈창자점막","돌창자점막","잘록창자점막"],"img":["hist_prac_histo_021.jpg"],"tags":[],"lv":3,"a":4,"look":"융모 없이 표면이 평평하고, 술잔세포가 가득 찬 곧은 창자샘이 점막근층까지 시험관처럼 나란히 배열한다.","e":"융모가 없고 술잔세포가 많은 곧은 창자샘은 잘록창자 점막의 특징이다.","w":["③, ④ 빈창자와 돌창자 점막은 융모가 있다."],"k":"융모 없는 곧은 창자샘 + 술잔세포 다수 = 잘록창자."},{"id":"H-실1-12","no":"실1-12","q":"간 문맥부위의 H&E 염색표본이다. 화살표가 가리키는 구조는?","o":["담관","정맥","동맥","림프관","중심정맥"],"img":["hist_prac_histo_022.jpg"],"tags":[],"lv":3,"a":0,"look":"문맥역의 넓고 벽이 얇은 혈관 옆 결합조직 속에서, 입방상피세포로 둘러싸인 작은 관을 화살표가 가리킨다.","e":"문맥역에는 간문맥 가지, 간동맥 가지, 소엽사이담관이 함께 있다(문맥삼조, portal triad). 입방상피로 덮인 관은 담관이다.","w":["③ 간동맥 가지는 내강이 작고 민무늬근육 벽이 두껍다.","⑤ 중심정맥은 소엽 중심에 있으며 주위 결합조직이 거의 없고 굴모양혈관이 직접 열린다."],"k":"문맥역의 입방상피 관 = 담관."},{"id":"H-실1-15","no":"실1-15","q":"어느 부위에서 볼 수 있는 구조인가?","o":["난소","기관지","부고환","속자궁목","자궁관(난관)"],"img":["hist_prac_histo_025.jpg"],"tags":[],"lv":3,"a":1,"look":"내강면 상피는 핵이 여러 높이에 있는 거짓중층원주상피로 표면에 섬모가 있고 술잔세포가 섞여 있다. 그 아래 결합조직에 샘이 보인다.","e":"거짓중층섬모원주상피와 술잔세포(goblet cell)로 된 호흡상피, 그 아래의 기관지샘은 기관지의 특징이다.","w":["① 난소 표면은 단층입방상피로 덮인다.","③ 부고환은 부동섬모(stereocilia)가 있는 거짓중층원주상피로 술잔세포가 없다.","⑤ 자궁관은 섬모세포와 못세포로 된 단층원주상피이며 술잔세포가 없다."],"k":"거짓중층섬모원주상피 + 술잔세포 = 기관지(호흡상피)."},{"id":"H-실1-16","no":"실1-16","q":"허파꽈리(lung alveoli)의 H&E 염색사진이다. 틀린 것은?","o":["제2형세포는 큰폐포상피라고도 부른다.","제2형세포는 층판소체를 간직하고 있다.","폐포 내에는 대식세포가 존재하지 않는다.","제1형세포는 폐포 표면의 97%를 차지한다.","혈액-공기장벽은 허파꽈리세포 세포질, 내피세포 및 기저막으로 구성되어 있다."],"img":["hist_prac_histo_027.jpg"],"tags":[],"lv":3,"a":2,"look":"얇은 허파꽈리 사이벽에 납작한 핵(1형세포, 내피세포)이 보이고, 모세혈관 안에 적혈구가 있으며 사이벽 모서리에 핵이 둥근 세포가 있다.","e":"허파꽈리 안에는 대식세포(먼지세포)가 정상적으로 존재하므로 ③이 틀리다.","w":["①, ② 제2형세포는 큰폐포상피라고도 하며 표면활성물질을 담은 층판소체를 가진다.","④ 제1형세포는 수는 적지만 허파꽈리 표면의 대부분을 덮는다.","⑤ 혈액공기장벽은 1형 허파꽈리세포 세포질, 융합된 기저막, 모세혈관 내피세포로 구성된다."],"k":"허파꽈리 내강의 정상 세포 = 대식세포(먼지세포)."},{"id":"H-실1-18","no":"실1-18","q":"비뇨기계 일부의 H&E 염색 표본이다. 어느 부위인가?","o":["콩팥피질","콩팥수질","요관","방광","콩팥유두"],"img":["hist_prac_histo_029.jpg"],"tags":[],"lv":3,"a":3,"look":"여러 층의 이행상피로 덮인 점막이 깊은 주름을 이루고, 그 아래 성긴 고유판과 불규칙하게 흩어진 민무늬근 다발이 보인다.","e":"주름진 점막을 덮는 두꺼운 이행상피와 그 아래 불규칙한 민무늬근 다발은 수축 상태의 방광이다.","w":["③ 요관도 이행상피지만 가로단면에서 내강이 별 모양이고 근육층이 안세로, 바깥돌림으로 얇게 정돈되어 있다."],"k":"주름진 두꺼운 이행상피 + 불규칙 민무늬근 다발 = 방광."},{"id":"H-실1-20","no":"실1-20","q":"근조직 세로단면의 H&E(Hematoxylin & Eosin) 염색 표본이다. 근육의 종류는?","o":["골격근","평활근","심근","내장근","적색근"],"img":["hist_prac_histo_031.jpg"],"tags":[],"lv":3,"a":2,"look":"근섬유가 서로 가지를 치며 이어지고, 핵은 세포 중앙에 1~2개 있으며, 섬유를 가로지르는 진한 선이 군데군데 보인다.","e":"가지 친 근섬유, 중앙핵, 사이원반(intercalated disc)은 심근(cardiac muscle)의 특징이다.","w":["① 골격근은 가지가 없고 핵이 여러 개로 가장자리에 있다.","②, ④ 평활근과 내장근은 같은 것으로 가로무늬와 사이원반이 없다."],"k":"가지 친 섬유 + 중앙핵 + 사이원반 = 심근."},{"id":"H-실1-21","no":"실1-21","q":"근조직의 H&E 염색 표본이다. 조직의 종류는?","o":["심장근육","평활근육","뼈대근육","평활근과 뼈대근육","평활근육과 심장근육"],"img":["hist_prac_histo_033.jpg"],"tags":[],"lv":3,"a":1,"look":"가로무늬가 없는 방추형 근세포가 나란히 배열되고, 길쭉한 시가 모양의 핵이 세포 중앙에 하나씩 있다.","e":"가로무늬와 사이원반이 없고 방추형 세포 중앙에 길쭉한 핵이 하나 있으면 평활근육(smooth muscle)이다.","w":["① 심장근육은 가로무늬와 사이원반이 있고 가지를 치며, ③ 뼈대근육은 핵이 여러 개로 가장자리에 있다."],"k":"가로무늬 없음 + 방추형 + 중앙의 길쭉한 핵 = 평활근육."},{"id":"H-실1-24","no":"실1-24","q":"자궁목 조직의 H&E 염색 표본이다. 편평-원주 경계는 어느 곳인가?","o":["a","b","c","d","F"],"img":["hist_prac_histo_037.jpg"],"tags":[],"lv":3,"a":2,"look":"a 부위는 여러 층의 중층편평상피이고, c 화살표 지점에서 이 상피가 끝나며 오른쪽 표면은 한 층의 원주상피로 바뀐다.","e":"중층편평상피가 끝나고 원주상피가 시작되는 지점이 편평-원주 경계(squamocolumnar junction)로, 사진에서는 c다.","w":[],"k":"중층편평상피가 끝나고 원주상피가 시작되는 c = 편평-원주 경계."},{"id":"H-실1-30","no":"실1-30","q":"사진의 장기로 옳은 것은?","o":["위","간","콩팥","큰창자","갑상샘"],"img":["hist_prac_histo_053.jpg"],"tags":[],"lv":3,"a":2,"look":"점선 안의 모세혈관 뭉치(G)가 빈 공간으로 둘러싸여 있고, 주변에 내강이 털 모양인 세관(P)과 내강이 깨끗한 세관(D)이 모여 있다.","e":"토리(G)와 토리주머니, 몸쪽곱슬세관(P), 먼쪽곱슬세관(D)이 함께 보이면 콩팥(kidney) 피질이다.","w":[],"k":"토리 + 몸쪽, 먼쪽곱슬세관 = 콩팥."},{"id":"H-실1-31","no":"실1-31","q":"헤마톡실린-에오신(hematoxylin-eosin)으로 염색한 표본이다. 사진의 조직은?","o":["질","식도","요도","기관지","큰창자"],"img":["hist_prac_histo_054.jpg"],"tags":[],"lv":3,"a":3,"look":"왼쪽에 연골세포방이 있는 유리연골, 가운데 점막하층에 장액점액샘, 오른쪽 표면에 섬모가 있는 거짓중층섬모원주상피가 보인다.","e":"유리연골, 점막하샘, 호흡상피가 함께 보이면 기관지(bronchus) 벽이다.","w":["③ 요도는 이행상피, 중층원주상피, 중층편평상피로 덮인다."],"k":"유리연골 + 점막하샘 + 호흡상피 = 기관지."},{"id":"H-실1-33","no":"실1-33","q":"H&E 염색에서 사진과 같은 부위는 어느 장기에서 볼 수 있는가?","o":["위","샘창자","막창자","빈창자","잘록창자"],"img":["hist_prac_qa_histo_003.jpg"],"tags":[],"lv":3,"a":0,"look":"표면은 밝은 점액을 담은 단층원주상피가 위오목(gastric pit)을 이루고, 그 아래 점막 대부분을 분홍색 벽세포와 주세포로 이루어진 위샘이 빽빽하게 채운다.","e":"융모와 술잔세포가 없고 위오목 아래로 벽세포가 많은 고유위샘이 이어지는 점막은 위(stomach) 바닥부와 몸통부다.","w":["②, ④ 샘창자와 빈창자는 융모와 술잔세포가 있으며, 샘창자는 점막밑층에 브루너샘이 있다.","③, ⑤ 막창자와 잘록창자는 융모 없이 곧은 창자샘에 술잔세포가 매우 많다."],"k":"위오목 + 벽세포 많은 위샘 = 위."},{"id":"H-실1-34","no":"실1-34","q":"H&E 염색에서 사진과 같은 부위는 어느 장기에서 볼 수 있는가?","o":["간","신장","췌장","림프절","갑상샘"],"img":["hist_prac_qa_histo_004.jpg"],"tags":[],"lv":3,"a":0,"look":"가운데 얇은 벽의 중심정맥(central vein)을 향해 다각형 간세포가 판 모양으로 방사상 배열되고, 그 사이에 가는 동모양혈관(sinusoid)이 있다.","e":"중심정맥 주위로 간세포판과 동모양혈관이 방사상 배열되는 구조는 간소엽(hepatic lobule)이다.","w":[],"k":"중심정맥 + 방사상 간세포판 = 간."},{"id":"H-실1-35","no":"실1-35","q":"H&E 염색에서 사진과 같은 부위는 어느 장기에서 볼 수 있는가?","o":["간","폐","골수","갑상샘","지방조직"],"img":["hist_prac_qa_histo_005.jpg"],"tags":[],"lv":3,"a":3,"look":"크기가 다른 둥근 소포 안을 분홍색 균질한 콜로이드(colloid)가 채우고, 소포벽은 단층입방상피의 소포세포가 한 줄로 둘러싼다.","e":"콜로이드를 저장한 소포가 모여 실질을 이루는 장기는 갑상샘(thyroid gland)이다.","w":["⑤ 지방조직의 지방세포는 내용물이 빠져 비어 보이며 콜로이드가 없다."],"k":"콜로이드 찬 소포 = 갑상샘."},{"id":"H-실1-36","no":"실1-36","q":"H&E 염색에서 사진과 같은 조직을 볼 수 있는 장기는?","o":["폐","이자","지라","침샘","콩팥"],"img":["hist_prac_qa_histo_007.jpg"],"tags":[],"lv":3,"a":0,"look":"가운데 연골 없이 단층원주상피와 얇은 민무늬근으로 둘러싸인 세기관지(bronchiole)가 있고, 주위를 얇은 벽의 폐포(alveolus)가 그물처럼 둘러싼다. 옆에 동반 혈관이 보인다.","e":"세기관지와 이를 둘러싼 폐포 조직은 폐(lung)에서만 관찰된다.","w":["④ 침샘은 장액성, 점액성 샘꽈리와 줄무늬관이 있다."],"k":"세기관지 + 폐포 = 폐."},{"id":"H-실1-38","no":"실1-38","q":"H&E 염색에서 사진과 같은 조직을 볼 수 있는 장기는?","o":["간","침샘","이자","지라","콩팥"],"img":["hist_prac_qa_histo_010.jpg"],"tags":[],"lv":3,"a":2,"look":"바닥쪽이 호염기성이고 꼭대기에 분홍색 효소원과립을 가진 꽈리세포 사이에, 연하게 염색된 둥근 세포 집단이 섬처럼 놓여 있다.","e":"외분비 꽈리 사이에 연하게 염색되는 내분비세포 덩어리인 이자섬(islet of Langerhans)이 있는 장기는 이자(pancreas)다.","w":["② 침샘도 샘꽈리가 있지만 이자섬이 없고 줄무늬관이 발달한다."],"k":"꽈리 사이 밝은 세포섬 = 이자섬(이자)."},{"id":"H-실1-39","no":"실1-39","q":"H&E 염색에서 사진과 같은 조직을 볼 수 있는 장기는?","o":["간","침샘","이자","지라","콩팥"],"img":["hist_prac_qa_histo_011.jpg"],"tags":[],"lv":3,"a":4,"look":"왼쪽에 모세혈관 뭉치인 토리(glomerulus)와 이를 감싼 보먼주머니(Bowman capsule) 및 그 사이의 빈 공간이 있고, 주위에 호산성 세포질의 곱슬세관 단면이 모여 있다.","e":"토리와 보먼주머니로 된 콩팥소체(renal corpuscle)와 세관이 함께 보이면 콩팥(kidney) 겉질이다.","w":[],"k":"토리 + 보먼주머니 = 콩팥."},{"id":"H-실1-43","no":"실1-43","q":"H&E 염색에서 사진과 같은 조직을 볼 수 있는 장기는?","o":["간","폐","골수","갑상샘","지방조직"],"img":["hist_prac_qa_histo_015.jpg"],"tags":[],"lv":3,"a":4,"look":"크고 둥근 지방세포가 가득하며, 지질이 표본 처리 중 녹아 빠져 세포 안이 비어 보이고 납작한 핵이 가장자리로 밀려 있다. 사이에 섬유성 결합조직과 근육성 혈관이 지난다.","e":"빈 공포 모양의 단방지방세포(unilocular adipocyte)가 대부분을 차지하므로 지방조직(adipose tissue)이다.","w":["③ 골수는 지방세포 사이에 조혈세포가 가득하고 뼈잔기둥이 있다."],"k":"비어 보이는 단방지방세포 = 지방조직."},{"id":"H-실1-40","no":"실1-40","q":"H&E 염색에서 사진과 같은 조직을 볼 수 있는 장기는?","o":["간","이자","쓸개","신장","갑상샘"],"img":["hist_prac_qa_histo_012.jpg"],"tags":[],"lv":3,"a":0,"look":"적혈구가 찬 중심정맥 주위로 둥근 핵을 가진 다각형 간세포가 판을 이루며 방사상으로 뻗고, 판 사이에 가는 동모양혈관이 있다. 두핵 간세포도 보인다.","e":"중심정맥을 중심으로 간세포판과 동모양혈관이 방사상 배열되는 구조는 간(liver)이다.","w":[],"k":"중심정맥 + 방사상 간세포판 = 간."},{"id":"H-실1-42","no":"실1-42","q":"H&E 염색에서 사진과 같은 조직을 볼 수 있는 장기는?","o":["부신","이자","콩팥","갑상샘","뇌하수체"],"img":["hist_prac_qa_histo_014.jpg"],"tags":[],"lv":3,"a":3,"look":"단층입방상피로 둘러싸인 둥근 소포가 빽빽하게 모여 있고, 소포 안은 균질한 분홍색 콜로이드로 차 있다.","e":"콜로이드를 저장하는 소포가 실질을 이루는 내분비샘은 갑상샘(thyroid gland)이다.","w":[],"k":"콜로이드 소포 = 갑상샘."},{"id":"H-실1-44","no":"실1-44","q":"H&E 염색 사진이다. 어느 부위에서 볼 수 있는가?","o":["위","식도","소장","기관지","전립샘"],"img":["hist_prac_qa_histo_016.jpg"],"tags":[],"lv":3,"a":3,"look":"위쪽에 거짓중층섬모원주상피와 점막고유층이 있고, 그 아래에 연골세포가 연골방 안에 흩어진 두꺼운 유리연골판이 연골막에 싸여 있다.","e":"호흡상피 아래를 유리연골판이 지지하는 벽은 기관과 기관지의 소견이며, 보기 중 기관지(bronchus)가 해당한다.","w":[],"k":"호흡상피 + 유리연골판 = 기관지(기관)."},{"id":"H-실1-46","no":"실1-46","q":"H&E 염색에서 사진과 같은 조직을 볼 수 있는 장기는?","o":["간","폐","신장","갑상샘","지방조직"],"img":["hist_prac_qa_histo_018.jpg"],"tags":[],"lv":3,"a":1,"look":"넓은 빈 공간을 얇은 사이벽이 둘러싸고, 사이벽 안에 적혈구가 든 모세혈관과 납작한 핵 또는 둥근 핵의 폐포세포가 보인다.","e":"얇은 폐포사이벽(interalveolar septum)으로 경계 지어진 공기 공간이 이어지는 조직은 폐(lung)다.","w":["⑤ 지방조직은 지방세포가 서로 맞닿으며 사이벽에 모세혈관과 폐포세포가 없다."],"k":"얇은 폐포사이벽 + 공기 공간 = 폐."},{"id":"H-실1-47","no":"실1-47","q":"H&E 염색 사진이다. 사진과 같은 구조가 관찰되는 부위는?","o":["위","간","심장","콩팥","기관"],"img":["hist_prac_qa_histo_021.jpg"],"tags":[],"lv":3,"a":4,"look":"호염기성 바탕질 속에 연골세포가 연골방(lacuna) 안에 2~4개씩 모여 동종세포군(isogenous group)을 이루고, 오른쪽 가장자리에는 섬유성 연골막이 있다.","e":"균질한 호염기성 바탕질과 동종세포군을 보이는 유리연골(hyaline cartilage)로, 보기 중 C자 유리연골이 벽을 지지하는 기관(trachea)에서 관찰된다.","w":[],"k":"유리연골(동종세포군) = 기관."},{"id":"H-실1-51","no":"실1-51","q":"간의 문맥부위이다. 화살표가 가리키는 구조는?","o":["동맥","정맥","담관","쿠퍼세포","동모양혈관"],"img":["hist_prac_qa_histo_029.jpg"],"tags":[],"lv":3,"a":2,"look":"간소엽 사이 문맥역 결합조직 안에서, 화살표는 혈구가 없는 좁은 내강과 이를 둘러싼 상피세포 줄로 이루어진 관을 가리킨다.","e":"문맥역에서 혈액 없이 입방~원주상피로 둘러싸인 관은 담즙을 운반하는 소엽사이담관(interlobular bile duct)이다.","w":["① 동맥(간동맥 가지)은 내강이 작고 둥글며 민무늬근 벽이 두껍다.","② 정맥(문맥 가지)은 문맥역에서 내강이 가장 넓고 벽이 얇다.","④ 쿠퍼세포는 동모양혈관 벽에 붙은 대식세포다."],"k":"문맥역의 상피로 둘러싸인 관 = 담관."},{"id":"H-실1-48","no":"실1-48","q":"H&E 염색에서 사진과 같은 조직을 볼 수 있는 장기는?","o":["간","폐","심장","콩팥","췌장"],"img":["hist_prac_qa_histo_022.jpg"],"tags":[],"lv":3,"a":0,"look":"저배율에서 실질이 균일한 간세포판으로 채워지고, 군데군데 작은 중심정맥이 있으며, 오른쪽 위 모서리에 결합조직과 림프구가 모인 문맥역(portal area)이 보인다.","e":"중심정맥과 문맥역이 일정 간격으로 배치된 균일한 간세포 실질은 간(liver)이다.","w":[],"k":"중심정맥 + 문맥역 = 간."},{"id":"H-실1-52","no":"실1-52","q":"H&E 염색에서 사진과 같은 조직을 볼 수 있는 장기는?","o":["간","비장","췌장","콩팥","이하선"],"img":["hist_prac_qa_histo_031.jpg"],"tags":[],"lv":3,"a":2,"look":"세포질 바닥이 진하게 염색되는 샘꽈리(acinus)가 빽빽한 배경 사이에 염색이 옅은 세포 덩어리가 섬처럼 흩어져 있다.","e":"옅게 염색되는 세포 덩어리는 랑게르한스섬(islet of Langerhans), 주변은 외분비 장액성 샘꽈리다. 둘이 함께 있는 장기는 췌장이다.","w":["⑤ 이하선(귀밑샘)은 장액성 샘꽈리만 있고 랑게르한스섬이 없으며 줄무늬관이 뚜렷하다."],"k":"장액성 샘꽈리 + 랑게르한스섬 = 췌장."},{"id":"H-실1-53","no":"실1-53","q":"H&E 염색에서 사진과 같은 조직을 볼 수 있는 장기는?","o":["간","폐","췌장","신장","갑상샘"],"img":["hist_prac_qa_histo_037.jpg"],"tags":[],"lv":3,"a":3,"look":"입방형 세포로 둘러싸인 관 모양 구조가 세로, 가로, 비스듬한 단면으로 빽빽하게 모여 있다. 오른쪽에는 세포질이 호산성이고 내강이 좁은 세관, 왼쪽에는 내강이 뚜렷한 곧은 세관 다발이 보인다.","e":"여러 단면의 세관(근위세관, 원위세관, 집합관)이 밀집한 소견은 신장이다. 곧은 세관 다발은 수질선(medullary ray) 또는 수질 쪽 세관이다.","w":[],"k":"여러 단면의 입방상피 세관 밀집 = 신장."},{"id":"H-실1-55","no":"실1-55","q":"H&E 염색에서 사진과 같은 조직을 볼 수 있는 장기는?","o":["신장","피부","자궁","기관지","잘록창자"],"img":["hist_prac_qa_histo_039.jpg"],"tags":[],"lv":3,"a":4,"look":"융모 없이 평평한 점막에서 곧은 관 모양의 샘(창자샘)이 나란히 깊게 내려가고, 샘 벽이 옅은 술잔세포로 가득 차 있다.","e":"융모가 없고 술잔세포가 풍부한 곧은 창자샘(intestinal crypt)이 촘촘히 배열되면 잘록창자(결장) 점막이다.","w":["③ 자궁은 자궁내막 기질 속에 술잔세포 없는 자궁샘이 흩어져 있다."],"k":"융모 없음 + 술잔세포 많은 곧은 창자샘 = 잘록창자."},{"id":"H-실1-56","no":"실1-56","q":"H&E 염색 사진이다. 조직의 바른 분류는?","o":["신경조직","그물조직","지방조직","성긴결합조직","치밀불규칙결합조직"],"img":["hist_prac_qa_histo_041.jpg"],"tags":[],"lv":3,"a":2,"look":"크고 둥근 다각형 세포가 그물처럼 빽빽하며 내부가 비어 있고, 얇은 세포질 테두리 가장자리에 납작한 핵이 눌려 있다.","e":"큰 지방방울 하나가 세포를 채우고 핵이 가장자리로 밀린 단방지방세포(unilocular adipocyte)의 조직은 지방조직(백색지방)이다. 지방은 처리 중 녹아 빈 공간으로 보인다.","w":[],"k":"빈 공간 같은 큰 세포 + 가장자리 납작 핵 = 지방조직."},{"id":"H-실1-57","no":"실1-57","q":"다음 장기의 근육층을 구성하는 근육의 종류는?","o":["심장근육","뼈대근육","민무늬근육","가로무늬근육","수의근(맘대로근)"],"img":["hist_prac_qa_histo_042.jpg"],"tags":[],"lv":3,"a":2,"look":"샘을 가진 점막 아래로 점막근육판, 점막밑층이 이어지고, 사진 오른쪽에 가로무늬 없는 분홍색 근육층(바깥근육층)이 띠 모양으로 놓여 있다.","e":"소화관 벽 근육층은 식도 위쪽 일부를 빼면 민무늬근육(평활근)이다. 사진은 샘이 있는 위장관 점막이므로 근육층은 민무늬근육이다.","w":["① 심장근육은 심장 벽에만 있고 사이원반이 있다.","②, ④, ⑤ 가로무늬 맘대로근은 소화관에서 식도 위쪽과 항문조임근 바깥쪽에 국한된다."],"k":"위장관 벽 근육층 = 민무늬근육."},{"id":"H-실1-58","no":"실1-58","q":"H&E 염색 사진이다. 근육의 분류는?","o":["내장근육","뼈대근육","심장근육","민무늬근육","불수의근(제대로근)"],"img":["hist_prac_qa_histo_043.jpg"],"tags":[],"lv":3,"a":1,"look":"굵고 크기가 비슷한 다각형 근육섬유 가로단면이 빽빽하며, 각 섬유의 핵이 세포막 바로 아래 가장자리에 여러 개 붙어 있다.","e":"굵은 다각형 근육섬유에 핵이 가장자리에 여러 개 있으면 뼈대근육(골격근)의 가로단면이다.","w":["①, ④ 민무늬근육은 방추형 세포에 핵이 중앙에 하나 있다.","③ 심장근육은 섬유가 가지를 치며 핵이 중앙에 한두 개 있다."],"k":"다각형 섬유 + 가장자리 다핵 = 뼈대근육."},{"id":"H-실1-60","no":"실1-60","q":"근육의 H&E 염색 사진이다. 이 근육의 특징은?","o":["다핵성","사이원반","가로무늬가 없다.","수의근육(맘대로근육)","핵이 세포질 주변에 위치"],"img":["hist_prac_qa_histo_045.jpg"],"tags":[],"lv":3,"a":1,"look":"가로무늬가 있는 근육섬유가 가지를 치며 이어지고, 핵이 섬유 중앙에 하나씩 있으며, 섬유를 가로지르는 진한 선이 군데군데 보인다.","e":"가로무늬, 중앙 핵, 가지 친 섬유는 심장근육이다. 세포 끝끼리 맞닿는 계단 모양 접합부인 사이원반(intercalated disc)이 심장근육만의 특징이다.","w":["①, ⑤ 다핵성과 가장자리 핵은 뼈대근육의 특징이다. 심장근육은 핵이 중앙에 한두 개다.","③ 가로무늬가 없는 것은 민무늬근육이다.","④ 심장근육은 제대로근이다. 맘대로근은 뼈대근육이다."],"k":"가로무늬 + 중앙 핵 + 가지 친 섬유 = 심장근육, 특징은 사이원반."},{"id":"H-실1-62","no":"실1-62","q":"연골의 H&E 염색 사진이다. 이 연골의 종류는?","o":["유리연골","관절연골","탄력연골","섬유연골","제1형아교질연골"],"img":["hist_prac_qa_histo_047.jpg"],"tags":[],"lv":3,"a":0,"look":"균질하고 유리처럼 매끈한 염기성 바탕질 속 연골방에 연골세포가 2~4개씩 무리(동원세포군, isogenous group)를 이루고, 바깥에 섬유성 연골막이 덮여 있다.","e":"섬유가 보이지 않는 균질한 바탕질, 동원세포군, 연골막을 갖춘 연골은 유리연골이다. 기관, 갈비연골 등에 있다.","w":["② 관절연골도 유리연골이지만 연골막이 없다.","③ 탄력연골은 탄력섬유가 많으며 귓바퀴, 후두덮개에 있다.","④ 섬유연골은 굵은 아교섬유 다발 사이에 연골세포가 한 줄로 늘어서며 연골막이 없다.","⑤ 유리연골의 아교섬유는 제2형이다. 제1형 아교질이 많은 것은 섬유연골이다."],"k":"균질 바탕질 + 동원세포군 + 연골막 = 유리연골."},{"id":"H-실1-63","no":"실1-63","q":"H&E 염색에서 사진과 같은 조직을 볼 수 있는 장기는?","o":["위","피부","식도","방광","기관지"],"img":["hist_prac_qa_histo_048.jpg"],"tags":[],"lv":3,"a":1,"look":"표면에 바구니 엮음 모양의 각질층이 있는 중층편평상피가 진피유두와 맞물리고, 아래 진피에는 아교섬유 다발과 작은 혈관이 분포한다.","e":"각질층을 가진 각질형 중층편평상피(표피)와 그 아래 진피로 된 조직은 피부다.","w":["③ 식도는 비각질 중층편평상피라 각질층이 없다."],"k":"각질층 + 중층편평상피 + 진피 = 피부."},{"id":"H-실1-66","no":"실1-66","q":"샘꽈리의 H&E 염색 사진이다. 화살표와 같은 구조에서 분비하는 샘조직은?","o":["점액샘","장액샘","혼합샘","온분비샘","내분비샘"],"img":["hist_prac_qa_histo_052.jpg"],"tags":[],"lv":3,"a":0,"look":"화살표가 가리키는 샘꽈리는 세포질이 거품처럼 밝고 비어 보이며, 납작한 핵이 세포 바닥에 눌려 있다. 주변의 진하고 과립이 많은 장액성 샘꽈리와 대비된다.","e":"세포질이 밝고 거품 같으며 핵이 바닥에 납작하게 눌린 점액세포(점액원 함유)로 된 구조는 점액샘이다.","w":["③ 혼합샘은 장액성과 점액성 샘꽈리가 함께 있는 샘 전체(턱밑샘, 혀밑샘)를 말한다.","④ 온분비샘은 세포 전체가 분비물이 되는 방식으로 피지샘이 대표다.","⑤ 내분비샘은 도관 없이 혈액으로 호르몬을 분비하는 샘이다."],"k":"밝은 거품 세포질 + 바닥의 납작 핵 = 점액샘."},{"id":"H-실1-67","no":"실1-67","q":"H&E 염색 표본이다. 어느 장기인가?","o":["위","간","콩팥","큰창자","갑상샘"],"img":["hist_gichul_2019_04.jpg"],"tags":[],"lv":3,"a":4,"look":"크기가 다양한 둥근 소포가 빽빽이 모여 있고 소포 안이 분홍색 균질한 콜로이드로 차 있는지 본다.","e":"갑상샘(thyroid gland)은 단층입방상피로 둘러싸인 소포(follicle)가 기본 구조이며, 크기가 다른 소포 안에 호산성 콜로이드(colloid)가 차 있다.","w":[],"k":"콜로이드로 찬 소포 = 갑상샘."}]},{"no":2,"t":"상피·세포·미세구조 판독","core":"","secs":[],"point":"","items":[{"id":"H-실2-01","no":"실2-01","q":"","o":[],"a":0,"img":["hist_prac_histo_001.jpg"],"tags":[]},{"id":"H-실2-03","no":"실2-03","q":"","o":[],"a":0,"img":["hist_prac_histo_004.jpg"],"tags":[]},{"id":"H-실2-04","no":"실2-04","q":"","o":[],"a":0,"img":["hist_prac_histo_005.jpg"],"tags":[]},{"id":"H-실2-05","no":"실2-05","q":"","o":[],"a":0,"img":["hist_prac_histo_008.jpg"],"tags":[]},{"id":"H-실2-08","no":"실2-08","q":"","o":[],"a":0,"img":["hist_prac_histo_011.jpg"],"tags":[]},{"id":"H-실2-09","no":"실2-09","q":"","o":[],"a":0,"img":["hist_prac_histo_013.jpg"],"tags":[]},{"id":"H-실2-10","no":"실2-10","q":"","o":[],"a":0,"img":["hist_prac_histo_020.jpg"],"tags":[]},{"id":"H-실2-11","no":"실2-11","q":"","o":[],"a":0,"img":["hist_prac_histo_026.jpg"],"tags":[]},{"id":"H-실2-12","no":"실2-12","q":"","o":[],"a":0,"img":["hist_prac_histo_032.jpg"],"tags":[]},{"id":"H-실2-14","no":"실2-14","q":"","o":[],"a":0,"img":["hist_prac_histo_041.jpg"],"tags":[]},{"id":"H-실2-15","no":"실2-15","q":"","o":[],"a":0,"img":["hist_prac_histo_042.jpg"],"tags":[]},{"id":"H-실2-16","no":"실2-16","q":"","o":[],"a":0,"img":["hist_prac_histo_043.jpg"],"tags":[]},{"id":"H-실2-17","no":"실2-17","q":"","o":[],"a":0,"img":["hist_prac_histo_044.jpg"],"tags":[]},{"id":"H-실2-18","no":"실2-18","q":"","o":[],"a":0,"img":["hist_prac_histo_045.jpg"],"tags":[]},{"id":"H-실2-20","no":"실2-20","q":"","o":[],"a":0,"img":["hist_prac_histo_049.jpg"],"tags":[]},{"id":"H-실2-21","no":"실2-21","q":"","o":[],"a":0,"img":["hist_prac_histo_050.jpg"],"tags":[]},{"id":"H-실2-22","no":"실2-22","q":"","o":[],"a":0,"img":["hist_prac_histo_051.jpg"],"tags":[]},{"id":"H-실2-23","no":"실2-23","q":"","o":[],"a":0,"img":["hist_prac_histo_052.jpg"],"tags":[]},{"id":"H-실2-24","no":"실2-24","q":"","o":[],"a":0,"img":["hist_prac_qa_histo_002.jpg"],"tags":[]},{"id":"H-실2-26","no":"실2-26","q":"","o":[],"a":0,"img":["hist_prac_qa_histo_009.jpg"],"tags":[]},{"id":"H-실2-27","no":"실2-27","q":"","o":[],"a":0,"img":["hist_prac_qa_histo_019.jpg"],"tags":[]},{"id":"H-실2-29","no":"실2-29","q":"","o":[],"a":0,"img":["hist_prac_qa_histo_024.jpg"],"tags":[]},{"id":"H-실2-30","no":"실2-30","q":"","o":[],"a":0,"img":["hist_prac_qa_histo_027.jpg"],"tags":[]},{"id":"H-실2-31","no":"실2-31","q":"","o":[],"a":0,"img":["hist_prac_qa_histo_030.jpg"],"tags":[]},{"id":"H-실2-28","no":"실2-28","q":"","o":[],"a":0,"img":["hist_prac_qa_histo_020.jpg"],"tags":[]},{"id":"H-실2-32","no":"실2-32","q":"","o":[],"a":0,"img":["hist_prac_qa_histo_032.jpg"],"tags":[]},{"id":"H-실2-33","no":"실2-33","q":"","o":[],"a":0,"img":["hist_prac_qa_histo_033.jpg"],"tags":[]},{"id":"H-실2-34","no":"실2-34","q":"","o":[],"a":0,"img":["hist_prac_qa_histo_034.jpg"],"tags":[]},{"id":"H-실2-35","no":"실2-35","q":"","o":[],"a":0,"img":["hist_prac_qa_histo_035.jpg"],"tags":[]},{"id":"H-실2-36","no":"실2-36","q":"","o":[],"a":0,"img":["hist_prac_qa_histo_036.jpg"],"tags":[]},{"id":"H-실2-37","no":"실2-37","q":"","o":[],"a":0,"img":["hist_prac_qa_histo_040.jpg"],"tags":[]},{"id":"H-실2-38","no":"실2-38","q":"","o":[],"a":0,"img":["hist_prac_qa_histo_050.jpg"],"tags":[]},{"id":"H-실2-39","no":"실2-39","q":"","o":[],"a":0,"img":["hist_prac_qa_histo_055.jpg"],"tags":[]},{"id":"H-실2-40","no":"실2-40","q":"","o":[],"a":0,"img":["hist_gichul_2022_05.jpg"],"tags":[]}]}],"final":{"no":0,"t":"시험 직전 최종 점검표","core":"","secs":[],"point":"","items":[]}},"P":{"code":"P","title":"병리학","theory":[{"no":1,"t":"세포손상·괴사·세포자멸사","core":"세포손상은 핵이 살아 있으면 가역, 핵이 농축·붕괴·융해되면 비가역(괴사)이며, 괴사는 장기와 원인에 따라 형태가 정해진다.","secs":[{"h":"핵심정리","head":["항목","내용"],"rows":[["가역적 손상","세포종창(cellular swelling)과 지방변화(fatty change). 핵은 정상, 원인 제거 시 회복"],["비가역적 손상의 핵 변화","핵농축(pyknosis), 핵붕괴(karyorrhexis), 핵융해(karyolysis)"],["세포질 호염기성","세포질 RNA 증가(단백 합성 왕성). 핵 호염기성은 DNA"],["응고괴사(coagulative necrosis)","허혈성 괴사, 세포 윤곽 유지. 심장·신장·비장 경색"],["액화괴사(liquefactive necrosis)","효소로 조직이 녹음. 뇌경색, 화농성 농양"],["건락괴사(caseous necrosis)","치즈 모양 무구조 괴사. 결핵 육아종 중심"],["지방괴사(fat necrosis)","지방 분해 후 칼슘 비누(백색 반점). 급성 췌장염, 유방 외상"],["섬유소양괴사(fibrinoid necrosis)","혈관벽에 섬유소·면역복합체 침착. 혈관염, 악성 고혈압"],["괴저(gangrene)","사지·장의 광범위 허혈 괴사. 건성은 미라화, 습성은 감염으로 액화"],["세포자멸사(apoptosis)","능동적·예정된 단일 세포 죽음. 세포 수축, 자멸사체, 염증 없음"],["혈류 차단의 최종 결과","조직괴사, 즉 경색(infarct)"]]},{"h":"주의 · 함정","head":["헷갈리는 지점","바른 이해"],"rows":[["다핵화","괴사의 핵 변화가 아니다. 괴사 핵 변화는 농축·붕괴·융해 세 가지뿐"],["뇌경색","허혈인데도 응고괴사가 아니라 액화괴사"],["건락 vs 비건락","결핵은 건락괴사, 유육종증은 괴사 없는 비건락성 육아종"],["세포자멸사와 염증","세포자멸사는 염증을 일으키지 않는다. 염증 동반은 괴사"]]},{"h":"괴사 유형 비교","head":["유형","특징","대표 부위·질환"],"rows":[["응고괴사","세포 윤곽 유지","심근경색, 신장 경색"],["액화괴사","조직이 녹음","뇌경색, 농양"],["건락괴사","치즈 모양 무구조","결핵"],["지방괴사","칼슘 비누, 백색 반점","급성 췌장염"],["섬유소양괴사","혈관벽 분홍색 침착","혈관염, 악성 고혈압"],["괴저","광범위 허혈 + 2차 변화","당뇨 발가락, 장 괴저"]]}],"point":"괴사 유형과 장기, 질환의 짝짓기가 가장 많이 나온다. 건락괴사는 결핵, 뇌는 액화괴사로 즉답한다.","items":[{"id":"P-1-01","no":"1-01","q":"헤마톡실린-에오신(H&E) 염색에서 세포질이 강한 호염기성(basophilia)을 띠는 것은 세포질 안에 무엇이 많기 때문인가?","o":["핵 내 DNA 증가","케라틴(keratin) 축적","세포질 RNA 증가","세포의 최종 성숙","세포의 괴사"],"img":[],"tags":[],"lv":3,"a":2,"look":"","e":"세포질의 RNA(특히 리보솜 RNA)는 인산기로 산성을 띠어 염기성 염료인 헤마톡실린과 결합해 청자색으로 염색된다. 형질세포처럼 단백질 합성이 왕성한 세포에서 강해진다.","w":["② 케라틴은 호산성 단백질로 분홍~적색으로 염색된다.","⑤ 괴사세포의 세포질은 RNA가 소실되고 단백질이 변성되어 호산성이 증가한다."],"k":"세포질 호염기성 = RNA 증가(단백질 합성 왕성), 핵 호염기성 = DNA"},{"id":"P-1-02","no":"1-02","q":"전리방사선(ionizing radiation)에 노출된 뒤 발생하는 병변으로 가장 대표적인 것은?","o":["세균성 폐렴","급성 출혈성 췌장염","사구체신염","급성 충수염","백혈병(leukemia)"],"img":[],"tags":[],"lv":3,"a":4,"look":"","e":"분열이 활발하고 미분화된 세포일수록 방사선 감수성이 높아(베르고니에-트리봉도 법칙) 골수 조혈세포가 가장 큰 영향을 받으며, DNA 손상 축적으로 백혈병이 발생한다.","w":[],"k":"방사선 고감수성 = 분열 왕성 세포(조혈세포), 대표 병변 = 백혈병"},{"id":"P-1-03","no":"1-03","q":"지방변화(fatty change)와 함께 가역적 세포손상(reversible cell injury)을 대표하는 소견은?","o":["핵농축","세포종창(cellular swelling)","핵붕괴","핵융해","응고괴사"],"img":[],"tags":[],"lv":3,"a":1,"look":"","e":"ATP 감소로 Na+/K+ ATPase가 작동하지 못하면 나트륨과 물이 유입되어 세포종창(혼탁종창, cloudy swelling)이 생긴다. 원인 제거 시 회복되는 가역적 손상이다.","w":["①, ③, ④ 핵농축(pyknosis), 핵붕괴(karyorrhexis), 핵융해(karyolysis)는 비가역적 손상인 괴사의 핵 변화이다."],"k":"가역적 손상 = 세포종창, 지방변화 / 핵농축·핵붕괴·핵융해 = 비가역(괴사)"},{"id":"P-1-04","no":"1-04","q":"살아 있는 생체 안에서 국소적으로 세포와 조직이 죽는 것을 무엇이라 하는가?","o":["변성","화생","종창","괴사(necrosis)","증식"],"img":[],"tags":["빈출"],"lv":3,"a":3,"look":"","e":"괴사는 생체 안 일부 세포와 조직의 비가역적 죽음으로 개체 전체의 사망과 구별된다. 세포막 파괴로 내용물이 새어 나와 주위에 염증반응을 일으킨다.","w":["① 변성(degeneration)은 세포 안에 비정상 물질이 쌓이는 가역적 손상이다.","② 화생(metaplasia)은 한 종류의 성숙 세포가 다른 성숙 세포로 대치되는 적응이다."],"k":"생체 내 국소 세포·조직의 죽음 = 괴사"},{"id":"P-1-05","no":"1-05","q":"괴사세포에서 관찰되는 형태 변화가 아닌 것은?","o":["다핵화","핵농축(pyknosis)","핵붕괴(karyorrhexis)","세포질의 호산성 증가와 파괴","핵융해(karyolysis)"],"img":[],"tags":[],"lv":3,"a":0,"look":"","e":"괴사세포의 핵은 핵농축, 핵붕괴, 핵융해 순으로 변하고 세포질은 호산성이 강해진 뒤 파괴된다. 다핵화는 세포 융합, 바이러스 감염 등으로 살아 있는 세포에서 보인다.","w":["②, ③, ⑤ 괴사의 핵 변화는 핵농축(초기), 핵붕괴(농축된 핵이 조각남), 핵융해(후기, 핵이 녹아 염색되지 않음)이다."],"k":"괴사 핵 변화 = 핵농축, 핵붕괴, 핵융해 / 다핵화는 괴사 아님"},{"id":"P-1-06","no":"1-06","q":"괴사(necrosis)에 대한 설명으로 옳지 않은 것은?","o":["혈액 공급 중단(허혈)으로 일어날 수 있다.","비가역적 세포손상의 결과이다.","주위 조직에 염증반응을 일으키지 않는다.","대개 여러 세포가 집단으로 죽는다.","세포막이 파괴되어 세포 내용물이 유출된다."],"img":[],"tags":["빈출"],"lv":3,"a":2,"look":"","e":"괴사는 세포막이 파괴되어 내용물이 흘러나와 호중구 등을 불러들이므로 염증반응을 일으킨다. 염증이 없는 것은 세포자멸사의 특징이다.","w":["④ 괴사는 개별 세포가 아니라 일정 범위의 세포가 함께 죽는다.","⑤ 세포막 손상과 내용물 유출은 괴사의 핵심 기전이다."],"k":"괴사 = 염증 동반, 세포자멸사 = 염증 없음"},{"id":"P-1-07","no":"1-07","q":"동맥이 막혀 조직으로 가는 혈류가 완전히 차단되면 그 조직이 최종적으로 이르는 상태는?","o":["울혈","출혈","혈전","수포 형성","조직괴사(경색)"],"img":[],"tags":["빈출"],"lv":3,"a":4,"look":"","e":"혈류가 차단되면 ATP가 고갈되어 가역적 손상을 거쳐 비가역적 괴사에 이른다. 혈류 차단에 의한 국소 괴사를 경색(infarction)이라 한다.","w":["① 울혈(congestion)은 정맥 유출 장애로 혈액이 고이는 것이다."],"k":"혈류 차단의 최종 결과 = 조직괴사(경색)"},{"id":"P-1-08","no":"1-08","q":"심장과 콩팥의 허혈에서 전형적으로 나타나는 괴사 유형은?","o":["액화괴사","지방괴사","건락괴사","응고괴사(coagulative necrosis)","가스괴저"],"img":[],"tags":[],"lv":3,"a":3,"look":"","e":"응고괴사는 허혈로 구조 단백질과 효소가 함께 변성되어 핵은 사라져도 세포 윤곽이 유지되는 괴사다. 심장, 콩팥, 비장의 경색에서 전형적이며 뇌는 액화괴사가 일어난다.","w":["① 액화괴사는 효소 분해로 조직이 녹는 것으로 뇌경색과 농양에서 보인다.","② 지방괴사는 췌장 지방분해효소 유출로 지방조직이 파괴되는 것이다.","③ 건락괴사는 결핵에서 보이는 치즈 모양 괴사이다.","⑤ 가스괴저는 웰치균(Clostridium perfringens) 등 혐기성 세균 감염에 의한 괴사이다."],"k":"심장·콩팥·비장 허혈 = 응고괴사, 뇌 허혈 = 액화괴사"},{"id":"P-1-09","no":"1-09","q":"건락괴사(caseous necrosis)가 특징적으로 나타나는 질환은?","o":["결핵","신장경색증","만성간염","위암","뇌연화증"],"img":[],"tags":["빈출"],"lv":3,"a":0,"look":"","e":"건락괴사는 결핵 육아종 중심부의 괴사로, 육안상 희고 부스러지는 치즈 모양, 현미경상 세포 윤곽이 없는 무구조 과립상 호산성 물질이다.","w":["② 신장경색증은 허혈에 의한 응고괴사이다.","⑤ 뇌연화증은 뇌의 액화괴사이다."],"k":"건락괴사 = 결핵"},{"id":"P-1-10","no":"1-10","q":"질환과 그 특징적인 병리 소견의 연결로 옳지 않은 것은?","o":["결핵 : 건락괴사","디프테리아 : 위막성 염증","급성 췌장염 : 지방괴사","유육종증(sarcoidosis) : 건락성 육아종","봉와직염(cellulitis) : 화농성 염증"],"img":[],"tags":["빈출"],"lv":3,"a":3,"look":"","e":"유육종증은 건락괴사가 없는 비건락성 육아종(non-caseating granuloma)이 특징이다. 건락괴사의 유무가 결핵과 유육종증을 구별한다.","w":["② 디프테리아는 섬유소와 괴사물이 막을 이루는 위막성 염증을 일으킨다.","③ 급성 췌장염에서는 유출된 지방분해효소가 지방괴사를 일으킨다.","⑤ 봉와직염은 호중구가 조직 사이로 퍼지는 미만성 화농성 염증이다."],"k":"결핵 = 건락성 육아종, 유육종증 = 비건락성 육아종"},{"id":"P-1-11","no":"1-11","q":"발생 과정이나 생리적 상태에서 유전적으로 예정되어 일어나는 세포의 죽음은?","o":["괴사","염증","세포자멸사(apoptosis)","화생","세포종창"],"img":[],"tags":["빈출"],"lv":3,"a":2,"look":"","e":"세포자멸사는 카스파제(caspase) 활성으로 진행되는 에너지 의존성의 프로그램된 세포사로, 개별 세포 단위로 일어나며 세포자멸소체가 탐식되어 염증이 생기지 않는다.","w":["① 괴사는 병적 손상으로 일어나는 수동적이고 집단적인 세포사이다."],"k":"예정된 능동적 세포사 = 세포자멸사"},{"id":"P-1-12","no":"1-12","q":"태아의 손이 발생할 때 손가락 사이의 물갈퀴 조직이 사라져 손가락이 분리된다. 이 과정을 담당하는 세포 변화는?","o":["위축","응고괴사","화생","세포종창","세포자멸사"],"img":[],"tags":["빈출"],"lv":3,"a":4,"look":"","e":"발생 중 손가락 사이 조직의 세포가 정해진 시기에 스스로 사멸하는 것은 세포자멸사의 대표적 예이며, 일어나지 않으면 합지증이 생길 수 있다.","w":[],"k":"발생 중 예정된 조직 소실(손가락 분리) = 세포자멸사"},{"id":"P-1-13","no":"1-13","q":"세포자멸사에서 관찰되는 형태학적 소견으로 옳은 것은?","o":["세포자멸소체(apoptotic body) 형성","세포와 소기관의 팽창","세포막 파열과 내용물 유출","주위의 호중구 침윤","인접한 다수 세포의 동시 사멸"],"img":[],"tags":["빈출"],"lv":3,"a":0,"look":"","e":"세포자멸사에서는 세포가 수축하고 염색질이 응축된 뒤 세포막에 싸인 조각, 즉 세포자멸소체로 떨어져 나가 대식세포에 탐식되며 염증이 생기지 않는다.","w":["②, ③, ④, ⑤ 세포와 소기관의 팽창, 세포막 파열과 내용물 유출, 호중구 침윤, 다수 세포의 동시 사멸은 괴사의 소견이며 세포자멸사는 개별 세포가 수축한다."],"k":"세포자멸사 = 세포 수축, 염색질 응축, 세포자멸소체, 염증 없음"},{"id":"P-1-14","no":"1-14","q":"세포자멸사에 대한 설명으로 옳지 않은 것은?","o":["개별 세포 단위로 일어난다.","염증반응을 동반한다.","생리적 자극과 병적 자극 모두 원인이 될 수 있다.","핵과 세포질의 농축과 조각화가 특징이다.","항상성 유지를 위한 계획된 세포의 죽음이다."],"img":[],"tags":["빈출"],"lv":3,"a":1,"look":"","e":"세포자멸사는 세포막이 유지되고 세포자멸소체가 빠르게 탐식되어 내용물이 새지 않으므로 염증반응이 없다. 염증 동반은 괴사의 특징이다.","w":["③ 발생, 호르몬 퇴축 같은 생리적 자극뿐 아니라 DNA 손상, 바이러스 감염 같은 병적 자극으로도 일어난다."],"k":"세포자멸사에 '염증 동반'은 틀린 설명"},{"id":"P-1-15","no":"1-15","q":"결핵 병소 중심부에 세포 윤곽이 남지 않은 무구조의 치즈 모양 괴사가 있고, 그 주위를 유상피세포와 랑한스 거대세포, 림프구가 둘러싼다. 이 괴사의 유형은?","o":["응고","건락","액화","괴저","지방"],"img":[],"tags":[],"lv":3,"a":1,"look":"","e":"건락괴사는 결핵의 특징으로, 응고괴사와 액화괴사가 섞인 형태이며 세포 윤곽이 사라진 무구조 호산성 물질이 육안으로 치즈처럼 보인다.","w":["① 응고괴사는 심장, 콩팥 경색처럼 세포 윤곽이 남는다.","③ 액화괴사는 뇌경색과 농양에서 조직이 녹는다."],"k":"결핵 + 치즈 모양 무구조 괴사 = 건락괴사."},{"id":"P-1-16","no":"1-16","q":"응고괴사(coagulative necrosis)가 전형적으로 나타나는 경우는?","o":["뇌경색","폐결핵","급성 췌장염","심근경색","화농성 세균 감염"],"img":[],"tags":[],"lv":3,"a":3,"look":"","e":"응고괴사는 허혈로 구조 단백질과 분해효소가 함께 변성되어 핵은 사라져도 세포 윤곽이 유지된다. 뇌를 제외한 고형 장기(심장, 콩팥, 지라)의 경색에서 전형적이다.","w":["① 뇌경색은 허혈성이지만 액화괴사이다.","② 결핵은 건락괴사이다.","③ 급성 췌장염은 지방괴사이다.","⑤ 화농성 세균 감염은 액화괴사이다."],"k":"심근경색·콩팥경색 = 응고괴사."}],"star":4},{"no":2,"t":"세포적응·변성·침착","core":"","secs":[],"point":"","items":[{"id":"P-2-01","no":"2-01","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"P-2-02","no":"2-02","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"P-2-03","no":"2-03","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"P-2-04","no":"2-04","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"P-2-05","no":"2-05","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"P-2-06","no":"2-06","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"P-2-07","no":"2-07","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"P-2-08","no":"2-08","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"P-2-09","no":"2-09","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"P-2-10","no":"2-10","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"P-2-11","no":"2-11","q":"","o":[],"a":0,"img":[],"tags":[]},{"id":"P-2-12","no":"2-12","q":"","o":[],"a":0,
