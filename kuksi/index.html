많은 남성으로 클라인펠터증후군이다.","w":"다운은 +21, 에드워드는 +18, 터너는 45,X이며 안젤만은 15번 염색체 이상이다."},{"n":4,"s":"병리학","q":"건락괴사가 특징적으로 나타나는 질병은?","o":["Sarcoidosis(유육종증)","신장경색증","결핵","뇌 연화증","디프테리아"],"img":[],"a":2,"e":"건락괴사는 결핵 육아종의 특징이다. 신장경색증은 응고괴사, 뇌 연화증은 액화괴사, 디프테리아는 위막성 염증, 유육종증은 비건락성 육아종을 보인다.","w":""},{"n":5,"s":"조직학","q":"인체 4대 조직에 들어가지 않는 것은?","o":["신경조직","상피조직","지방조직","근조직","결체조직"],"img":[],"a":2,"e":"4대 기본조직은 상피, 결합(결체), 근육, 신경조직이며 지방조직은 결합조직에 속한다.","w":"나머지는 모두 4대 조직이다."},{"n":6,"s":"조직학","q":"근육세포의 세포막이 세포 사이에 사이원반이라는 고도로 특화된 종말연접을 이루는 근육은?","o":["적색근","심장근","민무늬근","내장근","뼈대근"],"img":[],"a":1,"e":"사이원반이라는 특화된 세포 간 연접을 만드는 근육은 심장근이다.","w":"뼈대근과 적색근은 골격근, 내장근과 민무늬근은 평활근으로 사이원반이 없다."},{"n":7,"s":"조직학","q":"중층편평상피로 덮여 있는 부위는?","o":["방광","자궁내경부","기관지","자궁외경부","작은창자"],"img":[],"a":3,"e":"질과 맞닿는 자궁외경부는 마찰에 견디도록 중층편평상피로 덮여 있다. 자궁내경부는 단층원주, 방광은 이행, 기관지는 거짓중층원주, 작은창자는 단층원주다.","w":""},{"n":8,"s":"조직학","q":"같은 종류의 상피조직끼리 연결한 것으로 잘못된 것은?","o":["질-구강","위-소장","식도-피부","기관지-기관","대장-방광"],"img":[],"a":4,"e":"대장은 단층원주상피, 방광은 이행상피로 서로 다르다.","w":"식도, 피부, 질, 구강은 중층편평, 위와 소장은 단층원주, 기관과 기관지는 거짓중층섬모원주상피다."},{"n":9,"s":"진단조직학","q":"피부나 자궁경부의 조직병리학적 진단에 이용하는 생검법은?","o":["내시경생검","세침흡인법","바늘생검","펀치생검","절제생검"],"img":[],"a":3,"e":"피부와 자궁경부의 표면 병변은 원통형 펀치로 떼어내는 펀치생검이 표준이다.","w":"바늘생검은 실질장기, 세침흡인법은 갑상샘과 림프절에 주로 쓴다."},{"n":10,"s":"진단조직학","q":"Formalin 고정이 염기성 염료와 조직 성분의 친화력을 높이는 이유는?","o":["조직의 Amino 기와 결합","중금속과의 친화","염료의 흡수력이 강하다.","매염제를 포함","카르복실기와 결합"],"img":[],"a":0,"e":"포르말린은 단백질의 아미노기와 결합해 메틸렌 가교를 만들어 염기성 염료와의 친화력을 높인다.","w":"포르말린은 중금속이나 매염제를 포함하지 않는다."},{"n":11,"s":"진단조직학","q":"간세포판을 따라 가는 흑색 섬유가 이어져 보이는 은 염색 표본이다. 이 염색으로 증명하는 것은?","o":["탄력섬유","망상 섬유","교원 섬유","Amyloid","Glycogen"],"img":[],"a":1,"e":"세망(망상)섬유는 호은성이어서 은 염색에서 간세포판을 따라 가는 흑색 섬유로 보인다.","w":"교원섬유는 Masson trichrome, 탄력섬유는 Verhoeff 염색으로 증명한다."},{"n":12,"s":"진단조직학","q":"파라핀 포매 시 포매 온도의 기준이 되는 경파라핀의 융점은?","o":["58℃","40℃","70℃","50℃","25℃"],"img":[],"a":0,"e":"포매용 경파라핀의 융점은 약 56~58℃이며 이에 맞추어 포매 온도를 유지한다.","w":""},{"n":13,"s":"진단조직학","q":"과염색한 절편을 산성 알코올(acid-alcohol)액으로 분별하는 형식의 염색법은?","o":["퇴행성염색법","직접염색법","간접염색법","진행성염색법","변색성염색"],"img":[],"a":0,"e":"과염색한 뒤 산-알코올로 분별하는 방식은 퇴행성염색법이다.","w":"진행성염색법은 분별 없이 원하는 농도까지만 염색한다."},{"n":14,"s":"진단조직학","q":"헤마톡실린-에오신 염색에서 조직을 과염색한 후 탈색(분별)하여 원하는 부분만 남기는 방법은?","o":["퇴행성염색","진행성염색","혼합염색","생체내염색","변색성염색"],"img":[],"a":0,"e":"퇴행성염색은 과염색 후 분별하여 원하는 구조만 남기는 방법이다.","w":"진행성염색은 분별 과정 없이 염색 시간으로 농도를 조절한다."},{"n":15,"s":"진단조직학","q":"실시간 열순환기(real-time thermal cycler)와 온도 프로그램 화면이 있는 기기를 사용하는 검사는?","o":["면역화학검사","분자병리","효소항체검사","전자현미경 검사","특수화학검사"],"img":[],"a":1,"e":"실시간 PCR 열순환기는 핵산을 증폭해 분석하는 분자병리 검사에 사용한다.","w":"면역화학검사는 항원항체반응을 이용한다."},{"n":16,"s":"진단조직학","q":"유전분 검출에 사용되는 염색은?\n가. Congo red 나. Crystal violet 다. Methyl violet 라. Oil red O","o":["가, 나, 다","가, 다","나, 라","가, 나, 라","가, 나, 다, 라"],"img":[],"a":0,"e":"Congo red와 변색성 염료인 Crystal violet, Methyl violet이 유전분 검출에 쓰인다.","w":"라(Oil red O)는 지방 염색이다."},{"n":17,"s":"진단조직학","q":"심근 조직을 Masson 삼색 염색하였더니 근섬유 사이의 아교섬유가 파란색으로 염색되었다. 파란색 염색 시약은?","o":["Aniline blue","Toluidine blue","basic fuchsin","Methylene blue","Weigert’s HX"],"img":[],"a":0,"e":"Masson 삼색 염색에서 아교섬유는 aniline blue로 청색, 근섬유는 적색, 핵은 Weigert 철헤마톡실린으로 흑색이다.","w":""},{"n":18,"s":"진단조직학","q":"조직 내 크고 작은 지방 방울이 적색으로 염색된 표본이다. 이 염색 과정으로 옳은 것은?","o":["파라핀 절편","지용성 봉입제 사용","Carnoy 고정액 사용","동결절편에 시행","염료의 분자량 차이에 의한 염색"],"img":[],"a":3,"e":"지질은 파라핀 처리 중 녹으므로 지방염색은 동결절편에 시행하고 수용성 봉입제로 봉입한다.","w":""},{"n":19,"s":"진단조직학","q":"예리한 큐렛(curet)을 이용하여 자궁내막이나 농양 등 병터 부위의 조직을 긁어 채취하는 생검법은?","o":["절개생검","바늘생검","소파생검","원뿔생검","표층생검"],"img":[],"a":2,"e":"예리한 큐렛으로 자궁내막이나 농양 부위를 긁어 채취하는 것은 소파생검(시험소파술)이다.","w":""},{"n":20,"s":"진단조직학","q":"Toluidine blue로 비만세포 과립을 이염색(metachromasia)한 표본이다. 이 염색의 봉입제로 맞는 것은?","o":["Resin gum","Permount","매니큐어","Glycerin","Canada balsam"],"img":[],"a":3,"e":"이염성은 탈수하면 약해지므로 탈수, 투명을 거치지 않는 글리세린 같은 수용성 봉입제를 쓴다.","w":"Canada balsam, Permount, Resin gum은 탈수가 필요한 비수용성 봉입제이다."},{"n":21,"s":"진단조직학","q":"봉입 과정에서 수용성 봉입제에 관한 설명으로 옳은 것은?","o":["변색성 염색에만 사용된다.","지질염색 후에 사용된다.","항상 당을 포함하고 있다.","반드시 일반염색에만 사용한다.","합성수지 봉입제보다 높은 굴절률을 갖는다."],"img":[],"a":1,"e":"글리세린 젤리 같은 수용성 봉입제는 지방을 녹이지 않으므로 지방염색 후에 사용한다.","w":"일반염색 표본은 탈수, 투명 후 비수용성 봉입제로 봉입한다."},{"n":22,"s":"진단조직학","q":"열순환기에서 변성, 결합, 신장 단계를 반복하여 표적 DNA를 늘리는 과정을 나타낸 모식도이다. 무엇에 관한 설명인가?","o":["제자리부합법","중합연쇄반응","유세포분석","면역조직화학","FANA"],"img":[],"a":1,"e":"중합연쇄반응(PCR)은 변성, 결합, 신장을 반복해 표적 DNA를 증폭한다.","w":"제자리부합법은 조직 위에서 탐식자를 결합시키는 검사로 증폭 순환이 없다."},{"n":23,"s":"진단세포학","q":"부인과 검체를 채취한 뒤 막여과법으로 분산·수집·이전의 과정을 거치는 세포 검사법은?","o":["압착도말법","세포군집절편법","날인도말법","액상세포검사법","찰과도말법"],"img":[],"a":3,"e":"분산·수집·이전의 막여과 과정으로 세포를 단층으로 만드는 검사는 액상세포검사법이다.","w":"세포군집절편법은 파라핀 블록을 만든다."},{"n":24,"s":"진단세포학","q":"부인과 세포 도말에서 한 세포 안의 여러 핵이 서로 눌려 맞물리고 핵 안이 균질한 젖빛유리 모양이다. 의심되는 감염원은?","o":["Actinomyces","Gardnerella vaginalis","Herpes simplex virus","Trichomonas vaginalis","Cytomegalovirus"],"img":[],"a":2,"e":"다핵, 핵 성형(molding), 젖빛유리 핵은 단순포진바이러스 감염 소견이다.","w":"Cytomegalovirus는 큰 단일 핵내 봉입체를, Gardnerella는 실마리세포를 만든다."},{"n":25,"s":"진단세포학","q":"주사기를 끼워 한 손으로 음압을 걸 수 있게 만든 주사기 손잡이(holder)가 사용되는 검사는?","o":["액상세포검사법","자궁원추생검","신장침생검","세포원심분리","세침흡인검사"],"img":[],"a":4,"e":"주사기 손잡이는 가는 바늘로 음압을 걸어 세포를 흡인하는 세침흡인검사(FNA)에 쓴다.","w":"신장침생검은 조직 코어를 얻는 굵은 생검침을 쓴다."},{"n":26,"s":"진단세포학","q":"각화성 편평세포암종을 질도말표본에서 관찰할 때 특징적인 세포학적 소견은?","o":["감자 모양의 핵","높은 핵과 세포질 비율","큰 핵소체 관찰","판상(sheet)으로 도말되며 큰 핵소체가 보인다","올챙이 및 방추형 세포"],"img":[],"a":4,"e":"각화성 편평세포암종은 올챙이형, 방추형 세포가 특징이다.","w":"판상 배열과 큰 핵소체는 수복세포의 소견이다."},{"n":27,"s":"진단세포학","q":"PAP 염색 시 불완전 탈수 다음 단계에 쓰이며 각화세포와 글리코겐을 염색하는 시약은?","o":["95% 에탄올","무수 에탄올","Bismarck brown","Light green","Orange G 6"],"img":[],"a":4,"e":"OG-6는 불완전 탈수 뒤에 사용하며 각화세포와 글리코겐을 염색한다.","w":"Bismarck brown과 Light green은 EA의 구성 성분으로 비각화세포 세포질을 염색한다."},{"n":28,"s":"진단세포학","q":"객담으로 호흡기계 세포 진단을 할 때 폐포로부터 채취된 검체임을 판정하기 위해 반드시 포함되어야 할 세포는?","o":["비만세포","술잔세포","호산성구","먼지세포","중피세포"],"img":[],"a":3,"e":"객담이 폐포에서 유래했는지 판정할 때 반드시 확인하는 세포는 먼지세포이다.","w":"술잔세포는 기관지 상피 유래로 폐포 유래의 증거가 아니다."},{"n":29,"s":"진단세포학","q":"Pap 도말에서 핵주위 공동과 이핵을 보이는 공동세포가 관찰되는 것은?","o":["Trichomonas","Actinomyces","Herpes simplex virus","CMV","HPV"],"img":[],"a":4,"e":"공동세포는 HPV 감염의 특징적 세포 변화이다.","w":"CMV는 큰 핵내 봉입체, Actinomyces는 털뭉치 모양 균집락을 보인다."},{"n":30,"s":"진단세포학","q":"질도말표본에서 주상세포(navicular cell)가 특징적으로 출현하는 시기는?","o":["배란기","월경기","임신기","증식기","폐경기"],"img":[],"a":2,"e":"주상세포는 프로게스테론 영향으로 중간세포에 당원이 침착된 세포로, 임신 중인 여성의 질도말에 특징적으로 나타난다.","w":"배란기와 증식기는 에스트로겐 작용으로 표층세포가 늘어난다."}],"practice":[{"n":1,"s":"병리학","q":"자궁경부 조직 사진이다. 점막상피 전 층이 비정상 미분화세포로 대치되어 있고 세포의 극성이 소실되었으나 기저막은 침범하지 않은 상태는?","o":["중등도 이형성증","소세포암","미소침윤암","고도 이형성증","상피내암"],"img":["mock1_m0009.jpg"],"a":4,"e":"기저층부터 표층까지 전층이 이형세포로 바뀌었으나 기저막이 온전하므로 상피내암이다.","w":"이형성증은 상피 일부만 차지하고, 미소침윤암은 기저막을 넘어 기질로 침윤한다."},{"n":2,"s":"병리학","q":"꼬인 소장 고리가 검붉게 변한 사진이다. 이처럼 혈류가 막혔을 때 조직의 최종 상태는?","o":["수포 형성","울혈","혈전","조직괴사","출혈"],"img":["mock1_m0011.jpg"],"a":3,"e":"염전으로 혈류가 막혀 생긴 소장의 출혈성 경색으로, 최종 상태는 조직괴사다.","w":"출혈이 동반되어도 혈류 차단의 최종 결과는 괴사다."},{"n":3,"s":"조직학","q":"H&E 염색 표본이다. 사진의 조직이 속하는 기본조직은?","o":["신경조직","상피조직","결합조직","지방조직","근육조직"],"img":["mock1_m0013.jpg"],"a":2,"e":"균질한 바탕질 속 연골소강에 연골세포가 든 유리연골이다. 연골은 혈액, 뼈와 함께 특수 결합조직에 속한다.","w":""},{"n":4,"s":"조직학","q":"H&E 염색 표본이다. 사진의 근육처럼 소화기계, 생식기계, 호흡기계를 구성하며 손상을 받으면 유사분열 능력이 있는 근육은?","o":["백색근육","민무늬근육","뼈대근육","적색근육","심장근육"],"img":["mock1_m0015.jpg"],"a":1,"e":"가로무늬가 없고 방추형 세포 중앙에 길쭉한 핵이 하나씩 있는 민무늬근육은 손상 뒤 분열과 재생이 가능한 유일한 근육이다.","w":""},{"n":5,"s":"진단조직학","q":"콩팥을 염색한 사진이다. 사용한 염료는?","o":["FITC","Methylene blue","Hematoxylin","Congo red","Crystal violet"],"img":["mock1_m0017.jpg"],"a":0,"e":"사구체가 녹색 형광을 내는 면역형광염색으로, 표지 색소는 FITC이다.","w":"Hematoxylin, Crystal violet, Methylene blue는 광학현미경용 염료다."},{"n":6,"s":"진단조직학","q":"사진은 골격근 조직의 PTAH 염색 표본이다. 이 염색에 맞는 고정액은?","o":["Bouin","NBF","B-5","Henry","Zenker"],"img":["mock1_m0019.jpg"],"a":4,"e":"가로무늬가 청색으로 보이는 PTAH 염색은 Zenker 고정에서 가장 좋은 결과를 얻는다.","w":""},{"n":7,"s":"진단조직학","q":"진균을 증명하기 위한 GMS 염색 사진이다. 사용하는 산화제는?","o":["chromic acid","hydrochloric acid","formic acid","osmic acid","picric acid"],"img":["mock1_m0021.jpg"],"a":0,"e":"흑색 균사가 보이는 GMS 염색으로, 크롬산이 세포벽 다당류를 산화해 알데히드를 만든다.","w":"Periodic acid를 쓰는 것은 PAS 반응이다."},{"n":8,"s":"진단조직학","q":"위 점막의 특수염색 사진이다. 점액을 붉게 발색시키는 데 사용된 시약은?","o":["Periodic acid","Alcian blue","Schiff 시약","aniline blue","Acid fuchsin"],"img":["mock1_m0023.jpg"],"a":2,"e":"PAS 염색에서 과요오드산 산화로 생긴 알데히드기가 Schiff 시약과 반응하여 점액이 적자색으로 발색된다.","w":""},{"n":9,"s":"진단조직학","q":"사진의 표본에 알맞은 것은?","o":["Epoxy","동결절편","카보왁스","Gelatin","파라핀절편"],"img":["mock1_m0025.jpg"],"a":1,"e":"지방 방울이 적색으로 염색된 지방염색 표본으로, 지방이 녹지 않게 동결절편으로 만든다.","w":"파라핀절편은 처리 중 지방이 녹아 빈 공포로 남는다."},{"n":10,"s":"진단조직학","q":"림프절을 변색성 염료로 염색한 사진이다. 사용된 변색성 염료에 해당하는 시약은?","o":["eosin Y","acid fuchsin","orange G","aniline blue","toluidine blue"],"img":["mock1_m0027.jpg"],"a":4,"e":"청색 림프구 옆 비만세포 과립이 적자색으로 이염된 톨루이딘블루 염색이다.","w":"eosin Y, orange G, aniline blue, acid fuchsin은 변색성이 없는 산성 염료다."},{"n":11,"s":"진단조직학","q":"면역조직화학염색 사진이다. 사용한 발색제는?","o":["methenamine silver","AEC","Schiff","DAB","PAP"],"img":["mock1_m0029.jpg"],"a":3,"e":"갈색 양성 산물은 과산화효소와 DAB의 반응으로 생긴다.","w":"PAP는 발색제가 아니라 효소 복합체 검출법이다."},{"n":12,"s":"진단세포학","q":"세포검사 목적으로 쓰는 sample cassette 사진이다. 이용하는 방법은?","o":["세포 군집 절편","세포원심침전법","세침천자흡인","변형대 채취법","액상자궁세포검사"],"img":["mock1_m0031.jpg"],"a":0,"e":"조직 카세트에 세포침전물을 넣어 파라핀 블록을 만드는 세포군집절편법이다.","w":"세포원심침전법은 깔때기와 슬라이드를 쓴다."},{"n":13,"s":"진단세포학","q":"프로게스테론의 혈중농도가 높은 시기에 채취한, 내분비 검사용 질도말 표본이다. 우세하게 관찰되는 세포상은?","o":["기저세포","표재세포","중간세포","무핵세포","기저곁세포(방기저세포)"],"img":["mock1_m0033.jpg"],"a":2,"e":"청록색 세포질과 소포성 핵을 가진 중간세포만 보이며 이는 프로게스테론 우세 시기의 세포상이다.","w":"표재세포는 분홍색 세포질과 농축핵을 가진다."},{"n":14,"s":"진단세포학","q":"가려움증과 동통이 있는 여성의 질 도말표본 사진이다. 관찰되는 거짓균사, 포자가 특징인 미생물은?","o":["질편모충","칸디다","임균","렙토트릭스","방선균"],"img":["mock1_m0035.jpg"],"a":1,"e":"분절된 분홍색 거짓균사와 타원형 포자가 보이면 칸디다 감염이다.","w":"렙토트릭스는 분절이 없는 가늘고 긴 막대균이다."},{"n":15,"s":"진단세포학","q":"사진은 세포 도말 표본 제작 과정이다. 세포판독에 방해가 되는 점액 등을 제거하고 세포가 겹치지 않도록 보존액에 분산시켜 유리슬라이드에 단층으로 도말하는 이 방법은?","o":["흡인도말법","압착도말법","날인도말법","커버글라스도말법","액상세포 }

/* ---------- 문제 풀기 ---------- */
let run = null;
function startRun(pool, title, idx = 0, chInfo = null){ if (!pool.length) return toast('풀 문항이 없습니다'); run = {pool, title, idx, seen: new Set(), chInfo, round: 1}; go(runner, title, `${pool.length}문항`); }
const NEG = /(아닌|틀린|옳지 않은|적절하지 않은|거리가 먼|관계없는|관계가 없는|해당하지 않는)(\s*)(것은|것을|것)/g;
function stemHTML(t){
  let head = t, box = '';
  const i = t.search(/\n가\.\s/);
  if (i > 0 && /\n나\.\s/.test(t)) { head = t.slice(0, i); box = `<div class="bogi">${t.slice(i + 1).split('\n').map(x => `<div>${esc(x)}</div>`).join('')}</div>`; }
  return `<div class="stem">${esc(head).replace(NEG, '<u>$1$2$3</u>')}</div>${box}`;
}
function qCardHTML(q, label, sub){
  return `<div class="card qcard"><div class="qhead"><span class="mono">${esc(label)}</span>${sub ? `<span class="pill">${esc(sub)}</span>` : ''}${(q.tags || []).map(t => `<span class="pill eo">${esc(t)}</span>`).join('')}<span class="res"></span></div>
    ${stemHTML(q.q)}${(q.img || []).map(n => `<div class="imgph" data-img="${esc(n)}">사진 불러오는 중</div>`).join('')}
    <div class="opts">${q.o.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${CIRC[i]}</span><span>${esc(o)}</span></button>`).join('')}</div><div class="after"></div></div>`;
}
function reveal(card, q, c){
  card.querySelectorAll('.opt').forEach(b => { const i = +b.dataset.i; b.disabled = true; if (isOk(q, i)) b.classList.add('correct'); else if (i === c) b.classList.add('wrong'); });
  const ok = c >= 0 && isOk(q, c), w = Array.isArray(q.w) ? q.w : (q.w ? [q.w] : []);
  card.querySelector('.res').innerHTML = `<span class="pill ${ok ? 'ok' : 'bad'}">${ok ? '맞음' : c < 0 ? '미응답' : '틀림'}</span>`;
  card.querySelector('.after').replaceChildren(el(`
    <div class="verdict ${ok ? 'ok' : 'no'}">${ok ? '정답입니다' : '정답 ' + (Array.isArray(q.a) ? q.a.map(i => CIRC[i]).join(', ') : CIRC[q.a])}</div>
    <div class="exp">
      ${q.look ? `<section class="look"><h4>판독 포인트</h4><p>${esc(q.look)}</p></section>` : ''}

    </div>`));
  card.querySelectorAll('[data-link]').forEach(b => b.onclick = () => { const ls = [q, ...linksOf(q)]; startRun(ls, '연계 문항: ' + ansText(q), +b.dataset.link); });
  const rb = card.querySelector('[data-report]'); if (rb) rb.onclick = () => reportQ(q);
}
const qPlace = x => `${SUBJ_NAME[x._code]} ${x._part === 'theory' ? '이론' : '실기'} ${String(DATA[x._code][x._part][x._ch].no).padStart(2, '0')} · ${x.no}`;
function linkHTML(q){
  const ls = linksOf(q); if (!ls.length) return '';

  return `<section class="links"><h4>같은 개념 연계 문항 ${ls.length}${cross ? ` · 이론↔실기 ${cross}` : ''}</h4>${ls.slice(0, 5).map((x, i) => `<button class="lk" data-link="${i + 1}"><span class="pill ${x._part === 'practice' ? 'eo' : ''}">${x._part === 'theory' ? '이론' : '실기'}</span><span>${esc(qPlace(x))}<br><small>${esc(x.q.split('\n')[0].slice(0, 60))}</small></span></button>`).join('')}${ls.length > 5 ? `<p class="lede">외 ${ls.length - 5}문항 · 아무 문항이나 누르면 연계 문항 전체를 이어서 풉니다</p>` : ''}</section>`;
}
/* 문항 오류 신고: 앱 안에서 바로 교수님 휴대폰(ntfy 알림)으로 보낸다. 학생 이름 등 개인정보는 보내지 않는다 */
const REPORT_TOPIC = 'kuksi-report-ssxgyqqchnj5';

    <div class="rchips">${['정답이 틀림', '해설이 틀림', '보기·발문 오류', '사진 문제', '오타', '기타'].map(r => `<button class="rchip" aria-pressed="false">${r}</button>`).join('')}</div>
    <textarea id="rtxt" rows="2" maxlength="300" placeholder="무엇이 이상한지 한 줄로 적어 주세요(선택)"></textarea>
    <div class="row" style="justify-content:flex-end"><button class="btn primary" id="rsend">보내기</button></div></div>`).firstElementChild;
  box.after(f);
  f.querySelectorAll('.rchip').forEach(c => c.onclick = () => c.setAttribute('aria-pressed', c.getAttribute('aria-pressed') !== 'true'));
  f.querySelector('#rsend').onclick = async e => {

    if (!why.length && !txt) return toast('신고 이유를 하나 고르거나 적어 주세요');
    const last = +(localStorage.getItem('kuksi-rpt-t') || 0); if (Date.now() - last < 20000) return toast('잠시 뒤에 다시 보내 주세요');
    e.currentTarget.disabled = true;
    const body = JSON.stringify({topic: REPORT_TOPIC, title: `오류 신고 ${q.id} · ${why.join(', ') || '기타'}`, message: `${qPlace(q)}\n발문: ${q.q.split('\n')[0].slice(0, 90)}\n정답: ${ansText(q)}${txt ? '\n내용: ' + txt : ''}`, tags: ['warning']});
    try { const r = await fetch('https://ntfy.sh/', {method: 'POST', body}); if (!r.ok) throw 0; try { localStorage.setItem('kuksi-rpt-t', Date.now()); } catch (_) {} f.innerHTML = '<p class="lede"><b>교수님께 보냈습니다.</b> 확인 후 고쳐서 다시 올립니다.</p>'; }
    catch (_) { e.currentTarget.disabled = false; toast('보내지 못했습니다. 인터넷 연결을 확인하고 다시 눌러 주세요'); }
  };
}
function dock(prevDis, nextLabel, starOn){

function runner(){

      <div class="row" style="justify-content:center;margin-top:16px"><button class="btn primary" id="next">다음 챕터</button><button class="btn" id="back">목록으로</button></div></div>`));

    <p class="lede">${solved.length}문항 중 ${x.ok}문항 정답${ci ? ` · 챕터 미완료 ${DATA[ci.code][ci.part][ci.ci].items.filter(q => !(S.ans[q.id] && S.ans[q.id].ok)).length}문항` : ''}</p>

  SUBJ_ORDER.forEach(c => { const x = stat(subjQ(c)); bs.append(el(`<div class="statrow"><span>${SUBJ_NAME[c]}</span><span class="bar" style="--sc:var(--s-${c})"><i style="width:${x.done ? pct(x.ok, x.done) : 0}%"></i></span><span class="v">${x.done ? pct(x.ok, x.done) + '%' : '-'}</span></div>`)); });
  const wk = document.getElementById('weak');
  if (!weak.length) wk.append(el('<div class="empty">챕터마다 3문항 이상 풀면 약점 챕터가 여기에 나옵니다.</div>'));
  else { const l = el('<div class="chlist"></div>').firstElementChild; weak.forEach(w => { const b = el(`<button class="ch"><span class="no">${pct(w.x.ok, w.x.done)}%</span><span class="t">${esc(w.ch.t)}<span class="sub">${SUBJ_NAME[w.c]} ${w.pt === 'theory' ? '이론' : '실기'} · ${w.x.done}/${w.x.total} 풀이</span></span><span class="n">›</span></button>`).firstElementChild; b.onclick = () => go(() => chapter(w.c, w.pt, w.i), SUBJ_NAME[w.c]); l.append(b); }); wk.append(l); }
  const tr = document.getElementById('trend');
  if (!mk.length) tr.append(el('<p class="lede">모의고사를 응시하면 회차별 점수가 막대로 쌓입니다.</p>'));
  else tr.append(el(`<div class="trend">${mk.map(([no, r]) => `<div style="height:${Math.max(4, pct(r.score, r.n || 46))}%"><span>${no}</span></div>`).join('')}</div><p class="lede">막대 높이 = 정답 비율 · 평균 ${Math.round(mk.reduce((a, [, r]) => a + pct(r.score, r.n || 46), 0) / mk.length)}%</p>`));
  document.querySelectorAll('[data-fs]').forEach(b => b.onclick = () => { S.fs = +b.dataset.fs; save(); document.body.className = 'fs' + S.fs; show(stats); });
  const tb = document.getElementById('toBuy'); if (tb) tb.onclick = () => go(() => lockView(null), '전체 열기');
  document.querySelectorAll('[data-tr]').forEach(b => b.onclick = () => { S.trial = b.dataset.tr === '1'; save(); show(stats); toast(S.trial ? '체험판 화면입니다' : '전체 화면입니다'); });
  document.getElementById('wipe').onclick = () => {
    document.getElementById('confirm').replaceChildren(el('<div class="confirm">풀이 기록, 오답, 복습 일정, 완료 표시, 모의고사 점수를 모두 지울까요? 별표는 남습니다. <button class="btn eosin" id="yes">모두 지우기</button><button class="btn" id="no">취소</button></div>'));
    document.getElementById('yes').onclick = () => { Object.assign(S, {ans: {}, mock: {}, days: {}, last: null, master: {}, rev: {}, best: {}}); save(); show(stats); toast('기록을 지웠습니다'); };
    document.getElementById('no').onclick = () => document.getElementById('confirm').replaceChildren();
  };
}

/* ---------- 모의고사 ---------- */
function mockList(){
  const f = el(`<h1>모의고사 30회</h1><p class="lede">실제 국가시험 순서대로 이론(병리 4 · 조직 4 · 진단조직 14 · 진단세포 8)과 실기 16문항. 한 회를 세 부분(약 12분씩)으로 나눠 풀 수 있고, 채점하면 과목별 점수·약점·해설이 나옵니다.</p><div class="rounds" id="rounds"></div>`);
  $view.append(f);
  const box = document.getElementById('rounds');
  DATA.M.forEach(r => {
    const rec = S.mock[r.no], n = r.theory.length + r.practice.length, lk = mockLocked(r.no), dr = S.draft[r.no];
    const b = el(`<button class="rnd ${rec && !dr ? 'done' : ''} ${dr ? 'prog' : ''} ${lk ? 'locked' : ''}">${TRIAL() && isFreeMock(r.no) ? '<span class="free">무료</span>' : ''}<b>${r.no}</b><span>${lk ? '잠김' : S.draft[r.no] ? Object.keys(S.draft[r.no].ans).length + '/' + n + ' 중' : rec ? rec.score + '/' + n : n + '문항'}</span></button>`).firstElementChild;
    b.onclick = () => go(() => lk ? lockView('모의고사 ' + r.no + '회') : mockIntro(r.no), '모의고사 ' + r.no + '회');
    box.append(b);
  });
}
let mockState = null, timer = null;
function stopTimer(){ if (timer) { clearInterval(timer); timer = null; } }
const mmss = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
const mockSeq = no => { const r = DATA.M[no - 1]; return r.theory.map(q => ({q, part: '이론', key: 't' + q.n})).concat(r.practice.map(q => ({q, part: '실기', key: 'p' + q.n}))); };
/* 나눠 풀기: 이론 앞·뒤 절반, 실기. 고른 답은 바로 저장되어 언제 나가도 이어서 푼다 */
function mockParts(no){ const r = DATA.M[no - 1], nt = r.theory.length, np = r.practice.length, h = Math.ceil(nt / 2);
  return [{k: 1, d: `이론 1~${h}번`, a: 0, b: h}, {k: 2, d: `이론 ${h + 1}~${nt}번`, a: h, b: nt}, {k: 3, d: `실기 ${np}문항`, a: nt, b: nt + np}]; }
const mins = n => Math.max(5, Math.round(n * 0.8));
function mockIntro(no){
  const rec = S.mock[no], seq = mockSeq(no), n = seq.length, dr = S.draft[no], ans = dr ? dr.ans : {}, done = Object.keys(ans).length;
  const parts = mockParts(no), cnt = p => seq.slice(p.a, p.b).filter(x => ans[x.key] !== undefined).length;
  $view.append(el(`<h1>제${no}회 모의고사</h1><p class="lede">${n}문항 · 실제 시험 순서. 한 번에 풀어도 되고, 쉬는 시간마다 한 부분씩 나눠 풀어도 됩니다. 고른 답은 바로 저장되어 중간에 나가도 이어집니다.${no === 1 && !rec ? ' 채점하면 과목별 약점과 먼저 볼 챕터를 알려 드립니다.' : ''}</p>
    <div class="parts">${parts.map(p => { const c = cnt(p), m = p.b - p.a; return `<button class="tile part ${c === m ? 'full' : ''}" data-p="${p.k}"><span class="ic hema">${c === m ? '✓' : p.k + '부'}</span><span class="t">${p.d}<small>약 ${mins(m)}분 · ${c ? `${c}/${m} 답함` : `${m}문항`}</small></span><span class="arrow">›</span></button>`; }).join('')}</div>
    <div class="row" style="margin-top:14px">${done ? `<button class="btn eosin wide" id="grade">채점하기 · ${done}/${n} 답함</button><button class="btn" id="restart">처음부터</button>` : `<button class="btn primary wide" id="begin">${rec ? '다시 응시' : '한 번에 전체 풀기'} · 약 ${mins(n)}분</button>`}</div>
    ${rec ? `<div class="row" style="margin-top:8px"><button class="btn wide" id="review">지난 결과 보기 · ${rec.score}/${rec.n || n} · ${new Date(rec.t).toLocaleDateString('ko-KR')}</button></div>` : ''}
    <div id="confirm"></div>`));
  const start = (a, b, at) => { const d = S.draft[no] || (S.draft[no] = {ans: {}, sec: 0}); save(); mockState = {no, ans: d.ans, start: Date.now(), base: d.sec || 0, a, b}; show(() => mockRun(at), cur.title, a === 0 && b === n ? '전체' : parts.find(p => p.a === a).k + '부', false); };
  $view.querySelectorAll('.part').forEach(t => t.onclick = () => { const p = parts[+t.dataset.p - 1]; const first = seq.slice(p.a, p.b).findIndex(x => ans[x.key] === undefined); start(p.a, p.b, p.a + Math.max(0, first)); });
  const bg = document.getElementById('begin'); if (bg) bg.onclick = () => { delete S.draft[no]; start(0, n, 0); };
  const gr = document.getElementById('grade'); if (gr) gr.onclick = () => {
    const fin = () => mockFinish(no);
    if (done === n) return fin();
    document.getElementById('confirm').replaceChildren(el(`<div class="confirm">${n - done}문항에 아직 답하지 않았습니다. 답하지 않은 문항은 틀린 것으로 채점합니다. <button class="btn eosin" id="yes">채점</button><button class="btn" id="no">계속 풀기</button></div>`));
    document.getElementById('yes').onclick = fin; document.getElementById('no').onclick = () => document.getElementById('confirm').replaceChildren();
  };
  const rs = document.getElementById('restart'); if (rs) rs.onclick = () => { delete S.draft[no]; save(); show(cur.fn, cur.title, cur.sub, false); };
  const rv = document.getElementById('review'); if (rv) rv.onclick = () => { mockState = {no, ans: rec.ans, start: 0, sec: rec.sec}; go(() => mockResult(false), '제' + no + '회 결과'); };
}
function mockFinish(no){ const d = S.draft[no] || {ans: {}, sec: 0}; mockState = {no, ans: d.ans, sec: d.sec}; delete S.draft[no]; save(); show(() => mockResult(true), '제' + no + '회 결과', '', false); }
const mockSec = () => mockState.base + Math.round((Date.now() - mockState.start) / 1000);
function mockRun(idx){
  const seq = mockSeq(mockState.no), {a, b} = mockState, it = seq[idx], q = it.q, rng = seq.slice(a, b), answered = rng.filter(x => mockState.ans[x.key] !== undefined).length;
  $view.append(el(`<div class="qtop"><span class="mono">${idx - a + 1} / ${b - a}</span><span class="pbar"><i style="width:${pct(answered, b - a)}%"></i></span><span class="mono" id="clk">${mmss(mockSec())}</span></div>`));
  timer = setInterval(() => { const c = document.getElementById('clk'); if (c) c.textContent = mmss(mockSec()); }, 1000);
  $view.append(el(qCardHTML(q, it.part + ' ' + q.n + '번', q.s)));
  $view.querySelectorAll('.opt').forEach(o => { if (mockState.ans[it.key] === +o.dataset.i) o.classList.add('sel'); o.onclick = () => {
    mockState.ans[it.key] = +o.dataset.i; S.draft[mockState.no] = {ans: mockState.ans, sec: mockSec()}; save();
    $view.querySelectorAll('.opt').forEach(x => x.classList.toggle('sel', x === o));
    const at = cur; if (idx + 1 < b) setTimeout(() => { if (cur === at) show(() => mockRun(idx + 1), cur.title, cur.sub, false); }, 220); else show(() => mockRun(idx), cur.title, cur.sub, false);
  }; });
  fillImgs($view);
  $view.append(el(`<div class="dots">${rng.map((x, i) => `<button data-i="${a + i}" class="${a + i === idx ? 'cur' : ''} ${mockState.ans[x.key] !== undefined ? 'done' : ''}" aria-label="${x.part} ${x.q.n}번">${x.part === '실기' ? '실' + x.q.n : x.q.n}</button>`).join('')}</div>`));
  $view.querySelectorAll('.dots button').forEach(d => d.onclick = () => show(() => mockRun(+d.dataset.i), cur.title, cur.sub, false));
  const all = seq.every(x => mockState.ans[x.key] !== undefined);
  document.body.append(el(`<div class="dock"><div class="in" style="grid-template-columns:1fr 1fr 1.3fr"><button class="btn" id="dPrev" ${idx > a ? '' : 'disabled'}>이전</button><button class="btn" id="dNx" ${idx + 1 < b ? '' : 'disabled'}>다음</button><button class="btn primary" id="dNext">${all ? '채점하기' : answered === b - a ? '이 부분 끝' : '저장하고 나가기'}</button></div></div>`));
  document.getElementById('dPrev').onclick = () => show(() => mockRun(idx - 1), cur.title, cur.sub, false);
  document.getElementById('dNx').onclick = () => show(() => mockRun(idx + 1), cur.title, cur.sub, false);
  document.getElementById('dNext').onclick = () => {
    S.draft[mockState.no] = {ans: mockState.ans, sec: mockSec()}; save();
    if (all) return mockFinish(mockState.no);
    const no = mockState.no; show(() => mockIntro(no), '모의고사 ' + no + '회', '', false); toast(answered === b - a ? '이 부분을 마쳤습니다' : '저장했습니다 · 언제든 이어서');
  };
}
const MOCK2CODE = {'병리학': 'P', '조직학': 'H', '진단조직학': 'T', '진단세포학': 'C'};
function mockResult(store){
  const seq = mockSeq(mockState.no), by = {}; MOCK_SUBJ.forEach(s => by[s] = {t: [0, 0], p: [0, 0]});
  let score = 0;
  seq.forEach(x => { const ok = mockState.ans[x.key] !== undefined && isOk(x.q, mockState.ans[x.key]); if (ok) score++; const b = by[x.q.s] || (by[x.q.s] = {t: [0, 0], p: [0, 0]}); const k = x.part === '이론' ? 't' : 'p'; b[k][1]++; if (ok) b[k][0]++; });
  if (store) { S.mock[mockState.no] = {score, n: seq.length, ans: mockState.ans, t: Date.now(), sec: mockState.sec}; save(); }
  const rate = Object.entries(by).filter(([, v]) => v.t[1] + v.p[1]).map(([s, v]) => ({s, r: (v.t[0] + v.p[0]) / (v.t[1] + v.p[1]), v}));
  const weakest = rate.slice().sort((a, b) => a.r - b.r)[0];
  const rows = rate.map(({s, v, r}) => `<tr><td>${esc(s)}${weakest && s === weakest.s && r < 1 ? ' <span class="pill bad">약점</span>' : ''}</td><td class="r">${v.t[0]}/${v.t[1]}</td><td class="r">${v.p[0]}/${v.p[1]}</td><td class="r">${Math.round(r * 100)}%</td></tr>`).join('');
  $view.append(el(`<div class="card" style="margin-top:14px"><p class="lede">제${mockState.no}회${mockState.sec ? ' · 풀이 ' + mmss(mockState.sec) : ''}</p>
    <div class="score">${score}<span style="font-size:20px;color:var(--muted)"> / ${seq.length}</span></div>
    <table class="sc"><tr><th>과목</th><th class="r">이론</th><th class="r">실기</th><th class="r">정답률</th></tr>${rows}</table></div>
    ${weakest && weakest.r < 1 ? `<button class="tile" id="weakGo" style="margin-top:10px"><span class="ic eo">!</span><span class="t">${esc(weakest.s)}부터 보강하세요<small>${SUBJ_NAME[MOCK2CODE[weakest.s]]} 챕터 목록으로 이동</small></span><span class="arrow">›</span></button>` : ''}
    <div class="seg" id="flt"><button data-f="wrong" aria-selected="true">틀린 문항</button><button data-f="all" aria-selected="false">전체 해설</button></div>
    <div id="rev"></div>`));
  const wg = document.getElementById('weakGo'); if (wg) wg.onclick = () => { const c = MOCK2CODE[weakest.s]; Object.keys(openSubj).forEach(k => delete openSubj[k]); openSubj[c] = true; toTab('home'); };
  const draw = flt => {
    const box = document.getElementById('rev'); box.replaceChildren();
    seq.forEach(x => { const c = mockState.ans[x.key], ok = c !== undefined && isOk(x.q, c); if (flt === 'wrong' && ok) return; const n = el(qCardHTML(x.q, x.part + ' ' + x.q.n + '번', x.q.s)); const card = n.firstElementChild; box.append(n); reveal(card, x.q, c === undefined ? -1 : c); });
    if (!box.children.length) box.append(el('<div class="empty">모두 맞혔습니다.</div>'));
    fillImgs(box);
  };
  document.querySelectorAll('#flt button').forEach(b => b.onclick = () => { document.querySelectorAll('#flt button').forEach(x => x.setAttribute('aria-selected', x === b)); draw(b.dataset.f); });
  draw('wrong');
}

show(home);
