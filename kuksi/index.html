},{"n":15,"s":"진단세포학","q":"","o":[],"img":[]},{"n":16,"s":"진단세포학","q":"","o":[],"img":[]},{"n":17,"s":"진단세포학","q":"","o":[],"img":[]},{"n":18,"s":"진단세포학","q":"","o":[],"img":[]},{"n":19,"s":"진단세포학","q":"","o":[],"img":[]}],"practice":[{"n":1,"s":"진단세포학","q":"","o":[],"img":["cyto_prac_cyto_079.jpg"]},{"n":2,"s":"진단세포학","q":"","o":[],"img":["mock1_m0451.jpg"]},{"n":3,"s":"진단세포학","q":"","o":[],"img":["mock1_m0197.jpg"]},{"n":4,"s":"진단세포학","q":"","o":[],"img":["mock2_m0067.jpg"]},{"n":5,"s":"진단세포학","q":"","o":[],"img":["cyto_prac_qa_cyto_056.jpg"]},{"n":6,"s":"진단세포학","q":"","o":[],"img":["mock1_m0481.jpg"]},{"n":7,"s":"진단세포학","q":"","o":[],"img":["cyto_prac_qa_cyto_014.jpg"]},{"n":8,"s":"진단세포학","q":"","o":[],"img":["mock1_m0475.jpg"]},{"n":9,"s":"진단세포학","q":"","o":[],"img":["cyto_gichul_2021_15.jpg"]},{"n":10,"s":"진단세포학","q":"","o":[],"img":["mock2_m0331.jpg"]},{"n":11,"s":"진단세포학","q":"","o":[],"img":["cyto_gichul_2023_14.jpg"]}]}],"T":[{"no":"T1","theory":[{"q":"동맥벽 표본에서 내탄력막과 탄력층판을 물결 모양의 흑색으로 증명하려 한다. 이때 시행하는 특수염색은?","o":["마손 삼색","반 기슨","말로리 PTAH","베르회프","고모리 세망"],"a":3,"e":"베르회프 염색은 헤마톡실린, 염화제2철, 요오드로 탄력섬유를 흑색으로 염색하며, 동맥벽의 탄력층판이 흑색 물결 모양으로 나타난다.","w":["① 마손 삼색은 교원섬유를 청색으로 염색한다.","② 반 기슨은 교원섬유를 적색, 근섬유를 황색으로 염색한다.","③ PTAH는 가로무늬근, 섬유소, 핵을 청색으로 염색한다.","⑤ 고모리 세망 염색은 세망섬유의 호은성을 이용한 은 염색이다."],"k":"탄력섬유 흑색 = 베르회프 철 헤마톡실린.","img":[],"s":"진단조직학","src":"M20-이11","ty":"역변환","n":1},{"q":"파라핀 포매를 위한 조직처리에서 탈수와 파라핀 침투 사이에 투명(clearing) 단계를 거친다. 투명 단계에 대한 내용으로 옳지 않은 것은?","o":["수분 제거가 주목적","알코올 제거","알코올, 파라핀과 혼화","대표 시약은 자일렌","탈알코올 과정"],"a":0,"e":"투명은 파라핀과 섞이지 않는 탈수제(알코올)를 파라핀과 섞이는 자일렌 같은 용매로 바꿔 제거하는 과정이다. 수분 제거는 탈수 단계의 목적이다.","w":["②, ⑤ 투명은 앞 단계의 알코올을 제거하는 탈알코올 과정이다.","③ 투명제는 알코올과 파라핀 모두와 섞여야 알코올을 치환할 수 있다.","④ 자일렌은 투명 완료를 눈으로 확인하기 쉬워 가장 널리 쓰인다."],"k":"투명 = 탈알코올, 수분 제거는 탈수.","img":[],"s":"진단조직학","src":"M13-이14","ty":"부정전환","n":2},{"q":"악성흑색종 종양세포 안에서 Fontana-Masson 염색으로 흑색이 되는 색소는?","o":["멜라닌","포르말린 색소","승홍색소","담즙색소","혈철소"],"a":0,"e":"악성흑색종의 종양세포 색소는 멜라닌이며, 멜라닌은 Fontana-Masson 염색에서 은을 환원해 흑색으로 증명된다.","w":["② 포르말린 색소는 산성 포르말린이 혈색소와 반응해 생기는 인공 색소다.","③ 승홍색소는 요오드와 티오황산나트륨으로 제거하는 인공 색소다.","④ 담즙색소는 Hall법(Fouchet 시약)에서 녹색으로 확인한다.","⑤ 혈철소는 Prussian blue 반응에서 청색으로 증명한다."],"k":"Fontana-Masson 흑색 = 멜라닌.","img":[],"s":"진단조직학","src":"M17-이22","ty":"역변환","n":3},{"q":"수술 검체가 병리검사실에 접수되면 장기의 구조에 맞게 고정 방법을 달리한다. 장기와 고정 방법의 연결로 옳지 않은 것은?","o":["폐 - 기관지로 주입","콩팥 - 잘라서 담금","위 - 펼쳐서 고정","자궁 - 주사기로 주입","간 - 잘라서 담금"],"a":3,"e":"주사기 등으로 고정액을 주입해 팽창시킨 채 고정하는 장기는 폐다. 자궁은 콩팥, 간처럼 잘라서 담금고정한다.","w":["① 폐는 공기 때문에 떠서 기관지로 고정액을 주입해 고정한다.","②, ⑤ 간과 콩팥은 잘라서 담금고정한다.","③ 위는 펼쳐서 고정한다."],"k":"주입고정 = 폐. 자궁, 간, 콩팥 = 잘라서 담금고정.","img":[],"s":"진단조직학","src":"M19-이18","ty":"부정전환","n":4},{"q":"Epon 같은 에폭시 수지는 중합하면 매우 단단해지고 전자빔에도 견딘다. 에폭시 수지 포매의 주된 용도는?","o":["탈수 없이 직접 포매","큰 조직과 뼈의 광학 표본","동결절편 보조 포매","광학현미경 일상 표본","60~90 nm 초박절편 제작"],"a":4,"e":"에폭시 수지는 단단하여 60~90 nm 초박절편을 만들 수 있고 전자빔에 견디므로 전자현미경 포매제로 쓴다.","w":["① 탈수 없이 고정 후 바로 침투시키는 수용성 왁스는 카보왁스다.","② 큰 조직과 뼈의 광학용 포매제는 셀로이딘이다.","③ 동결절편 보조 포매에는 젤라틴을 쓴다.","④ 광학현미경 일상 표본의 포매제는 파라핀이다."],"k":"에폭시 수지 = 전자현미경 초박절편.","img":[],"s":"진단조직학","src":"T-10-03","ty":"역변환","n":5},{"q":"염료 본래의 색과 다른 색으로 조직 성분을 물들이는 성질을 변색성(이염성, metachromasia)이라 한다. 이 성질을 나타내는 염료가 아닌 것은?","o":["톨루이딘 블루","메틸 바이올렛","메틸렌 바이올렛 블루","크리스탈 바이올렛","알시안 블루"],"a":4,"e":"Alcian blue는 산성 점액을 청색으로 염색하는 정색성 염료로 이염성을 보이지 않는다.","w":["① 톨루이딘 블루는 비만세포 과립을 적자색으로 이염시킨다.","②, ④ 메틸 바이올렛과 크리스탈 바이올렛은 아밀로이드를 적자색으로 이염시킨다.","③ 메틸렌 바이올렛 블루는 변색성 염료에 해당한다."],"k":"Alcian blue = 정색성(이염성 없음).","img":[],"s":"진단조직학","src":"M14-이14","ty":"부정전환","n":6},{"q":"동결절편에서 크고 작은 지방 방울을 증명하려 한다. 이 표본의 처리로 옳은 것은?","o":["Oil red O 염색","알코올 탈수 후 봉입","파라핀절편 제작","캐나다 발삼 봉입","PAS 염색"],"a":0,"e":"지방 방울은 동결절편에서 Oil red O 같은 지용성 염료로 적색으로 염색한다.","w":["② 알코올 탈수를 거치면 지방과 지용성 염료가 녹아 빠진다.","③ 파라핀절편은 유기용매 처리로 지방이 소실된다.","④ 캐나다 발삼은 비수용성 봉입제라 지방 염색 후에 쓰지 않는다.","⑤ PAS는 점액과 당원 같은 다당류를 파라핀절편에서 증명한다."],"k":"지방 방울 = 동결절편 + Oil red O(적색).","img":[],"s":"진단조직학","src":"M27-이19","ty":"변형","n":7},{"q":"간 생검 절편에서 간세포 세포질의 과립이 글리코겐인지 확인하려고 연속절편 하나는 PAS 염색, 다른 하나는 디아스타제 처리 후 PAS 염색(D-PAS)을 하였다. 글리코겐일 때의 결과는?","o":["PAS 음성, D-PAS 양성","PAS 양성, D-PAS 음성","PAS 청색, D-PAS 적자색","PAS 양성, D-PAS 양성","PAS 음성, D-PAS 음성"],"a":1,"e":"글리코겐은 PAS 양성이며 디아스타제로 분해되어 디아스타제-PAS에서 음성이 된다.","w":["① 글리코겐은 PAS 양성이다.","③ PAS 양성 색은 청색이 아니라 적자색이다.","④ D-PAS에서도 양성으로 남는 것은 중성점액이다.","⑤ 글리코겐은 PAS에서 적자색으로 염색된다."],"k":"글리코겐 = PAS +, D-PAS −.","img":[],"s":"진단조직학","src":"M26-이10","ty":"역변환","n":8},{"q":"자동침투기(자동조직처리기)에서 자동으로 진행되는 과정은?","o":["탈수 → 투명 → 침투","포매 → 박절 → 염색","탈파라핀 → 함수 → 염색","염색 → 탈수 → 봉입","박절 → 신전 → 건조"],"a":0,"e":"자동침투기는 알코올 탈수, 자일렌 투명, 파라핀 침투를 자동으로 진행한다. 포매, 박절, 염색은 별도 장비에서 한다.","w":["② 포매는 포매기, 박절은 박절기, 염색은 자동염색기에서 한다.","③ 탈파라핀, 함수, 염색은 박절한 절편을 자동염색기에서 처리하는 과정이다.","④ 염색 후 탈수와 봉입은 자동염색기와 자동봉입기의 일이다.","⑤ 박절 후 절편을 펴고 말리는 것은 부유 온수조와 신전기의 일이다."],"k":"자동침투기 = 탈수 → 투명 → 침투.","img":[],"s":"진단조직학","src":"T-2-14","ty":"역변환","n":9},{"q":"해리스 헤마톡실린 용액을 며칠 사용하면 용액 표면에 금속성 광택을 띠는 막이 생긴다. 이 광택물에 대한 내용으로 옳지 않은 것은?","o":["방치해도 남음","산화제 추가로 소실","사용 전 여과로 제거","산화된 피막","절편 얼룩의 원인"],"a":1,"e":"광택물은 과산화된 침전물이라 산화제를 더 넣으면 오히려 늘어난다. 사용 전에 여과하여 제거한다.","w":["① 방치하거나 시약을 더 넣어도 광택물은 없어지지 않는다.","③ 광택물은 사용 전 여과로 제거한다.","④ 광택물은 공기와 닿아 산화된 헤마테인 피막과 침전물이다.","⑤ 광택물이 절편에 붙으면 얼룩이 생긴다."],"k":"헤마톡실린 광택물 = 여과로 제거.","img":[],"s":"진단조직학","src":"M19-이22","ty":"부정전환","n":10},{"q":"검체 종류에 따라 고정 전후에 특수 처리가 필요하다. 검체와 처리의 연결로 옳은 것은?","o":["콩팥 생검 - 전부 파라핀","충수돌기 - 핀 고정","폐 - 관류고정","뼈 - 고정 전 탈회","근육 - 이소펜탄 급속 동결"],"a":4,"e":"근육 생검은 ATPase, NADH 같은 효소조직화학 검사를 위해 액체질소로 냉각한 이소펜탄에 급속 동결한다.","w":["① 콩팥 생검은 광학, 면역형광, 전자현미경용으로 3등분한다.","② 충수돌기는 끝부분 세로, 나머지 가로로 절취해 포매한다.","③ 폐는 기관지로 고정액을 주입하는 주입고정을 한다.","④ 뼈는 고정 후 탈회를 거쳐 표본을 만든다."],"k":"이소펜탄 급속 동결 = 근육.","img":[],"s":"진단조직학","src":"T-9-16","ty":"변형","n":11},{"q":"마손 삼색 염색은 핵, 세포질과 근육, 교원섬유를 서로 다른 색으로 나타낸다. 시약과 역할의 연결로 옳은 것은?","o":["인몰리브덴산 - 매염","아닐린 블루 - 교원섬유 청색","비브리히 스칼렛 - 핵 흑색","바이게르트 - 세포질 적색","부앵 용액 - 분별"],"a":1,"e":"마손 삼색에서 교원섬유는 아닐린 블루에 의해 청색으로 염색된다.","w":["① 인몰리브덴산-인텅스텐산은 교원섬유에서 적색 염료를 빼내는 분별제다.","③ 비브리히 스칼렛-산성 푹신은 세포질과 근육을 적색으로 염색한다.","④ 바이게르트 철 헤마톡실린은 핵을 흑색으로 염색한다.","⑤ 부앵 용액은 매염(후고정)을 담당한다."],"k":"MT: 아닐린 블루 = 교원섬유 청색.","img":[],"s":"진단조직학","src":"T-5-35","ty":"변형","n":12},{"q":"파라핀 블록을 박절할 때 조직의 석회화 부위나 파라핀 속 이물질이 칼날에 걸렸다. 이때 절편에 나타나는 결함은?","o":["부스러짐과 구멍","리본의 휨","교대 두께 줄무늬","수직 금과 갈라짐","압축과 주름"],"a":3,"e":"석회화된 부위나 파라핀 속 이물질이 칼에 걸리면 절편에 수직으로 금이 가며 갈라진다.","w":["① 부스러짐과 구멍은 탈수, 투명, 침투가 불완전할 때 생긴다.","② 리본이 휘는 것은 블록의 위아래 변이 칼날과 평행하지 않을 때다.","③ 두께가 교대로 달라지는 줄무늬는 블록이나 칼이 단단히 고정되지 않았을 때 생긴다.","⑤ 압축과 주름은 칼과 블록이 따뜻할 때 생긴다."],"k":"석회화, 이물질 = 수직 금, 갈라짐.","img":[],"s":"진단조직학","src":"M12-이9","ty":"역변환","n":13},{"q":"수술 중 받은 신선 조직에서 지방 성분을 증명하려고 Oil red O 염색을 계획하였다. 이 염색에 대한 내용으로 옳지 않은 것은?","o":["탈수, 투명 후 봉입","중성지질 적색","지용성 염료","동결절편 사용","용해성 차이 이용"],"a":0,"e":"지방과 지용성 염료는 알코올과 자일렌에 녹으므로 Oil red O 염색 후에는 탈수, 투명 없이 글리세린 젤리로 봉입한다.","w":["② Oil red O는 중성지질을 적색으로 염색한다.","③ Oil red O는 지용성 염료다.","④ 지방은 파라핀 처리 중 녹으므로 동결절편으로 염색한다.","⑤ 지방염색은 염료가 지방에 더 잘 녹는 용해성 차이를 이용한다."],"k":"Oil red O 후 탈수, 투명 생략, 글리세린 젤리 봉입.","img":[],"s":"진단조직학","src":"M28-이19","ty":"부정전환","n":14},{"q":"충수돌기(막창자꼬리) 절제 검체에서 벽의 층과 내강, 끝부분을 한 블록에서 모두 관찰하려 한다. 절취와 포매 방법으로 옳은 것은?","o":["공기주머니 형성","끝 세로, 나머지 가로","고정액 주입 후 통째로","펼쳐서 상피를 위로","전체 세로 절취"],"a":1,"e":"충수돌기는 끝부분을 세로로, 나머지를 가로로 절취해 종단면과 횡단면이 함께 나오도록 포매한다.","w":["① 공기주머니가 생기지 않게 포매해야 한다.","③ 고정액 주입은 폐의 고정법이다.","④ 피부, 위장관 조직은 모든 층이 보이도록 표면에 수직으로 세워 포매한다.","⑤ 몸통은 가로로 잘라 벽의 층과 내강을 보이게 한다."],"k":"충수 = 끝부분 세로 + 나머지 가로.","img":[],"s":"진단조직학","src":"M7-이16","ty":"역변환","n":15},{"q":"초미세박절기로 자른 초박절편이 물받이 수면에 뜨면 두께에 따라 다른 간섭색을 띤다. 간섭색과 두께의 연결로 옳은 것은?","o":["청색 - 240 nm 이상","녹색 - 190~240 nm","회색 - 60 nm 미만","자색 - 60~90 nm","은색 - 150~190 nm"],"a":2,"e":"수면에 뜬 초박절편의 색으로 두께를 판정하며, 회색은 60 nm 미만, 은색은 60~90 nm, 자색은 150~190 nm, 청색은 190~240 nm, 녹색은 240 nm 이상이다.","w":["① 청색은 190~240 nm다.","② 녹색은 240 nm 이상이다.","④ 자색은 150~190 nm다.","⑤ 은색은 60~90 nm로 투과전자현미경에 적당한 두께다."],"k":"초박절편 색: 회색 < 60, 은색 60~90, 자색 150~190, 청색 190~240, 녹색 > 240 nm.","img":[],"s":"진단조직학","src":"M21-이18","ty":"변형","n":16},{"q":"뼈 조직은 고정 후 탈회해야 박절할 수 있으며, 검사 목적에 따라 탈회제를 고른다. 탈회 방법에 대한 내용으로 옳지 않은 것은?","o":["효소용은 강산 급속 탈회","EDTA는 효소, 항원 보존","EDTA는 킬레이트 결합","질산 장시간 시 핵 염색 저하","이온교환수지, 전기분해로 촉진"],"a":0,"e":"효소조직화학 검사용 뼈 조직은 효소 활성을 보존하기 위해 중성 킬레이트제인 EDTA로 탈회한다.","w":["②, ③ EDTA는 킬레이트 결합으로 중성 부근에서 서서히 탈회해 효소와 항원을 보존한다.","④ 질산은 탈회가 빠르지만 오래 두면 핵 염색성이 떨어진다.","⑤ 이온교환수지는 칼슘 이온을 제거하고 전기분해는 칼슘 이온을 음극으로 끌어내 탈회를 촉진한다."],"k":"효소조직화학용 뼈 탈회 = EDTA.","img":[],"s":"진단조직학","src":"M21-이17","ty":"부정전환","n":17},{"q":"과거 출혈 부위의 혈철소를 Prussian blue 염색으로 증명한다. 이때 조직 내 3가 철과 반응하여 청색 침전을 만드는 시약은?","o":["과망간산칼륨","페리시안화칼륨","염화금","페로시안화칼륨","질산은"],"a":3,"e":"Prussian blue는 3가 철이 페로시안화칼륨과 반응하여 청색의 ferric ferrocyanide를 만드는 반응을 이용한다.","w":["① 과망간산칼륨은 멜라닌 표백이나 세망 염색의 산화에 쓴다.","② 페리시안화칼륨은 2가 철과 반응하는 Turnbull blue 반응의 시약이다.","③ 염화금은 은염색 뒤 색조를 안정시키는 조색제다.","⑤ 질산은은 von Kossa 염색에서 칼슘염과 치환되는 시약이다."],"k":"Prussian blue = Fe3+ + 페로시안화칼륨 → ferric ferrocyanide.","img":[],"s":"진단조직학","src":"M10-이11","ty":"역변환","n":18},{"q":"쉬프(Schiff) 시약 제조에 쓰는 성분과 역할의 연결로 옳은 것은?","o":["메타중아황산나트륨 - 분별","과요오드산 - 무색화","1N 염산 - 매염","활성탄 - 산화","염기성 푹신 - 염료 원료"],"a":4,"e":"쉬프 시약은 염료 원료인 염기성 푹신을 메타중아황산나트륨과 염산으로 무색화하고 활성탄으로 탈색하여 만든다.","w":["① 메타중아황산나트륨은 염기성 푹신을 무색으로 만드는 성분이다.","② 과요오드산은 쉬프 시약 성분이 아니라 PAS의 산화 단계에서 따로 쓴다.","③ 1N 염산은 염기성 푹신을 무색으로 만드는 성분이다.","④ 활성탄은 쉬프 시약의 색을 제거하는 데 쓴다."],"k":"쉬프 시약 = 염기성 푹신 + 메타중아황산나트륨 + 염산 + 활성탄.","img":[],"s":"진단조직학","src":"T-6-15","ty":"변형","n":19},{"q":"H&E 염색 후 상승 알코올 탈수가 불완전한 표본을 자일렌을 거쳐 발삼(balsam)으로 봉입하였다. 이 표본에 나타나는 현상은?","o":["백색 혼탁","얼음결정 산물","핵 과염색","포르말린 색소 침착","테두리 진한 기포"],"a":0,"e":"탈수가 덜 되어 남은 물이 발삼과 섞이지 못하면 봉입 후 표본이 백색으로 흐려진다.","w":["② 얼음결정 산물은 동결이 느릴 때 생긴다.","③ 핵 과염색은 산알코올 분별로 조절할 문제다.","④ 포르말린 색소는 산성 포르말린이 혈색소와 반응해 생긴다.","⑤ 테두리가 진한 기포는 봉입 과정에 공기가 들어갈 때 생긴다."],"k":"탈수 불완전 + 발삼 봉입 = 백색 혼탁.","img":[],"s":"진단조직학","src":"M14-이9","ty":"역변환","n":20},{"q":"바이게르트 철 헤마톡실린으로 핵을 염색하는 특수염색을 모두 고른 것은?\n가. 반 기슨 염색\n나. 마손 삼색 염색\n다. 일상 H&E 염색\n라. 말로리 PTAH 염색","o":["가, 나, 다","가, 나","나, 라","라","가, 나, 다, 라"],"a":1,"e":"바이게르트 철 헤마톡실린은 철 매염으로 산에 강해 반 기슨의 피크린산과 마손 삼색의 산성 염료에도 핵 염색이 유지되므로 두 염색의 핵 염색에 쓴다.","w":["① 다. 일상 H&E는 해리스나 메이어 같은 명반 헤마톡실린을 쓴다.","③ 라. PTAH는 인텅스텐산 헤마톡실린으로 핵과 가로무늬를 함께 염색한다.","④ 라만으로는 맞지 않으며 가와 나가 빠졌다.","⑤ 다와 라는 바이게르트 철 헤마톡실린을 쓰지 않는다."],"k":"바이게르트 철 헤마톡실린 = 반 기슨, 마손 삼색의 핵 염색.","img":[],"s":"진단조직학","src":"T-4-32","ty":"변형","n":21}],"practice":[{"q":"사진은 박절하여 염색한 파라핀 절편이다. 사진과 같은 결함을 바로잡기 위한 조치로 옳은 것은?","o":["칼날 이물질 제거","블록과 칼 고정대 조이기","투명 시간 단축","포매 온도 낮추기","경파라핀 재포매"],"a":1,"e":"칼날과 평행한 진한 띠와 연한 띠가 교대로 생긴 것은 블록이나 칼 고정대가 느슨해 박절 중 흔들렸기 때문이므로 단단히 조인다.","w":["① 칼날의 이물질은 칼날에 수직인 긁힌 자국의 원인이다.","③, ④ 투명 과다나 높은 포매 온도는 조직이 단단하고 부서지는 원인이다.","⑤ 연한 파라핀은 절편이 압축되고 주름지는 원인이다."],"k":"칼날과 평행한 두께 불균일 띠 = 고정대 조이기.","img":["tech2_prac_qa_tech_027.jpg"],"s":"진단조직학","src":"T-실3-25","ty":"변형","look":"칼날과 평행한 가로 방향으로 진하게 염색된 띠와 연하게 염색된 띠가 번갈아 나타나고, 띠 경계를 따라 절편이 벌어져 있다. 절편 두께가 일정하지 않아 생긴 염색 농도 차이다.","n":1},{"q":"사진의 현미경으로 관찰하는 초박절편을 건져 올리는 지지체는?","o":["코르크판","조직 카세트","덮개유리","구리 그리드(grid)","유리 슬라이드"],"a":3,"e":"사진은 투과전자현미경이며, 에폭시수지 포매 블록에서 자른 초박절편은 구리 그리드에 건져 올려 격자 사이로 전자선을 투과시켜 관찰한다.","w":["① 코르크판은 위, 장 같은 관강장기를 펼쳐 핀으로 고정할 때 쓴다.","② 조직 카세트는 조직처리와 포매 때 조직을 담는 용기다.","③ 덮개유리는 봉입할 때 쓴다.","⑤ 유리 슬라이드는 광학현미경용 파라핀 절편을 올린다."],"k":"투과전자현미경 초박절편 = 구리 그리드.","img":["mock2_m0399.jpg"],"s":"진단조직학","src":"M28-실5","ty":"변형","n":2},{"q":"사진의 장비는 온도 조절 다이얼로 물 온도를 40~45℃로 맞추어 사용한다. 이 온도에서 얻는 효과는?","o":["파라핀 침투","조직 동결","파라핀 용융 유지","절편 밀착 건조","절편 주름 펴짐"],"a":4,"e":"부유 온수조는 파라핀 융점보다 약 10℃ 낮은 40~45℃로 맞추어, 파라핀이 녹지 않고 부드러워져 절편의 주름이 펴지게 한다.","w":["① 파라핀 침투조는 60℃ 전후로 유지한다.","② 조직을 얼려 박절하는 장비는 동결절편기다.","③ 파라핀을 녹은 상태로 유지하는 분주기는 약 60℃다.","④ 절편 건조, 부착은 신전기에서 약 60℃로 한다."],"k":"부유 온수조 40~45℃ = 융점보다 약 10℃ 낮게.","img":["tech2_prac_tech_032.jpg"],"s":"진단조직학","src":"T-실3-11","ty":"역변환","look":"온도 조절 다이얼(TEMP. CONTROL)과 전원 스위치가 달린 둥근 수조로, 박절한 파라핀 절편 리본을 수면에 띄워 주름을 펴는 부유 온수조(flotation water bath)이다.","n":3},{"q":"사진과 같은 상을 얻기 위한 고정, 포매, 박절 과정으로 옳은 것은?","o":["포르말린 - 파라핀 - 회전식","글루타르알데하이드 - 에폭시 - 초박절","알코올 - 셀로이딘 - 활주식","FITC 항체 - 암소 관찰","급속 동결 - OCT - 동결절편"],"a":1,"e":"사진은 흑백의 초미세구조 단면상이므로 투과전자현미경 사진이며, 글루타르알데하이드 1차 고정, 에폭시 수지 포매, 초박절 과정을 거친다.","w":["① 파라핀 포매와 회전식 박절은 광학현미경 표본 과정이다.","③ 셀로이딘 포매와 활주식 박절은 큰 조직의 광학현미경 표본 과정이다.","④ FITC 표지 항체는 형광현미경 표본에 쓴다.","⑤ OCT 동결절편은 신속 진단과 지질, 효소 검출용이다."],"k":"투과전자현미경 = 글루타르알데하이드, 에폭시, 초박절.","img":["mock2_m0055.jpg"],"s":"진단조직학","src":"M17-실7","ty":"변형","n":4},{"q":"사진의 장비(신전기)는 파라핀 절편을 건져 올린 슬라이드를 약 60℃에서 처리한다. 이 장비를 사용하는 목적은?","o":["블록 냉각","절편 밀착, 건조","리본 주름 펴기","파라핀 침투","파라핀 분주"],"a":1,"e":"신전기에서는 약 60℃로 60분 정도 건조하여 절편을 슬라이드에 밀착시킨다.","w":["① 블록 냉각은 조직포매장치의 냉각판에서 한다.","③ 절편 리본을 띄워 주름을 펴는 것은 40~45℃의 부유 온수조다.","④ 파라핀 침투는 자동침투기에서 한다.","⑤ 파라핀을 녹여 분주하는 것은 조직포매장치의 분주기다."],"k":"신전기 = 약 60℃, 60분 건조, 절편 밀착.","img":["mock1_m0381.jpg"],"s":"진단조직학","src":"M12-실10","ty":"역변환","n":5},{"q":"사진은 페트리 접시 안 파라필름 위에 두 가지 염색액 방울을 떨어뜨려 놓은 모습이다. 이 과정에서 사용하는 두 염색액은?","o":["DAB, 과산화수소","사산화오스뮴, 글루타르알데하이드","초산우라닐, 구연산납","톨루이딘 블루, 에오신","헤마톡실린, 에오신"],"a":2,"e":"사진은 전자현미경 염색 과정으로, 초산우라닐(uranyl acetate)과 구연산납(lead citrate)으로 이중 전자염색한다.","w":["① DAB와 과산화수소는 면역조직화학 발색에 쓴다.","② 글루타르알데하이드와 사산화오스뮴은 1차, 2차 고정액이다.","④ 톨루이딘 블루는 반박절편에서 관찰 부위를 정할 때 쓴다.","⑤ 헤마톡실린과 에오신은 광학현미경 일반 염색이다."],"k":"전자현미경 이중염색 = 초산우라닐 + 구연산납.","img":["tech2_prac_qa_tech_094.jpg"],"s":"진단조직학","src":"T-실10-19","ty":"변형","look":"황색의 uranyl acetate 용액(무수에탄올 25 mL에 초산우라닐 1.5 g)과 lead citrate 용액(질산납 1.33 g, 구연산나트륨 1.76 g, 증류수 30 mL)이 있고, 페트리 접시 안 파라필름 위에 염색액 방울이 떨어져 있다.","n":6},{"q":"사진의 염색에서 진균 세포벽 다당류를 산화시키는 시약은?","o":["Picric acid","Periodic acid","Chromic acid","Osmic acid","Acetic acid"],"a":2,"e":"녹색 배경에 흑색 균사가 보이는 Grocott 메테나민 은(GMS) 염색으로, 크롬산이 진균 다당류를 산화해 은을 환원시키게 한다.","w":["① Picric acid는 Bouin 고정액과 반 기슨 염색의 성분이다.","② Periodic acid는 PAS 염색의 산화제다.","④ Osmic acid는 지방 고정, 염색에 쓴다.","⑤ Acetic acid는 산화제가 아니다."],"k":"GMS 산화제 = 크롬산.","img":["mock1_m0059.jpg"],"s":"진단조직학","src":"M8-실5","ty":"변형","n":8}]},{"no":"T2","theory":[{"n":1,"s":"진단조직학","q":"","o":[],"img":[]},{"n":2,"s":"진단조직학","q":"","o":[],"img":[]},{"n":3,"s":"진단조직학","q":"","o":[],"i function stemHTML(t){

/* ---------- 실기 사진 판독 연습 (실기 사진 문항을 해설 없이 연속으로) ---------- */
const photoAll = c => ALLQ.filter(q => q._part === 'practice' && q.img && q.img.length && usable(q) && (!c || q._code === c));
const PHOTO_N = new Set(ALLQ.flatMap(q => q.img || []).concat(DATA.M.concat(DATA.SM ? SUBJ_ORDER.flatMap(c => DATA.SM[c] || []) : []).flatMap(r => r.theory.concat(r.practice).flatMap(q => q.img || [])))).size;
function startCards(c, pool){ cards = {pool: pool || shuffle(photoAll(c)).slice(0, 16), i: 0, wrong: [], c}; go(cardRun, '실기 사진 판독 연습', SUBJ_NAME[c]); }
let cards = null;
function cardRun(){
  const {pool, i} = cards, q = pool[i];
  $view.append(el(`<div class="qtop"><span class="mono">${i + 1} / ${pool.length}</span><span class="pbar"><i style="width:${pct(i + 1, pool.length)}%"></i></span><span>틀림 ${cards.wrong.length}</span></div>`));
  $view.append(el(qCardHTML(q, '사진 ' + (i + 1), '')));
  const card = $view.querySelector('.qcard'); fillImgs($view);
  card.querySelectorAll('.opt').forEach(b => b.onclick = () => {
    const c = +b.dataset.i; record(q, c); const ok = isOk(q, c); if (!ok) cards.wrong.push(q);
    card.querySelectorAll('.opt').forEach(x => { const k = +x.dataset.i; x.disabled = true; if (isOk(q, k)) x.classList.add('correct'); else if (k === c) x.classList.add('wrong'); });
    const at = cur; setTimeout(() => { if (cur !== at) return; if (i + 1 < pool.length) { cards.i++; show(cardRun, cur.title, cur.sub, false); } else show(cardDone, cur.title, cur.sub, false); }, ok ? 450 : 1100);
  });
}
function cardDone(){
  const n = cards.pool.length, w = cards.wrong.length;
  $view.append(el(`<div class="card celebrate" style="margin-top:16px"><div class="score">${n - w}/${n}</div><p class="lede">${SUBJ_NAME[cards.c]} 실기 사진 판독 · 정답 ${n - w}문항</p><div class="row" style="justify-content:center;margin-top:14px">${w ? `<button class="btn eosin" id="rw">오답 ${w}문항 해설과 다시 풀기</button>` : ''}<button class="btn" id="more">새 16문항</button></div></div>`));
  const rw = document.getElementById('rw'); if (rw) rw.onclick = () => startRun(cards.wrong, '사진 판독 오답');
  document.getElementById('more').onclick = () => { stack.pop(); startCards(cards.c); };
}

}

/* ---------- 모의고사 ---------- */
let mockTab = 'all';

    <p class="lede">${sub ? `${SUBJ_NAME[mockTab]} 한 과목만 30문항(이론과 실기). 챕터 연습에서 푼 내용을 발문을 바꾸거나 거꾸로 묻는 다른 유형으로 다시 만나도록 새로 구성했습니다. 회차마다 문항이 겹치지 않습니다.` : '국가시험 과목 순서로 이론 30문항(병리학·조직학·조직검사학·진단세포학)과 실기 사진 문항을 한 회에 담았습니다. 한 회를 세 부분(약 12분씩)으로 나눠 풀 수 있고, 채점하면 과목별 점수·약점·해설이 나옵니다.'}</p><div class="rounds" id="rounds"></div>`);
  $view.append(f);
  $view.querySelectorAll('#mtab button').forEach(b => b.onclick = () => { mockTab = b.dataset.k; show(cur.fn, cur.title, cur.sub, false); });

  (sub ? DATA.SM[mockTab].map((r, i) => mockTab + (i + 1)) : DATA.M.map(r => r.no)).forEach(no => {

    box.append(b);

let mockState = null, timer = null;
function stopTimer(){ if (timer) { clearInterval(timer); timer = null; } }
const mmss = s => String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
const mockSeq = no => { const r = MK(no); return r.theory.map(q => ({q, part: '이론', key: 't' + q.n})).concat(r.practice.map(q => ({q, part: '실기', key: 'p' + q.n}))); };
/* 나눠 풀기: 이론 앞·뒤 절반, 실기. 고른 답은 바로 저장되어 언제 나가도 이어서 푼다 */
function mockParts(no){ const r = MK(no), nt = r.theory.length, np = r.practice.length, h = Math.ceil(nt / 2);
  return [{k: 1, d: `이론 1~${h}번`, a: 0, b: h}, {k: 2, d: `이론 ${h + 1}~${nt}번`, a: h, b: nt}, {k: 3, d: `실기 ${np}문항`, a: nt, b: nt + np}]; }
const mins = n => Math.max(5, Math.round(n * 0.8));
function mockIntro(no){
  const rec = S.mock[no], seq = mockSeq(no), n = seq.length, dr = S.draft[no], ans = dr ? dr.ans : {}, done = Object.keys(ans).length;
  const parts = mockParts(no), cnt = p => seq.slice(p.a, p.b).filter(x => ans[x.key] !== undefined).length;
  $view.append(el(`<h1>${mockName(no)}</h1><p class="lede">${n}문항 · ${typeof no === 'number' ? '과목 순서' : '이론 다음 실기'}. 한 번에 풀어도 되고, 쉬는 시간마다 한 부분씩 나눠 풀어도 됩니다. 고른 답은 바로 저장되어 중간에 나가도 이어집니다.${(no === 1 || no === mockTab + '1') && !rec ? ' 채점하면 과목별 약점과 먼저 볼 챕터를 알려 드립니다.' : ''}</p>
    <div class="parts">${parts.map(p => { const c = cnt(p), m = p.b - p.a; return `<button class="tile part ${c === m ? 'full' : ''}" data-p="${p.k}"><span class="ic hema">${c === m ? '✓' : p.k + '부'}</span><span class="t">${p.d}<small>약 ${mins(m)}분 · ${c ? `${c}/${m} 답함` : `${m}문항`}</small></span><span class="arrow">›</span></button>`; }).join('')}</div>
    <div class="row" style="margin-top:14px">${done ? `<button class="btn eosin wide" id="grade">채점하기 · ${done}/${n} 답함</button><button class="btn" id="restart">처음부터</button>` : `<button class="btn primary wide" id="begin">${rec ? '다시 응시' : '한 번에 전체 풀기'} · 약 ${mins(n)}분</button>`}</div>
    ${rec ? `<div class="row" style="margin-top:8px"><button class="btn wide" id="review">지난 결과 보기 · ${rec.score}/${rec.n || n} · ${new Date(rec.t).toLocaleDateString('ko-KR')}</button></div>` : ''}
    <div id="confirm"></div>`));
  const start = (a, b, at) => { const d = S.draft[no] || (S.draft[no] = {ans: {}, sec: 0}); save(); mockState = {no, ans: d.ans, start: Date.now(), base: d.sec || 0, a, b}; show(() => mockRun(at), cur.title, a === 0 && b === n ? '전체' : parts.find(p => p.a === a).k + '부', false); };
  $view.querySelectorAll('.part').forEach(t => t.onclick = () => { const p = parts[+t.dataset.p - 1]; const first = seq.slice(p.a, p.b).findIndex(x => ans[x.key] === undefined); start(p.a, p.b, p.a + Math.max(0, first)); });
  const bg = document.getElementById('begin'); if (bg) bg.onclick = () => { delete S.draft[no]; start(0, n, 0); };
  const gr = document.getElementById('grade'); if (gr) gr.onclick = () => {
    const fin = () => mockFinish(no);
    if (done === n) return fin();
    document.getElementById('confirm').replaceChildren(el(`<div class="confirm">${n - done}문항에 아직 답하지 않았습니다. 답하지 않은 문항은 틀린 것으로 채점합니다. <button class="btn eosin" id="yes">채점</button><button class="btn" id="no">계속 풀기</button></div>`));
    document.getElementById('yes').onclick = fin; document.getElementById('no').onclick = () => document.getElementById('confirm').replaceChildren();
  };
  const rs = document.getElementById('restart'); if (rs) rs.onclick = () => { delete S.draft[no]; save(); show(cur.fn, cur.title, cur.sub, false); };
  const rv = document.getElementById('review'); if (rv) rv.onclick = () => { mockState = {no, ans: rec.ans, start: 0, sec: rec.sec}; go(() => mockResult(false), mockName(no) + ' 결과'); };
}
function mockFinish(no){ const d = S.draft[no] || {ans: {}, sec: 0}; mockState = {no, ans: d.ans, sec: d.sec}; delete S.draft[no]; save(); show(() => mockResult(true), mockName(no) + ' 결과', '', false); }
const mockSec = () => mockState.base + Math.round((Date.now() - mockState.start) / 1000);
function mockRun(idx){
