include_title = ["expert", "medical", "life science", "linguist", "korean", "reviewer", "evaluator"]

[[source]]
id = "mercor"
type = "ashby"
enabled = true
organization = "Mercor"
board = "mercor"
include_title = ["expert", "medical", "biology", "pathology", "laboratory", "clinical", "health", "science", "phd", "professor", "korean"]

[[source]]
id = "micro1"
type = "ashby"
enabled = true
organization = "micro1"
board = "micro1"
include_title = ["expert", "medical", "biology", "health", "science", "phd", "korean"]

# ── 5. RSS – Google Alerts 를 RSS 로 받아 등록하면 가장 안정적 ──────
# Google Alerts(https://www.google.com/alerts) → 검색어 입력 → 옵션 "전송 대상: RSS 피드"
# 권장 검색어: "subject matter expert" laboratory consultancy / "e-learning" "laboratory" consultant /
#              "expert network" "laboratory medicine" / 임상병리 이러닝 / 평가위원 모집 보건의료
[[source]]
id = "google-alerts-example"
type = "rss"
enabled = false
organization = "Google Alerts"
url = "https://www.google.com/alerts/feeds/REPLACE_WITH_YOUR_FEED_ID"
