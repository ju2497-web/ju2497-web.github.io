# ─────────────────────────────────────────────────────────────
# Revenue Agent – 교수님 프로필 & 목표 설정
# 이 파일의 값이 적합도 점수, 지원서 초안, 대시보드 목표에 쓰입니다.
# [ ] 로 표시된 칸은 사실만 채워 주세요 (지원서 초안에 그대로 들어갑니다).
# ─────────────────────────────────────────────────────────────

[identity]
name = "[Your Name], PhD"
title = "Professor, Department of Clinical Laboratory Science"
institution = "[University Name], Republic of Korea"
email = "[email]"
timezone = "GMT+9 (Korea)"

[positioning]
headline = "Biomedical / Laboratory Medicine Subject Matter Expert + Academic Course Architect + Medical AI / Scientific Content Expert"
premium_bio = """University Professor and Biomedical Subject Matter Expert specializing in laboratory medicine, \
cytogenetics, molecular diagnostics, cancer genomics, hematologic malignancies, and medical AI. \
Experienced in academic curriculum development, online course production, scientific publication, \
research review, assessment design, and AI-enhanced education. Capable of translating complex biomedical \
science into structured professional learning content, case-based education, assessment frameworks, \
and evidence-based digital curricula."""

# 실제 경력을 국제 컨설팅 용어로 재구성할 때 쓰는 역할명 (사실에 맞는 것만 사용)
reframed_roles = [
  "Subject Matter Expert",
  "Curriculum Developer",
  "Course Author",
  "Academic Course Architect",
  "Assessment Designer",
  "Online Learning Developer",
  "AI-enhanced Learning Designer",
  "Learning Content Reviewer",
  "Biomedical Education Consultant",
]

# 증빙 가능한 수치만 입력하세요. 비워 두면 초안에 [ ] 로 남습니다.
[evidence]
years_teaching = ""
years_elearning = ""
elearning_courses = ""
sci_publications = ""
learners_reached = ""
elearning_clients = "[e.g., KOREATECH, university e-learning centre]"

