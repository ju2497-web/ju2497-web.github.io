# ── 요율 기준 (지원서 초안의 제안 요율에 사용; 교수님이 직접 조정) ──
# basis: 모두 ESTIMATE – 시장 통상 범위에 대한 추정이며 공고 사실이 아님
[rates]
min_hourly_usd = 50
target_hourly_usd = 100
premium_hourly_usd = 150
intl_consultant_daily_usd = [400, 600]   # 국제기구 개인 컨설턴트 제안 일당 (추정)
expert_call_hourly_usd = [150, 300]      # 전문가 네트워크 자문 콜 (추정)
ai_expert_hourly_usd = [60, 120]         # AI 전문가 평가/학습데이터 (추정)
domestic_project_min_krw = 500000
domestic_project_target_krw = 1000000

[goals]
monthly_revenue_krw = 10000000

