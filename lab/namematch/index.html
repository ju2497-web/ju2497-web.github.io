<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>이름 궁합</title>
  <meta name="description" content="두 사람의 이름을 획수로 풀어 보는 고전 이름 궁합. 숫자 피라미드가 내려가며 궁합 점수가 나와요.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E💌%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../lab.css">
  <script src="../config.js"></script>
  <script src="../lab.js"></script>
  <style>
    .pyr { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; text-align: center; background: var(--bg); border-radius: 12px; padding: 12px 6px; margin: 10px 0; font-size: 1rem; line-height: 1.7; overflow-x: auto; white-space: pre; letter-spacing: .02em; }
    .pyr .nm { color: var(--muted); font-size: .8rem; font-family: "Noto Sans KR", sans-serif; letter-spacing: 0; }
    .pyr .fin { color: var(--brand); font-weight: 800; font-size: 1.2rem; }
  </style>
</head>
<body>
  <main class="lab">
    <div class="hero"><div class="emoji">💌</div><h1>이름 궁합</h1><p>연습장 뒤에 그리던 그 숫자 피라미드, 그대로 계산해 드려요</p></div>
    <div id="form" class="card">
      <div class="row">
        <div>
          <label class="f" for="n1">첫 번째 이름</label>
          <input type="text" id="n1" placeholder="예: 김지우" maxlength="10" autocomplete="off">
        </div>
        <div>
          <label class="f" for="n2">두 번째 이름</label>
          <input type="text" id="n2" placeholder="예: 박서준" maxlength="10" autocomplete="off">
        </div>
      </div>
      <p style="color:var(--muted);font-size:.85rem;margin:12px 0 0">성을 넣어도, 빼도 돼요. 둘 다 같은 방식으로 넣으면 비교하기 좋아요.</p>
      <button class="primary" id="go">궁합 보기</button>
    </div>
    <div id="out" hidden></div>
  </main>
  <script>
    Lab.init({ id: "namematch", title: "이름 궁합" });

    // 자모 획수표 (흔히 쓰는 기준)
    const CHO = [2,4,2,3,6,5,4,4,8,2,4,1,3,6,4,3,4,4,3]; // ㄱㄲㄴㄷㄸㄹㅁㅂㅃㅅㅆㅇㅈㅉㅊㅋㅌㅍㅎ
    const JUNG = [2,3,3,4,2,3,3,4,2,4,5,3,3,2,4,5,3,3,1,2,1]; // ㅏㅐㅑㅒㅓㅔㅕㅖㅗㅘㅙㅚㅛㅜㅝㅞㅟㅠㅡㅢㅣ
    const JONG = [0,2,4,4,2,5,5,3,5,7,9,9,7,9,9,8,4,4,6,2,4,1,3,4,3,4,4,3]; // (없음)ㄱㄲㄳㄴㄵㄶㄷㄹㄺㄻㄼㄽㄾㄿㅀㅁㅂㅄㅅㅆㅇㅈㅊㅋㅌㅍㅎ

    function strokes(ch) {
      const c = ch.charCodeAt(0) - 0xAC00;
      return CHO[Math.floor(c / 588)] + JUNG[Math.floor((c % 588) / 28)] + JONG[c % 28];
    }
    function hangulOnly(s) { return (s.match(/[가-힣]/g) || []).join(""); }
    function hasBatchim(s) { const c = s.charCodeAt(s.length - 1); return c >= 0xAC00 && c <= 0xD7A3 && (c - 0xAC00) % 28 !== 0; }
    function ya(s) { return s + (hasBatchim(s) ? "아" : "야"); }
    function iga(s) { return s + (hasBatchim(s) ? "이" : ""); }

    const BANDS = [
      ["0~9점", "숫자가 이렇게 나올 수도 있군요. 이름끼리는 서먹해도 사람끼리는 모를 일이에요. 다음에 성 빼고 다시 해 보세요."],
      ["10~19점", "서로 다른 세계에서 온 두 이름이에요. 처음엔 어색하지만, 다른 만큼 배울 게 많은 사이예요."],
      ["20~29점", "조금 데면데면한 숫자지만 이름은 이름일 뿐이에요. 같이 밥 한 번 먹으면 숫자가 무색해져요."],
      ["30~39점", "천천히 가까워지는 사이예요. 급하게 친해지려 하지 않을수록 오래 가요."],
      ["40~49점", "반반이에요. 오늘은 안 맞다가 내일은 잘 맞는, 날씨 같은 두 이름이에요."],
      ["50~59점", "무난하게 잘 맞는 사이예요. 큰 사건 없이 오래 가는 조합이 사실 제일 귀해요."],
      ["60~69점", "꽤 잘 맞는 두 이름이에요. 서로 부르는 목소리에 벌써 정이 묻어 있어요."],
      ["70~79점", "좋은 궁합이에요. 한 사람이 웃으면 다른 사람도 따라 웃는 사이예요."],
      ["80~89점", "연습장에 이 숫자 나오면 그날 하루 종일 기분 좋았죠. 서로의 이름을 자주 부르게 될 거예요."],
      ["90~99점", "전설의 점수예요. 이 숫자는 캡처해서 보내야 해요. 이름부터 이미 서로를 알아봤어요."]
    ];

    const NICKS = [
      (a, b) => a + "둥이 & " + b + "둥이",
      (a, b) => "우리 " + iga(a) + " / 우리 " + iga(b),
      (a, b) => a + b + " 콤비",
      (a, b) => a + "님 & " + b + "님 (존댓말 커플)",
      (a, b) => a + "봉 / " + b + "봉",
      (a, b) => "'" + ya(a) + "' 하고 '" + ya(b) + "' 하고 부르는 게 제일 좋아요",
      (a, b) => a + "짱 & " + b + "짱",
      (a, b) => a + "이모 / " + b + "삼촌 (강아지 기준)",
      (a, b) => a + "쓰 & " + b + "쓰",
      (a, b) => "큰" + a + " / 작은" + b,
      (a, b) => a + "뿡 & " + b + "뿡",
      (a, b) => a + "선생 & " + b + "선생"
    ];

    function compute(s1, s2) {
      const a = s1.split("").map(strokes), b = s2.split("").map(strokes);
      const row = [];
      for (let i = 0; i < Math.max(a.length, b.length); i++) { if (i < a.length) row.push(a[i]); if (i < b.length) row.push(b[i]); }
      const rows = [row];
      let cur = row;
      while (cur.length > 2) { const n = []; for (let i = 0; i < cur.length - 1; i++) n.push((cur[i] + cur[i + 1]) % 10); rows.push(n); cur = n; }
      const score = (cur[0] % 10) * 10 + (cur[1] % 10);
      return { rows, score };
    }

    function pyramidHtml(s1, s2, rows) {
      const chars = [];
      for (let i = 0; i < Math.max(s1.length, s2.length); i++) { if (i < s1.length) chars.push(s1[i]); if (i < s2.length) chars.push(s2[i]); }
      const w = rows[0].length * 3;
      function line(arr) { const s = arr.map(n => String(n).padStart(2, " ")).join(" "); const pad = Math.max(0, Math.floor((w - s.length) / 2)); return " ".repeat(pad) + s; }
      const lines = ['<span class="nm">' + line(chars) + "</span>"];
      rows.forEach((r, i) => lines.push(i === rows.length - 1 ? '<span class="fin">' + line(r) + "</span>" : line(r)));
      return '<div class="pyr">' + lines.join("\n") + "</div>";
    }

    document.getElementById("go").onclick = () => {
      const raw1 = document.getElementById("n1").value, raw2 = document.getElementById("n2").value;
      const s1 = hangulOnly(raw1), s2 = hangulOnly(raw2);
      if (!s1 || !s2) { Lab.toast("한글 이름 두 개를 넣어 주세요"); return; }
      const dropped = (raw1.replace(/\s/g, "").length !== s1.length) || (raw2.replace(/\s/g, "").length !== s2.length);
      const { rows, score } = compute(s1, s2);
      const band = BANDS[Math.floor(score / 10)];
      const rnd = Lab.rng(Lab.hash(s1 + "|" + s2));
      const nick = Lab.pick(NICKS, rnd)(s1.slice(-1), s2.slice(-1));
      const html =
        '<span class="badge">' + s1 + " ♥ " + s2 + "</span>" +
        '<div class="big">' + score + "점</div>" +
        '<p class="sub">' + band[0] + "</p>" +
        pyramidHtml(s1, s2, rows) +
        "<p>" + band[1] + "</p>" +
        "<p><b>서로 부르는 애칭 추천</b><br>" + nick + "</p>" +
        (dropped ? '<p class="sub">한글이 아닌 글자는 계산에서 뺐어요.</p>' : "") +
        '<p class="sub">글자를 자음, 모음으로 나눠 획수를 더하고, 두 이름을 번갈아 세운 뒤 이웃한 숫자를 더해 내려가는 방식이에요. 순서를 바꿔 넣으면 다른 점수가 나오는 것도 이 놀이의 전통이에요.</p>';
      const share = s1 + " ♥ " + s2 + " 이름 궁합 " + score + "점\n" + band[1];
      document.getElementById("form").hidden = true;
      Lab.result("out", html, share, () => { document.getElementById("form").hidden = false; document.getElementById("out").hidden = true; window.scrollTo({ top: 0, behavior: "smooth" }); });
    };
    document.getElementById("n2").addEventListener("keydown", e => { if (e.key === "Enter") document.getElementById("go").click(); });
  </script>
</body>
</html>
