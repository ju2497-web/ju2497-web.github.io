<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>오늘의 운세</title>
  <meta name="description" content="생년월일로 보는 오늘 하루의 흐름. 총운, 금전, 연애, 일과 공부, 건강, 행운 포인트까지.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🔆%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../lab.css">
  <script src="../config.js"></script>
  <script src="../lab.js"></script>
</head>
<body>
  <main class="lab">
    <div class="hero"><div class="emoji">🔆</div><h1>오늘의 운세</h1><p>생년월일만 넣으면 오늘 하루의 흐름을 읽어 드려요</p></div>
    <div id="form" class="card">
      <label class="f" for="birth">생년월일</label>
      <input type="date" id="birth" min="1930-01-01" max="2025-12-31">
      <label class="f" for="name">이름 또는 별명 (선택, 같은 생일인 사람과 구분용)</label>
      <input type="text" id="name" placeholder="예: 지우" maxlength="12">
      <button class="primary" id="go">오늘 운세 보기</button>
    </div>
    <div id="out" hidden></div>
  </main>
  <script>
    Lab.init({ id: "fortune", title: "오늘의 운세" });
    const ZODIAC = ["원숭이","닭","개","돼지","쥐","소","호랑이","토끼","용","뱀","말","양"]; // year % 12
    const OVERALL = [
      "오래 미뤄 둔 일을 손대기 좋은 날입니다. 시작만 하면 생각보다 빨리 끝납니다.",
      "작은 오해가 생기기 쉬운 날입니다. 짧게라도 말로 확인하면 하루가 편해집니다.",
      "기다리던 소식이 늦게 오는 날입니다. 늦는 것이지 안 오는 것이 아닙니다.",
      "누군가의 부탁을 받는 날입니다. 들어주되, 내 일의 순서는 바꾸지 마세요.",
      "컨디션이 좋은 날입니다. 오후에 중요한 일을 두면 힘이 실립니다.",
      "평소보다 생각이 많아지는 날입니다. 결정은 내일로, 오늘은 메모만.",
      "뜻밖의 칭찬을 듣는 날입니다. 겸손보다 고맙다는 말이 어울립니다.",
      "돈이 새기 쉬운 날입니다. 장바구니에 넣고 하루 묵히면 반은 안 삽니다.",
      "오래 못 본 사람이 떠오르는 날입니다. 먼저 연락하면 좋은 대화가 됩니다.",
      "실수가 하나 나오지만 금방 수습되는 날입니다. 당황하지 않는 것이 전부입니다.",
      "집중이 잘 되는 날입니다. 알림을 끄고 한 가지만 붙들어 보세요.",
      "가벼운 마음으로 걷기 좋은 날입니다. 답은 책상이 아니라 길에서 나옵니다.",
      "주변 사람이 내 편이 되어 주는 날입니다. 혼자 끙끙대지 말고 말하세요.",
      "계획이 조금 어긋나는 날입니다. 어긋난 자리에 더 나은 일이 들어옵니다.",
      "정리 운이 있는 날입니다. 책상, 사진첩, 받은편지함 중 하나만 비워도 머리가 가벼워집니다.",
      "말보다 행동이 잘 통하는 날입니다. 설명을 줄이고 결과를 보여 주세요."
    ];
    const MONEY = [
      "들어올 돈은 제때, 나갈 돈은 조금 늦게. 큰 지출은 피하세요.",
      "작은 횡재수가 있습니다. 잊고 있던 환불이나 포인트를 확인해 보세요.",
      "충동구매 주의. 오늘 사고 싶은 것은 내일도 팔고 있습니다.",
      "돈 이야기를 꺼내기 좋은 날입니다. 받을 것이 있으면 정중하게 말하세요.",
      "지갑보다 시간을 아끼는 날입니다. 배달비보다 택시비가 아깝습니다.",
      "평소와 같습니다. 무리하지 않으면 손해도 없습니다.",
      "나를 위한 소비 하나는 괜찮습니다. 단, 정해 둔 금액 안에서.",
      "동료나 친구와 돈 거래는 피하세요. 관계까지 섞이기 쉬운 날입니다."
    ];
    const LOVE = [
      "연락이 올 사람에게서 연락이 옵니다. 답장은 너무 빠르지도 늦지도 않게.",
      "오해가 풀리는 날입니다. 먼저 한마디 건네면 분위기가 바뀝니다.",
      "혼자인 분은 자연스러운 자리에서 눈이 마주칠 수 있습니다. 꾸미지 말고 평소처럼.",
      "상대의 말보다 표정을 보세요. 오늘은 말이 다가 아닙니다.",
      "작은 선물이나 말 한마디가 크게 기억되는 날입니다.",
      "서로 바쁜 날입니다. 서운해하기보다 각자의 하루를 응원해 주세요.",
      "옛 인연 생각이 나지만 돌아갈 길은 아닙니다. 앞을 보세요.",
      "고백이나 중요한 대화는 저녁보다 낮이 좋습니다."
    ];
    const WORK = [
      "꼼꼼함이 빛나는 날입니다. 한 번 더 확인한 것이 나를 살립니다.",
      "아이디어가 잘 나옵니다. 떠오르는 즉시 적어 두세요.",
      "회의나 발표에서 짧게 말할수록 잘 전달됩니다.",
      "미뤄 둔 연락과 답장을 오전에 끝내면 오후가 가볍습니다.",
      "배우는 것이 잘 들어오는 날입니다. 어려운 부분을 오늘 공략하세요.",
      "실수가 보여도 남 탓은 금물. 조용히 고치면 평가가 올라갑니다.",
      "혼자보다 둘이 할 때 속도가 납니다. 도움을 청하세요.",
      "결과보다 과정이 평가받는 날입니다. 기록을 남기세요."
    ];
    const HEALTH = [
      "목과 어깨가 굳기 쉽습니다. 한 시간에 한 번 기지개.",
      "물을 평소보다 두 컵 더 마시면 오후 피로가 줄어듭니다.",
      "잠이 부족한 티가 나는 날입니다. 오늘은 30분 일찍 눕기.",
      "속이 예민할 수 있습니다. 맵고 찬 것은 조금만.",
      "걷기 좋은 날입니다. 한 정거장 먼저 내려 보세요.",
      "눈이 피로합니다. 화면에서 20분마다 20초 먼 곳 보기.",
      "컨디션 좋음. 미뤄 둔 운동을 다시 시작하기에 알맞습니다.",
      "스트레칭 5분이 오늘의 약입니다."
    ];
    const COLORS = ["하늘색","버건디","올리브","크림색","남색","연보라","주황","검정","흰색","초록","머스터드","분홍"];
    const ITEMS = ["손수건","텀블러","볼펜","작은 노트","이어폰","열쇠고리","손목시계","립밤","우산","동전","사탕","스티커"];
    const DIRS = ["동쪽","서쪽","남쪽","북쪽","남동쪽","북서쪽"];
    const TIMES = ["오전 9시~11시","오전 11시~오후 1시","오후 1시~3시","오후 3시~5시","오후 5시~7시","저녁 7시~9시"];
    const AVOID = ["늦은 밤 결제","빈속 커피","즉흥적인 약속 취소","남 이야기 전달","한 번 더 자기","확인 없이 보내기"];

    function stars(n) { return "★".repeat(n) + "☆".repeat(5 - n); }
    document.getElementById("go").onclick = () => {
      const b = document.getElementById("birth").value;
      if (!b) { Lab.toast("생년월일을 넣어 주세요"); return; }
      const name = document.getElementById("name").value.trim();
      const today = Lab.today();
      const rnd = Lab.rng(Lab.hash(b + "|" + name + "|" + today));
      const year = +b.slice(0, 4);
      const z = ZODIAC[year % 12];
      const score = 3 + Math.floor(rnd() * 3) - (rnd() < 0.25 ? 1 : 0); // 2~5
      const sub = { 금전: 2 + Math.floor(rnd() * 4), 연애: 2 + Math.floor(rnd() * 4), 일공부: 2 + Math.floor(rnd() * 4), 건강: 2 + Math.floor(rnd() * 4) };
      const html =
        '<span class="badge">' + today.replace(/-/g, ".") + " · " + z + "띠" + (name ? " · " + name : "") + "</span>" +
        '<div class="big">' + stars(score) + "</div>" +
        '<p class="sub">총운 ' + score + "점 / 5점</p>" +
        "<p>" + Lab.pick(OVERALL, rnd) + "</p>" +
        "<p><b>금전 " + stars(sub.금전) + "</b><br>" + Lab.pick(MONEY, rnd) + "</p>" +
        "<p><b>연애 " + stars(sub.연애) + "</b><br>" + Lab.pick(LOVE, rnd) + "</p>" +
        "<p><b>일·공부 " + stars(sub.일공부) + "</b><br>" + Lab.pick(WORK, rnd) + "</p>" +
        "<p><b>건강 " + stars(sub.건강) + "</b><br>" + Lab.pick(HEALTH, rnd) + "</p>" +
        '<p><span class="pill">행운의 색 ' + Lab.pick(COLORS, rnd) + '</span><span class="pill">행운의 물건 ' + Lab.pick(ITEMS, rnd) + '</span><span class="pill">좋은 방향 ' + Lab.pick(DIRS, rnd) + '</span><span class="pill">좋은 시간 ' + Lab.pick(TIMES, rnd) + '</span><span class="pill">오늘 피할 것 ' + Lab.pick(AVOID, rnd) + "</span></p>";
      const share = "오늘의 운세 " + stars(score) + " (" + z + "띠)\n" + Lab.pick(OVERALL, Lab.rng(Lab.hash(b + today)));
      document.getElementById("form").hidden = true;
      Lab.result("out", html, share, () => { document.getElementById("form").hidden = false; document.getElementById("out").hidden = true; });
    };
    try { const saved = localStorage.getItem("lab.birth"); if (saved) document.getElementById("birth").value = saved; } catch (e) {}
    document.getElementById("birth").addEventListener("change", e => { try { localStorage.setItem("lab.birth", e.target.value); } catch (x) {} });
  </script>
</body>
</html>
