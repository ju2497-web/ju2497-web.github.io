      ["조개구이","🐚","저","둘모","시","해","바다 냄새 가득한 저녁"],
      ["생선구이 정식","🐟","아점저","혼둘","가","해밥","담백하고 소박한 정식"],
      ["두부김치","🥬","야","둘모","든매","고매","따뜻한 두부와 볶음김치의 조화"],
      ["감자탕","🍲","저야","둘모배","든매해","고매","뼈 발라 먹다 보면 밤이 깊어져요"],
      ["샤브샤브","🍲","저","둘모","가시","고해","야채 듬뿍, 깔끔한 저녁"],
      ["훠궈","🍲","저","둘모","든매","고매면","마라와 백탕, 둘 다 즐겨요"],
      ["양꼬치","🍢","저야","둘모","든","고","지글지글 돌려 가며 먹는 밤"],
      ["케밥","🥙","점야","혼","든","빵고","한 손에 든든하게"],
      ["그릭요거트","🍧","아","혼","가달","","꾸덕하게 떠먹는 아침"],
      ["빙수","🍧","야","둘","시달","","더운 밤의 달콤한 피난처"],
      ["와플","🧇","야아","둘","달","빵","달콤한 디저트 타임"],
      ["닭죽","🥣","아","혼","가해","고밥","속 풀리는 따뜻한 한 그릇"],
      ["치킨마요 덮밥","🍚","점","혼","든달","밥고","달콤한 소스가 밥을 부르는 맛"],
      ["연어덮밥","🍣","점저","혼","가시","해밥","건강하고 고소한 한 끼"],
      ["소고기국밥","🍲","아점","혼","든해","고밥","얼큰하고 깊은 맛이에요"],
      ["냉모밀","🍜","점","혼둘","시가","면","차갑게 찍어 먹는 산뜻함"],
      ["우동 정식","🍱","점","혼","든","면","우동에 미니 덮밥까지, 알찬 구성"],
      ["닭한마리","🍲","저","모둘","든","고면","칼국수 사리로 마무리하는 모임 메뉴"],
      ["낙곱새","🍲","저야","둘모","매든","해고매","낙지 곱창 새우, 이름부터 풍성해요"],
      ["쌈밥 정식","🥬","점저","둘모","가든","고밥","쌈 한 입에 야채도 고기도 가득"],
      ["월남쌈","🥗","저","둘모","가시","해고","돌돌 말아 먹는 가벼운 저녁"],
      ["마제소바","🍜","점저","혼","든","면고","비벼 먹는 진한 소바, 밥 추가는 필수"]
    ];

    const MEAL = { 아: "아침", 점: "점심", 저: "저녁", 야: "야식" };
    const SITU = { 혼: "혼밥", 둘: "둘이", 모: "회식·모임", 배: "배달" };
    const MOOD = { 든: "든든하게", 가: "가볍게", 매: "매콤하게", 시: "시원하게", 달: "달달하게", 해: "해장" };
    const AVOID = { 면: "면", 밥: "밥", 빵: "빵", 고: "고기", 해: "해산물", 매: "매운맛" };
    const OPENERS = ["오늘의 결정은", "고민 끝, 정답은", "제 추천은", "배가 먼저 알아본 메뉴", "오늘은 이걸로 가요", "망설이지 마세요"];
    const CLOSERS = ["맛있게 드시고 좋은 하루 보내세요", "먹고 나면 고민이 사라질 거예요", "사진 한 장 남기는 것도 잊지 마세요", "오늘 하루도 든든하게 채우세요", "입맛이 돌아오는 소리가 들리네요"];

    // 시간대에 맞춰 끼니 기본값
    (function () {
      const h = new Date().getHours();
      document.getElementById("meal").value = h >= 5 && h < 10 ? "아" : h >= 10 && h < 15 ? "점" : h >= 15 && h < 21 ? "저" : "야";
    })();
    document.querySelectorAll("#moods button, #avoid button").forEach(b => b.onclick = () => b.classList.toggle("on"));
    function picked(id) { return [...document.querySelectorAll("#" + id + " button.on")].map(b => b.dataset.v); }
    try { const s = JSON.parse(localStorage.getItem("lab.menu.avoid") || "[]"); document.querySelectorAll("#avoid button").forEach(b => { if (s.includes(b.dataset.v)) b.classList.add("on"); }); } catch (e) {}

    let shown = [];   // 이미 보여 준 메뉴 이름
    let current = null; // 현재 필터 상태

    function filterMenus(f, exclude) {
      const list = MENUS.filter(m => !exclude.includes(m[0]))
        .filter(m => !f.avoid.some(a => m[5].includes(a)))
        .filter(m => !f.meal || m[2].includes(f.meal))
        .filter(m => !f.situ || m[3].includes(f.situ))
        .map(m => { const hit = f.moods.filter(x => m[4].includes(x)).length; return { m, hit }; })
        .filter(x => f.moods.length === 0 || x.hit > 0);
      return list.map(x => ({ m: x.m, w: 1 + x.hit * 2 + (f.moods.length && x.hit === f.moods.length ? 2 : 0) }));
    }
    function weightedPick(list) {
      const total = list.reduce((s, x) => s + x.w, 0);
      let r = Math.random() * total;
      for (const x of list) { r -= x.w; if (r <= 0) return x; }
      return list[list.length - 1];
    }
    function choose(f, exclude) {
      const steps = [
        { f: f, note: "" },
        { f: Object.assign({}, f, { moods: [] }), note: "기분 조건을 잠시 내려놓고 골랐어요" },
        { f: Object.assign({}, f, { moods: [], situ: "" }), note: "상황 조건까지 넓혀서 골랐어요" },
        { f: Object.assign({}, f, { moods: [], situ: "", meal: "" }), note: "끼니 구분 없이 넓게 골랐어요" },
        { f: { meal: "", situ: "", moods: [], avoid: [] }, note: "피할 것까지 모두 풀어야 고를 수 있었어요. 오늘은 조금 너그럽게 봐 주세요" }
      ];
      for (const s of steps) {
        let list = filterMenus(s.f, exclude);
        if (list.length < 3) list = filterMenus(s.f, []); // 다 보여 줬으면 다시 처음부터
        if (list.length >= 1) {
          const picks = [];
          const pool = list.slice();
          while (picks.length < 3 && pool.length) { const p = weightedPick(pool); picks.push(p.m); pool.splice(pool.indexOf(p), 1); }
          return { picks, note: s.note };
        }
      }
      return { picks: [Lab.pick(MENUS)], note: "" };
    }

    function spinThen(f, exclude, cb) {
      const out = document.getElementById("out");
      out.innerHTML = '<div class="card spin"><div class="name blur" id="spinName">🍽️</div><div class="sub">고르는 중이에요...</div></div>';
      out.hidden = false;
      out.scrollIntoView({ behavior: "smooth", block: "start" });
      const el = document.getElementById("spinName");
      const pool = MENUS.slice();
      const start = Date.now();
      let delay = 60;
      (function tick() {
        const m = Lab.pick(pool);
        el.textContent = m[1] + " " + m[0];
        const t = Date.now() - start;
        if (t >= 1500) { el.classList.remove("blur"); cb(); return; }
        delay = t > 1100 ? 160 : t > 800 ? 100 : 60;
        setTimeout(tick, delay);
      })();
    }

    function render(f, exclude) {
      const r = choose(f, exclude);
      const main = r.picks[0], alts = r.picks.slice(1);
      shown = shown.concat(r.picks.map(m => m[0]));
      const tags = [MEAL[f.meal], SITU[f.situ]].concat(f.moods.map(x => MOOD[x])).filter(Boolean);
      const html =
        '<span class="badge">' + tags.join(" · ") + "</span>" +
        '<p class="sub" style="margin:10px 0 0">' + Lab.pick(OPENERS) + "</p>" +
        '<div class="dish">' + main[1] + "</div>" +
        '<div class="big">' + main[0] + "</div>" +
        "<p>" + main[6] + ".</p>" +
        (r.note ? '<p class="note">' + r.note + ".</p>" : "") +
        (alts.length ? '<p class="sub" style="margin-bottom:4px">이것도 괜찮아요</p><div class="alt">' +
          alts.map(a => "<div><div class=\"e\">" + a[1] + "</div><b>" + a[0] + "</b><span>" + a[6] + "</span></div>").join("") + "</div>" : "") +
        "<p class=\"sub\">" + Lab.pick(CLOSERS) + ".</p>" +
        (f.avoid.length ? "<p>" + f.avoid.map(a => '<span class="pill">' + AVOID[a] + " 제외</span>").join("") + "</p>" : "") +
        '<button class="ghost" id="again" style="width:100%">다른 거</button>';
      const share = "오늘 뭐 먹지? 제 답은 " + main[1] + " " + main[0] + "!\n" + main[6] + "." + (alts.length ? "\n대안: " + alts.map(a => a[0]).join(", ") : "");
      Lab.result("out", html, share, () => {
        document.getElementById("form").hidden = false; document.getElementById("out").hidden = true;
      });
      document.getElementById("again").onclick = () => spinThen(f, shown, () => render(f, shown));
    }

    document.getElementById("go").onclick = () => {
      current = { meal: document.getElementById("meal").value, situ: document.getElementById("situ").value, moods: picked("moods"), avoid: picked("avoid") };
      try { localStorage.setItem("lab.menu.avoid", JSON.stringify(current.avoid)); } catch (e) {}
      shown = [];
      document.getElementById("form").hidden = true;
      spinThen(current, shown, () => render(current, shown));
    };
  </script>
</body>
</html>
