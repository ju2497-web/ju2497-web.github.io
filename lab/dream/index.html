<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>꿈 해몽 사전</title>
  <meta name="description" content="뱀, 돼지, 이빨, 똥, 물까지 130가지 꿈 키워드를 바로 찾아보고, 꿈 이야기를 통째로 붙여 넣으면 숨은 단서를 골라 드려요.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🌙%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../lab.css">
  <script src="../config.js"></script>
  <script src="../lab.js"></script>
  <style>
    .today { background: linear-gradient(135deg, var(--brand-soft), var(--card)); }
    .today .k { font-size: 1.3rem; font-weight: 800; margin: 2px 0 4px; }
    .tag { display: inline-block; border-radius: 999px; padding: 2px 10px; font-size: .75rem; font-weight: 700; vertical-align: middle; }
    .tag.g { background: #e6f7ec; color: #1f7a3f; } .tag.b { background: #fde8e8; color: #b23a3a; } .tag.n { background: var(--line); color: var(--muted); }
    @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tag.g { background: #163d26; color: #8fe0ab; } :root:not([data-theme="light"]) .tag.b { background: #4a1f1f; color: #ffb3b3; } }
    .list { display: grid; gap: 8px; margin-top: 10px; }
    .ent { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; cursor: pointer; background: var(--card); }
    .ent:hover { border-color: var(--brand); }
    .ent .h { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
    .ent .h b { font-size: 1.02rem; }
    .ent .syn { font-size: .78rem; color: var(--muted); margin-top: 2px; }
    .ent .body { display: none; margin-top: 8px; font-size: .92rem; border-top: 1px dashed var(--line); padding-top: 8px; }
    .ent.open .body { display: block; }
    .ent .body p { margin: 0 0 6px; }
    .ent .body small { color: var(--muted); font-weight: 700; display: block; font-size: .75rem; }
    .cnt { font-size: .8rem; color: var(--muted); margin-top: 8px; }
    .result .ent { cursor: pointer; }
    textarea { min-height: 110px; resize: vertical; }
    .sum { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0 10px; }
    .chipq { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 8px; }
    .chipq button { padding: 5px 11px; font-size: .82rem; border-radius: 999px; }
  </style>
</head>
<body>
  <main class="lab">
    <div class="hero"><div class="emoji">🌙</div><h1>꿈 해몽 사전</h1><p>어젯밤 꿈, 무슨 뜻이었을까요. 단어 하나면 충분해요</p></div>
    <div id="todayCard" class="card today"></div>
    <div id="form" class="card">
      <label class="f" for="q">꿈에 나온 것</label>
      <input type="search" id="q" placeholder="예: 뱀, 돼지, 이빨, 똥, 물..." autocomplete="off">
      <div class="chipq" id="quick"></div>
      <div class="cnt" id="cnt"></div>
      <div class="list" id="list"></div>
      <label class="f" for="memo" style="margin-top:18px">꿈 메모 (꿈 이야기를 통째로 붙여 넣어도 돼요)</label>
      <textarea id="memo" placeholder="예: 집에 큰 뱀이 들어왔는데 무서워서 도망치다가 이빨이 빠졌어요. 그런데 밖에 비가 오고 있었어요."></textarea>
      <button class="primary" id="go">꿈 풀어 보기</button>
    </div>
    <div id="out" hidden></div>
  </main>
  <script>
    Lab.init({ id: "dream", title: "꿈 해몽 사전" });

    // [키워드, 동의어, 길/흉/중, 전통 해석(2문장), 요즘 식 해석(1문장)]
    const D = [
      ["뱀","구렁이,독사,뱀이","길","재물과 기회가 들어오는 꿈으로 봅니다. 뱀이 몸을 감거나 집으로 들어오면 큰 재물운, 뱀에게 물리면 뜻밖의 횡재로 풀이합니다.","묵혀 둔 일이 드디어 움직일 조짐이니 들어오는 제안을 가볍게 넘기지 마세요."],
      ["돼지","멧돼지,돼지새끼,돼지가","길","돼지는 복과 재물의 상징입니다. 돼지가 집에 들어오거나 품에 안기면 큰 복이 들어온다고 봅니다.","미뤄 둔 연봉 이야기나 가격 제안을 꺼내 볼 때라는 신호로 읽어도 좋아요."],
      ["호랑이","범,호랑이가","길","권세와 명예, 귀인을 뜻합니다. 호랑이가 집에 들어오면 귀한 자식이나 큰 성취를 얻는다고 풀이합니다.","든든한 멘토나 윗사람의 도움이 가까이 있다는 신호예요."],
      ["용","이무기,용이,용을,용꿈","길","최고의 길몽으로 꼽힙니다. 용이 하늘로 오르면 큰 성공, 용을 타면 출세로 봅니다.","오래 준비한 일이 한 단계 올라설 때이니 지원서나 제안서를 내기 좋은 타이밍이에요."],
      ["개","강아지,멍멍이,개가,개한테","중","충직한 친구나 가까운 사람을 뜻합니다. 개가 반기면 좋은 인연, 개에게 물리면 가까운 사람과의 다툼을 조심하라고 봅니다.","주변 사람과의 관계가 마음에 걸려 있다는 뜻, 연락 한 번이면 풀릴 수 있어요."],
      ["고양이","냥이,새끼고양이,고양이가","중","예민한 상황이나 숨은 속내를 상징합니다. 고양이가 품에 안기면 작은 행운, 할퀴면 구설수를 조심합니다.","혼자만의 시간이 필요하다는 몸의 메시지일 수 있어요."],
      ["물고기","붕어,잉어,생선,물고기를","길","재물과 태몽의 대표 상징입니다. 큰 물고기를 잡으면 재물, 물고기가 품에 들어오면 태몽으로 봅니다.","뭔가를 꼭 잡고 싶은 마음이 커진 상태이니 목표를 구체적으로 적어 보세요."],
      ["새","참새,비둘기,독수리,까치,새가,새들","길","소식과 자유를 뜻합니다. 새가 날아들면 반가운 소식, 새가 날아가면 아쉬운 이별로 봅니다.","기다리는 연락이 있다면 곧 답이 올 수 있어요."],
      ["쥐","생쥐,들쥐,쥐가","흉","작은 손실이나 도둑, 걱정거리를 뜻합니다. 쥐를 잡으면 걱정이 사라지고, 쥐가 많으면 잔근심이 쌓인다고 봅니다.","새는 지출이나 구독을 점검해 보라는 신호예요."],
      ["말","백마,경마,말을 타,말이 달","길","추진력과 출세를 뜻합니다. 말을 타고 달리면 일이 빨리 풀리고, 말에서 떨어지면 계획 차질을 조심합니다.","속도를 내고 싶은 마음, 지금 추진해도 괜찮다는 뜻이에요."],
      ["소","황소,송아지,소가,소를","길","재산과 성실한 결실을 뜻합니다. 소가 집에 들어오면 재물이 쌓이고, 소를 잃으면 손재수로 봅니다.","꾸준히 해 온 일이 보상받을 때가 가까워졌어요."],
      ["닭","병아리,수탉,암탉,닭이","중","새벽을 알리는 닭은 새 시작을 뜻합니다. 닭이 울면 좋은 소식, 닭을 잡으면 작은 다툼으로 봅니다.","새 루틴을 시작하기 좋은 때라는 뜻이에요."],
      ["토끼","산토끼,토끼가","길","다산과 귀여운 복을 뜻합니다. 토끼를 안으면 연애운, 토끼가 뛰어가면 기회를 놓칠까 조심합니다.","가벼운 설렘이 찾아올 때예요."],
      ["곰","반달곰,북극곰,곰이,곰한테","중","큰 힘과 보호자를 뜻합니다. 곰에게 쫓기면 버거운 상사나 압박, 곰을 이기면 큰 난관을 넘는다고 봅니다.","혼자 감당하기 큰 일을 안고 있는지 돌아보세요."],
      ["늑대","이리,늑대가","흉","경쟁자나 위협을 뜻합니다. 늑대 무리를 보면 주변의 시기를, 늑대를 쫓아내면 위기를 넘긴다고 봅니다.","경계심이 올라간 상태이니 믿을 사람을 가려 보세요."],
      ["여우","구미호,여우가","흉","교활함과 유혹을 뜻합니다. 여우에게 홀리면 사기나 구설, 여우를 잡으면 속임수를 밝혀낸다고 봅니다.","너무 좋은 제안에는 한 번 더 조건을 읽어 보세요."],
      ["사자","숫사자,사자가","길","권위와 승리를 뜻합니다. 사자를 타거나 사자가 따르면 명예를 얻고, 사자에게 쫓기면 강한 경쟁을 겪습니다.","리더 역할이 주어질 수 있어요."],
      ["코끼리","코끼리가","길","큰 재물과 든든한 뒷배를 뜻합니다. 코끼리를 타면 성공, 코끼리가 집에 오면 가문이 번성한다고 봅니다.","큰 프로젝트가 생각보다 안정적으로 굴러갈 거예요."],
      ["원숭이","침팬지,원숭이가","흉","잔꾀와 가벼운 말을 뜻합니다. 원숭이가 장난치면 구설수, 원숭이를 쫓으면 번잡한 일이 정리됩니다.","말실수를 조심하라는 작은 경고예요."],
      ["거북이","자라,거북","길","장수와 꾸준한 복을 뜻합니다. 거북이를 보면 건강과 안정, 거북이가 집에 들어오면 재물이 따른다고 봅니다.","느리더라도 방향은 맞다는 뜻이에요."],
      ["개구리","두꺼비,개구리가","길","두꺼비와 개구리는 재물의 상징입니다. 두꺼비가 집에 들어오면 횡재, 개구리 울음은 좋은 소식으로 봅니다.","작은 수입이 늘어날 조짐이에요."],
      ["벌레","구더기,바퀴벌레,개미,애벌레,벌레가","중","구더기는 재물, 바퀴벌레는 근심을 뜻합니다. 벌레가 몸에서 나오면 병이 낫고, 벌레가 들끓으면 잔걱정이 많다고 봅니다.","신경 쓰이는 잔일이 쌓여 있으니 하나씩 지워 보세요."],
      ["벌","꿀벌,말벌,벌에,벌이","중","부지런함과 수확을 뜻합니다. 벌이 모여들면 재물, 벌에 쏘이면 구설이나 작은 사고를 조심합니다.","일이 많지만 결실도 함께 오는 시기예요."],
      ["나비","호랑나비,나비가","길","변화와 아름다운 인연을 뜻합니다. 나비가 날아오면 좋은 인연, 나비를 잡으면 사랑을 얻는다고 봅니다.","작은 변신을 시도하기 좋은 때예요."],
      ["거미","거미줄,거미가","중","거미줄은 재물이 얽혀 들어오는 그물로 봅니다. 거미를 보면 작은 재물, 거미줄에 걸리면 복잡한 일에 얽힌다고 봅니다.","정리되지 않은 관계나 업무가 있다는 뜻이에요."],
      ["상어","식인상어,상어가","흉","숨은 위험과 강한 경쟁자를 뜻합니다. 상어에게 쫓기면 압박, 상어를 잡으면 큰 승리로 봅니다.","불안한 일이 있다면 미리 대비하라는 신호예요."],
      ["고래","돌고래,고래가","길","큰 포부와 큰 재물을 뜻합니다. 고래를 타면 성공, 고래가 물을 뿜으면 명성을 얻는다고 봅니다.","꿈의 크기를 줄이지 말라는 뜻이에요."],
      ["사슴","노루,사슴이","길","순수한 복과 귀인을 뜻합니다. 사슴을 보면 좋은 인연, 사슴뿔을 얻으면 명예를 얻는다고 봅니다.","부드러운 사람과의 만남이 기다려요."],
      ["양","염소,양떼,양이,양을","길","온순한 복과 평화를 뜻합니다. 양떼를 보면 재산이 늘고, 양을 잃으면 작은 손해로 봅니다.","마음이 평화를 바라고 있어요."],
      ["오리","거위,백조,오리가","길","물 위의 새는 재물과 안정입니다. 오리떼는 가정의 화목, 백조는 고귀한 인연으로 봅니다.","가족과의 시간이 필요한 때예요."],
      ["악어","악어가","흉","숨은 적과 배신을 뜻합니다. 악어에게 물리면 뒤통수, 악어를 피하면 위기를 넘깁니다.","계약이나 약속은 서면으로 남기세요."],
      ["공룡","티라노,공룡이","중","거대한 과거의 힘, 오래된 문제를 뜻합니다. 공룡에게 쫓기면 묵은 스트레스, 공룡을 보면 큰 변화가 온다고 봅니다.","오래된 습관을 바꿀 때예요."],
      ["물","맑은 물,시냇물,물이,물을,물에,물속","길","맑은 물은 재물과 정화를 뜻합니다. 물을 마시면 건강, 흙탕물은 근심으로 봅니다.","마음을 씻어 내고 싶은 상태이니 쉬어도 돼요."],
      ["불","화재,불길,불꽃,불이,불을","길","불은 번영과 열정의 길몽입니다. 집에 불이 나면 사업 번창, 불이 꺼지면 의욕 저하로 봅니다.","뭔가 몰입할 대상이 생겼다는 뜻이에요."],
      ["바다","파도,해변,바닷가,바다가","중","넓은 바다는 큰 기회와 감정의 흐름입니다. 잔잔하면 평안, 거센 파도는 감정 기복을 뜻합니다.","요즘 감정의 파도가 큰지 살펴보세요."],
      ["산","등산,산꼭대기,정상,산을,산에","길","산은 목표와 권위를 뜻합니다. 산 정상에 오르면 성공, 산이 무너지면 뒷배를 잃는다고 봅니다.","목표가 눈앞에 보이기 시작했어요."],
      ["비","소나기,장마,폭우,비가,비를","길","비는 재물과 해갈을 뜻합니다. 비를 맞으면 복이 내리고, 폭우로 집이 잠기면 걱정이 몰린다고 봅니다.","막힌 일이 풀리는 때이니 조금만 기다리세요."],
      ["눈","폭설,눈사람,함박눈,눈이 내,눈이 오,눈이 쌓","길","흰 눈은 순수와 축복입니다. 눈이 소복이 쌓이면 재물, 눈길에 넘어지면 작은 실수를 조심합니다.","새하얀 시작, 깨끗하게 다시 시작해도 좋아요."],
      ["번개","천둥,벼락","중","번개는 갑작스러운 깨달음이나 큰 변화입니다. 벼락을 맞으면 큰 행운, 천둥이 치면 놀랄 일이 생깁니다.","번뜩이는 아이디어가 올 때이니 메모를 준비하세요."],
      ["꽃","꽃다발,꽃밭,벚꽃,장미,꽃이,꽃을","길","꽃은 사랑과 결실입니다. 꽃이 활짝 피면 경사, 꽃이 지면 이별이나 아쉬움으로 봅니다.","연애운이 올라오는 시기예요."],
      ["나무","큰 나무,고목,숲,나무가,나무를","길","나무는 성장과 가문의 번성입니다. 큰 나무에 오르면 출세, 나무가 쓰러지면 든든한 사람을 잃는다고 봅니다.","뿌리내리고 싶은 마음, 안정이 필요해요."],
      ["해","태양,일출,햇빛,해가 뜨,해를","길","해는 명예와 권위의 최고 상징입니다. 해를 삼키면 큰 인물의 태몽, 해가 지면 운이 기운다고 봅니다.","주목받을 일이 생기니 준비해 두세요."],
      ["달","보름달,초승달,달빛,달이,달을","길","달은 소원 성취와 명예입니다. 보름달은 원만한 성취, 달이 구름에 가리면 지연을 뜻합니다.","조용히 바라던 일이 이뤄질 조짐이에요."],
      ["별","별똥별,유성,별빛,별이,별을","길","별은 희망과 귀한 인연입니다. 별똥별은 소원 성취, 별이 떨어지면 아끼는 사람의 소식으로 봅니다.","작은 소원을 입 밖으로 내 보세요."],
      ["무지개","쌍무지개","길","무지개는 꿈과 희망의 다리입니다. 무지개를 보면 경사, 무지개 아래를 지나면 소원이 이뤄진다고 봅니다.","기다리던 좋은 소식이 와요."],
      ["바람","태풍,돌풍,바람이","중","바람은 변화와 소식입니다. 산들바람은 반가운 소식, 태풍은 큰 변동을 뜻합니다.","환경 변화가 생길 수 있으니 유연하게 대응하세요."],
      ["지진","땅울림,지진이","흉","지진은 기반이 흔들리는 변화입니다. 지진에서 살아남으면 전화위복, 집이 무너지면 큰 변동을 조심합니다.","불안의 근원을 찾아 정리해 보세요."],
      ["홍수","물난리,범람,홍수가","중","홍수는 넘치는 재물이거나 감당 못 할 감정입니다. 홍수를 건너면 큰 재물, 휩쓸리면 손실을 조심합니다.","감정이 넘치는 시기이니 글로 쏟아내 보세요."],
      ["안개","짙은 안개,안개가","흉","안개는 불확실함과 혼란입니다. 안개가 걷히면 일이 풀리고, 안개 속을 헤매면 결정을 미루라는 뜻입니다.","아직 정보가 부족하니 결정은 조금 뒤로 미루세요."],
      ["구름","먹구름,흰 구름,구름이","중","흰 구름은 평안, 먹구름은 근심입니다. 구름 위를 걸으면 출세, 먹구름이 몰리면 어려움을 예고합니다.","머리가 복잡한 상태, 산책이 답이에요."],
      ["하늘","푸른 하늘,맑은 하늘,하늘이,하늘을","길","하늘은 이상과 높은 뜻입니다. 하늘을 날면 성취, 하늘이 무너지면 큰 걱정으로 봅니다.","시야를 넓힐 때예요."],
      ["땅","흙,논밭,대지,땅이,땅을","길","땅은 재산과 터전입니다. 땅을 사면 재물, 땅이 꺼지면 기반이 흔들린다고 봅니다.","현실적인 기반을 다질 시기예요."],
      ["강","강물,개울,폭포,강을,강이","길","흐르는 물은 재물의 흐름입니다. 강을 건너면 난관 극복, 폭포는 큰 성취로 봅니다.","흐름을 타세요, 지금 역행하지 마세요."],
      ["연못","호수,우물,연못이","길","고인 물은 저축과 안정입니다. 맑은 호수는 평안, 우물이 마르면 재물 걱정으로 봅니다.","모아 둔 것을 점검할 때예요."],
      ["흙탕물","더러운 물,구정물,탁한 물","흉","탁한 물은 근심과 구설입니다. 흙탕물에 빠지면 곤란한 일, 흙탕물이 맑아지면 문제가 풀린다고 봅니다.","애매한 관계나 일을 정리해야 해요."],
      ["돌","바위,수석,돌을,돌이,돌에","길","돌은 단단한 재물입니다. 큰 바위를 얻으면 재물, 돌에 맞으면 구설을 조심합니다.","작지만 확실한 성과가 다가와요."],
      ["사막","모래,사막을","흉","메마른 땅은 외로움과 정체입니다. 사막을 헤매면 고독, 오아시스를 찾으면 희망을 뜻합니다.","재충전이 절실한 때예요."],
      ["동굴","굴,지하,동굴에","중","동굴은 숨은 무의식과 피난처입니다. 동굴에서 나오면 깨달음, 갇히면 답답한 상황을 뜻합니다.","혼자 생각할 시간이 필요해요."],
      ["죽음","죽는 꿈,장례식,시체,죽었,죽는,죽어","길","죽음은 새로운 시작을 뜻하는 역설적인 길몽입니다. 자신이 죽으면 새 출발, 아는 사람이 죽으면 그 사람에게 좋은 일이 생긴다고 봅니다.","지금의 역할을 끝내고 다음 단계로 가고 싶은 마음이에요."],
      ["결혼","결혼식,신부,신랑,웨딩","중","결혼은 새로운 결합과 책임입니다. 자신이 결혼하면 중요한 계약, 남의 결혼식은 경사 소식을 뜻합니다.","중요한 선택이 가까워졌어요."],
      ["임신","임산부,출산,임신했,임신을","길","임신은 새로운 계획과 성과입니다. 임신하면 큰 결실, 출산하면 결실이 완성된다고 봅니다.","준비 중인 프로젝트가 궤도에 올라요."],
      ["아기","갓난아기,신생아,아기가,아기를","길","아기는 새 희망과 복덩이입니다. 아기를 안으면 재물, 아기가 울면 걱정거리를 뜻합니다.","돌봐야 할 새 일이 생겨요."],
      ["시험","수능,면접,시험지,시험장,시험을","중","시험은 평가받는 상황입니다. 시험을 잘 보면 인정, 시험을 망치면 준비 부족 걱정으로 봅니다.","누군가에게 인정받고 싶은 마음이 커요."],
      ["이빨 빠짐","이빨,치아,이가 빠,앞니,어금니,송곳니","흉","이가 빠지면 가까운 사람의 근심이나 이별로 봅니다. 윗니는 윗사람, 아랫니는 아랫사람과 관련된다고 봅니다.","상실에 대한 불안이 있으니 소중한 사람에게 연락해 보세요."],
      ["머리카락","머리를 자르,머리를 감,탈모,머리가 빠,머리칼","중","머리카락은 생각과 근심입니다. 머리를 자르면 걱정을 덜고, 머리가 빠지면 기운이 빠진다고 봅니다.","뭔가 끊어 내고 싶은 때예요."],
      ["피","출혈,피가,피를,피 흘","길","피는 재물과 생명력입니다. 피를 흘리면 재물이 들어오고, 피를 보면 큰 이익을 얻는다고 봅니다.","에너지를 많이 쓰고 있으니 보충하세요."],
      ["똥","대변,배설,똥이,똥을,똥에,응가","길","똥은 가장 유명한 재물 길몽입니다. 똥을 밟거나 몸에 묻으면 횡재, 똥을 치우면 재물이 나간다고 봅니다.","쌓인 것을 비워 내는 중이니 속이 후련해질 거예요."],
      ["오줌","소변,오줌을","길","소변은 쌓인 것의 해소와 재물입니다. 시원하게 보면 근심 해소, 참으면 답답한 일이 있다고 봅니다.","참고 있는 말이 있다면 꺼내 보세요."],
      ["돈","지폐,현금,동전,돈을,돈이,만원,억","중","돈 꿈은 양면적입니다. 돈을 줍거나 받으면 재물, 돈을 잃으면 작은 손실을 조심합니다.","돈 걱정이 꿈까지 따라왔으니 가계부를 한 번 보세요."],
      ["울음","우는 꿈,눈물,통곡,울었,울고,울면서","길","울음은 응어리 해소입니다. 실컷 울면 좋은 일, 남이 울면 그 사람의 근심이 풀린다고 봅니다.","감정을 풀어낼 곳이 필요해요."],
      ["싸움","다툼,주먹,때리,싸웠,싸우","중","싸움은 갈등 해소의 과정입니다. 싸워서 이기면 문제 해결, 지면 양보할 일이 생깁니다.","참아 온 말이 있는지 돌아보세요."],
      ["추락","떨어지는,떨어졌,낙하,절벽","흉","추락은 불안과 통제 상실입니다. 떨어지다 깨면 걱정, 무사히 착지하면 위기를 넘깁니다.","쉬지 않고 달려왔다는 신호이니 속도를 줄이세요."],
      ["날기","하늘을 나,날았,날아다,비행,날아가","길","나는 꿈은 자유와 성취입니다. 높이 날면 큰 성공, 떨어질까 두려우면 자신감 부족을 뜻합니다.","해방감을 원하고 있으니 휴가 계획 어때요."],
      ["쫓김","쫓기는,쫓겨,도망,추격,쫓아","흉","쫓기는 꿈은 미뤄 둔 부담입니다. 끝까지 도망치면 걱정이 길어지고, 돌아서 맞서면 해결된다고 봅니다.","미뤄 둔 그 일에 이름을 붙여서 적어 보세요."],
      ["길 잃음","길을 잃,미아,헤매","중","길을 잃으면 방향을 고민하는 시기입니다. 길을 찾으면 해결책, 계속 헤매면 결정 미루기로 봅니다.","목표를 다시 적어 보면 길이 보여요."],
      ["지각","늦는 꿈,놓치는,버스를 놓,기차를 놓,늦었","흉","늦는 꿈은 기회에 대한 조바심입니다. 간신히 타면 기회를 잡고, 놓치면 준비를 더 하라는 뜻입니다.","일정을 너무 빡빡하게 잡았어요."],
      ["알몸","벌거벗,나체,옷을 안 입","중","알몸은 솔직함과 노출의 불안입니다. 부끄러우면 비밀 걱정, 당당하면 자신감을 뜻합니다.","드러내는 게 두려운 게 있군요, 생각보다 남들은 신경 안 써요."],
      ["키스","입맞춤,뽀뽀,키스를","길","입맞춤은 좋은 인연과 화해입니다. 좋아하는 사람과 하면 인연이 가까워지고, 모르는 사람과 하면 새 인연을 뜻합니다.","친밀함을 원하는 마음이에요."],
      ["옛 연인","전남친,전여친,헤어진,전 애인,옛날 애인,구남친,구여친","중","옛 인연은 마무리되지 않은 감정입니다. 화해하면 정리, 다시 싸우면 미련이 남았다고 봅니다.","그리운 건 그 사람이 아니라 그때의 나일 수 있어요."],
      ["연예인","아이돌,배우,가수,유명인","길","유명인은 인정 욕구와 행운입니다. 연예인과 친해지면 귀인, 같이 사진을 찍으면 좋은 기회로 봅니다.","주목받고 싶은 마음이니 작게라도 내 작업을 보여 주세요."],
      ["부모님","엄마,아빠,어머니,아버지,부모","길","부모는 보호와 조언입니다. 부모가 웃으면 집안 경사, 부모가 아프면 걱정을 뜻합니다.","안부 전화 한 통이면 마음이 편해져요."],
      ["돌아가신 분","조상,할머니,할아버지,고인,돌아가신","길","조상이 나타나면 돌봐 준다는 길몽입니다. 조상이 음식을 주면 재물, 조상이 손짓하면 조심하라는 뜻입니다.","그리움을 안고 사는 중이니 기억을 한 줄 적어 보세요."],
      ["친구","동창,옛 친구,친구가,친구와,친구랑","중","친구는 관계와 지지입니다. 친구와 웃으면 좋은 소식, 친구와 다투면 오해를 조심합니다.","그 친구 생각이 났다면 연락해 보세요."],
      ["모르는 사람","낯선 사람,타인,처음 보는","중","낯선 사람은 나의 숨은 모습입니다. 친절하면 좋은 인연, 위협적이면 불안을 뜻합니다.","아직 모르는 나의 가능성이에요."],
      ["도둑","강도,도난,훔치,훔쳐,도둑이","중","도둑은 역설적으로 재물이 들어오는 꿈입니다. 도둑을 잡으면 손실 회복, 도둑맞으면 오히려 횡재수로 봅니다.","뺏길까 불안한 것이 있군요, 백업부터 해 두세요."],
      ["경찰","순경,체포,경찰서,경찰이","중","경찰은 규칙과 양심입니다. 경찰이 도와주면 문제 해결, 체포되면 죄책감이 있다고 봅니다.","지켜야 할 약속이 마음에 걸려 있어요."],
      ["병원","아픈 꿈,입원,수술,의사,병에 걸","중","병든 꿈은 회복의 시작입니다. 병이 낫으면 문제 해결, 수술은 큰 변화로 봅니다.","몸이 쉬라고 말하고 있어요."],
      ["군대","입대,재입대,훈련소,군복","흉","군대 꿈은 억압과 답답함입니다. 재입대하면 반복되는 스트레스, 전역하면 해방을 뜻합니다.","지금의 환경이 숨 막히게 느껴진다는 뜻이에요."],
      ["학교","공부,숙제,교실,수업,선생님","중","학교 꿈은 성장 욕구입니다. 공부가 잘 풀리면 발전, 안 풀리면 압박감을 뜻합니다.","배우고 싶은 게 생겼으니 시작해 보세요."],
      ["수영","헤엄,잠수,수영을","길","물속을 헤엄치면 어려움을 헤쳐 나가는 길몽입니다. 잘 헤엄치면 성취, 가라앉으면 버거움을 뜻합니다.","감정 속에서 잘 버티고 있어요."],
      ["춤","춤추,댄스,춤을","길","춤은 기쁨과 어울림입니다. 즐겁게 추면 경사, 혼자 추면 외로움으로 봅니다.","즐거움을 허락해 주세요."],
      ["노래","노래를,노래방,노래하","길","노래는 표현과 소식입니다. 노래를 잘 부르면 인정, 목소리가 안 나오면 답답한 일이 있습니다.","하고 싶은 말이 있어요."],

    ];
    const TAG = { 길: ["g", "길몽"], 흉: ["b", "흉몽"], 중: ["n", "중립"] };

        '<div class="body"><small>전통 해석</small><p>' + e[3] + "</p><small>요즘 식으로</small><p>" + e[4] + "</p></div></div>";
    }

    // 오늘의 꿈 한 줄
    (function () {
      const e = Lab.pick(D, Lab.rng(Lab.hash("dream|" + Lab.today() + "|" + Math.floor(Math.random() * 1e6))));

    })();

    // 검색
    const listEl = document.getElementById("list"), cntEl = document.getElementById("cnt"), qEl = document.getElementById("q");
    function renderList(q) {
      q = (q || "").trim().replace(/\s+/g, "");
      let hits = [];
      if (!q) { hits = D.map((e, i) => i); cntEl.textContent = "총 " + D.length + "개의 꿈 단어가 있어요. 눌러서 펼쳐 보세요"; }
      else {
        D.forEach((e, i) => { if (terms(e).some(t => t.replace(/\s+/g, "").includes(q)) || e[3].includes(q) || e[4].includes(q)) hits.push(i); });
        // 키워드 직접 일치는 앞으로
        hits.sort((a, b) => (D[b][0].includes(q) ? 1 : 0) - (D[a][0].includes(q) ? 1 : 0));
        cntEl.textContent = hits.length ? hits.length + "개 찾았어요" : "아직 없는 단어예요. 비슷한 말로 다시 찾아보거나 아래 꿈 메모에 적어 보세요";
      }
      listEl.innerHTML = hits.slice(0, 40).map(i => entHtml(D[i], i, !!q && hits.length <= 3)).join("") + (hits.length > 40 ? '<div class="cnt">그 밖에 ' + (hits.length - 40) + "개 더 있어요. 검색어를 넣어 보세요</div>" : "");
      bindToggle(listEl);
    }
    qEl.addEventListener("input", () => renderList(qEl.value));
    const QUICK = ["뱀", "돼지", "똥", "이빨", "물", "불", "죽음", "시험", "쫓김", "돈"];

    document.querySelectorAll("#quick button").forEach(b => b.onclick = () => { qEl.value = b.textContent; renderList(qEl.value); });
    renderList("");

    // 꿈 메모에서 키워드 추출
    const PART = "(이|가|을|를|은|는|도|에|로|과|와|만|의|한테|에서|으로|까지|부터|들)";
    function matchText(text, term) {
      const t = term.replace(/\s+/g, "");
      const plain = text.replace(/\s+/g, "");
      if (t.length >= 2) return plain.includes(t);
      const esc = t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
      return new RegExp("(^|[^가-힣])" + esc + "($|[^가-힣]|" + PART + ")").test(text);
    }
    const INTRO = ["꿈 속 단서를 모아 봤어요", "어젯밤 꿈을 조각조각 읽어 봤어요", "꿈이 남긴 힌트를 꺼내 봤어요"];
    const VERDICT = {

      bad: ["조심하라는 신호가 섞여 있어요. 흉몽은 경고일 뿐이니 오늘 하루 천천히 가면 돼요", "걱정이 꿈에 묻어난 것 같아요. 무서운 꿈일수록 실제로는 마음의 정리 신호예요", "불안한 상징이 있지만 꿈은 반대로 풀리는 일도 많아요. 오늘은 확인을 한 번 더 하는 날로 삼으세요"],
      mixed: ["좋은 신호와 조심할 신호가 섞여 있어요. 흔들리는 가운데 기회가 숨어 있는 꿈이에요", "길과 흉이 함께 있는 꿈이에요. 하루의 흐름에 따라 어느 쪽으로든 갈 수 있어요", "엇갈리는 상징이에요. 꿈은 답이 아니라 질문이니 오늘의 선택이 방향을 정해요"],
      neutral: ["특별히 좋거나 나쁘다기보다 마음 상태를 비춘 꿈이에요. 요즘 생각이 많은지 돌아보세요", "중립적인 상징이 많아요. 꿈보다 지금 내 기분이 더 정확한 해몽이에요"]
    };
    document.getElementById("go").onclick = () => {
      const text = document.getElementById("memo").value.trim();
      if (!text) { Lab.toast("꿈 이야기를 한 줄이라도 적어 주세요"); return; }
      const found = [];
      D.forEach((e, i) => { if (terms(e).some(t => matchText(text, t))) found.push(i); });
      const g = found.filter(i => D[i][2] === "길").length, b = found.filter(i => D[i][2] === "흉").length;
      let verdict;
      if (!found.length) verdict = null;
      else if (g && !b) verdict = Lab.pick(VERDICT.good);
      else if (b && !g) verdict = Lab.pick(VERDICT.bad);
      else if (g && b) verdict = Lab.pick(VERDICT.mixed);
      else verdict = Lab.pick(VERDICT.neutral);
      const head = found.length ? "꿈에서 단서 " + found.length + "개를 찾았어요" : "아직 사전에 없는 꿈이에요";
      const html =
        '<span class="badge">' + Lab.today().replace(/-/g, ".") + " · 꿈 메모 풀이</span>" +
        "<h2>" + head + "</h2>" +
        (found.length ?
          '<div class="sum">' + found.map(i => '<span class="pill">' + D[i][0] + " " + TAG[D[i][2]][1] + "</span>").join("") + "</div>" +
          "<p>" + Lab.pick(INTRO) + ". " + verdict + ".</p>" +
          '<div class="list">' + found.map(i => entHtml(D[i], i, found.length <= 2)).join("") + "</div>" +
          '<p class="sub" style="margin-top:12px">각 단어를 누르면 전통 해석과 요즘 식 해석이 펼쳐져요.</p>'
          : "<p>사전에 있는 단어가 보이지 않았어요. 꿈에 나온 동물, 장소, 물건을 한 단어로 적으면 더 잘 찾아요.</p><p class=\"sub\">예: 뱀, 물, 집, 이빨, 시험, 쫓김</p>");
      const share = head + (found.length ? "\n" + found.map(i => D[i][0] + "(" + TAG[D[i][2]][1] + ")").join(", ") + "\n" + verdict : "");
      document.getElementById("form").hidden = true;
      Lab.result("out", html, share, () => { document.getElementById("form").hidden = false; document.getElementById("out").hidden = true; });
      bindToggle(document.getElementById("out"));
    };
  </script>
</body>
</html>
