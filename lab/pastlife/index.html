<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>전생 테스트</title>
  <meta name="description" content="생년월일과 태어난 시간대, 좋아하는 계절로 풀어 보는 나의 전생. 시대, 직업, 못 다 이룬 것, 이번 생에 남은 흔적까지.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🔮%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../lab.css">
  <script src="../config.js"></script>
  <script src="../lab.js"></script>
</head>
<body>
  <main class="lab">
    <div class="hero"><div class="emoji">🔮</div><h1>전생 테스트</h1><p>당신은 어느 시대, 어떤 사람으로 살았을까요</p></div>
    <div id="form" class="card">
      <label class="f" for="birth">생년월일</label>
      <input type="date" id="birth" min="1930-01-01" max="2025-12-31">
      <div class="row">
        <div>
          <label class="f" for="hour">태어난 시간대</label>
          <select id="hour">
            <option value="새벽">새벽 (0시~6시)</option>
            <option value="아침">아침 (6시~10시)</option>
            <option value="낮">낮 (10시~16시)</option>
            <option value="저녁">저녁 (16시~20시)</option>
            <option value="밤">밤 (20시~24시)</option>
            <option value="모름" selected>잘 모름</option>
          </select>
        </div>
        <div>
          <label class="f" for="season">좋아하는 계절</label>
          <select id="season">
            <option value="봄">봄</option>
            <option value="여름">여름</option>
            <option value="가을">가을</option>
            <option value="겨울">겨울</option>
          </select>
        </div>
      </div>
      <label class="f" for="initial">이름 첫 글자 (선택)</label>
      <input type="text" id="initial" placeholder="예: 지" maxlength="1">
      <button class="primary" id="go">전생 보기</button>
    </div>
    <div id="out" hidden></div>
  </main>
  <script>
    Lab.init({ id: "pastlife", title: "전생 테스트" });

    const ZODIAC = ["원숭이","닭","개","돼지","쥐","소","호랑이","토끼","용","뱀","말","양"];

    const ERAS = [
      { n: "고조선", d: "아침 안개가 걷히는 강가 마을. 청동 거울이 귀하던 시절이에요.", name: () => P(["한","단","우","비","해","마"]) + P(["아라","마루","누리","가온","다솔","온새","바우","새별"]) },
      { n: "삼국시대", d: "세 나라가 경쟁하던 시절, 성곽 아래 장터는 늘 소문으로 북적였어요.", name: () => P(["김","박","석","을","연","계","부여"]) + P(["미르","한울","수로","아진","세오","달기","모례","바리"]) },
      { n: "고려", d: "청자와 불경, 그리고 바다 건너 상인들이 드나들던 개경의 시대예요.", name: () => P(["왕","최","강","윤","서","문"]) + P(["은솔","여울","미리","하담","벼리","채운","서하","도령"]) },
      { n: "조선", d: "한양 골목에 종소리가 울리고, 저잣거리에는 엿장수와 책쾌가 지나다녔어요.", name: () => P(["이","김","정","윤","허","남궁","조"]) + P(["순복","막동","덕이","은비","삼월","연화","갑돌","분이"]) },
      { n: "르네상스 이탈리아", d: "피렌체 광장에 대리석 먼지가 날리고, 공방마다 천재가 하나씩 있던 시대예요.", name: () => P(["루카","마테오","루치아","비앙카","조반니","아우렐리아","코시모","키아라"]) + " " + P(["데 로시","벨리니","폰타나","모란디","바르바로","콘티"]) },
      { n: "에도 일본", d: "목판화 속 거리 풍경 그대로, 찻집과 목욕탕과 축제가 있던 시절이에요.", name: () => P(["사카이","미야모토","오카다","후지와라","이노우에","하야시"]) + " " + P(["하루","토모에","겐지로","사요","신노스케","아야메"]) },
      { n: "빅토리아 영국", d: "런던의 안개, 가스등, 증기기관차. 편지가 하루에 네 번 배달되던 시대예요.", name: () => P(["엘리너","아서","클라라","에드먼드","루이자","오스카","베아트리스","휴"]) + " " + P(["화이트필드","애쉬비","펨버튼","그레이","홀로웨이","밴스"]) },
      { n: "몽골 초원", d: "끝없는 초원과 게르, 말발굽 소리. 하늘이 제일 큰 집이던 시절이에요.", name: () => P(["알탄","바얀","체첵","나란","에르덴","사란"]) + P(["바타르","게렐","투야","호약","톨고이","수흐"]) },
      { n: "잉카 제국", d: "안데스 산맥 구름 위의 돌의 도시. 매듭으로 숫자를 기록하던 시대예요.", name: () => P(["아마루","키스페","쿠시","이야리","파차","와이라","킬라"]) + " " + P(["유팡키","코야","푸마","킬쿠","카파크","수마크"]) },
      { n: "고대 이집트", d: "나일강이 해마다 범람하고, 신전 벽에 하루하루가 새겨지던 시대예요.", name: () => P(["네페르","아몬","세네트","메리트","호테프","이시","네브","카"]) + P(["호테프","아문","카레","메스","엠하트","타위"]) },
      { n: "바이킹 북유럽", d: "긴 겨울밤과 피오르, 그리고 바다 너머를 꿈꾸던 긴 배의 시대예요.", name: () => P(["북쪽 피오르의","베르겐의","얼어붙은 호수의","바람 언덕의","긴 배의"]) + " " + P(["시그리드","에이나르","아스트리드","비요른","잉그리드","레이프","토르디스","하콘"]) },
      { n: "1920년대 상하이", d: "재즈와 전차, 치파오와 양복이 한 거리에 섞이던 동양의 파리예요.", name: () => P(["린","저우","장","쑤","천","왕"]) + " " + P(["메이링","즈하오","샤오란","원칭","루이","옥란","보원","징이"]) }
    ];
    let R = null; function P(arr) { return Lab.pick(arr, R); }

    const JOBS = [
      ["떠돌이 악사", "마을마다 노래 하나씩 남기고 떠났어요. 이름보다 곡조가 더 오래 기억됐어요."],
      ["궁중 요리사", "높은 분들의 입맛을 책임졌어요. 소금 한 꼬집의 차이를 아는 사람이었어요."],
      ["지도 제작자", "가 본 적 없는 땅을 그리며 늘 그 끝을 궁금해했어요."],
      ["약초꾼", "산을 제 집처럼 드나들며 어떤 잎이 어디에 좋은지 다 알았어요."],
      ["서기관", "남의 말을 받아 적는 게 일이었지만 자기 생각을 여백에 몰래 적었어요."],
      ["도공", "흙을 만지면 마음이 가라앉는 사람. 가마 앞에서 밤을 새우는 날이 많았어요."],
      ["염색 장인", "손끝이 늘 쪽빛이었어요. 색 하나를 위해 계절 하나를 기다릴 줄 알았어요."],
      ["뱃사람", "육지보다 바다에서 더 잘 자는 사람. 별을 보고 길을 찾았어요."],
      ["점성술사", "밤하늘을 보며 사람들의 내일을 말해 줬지만 정작 자기 내일은 몰랐어요."],
      ["시장 상인", "흥정의 달인. 하루에 백 명과 이야기하고도 지치지 않았어요."],
      ["정원사", "꽃보다 나무를, 나무보다 흙을 좋아했어요. 기다림이 직업이었어요."],
      ["이야기꾼", "장터 한가운데서 사람들을 울리고 웃겼어요. 결말은 늘 다음 날로 미뤘어요."],
      ["대장장이", "불과 쇠 앞에서 하루를 보냈어요. 말수는 적고 팔은 굵었어요."],
      ["보석 세공사", "작은 것을 오래 들여다보는 사람. 남들이 못 보는 흠을 찾아냈어요."],
      ["필경사", "책 한 권을 손으로 옮겨 쓰는 데 한 해를 썼어요. 글씨가 곧 자존심이었어요."],
      ["양치기", "양보다 구름을 더 자주 셌어요. 혼자 있는 법을 아는 사람이었어요."],
      ["등불지기", "해 질 녘마다 거리의 불을 하나씩 켰어요. 도시의 밤은 이 사람 손에서 시작됐어요."],
      ["무희", "춤출 때만 진짜 자기 자신이 되는 사람. 축제가 끝나면 조용히 사라졌어요."],
      ["통역관", "두 나라 말 사이에 서서 오해를 풀고 다녔어요. 가끔은 일부러 못 들은 척도 했어요."],
      ["밀수꾼", "국경과 규칙을 가볍게 넘나들었어요. 나쁜 사람은 아니었고, 그냥 자유로웠어요."],
      ["떠돌이 의원", "마을마다 들러 아픈 사람을 돌봤어요. 치료비 대신 밥 한 끼를 받는 날이 많았어요."],
      ["석공", "탑과 성벽을 쌓았어요. 자기가 올린 돌이 자기보다 오래 남을 걸 알았어요."],
      ["조향사", "냄새로 기억하는 사람. 향 하나로 누군가의 하루를 바꿨어요."],
      ["사냥꾼", "숲에서 발소리를 지우는 법을 알았어요. 필요한 만큼만 잡았어요."],
      ["궁수", "먼 것을 정확히 보는 눈. 활보다 기다림이 더 중요하다는 걸 알았어요."],
      ["재단사", "사람의 몸을 보면 옷이 먼저 떠올랐어요. 바느질 한 땀에 성격이 다 드러났어요."],
      ["천문 관측자", "밤에 깨어 있고 낮에 잤어요. 하늘이 움직이는 규칙을 적는 게 평생의 일이었어요."],
      ["떠돌이 화가", "풍경보다 사람 얼굴을 그렸어요. 그림값은 늘 받는 둥 마는 둥이었어요."],
      ["여관 주인", "오가는 사람들의 사연을 다 들었어요. 비밀을 지키는 게 진짜 직업이었어요."],
      ["파발꾼", "급한 소식을 들고 달렸어요. 소식의 내용보다 빨리 닿는 게 중요했어요."]
    ];
    const PERSONA = [
      "말보다 행동이 먼저인 사람이라 주변에서 늘 믿고 일을 맡겼어요.",
      "웃음이 많아 어딜 가나 사람이 모였지만 정작 속마음은 잘 안 보여 줬어요.",
      "고집이 세고 한 번 정하면 끝까지 갔어요. 그래서 이룬 것도, 놓친 것도 많았어요.",
      "조용하고 관찰력이 좋아서 남들이 놓친 걸 자주 발견했어요.",
      "호기심이 넘쳐 한자리에 오래 못 있었어요. 짐은 늘 가벼웠어요.",
      "정이 많아 남 일에 먼저 나섰고, 그 때문에 손해도 자주 봤어요.",
      "느긋하고 낙천적이라 큰일이 나도 '어떻게든 되겠지' 하고 웃었어요.",
      "완벽주의자라 남이 보기엔 끝난 일도 혼자 계속 다듬었어요.",
      "유머가 무기였어요. 어려운 자리일수록 농담 한마디로 분위기를 바꿨어요.",
      "겉은 차가워 보여도 한 번 마음을 준 사람에게는 끝까지 의리를 지켰어요.",
      "꿈이 커서 늘 지금보다 먼 곳을 봤어요. 발밑은 가끔 놓쳤지만요.",
      "손재주가 좋고 혼자 있는 걸 즐겼어요. 사람보다 물건과 대화가 잘 통했어요."
    ];
    const UNDONE = [
      "바다 건너 먼 나라를 직접 보는 것",
      "좋아한다고 말하지 못한 사람에게 그 한마디를 전하는 것",
      "평생 모은 이야기를 책 한 권으로 엮는 것",
      "고향에 돌아가 어머니가 해 준 음식을 다시 먹는 것",
      "자기 이름을 건 가게 하나를 여는 것",
      "하루 종일 아무 일도 하지 않고 쉬어 보는 것",
      "오래 미뤄 둔 사과를 하는 것",
      "눈 내리는 걸 처음부터 끝까지 지켜보는 것",
      "제자 한 명을 끝까지 키워 내는 것",
      "큰 축제에서 맨 앞에 서서 노래하는 것",
      "집 한 채를 자기 손으로 짓는 것",
      "멀리 떠난 친구와 다시 한 번 술잔을 나누는 것"
    ];
    const TRACE = [
      "낯선 도시에 가면 이유 없이 마음이 편해지는 것",
      "오래된 물건을 쉽게 못 버리는 버릇",
      "비 냄새를 맡으면 괜히 설레는 것",
      "처음 가는 길인데 어쩐지 와 본 것 같은 느낌",
      "손으로 뭔가 만들 때 시간 가는 줄 모르는 것",
      "밤하늘을 올려다보는 걸 유난히 좋아하는 것",
      "모르는 사람과도 금방 말을 트는 재주",
      "바다나 강 근처에 가면 오래 앉아 있게 되는 것",
      "음식 간을 맞추는 감각이 남다른 것",
      "지도나 길 찾기에 묘하게 강한 것",
      "누가 울면 먼저 다가가게 되는 성격",
      "혼자 걷는 긴 산책을 사랑하는 것"
    ];
    const BOND = [
      "지금 가장 자주 연락하는 사람일 가능성이 커요.",
      "처음 봤는데 낯이 익다고 느낀 사람을 떠올려 보세요.",
      "같은 농담에 같이 웃는 사람이면 거의 확실해요.",
      "오래 안 봐도 어색하지 않은 그 사람이에요.",
      "이유 없이 신경 쓰이는 사람, 그 사람이 맞아요.",
      "다투고도 금방 화해하게 되는 사람이에요."
    ];

    document.getElementById("go").onclick = () => {
      const b = document.getElementById("birth").value;
      if (!b) { Lab.toast("생년월일을 넣어 주세요"); return; }
      const hour = document.getElementById("hour").value;
      const season = document.getElementById("season").value;
      const init = document.getElementById("initial").value.trim();
      R = Lab.rng(Lab.hash([b, hour, season, init].join("|")));
      const z = ZODIAC[+b.slice(0, 4) % 12];
      const era = P(ERAS);
      const job = P(JOBS);
      const persona = P(PERSONA);
      const undone = P(UNDONE);
      const trace = P(TRACE);
      const bondZ = P(ZODIAC);
      const bond = P(BOND);
      const pname = era.name();
      const years = 28 + Math.floor(R() * 60);
      const html =
        '<span class="badge">' + z + "띠 · " + (hour === "모름" ? "시간 모름" : hour + "에 태어남") + " · " + season + "을 좋아함</span>" +
        '<div class="big">' + era.n + "</div>" +
        "<h2>" + era.n + "의 " + job[0] + "</h2>" +
        '<p><span class="pill">전생 이름 ' + pname + '</span><span class="pill">' + years + "년을 살다 감</span></p>" +
        "<p>" + era.d + " 당신은 그 시대의 <b>" + job[0] + "</b>이었어요. " + job[1] + "</p>" +
        "<p><b>전생의 성격</b><br>" + persona + "</p>" +
        "<p><b>전생에서 이루지 못한 것</b><br>" + undone + "</p>" +
        "<p><b>이번 생에 이어진 흔적</b><br>" + trace + "</p>" +
        "<p><b>전생 궁합</b><br>당신과 전생에 인연이 있던 사람은 <b>" + bondZ + "띠</b>예요. " + bond + "</p>" +
        '<p class="sub">같은 생일, 같은 시간대, 같은 계절을 넣으면 늘 같은 전생이 나와요. 친구 것도 같이 뽑아 보세요.</p>';
      const share = "나의 전생은 " + era.n + "의 " + job[0] + " (" + pname + ")\n이루지 못한 것: " + undone;
      document.getElementById("form").hidden = true;
      Lab.result("out", html, share, () => { document.getElementById("form").hidden = false; document.getElementById("out").hidden = true; window.scrollTo({ top: 0, behavior: "smooth" }); });
    };
    try { const saved = localStorage.getItem("lab.birth"); if (saved) document.getElementById("birth").value = saved; } catch (e) {}
    document.getElementById("birth").addEventListener("change", e => { try { localStorage.setItem("lab.birth", e.target.value); } catch (x) {} });
  </script>
</body>
</html>
