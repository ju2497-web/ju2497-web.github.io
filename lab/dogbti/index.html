<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>우리 강아지 성격 유형(견BTI)</title>
  <meta name="description" content="12가지 질문으로 알아보는 우리 강아지의 성격 유형. 16가지 견BTI와 잘 맞는 보호자 유형까지.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E🐶%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../lab.css">
  <script src="../config.js"></script>
  <script src="../lab.js"></script>
</head>
<body>
  <main class="lab">
    <div class="hero"><div class="emoji">🐶</div><h1>우리 강아지 성격 유형(견BTI)</h1><p>평소 모습 12가지만 고르면 우리 집 강아지의 유형이 나와요</p></div>
    <div id="form" class="card">
      <label class="f" for="dogname">강아지 이름 (선택)</label>
      <input type="text" id="dogname" placeholder="예: 콩이" maxlength="12">
      <p class="sub" style="color:var(--muted);font-size:.9rem;margin:12px 0 0">보호자가 생각하는 평소 모습으로 골라 주세요. 정답은 없고, 가장 가까운 쪽이면 충분해요.</p>
      <button class="primary" id="go">검사 시작</button>
    </div>
    <div id="quiz" hidden></div>
    <div id="out" hidden></div>
  </main>
  <script>
    Lab.init({ id: "dogbti", title: "우리 강아지 성격 유형(견BTI)" });

    const Q = [
      { q: "낯선 사람이 집에 오면?", a: [
        { t: "꼬리 흔들며 제일 먼저 마중 나가요", s: { E: 2 } },
        { t: "조금 지켜보다가 슬쩍 다가가요", s: { E: 1, I: 1 } },
        { t: "보호자 뒤에 숨거나 멀리서 지켜봐요", s: { I: 2 } } ] },
      { q: "산책을 나가면?", a: [
        { t: "늘 새로운 길로 가고 싶어 해요. 냄새도 다 맡아야 해요", s: { N: 2 } },
        { t: "익숙한 코스를 좋아하지만 가끔은 새 길도 괜찮아요", s: { N: 1, S: 1 } },
        { t: "매일 같은 코스, 같은 순서여야 마음이 편해요", s: { S: 2 } } ] },
      { q: "집에 혼자 남겨지면?", a: [
        { t: "문 앞에서 기다리거나 낑낑거려요", s: { F: 2 } },
        { t: "조금 서운해하다가 금방 자기 할 일 해요", s: { F: 1, T: 1 } },
        { t: "오히려 편하게 늘어져서 자요", s: { T: 2 } } ] },
      { q: "간식 앞에서는?", a: [
        { t: "앉아, 기다려를 완벽하게 수행해요", s: { J: 2 } },
        { t: "기다리긴 하는데 엉덩이가 들썩여요", s: { J: 1, P: 1 } },
        { t: "일단 먹고 생각해요", s: { P: 2 } } ] },
      { q: "다른 강아지를 만나면?", a: [
        { t: "먼저 다가가서 인사하고 놀자고 해요", s: { E: 2 } },
        { t: "상대가 다가오면 받아 주는 편이에요", s: { E: 1, I: 1 } },
        { t: "관심 없거나 멀찍이 떨어져요", s: { I: 2 } } ] },
      { q: "새 장난감을 주면?", a: [
        { t: "바로 물고 뜯고 온 집을 돌아다녀요", s: { N: 2, P: 1 } },
        { t: "냄새 맡고 살펴본 뒤 천천히 가지고 놀아요", s: { S: 1, J: 1 } },
        { t: "원래 쓰던 장난감이 최고예요. 새것은 한참 뒤에 손대요", s: { S: 2 } } ] },
      { q: "천둥이나 큰 소리가 나면?", a: [
        { t: "보호자 품으로 파고들어요", s: { F: 2 } },
        { t: "잠깐 긴장했다가 곧 괜찮아져요", s: { F: 1, T: 1 } },
        { t: "귀 한 번 쫑긋하고 다시 자요", s: { T: 2 } } ] },
      { q: "보호자가 울거나 기운이 없으면?", a: [
        { t: "얼굴을 핥거나 옆에 딱 붙어 있어요", s: { F: 2, E: 1 } },
        { t: "가까이 와서 조용히 앉아 있어요", s: { F: 1, I: 1 } },
        { t: "평소와 다름없이 자기 자리에 있어요", s: { T: 2 } } ] },
      { q: "이름을 부르면?", a: [
        { t: "어디서든 바로 달려와요", s: { J: 2, E: 1 } },
        { t: "쳐다보긴 하는데 올지 말지는 기분에 따라요", s: { P: 1, J: 1 } },
        { t: "들은 척 안 하다가 간식 소리에만 반응해요", s: { P: 2, T: 1 } } ] },
      { q: "목욕 시간에는?", a: [
        { t: "물놀이처럼 즐겨요", s: { N: 2, E: 1 } },
        { t: "싫어하지만 체념하고 가만히 있어요", s: { S: 1, J: 1 } },
        { t: "욕실 문 소리만 나도 도망가요", s: { S: 1, P: 1, I: 1 } } ] },
      { q: "밥 먹는 속도는?", a: [
        { t: "그릇 내려놓기 전에 끝나요", s: { P: 2 } },
        { t: "적당히 먹다가 남기기도 해요", s: { J: 1, P: 1 } },
        { t: "천천히 꼭꼭, 정해진 시간에만 먹어요", s: { J: 2 } } ] },
      { q: "잠은 어디서 자나요?", a: [
        { t: "보호자 이불 속, 가능하면 얼굴 옆", s: { F: 2 } },
        { t: "침대 발치나 방 안 자기 방석", s: { F: 1, T: 1 } },
        { t: "거실 한가운데나 현관 근처, 혼자 넓게", s: { T: 2, I: 1 } } ] }
    ];

    const TYPES = {
      ENFJ: { nick: "동네 인싸 골든리트리버형", desc: "사람도 강아지도 다 내 친구. 보호자의 기분을 제일 먼저 알아채고 옆에 와 앉는, 다정함이 특기인 강아지예요.", owner: "함께 자주 나가고 사람을 좋아하는 보호자. 강아지 모임, 카페 산책이 잘 어울려요.", care: "관심받지 못하면 금세 시무룩해져요. 바쁜 날에도 5분 눈맞춤은 꼭 챙겨 주세요." },
      ENFP: { nick: "산책길 축제 비글형", desc: "세상 모든 냄새가 궁금하고 모든 사람이 반가워요. 산책 한 번이 동네 축제가 되는 에너지 폭탄이에요.", owner: "체력 좋고 즉흥적인 외출을 즐기는 보호자. 새로운 산책 코스를 같이 개척하면 최고의 짝이에요.", care: "호기심이 앞서 길에서 이것저것 주워 먹을 수 있어요. 산책 땐 눈을 떼지 마세요." },
      ENTJ: { nick: "공원 대장 셰퍼드형", desc: "공원에 들어서면 먼저 상황 파악, 그 다음 지휘. 리더십 있고 규칙을 중시하며 할 일이 있을 때 가장 빛나요.", owner: "일관된 규칙으로 훈련하는 걸 즐기는 보호자. 노즈워크나 어질리티처럼 과제가 있는 놀이가 잘 맞아요.", care: "할 일이 없으면 스스로 일을 만들어요. 쿠션 해체 작업 같은 것으로요." },
      ENTP: { nick: "사고뭉치 잭러셀형", desc: "머리가 좋고 손(발)도 빨라요. 문 여는 법, 간식통 여는 법을 스스로 터득하는 발명가 타입이에요.", owner: "유연하고 유머 있는 보호자. 매번 다른 놀이를 준비해 줄 수 있으면 심심할 틈이 없어요.", care: "똑같은 훈련을 반복하면 금방 질려요. 규칙은 짧게, 놀이는 자주 바꿔 주세요." },
      ESFJ: { nick: "온 가족 치어리더 코기형", desc: "가족 모두를 챙기는 살림꾼. 누가 들어오면 반기고, 나가면 배웅하고, 식구들이 한자리에 모이면 제일 행복해해요.", owner: "집에 사람이 자주 드나드는 가족형 보호자. 아이들과도 잘 지내요.", care: "분위기에 민감해서 가족이 다투면 같이 불안해해요. 집안 분위기가 곧 강아지 컨디션이에요." },
      ESFP: { nick: "무대 체질 푸들형", desc: "사람들이 보고 있으면 묘기가 두 배로 늘어요. 애교와 재롱이 넘치는 타고난 연예인이에요.", owner: "리액션이 큰 보호자. 잘했다고 호들갑 떨어 주면 다음 날 더 잘해요.", care: "혼자 있는 시간을 유난히 힘들어해요. 외출 전 충분한 놀이로 에너지를 빼 주세요." },
      ESTJ: { nick: "집안 경비대장 진돗개형", desc: "문 앞, 창가, 현관 순찰은 내 임무. 규칙적이고 책임감이 강하며 가족을 지키는 일에 진심이에요.", owner: "생활 리듬이 일정한 보호자. 정해진 시간에 산책하고 밥 주면 더없이 든든한 파트너가 돼요.", care: "낯선 사람에게 경계가 강할 수 있어요. 어릴 때부터 다양한 사람을 만나는 경험이 중요해요." },
      ESTP: { nick: "공 던지면 끝 보더콜리형", desc: "공, 원반, 뛰는 것이라면 무엇이든. 몸으로 노는 게 세상에서 제일 좋은 운동선수 타입이에요.", owner: "같이 뛰어 줄 수 있는 활동적인 보호자. 러닝 메이트가 필요하다면 바로 이 강아지예요.", care: "운동량이 부족하면 집 안에서 에너지를 풀어요. 하루 산책은 선택이 아니라 필수예요." },
      INFJ: { nick: "조용한 수호자 세인트버나드형", desc: "시끄럽게 티 내지 않지만 늘 보호자가 보이는 자리에 있어요. 말없이 곁을 지키는 깊은 정의 소유자예요.", owner: "조용히 집에서 시간을 보내는 보호자. 책 읽을 때 발밑에 와서 자는 그림이 딱이에요.", care: "불편해도 표현을 잘 안 해요. 평소보다 조용하면 몸 상태를 한 번 살펴 주세요." },
      INFP: { nick: "무릎 위 시인 말티즈형", desc: "세상은 좀 무섭지만 보호자 무릎 위는 안전해요. 섬세하고 감성적이며 좋아하는 사람에게만 마음을 열어요.", owner: "차분하고 인내심 있는 보호자. 서두르지 않고 기다려 주면 세상에서 가장 깊은 신뢰를 보여 줘요.", care: "환경 변화에 예민해요. 이사나 가구 배치 변경은 천천히, 익숙한 담요와 함께." },
      INTJ: { nick: "창가의 철학자 시바형", desc: "창밖을 보며 깊은 생각에 잠기는 듯한 표정. 독립적이고 자기 루틴이 확실하며 쓸데없는 애교는 하지 않아요.", owner: "강아지의 공간을 존중하는 보호자. 억지로 안지 않고 기다려 주면 어느 날 먼저 와서 기대요.", care: "고집이 있어서 훈련이 더딜 수 있어요. 강요보다 보상이 훨씬 잘 통해요." },
      INTP: { nick: "혼자 노는 천재 바센지형", desc: "장난감 하나로 혼자 한 시간을 놀아요. 호기심은 많지만 사람보다 사물에 관심이 더 많은 연구자 타입이에요.", owner: "각자의 시간을 존중하는 보호자. 퍼즐 장난감이나 노즈워크를 준비해 주면 서로 행복해요.", care: "사회성이 부족해지기 쉬워요. 가끔은 다른 강아지와 만나는 자리를 만들어 주세요." },
      ISFJ: { nick: "그림자 집사 래브라도형", desc: "보호자가 움직이면 따라 움직이고, 앉으면 옆에 앉아요. 조용하지만 한결같은 헌신파예요.", owner: "안정적이고 규칙적인 생활을 하는 보호자. 매일 같은 시간에 같은 애정을 주면 평생 충성해요.", care: "보호자 중심이라 분리불안이 올 수 있어요. 혼자 있는 연습을 짧게부터 시작하세요." },
      ISFP: { nick: "햇살 담요 카발리에형", desc: "볕 좋은 자리를 찾아 누워 있는 게 하루 일과. 온화하고 부드러우며 다툼이라는 걸 몰라요.", owner: "느긋한 보호자. 주말 낮잠을 같이 자 줄 수 있으면 완벽해요.", care: "운동을 싫어해서 살이 찌기 쉬워요. 짧더라도 매일 걷게 해 주세요." },
      ISTJ: { nick: "규칙 지킴이 슈나우저형", desc: "밥 시간, 산책 시간, 잠자리 모두 정해진 대로. 그 규칙이 깨지면 눈빛으로 항의하는 원칙주의자예요.", owner: "계획적이고 성실한 보호자. 일정표대로 사는 사람과 찰떡이에요.", care: "갑작스러운 변화에 스트레스를 받아요. 여행이나 일정 변경 땐 평소 물건을 꼭 챙겨 주세요." },
      ISTP: { nick: "쿨한 룸메 그레이하운드형", desc: "필요할 때만 와서 쓰다듬 한 번 받고 돌아가요. 쿨하고 독립적이지만 결정적인 순간엔 옆에 있어요.", owner: "강아지를 하나의 인격으로 대하는 보호자. 과한 애정 표현보다 적당한 거리가 오히려 편해요.", care: "아파도 티를 안 내는 편이에요. 식욕이나 활동량 변화를 꾸준히 지켜봐 주세요." }
    };

    const AXES = [["E","I"],["N","S"],["F","T"],["J","P"]];
    const AXIS_LABEL = { E: "외향(E)", I: "내향(I)", N: "탐험(N)", S: "안정(S)", F: "애교(F)", T: "독립(T)", J: "계획(J)", P: "즉흥(P)" };

    function retry() {
      document.getElementById("form").hidden = false;
      document.getElementById("quiz").hidden = true;
      document.getElementById("out").hidden = true;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    document.getElementById("go").onclick = () => {
      const name = document.getElementById("dogname").value.trim() || "우리 강아지";
      document.getElementById("form").hidden = true;
      const quiz = document.getElementById("quiz");
      quiz.hidden = false;
      Lab.quiz("quiz", Q, scores => {
        quiz.hidden = true;
        let code = "";
        const pct = {};
        AXES.forEach(([a, b]) => {
          const va = scores[a] || 0, vb = scores[b] || 0;
          const pa = va + vb ? Math.round(va / (va + vb) * 100) : 50;
          const win = pa >= 50 ? a : b;
          code += win;
          pct[win] = win === a ? pa : 100 - pa;
        });
        const T = TYPES[code];
        const html =
          '<span class="badge">' + name + "의 견BTI</span>" +
          '<div class="big">' + code + "</div>" +
          "<h2>" + T.nick + "</h2>" +
          "<p>" + T.desc + "</p>" +
          Lab.bars(pct, AXIS_LABEL) +
          "<p><b>잘 맞는 보호자</b><br>" + T.owner + "</p>" +
          "<p><b>이것만은 조심</b><br>" + T.care + "</p>" +
          '<p class="sub">같은 답을 고르면 같은 결과가 나와요. 가족끼리 각자 해 보고 비교해도 재미있어요.</p>';
        const share = name + "의 견BTI는 " + code + " " + T.nick + "\n" + T.desc;
        Lab.result("out", html, share, retry);
      });
    };
  </script>
</body>
</html>
