<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>사주 오행 풀이</title>
  <meta name="description" content="생년월일시로 사주 네 기둥을 세우고 오행 비율과 타고난 성향을 읽어 드립니다.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E☯%3C/text%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../lab.css">
  <script src="../config.js"></script>
  <script src="../lab.js"></script>
  <style>
    .pillars { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin: 10px 0 14px; text-align: center; }
    .pillars div { background: var(--brand-soft); border-radius: 10px; padding: 8px 4px; }
    .pillars small { display: block; color: var(--muted); font-size: .72rem; }
    .pillars b { display: block; font-size: 1.3rem; line-height: 1.2; }
    .pillars span { font-size: .78rem; color: var(--muted); }
  </style>
</head>
<body>
  <main class="lab">
    <div class="hero"><div class="emoji">☯</div><h1>사주 오행 풀이</h1><p>네 기둥을 세우고 목·화·토·금·수 비율로 타고난 성향을 봅니다</p></div>
    <div id="form" class="card">
      <label class="f" for="birth">생년월일 (양력)</label>
      <input type="date" id="birth" min="1930-01-01" max="2025-12-31">
      <label class="f" for="hour">태어난 시간</label>
      <select id="hour">
        <option value="">모름 (시주 없이 봅니다)</option>
        <option value="0">자시 23:30~01:29</option><option value="1">축시 01:30~03:29</option>
        <option value="2">인시 03:30~05:29</option><option value="3">묘시 05:30~07:29</option>
        <option value="4">진시 07:30~09:29</option><option value="5">사시 09:30~11:29</option>
        <option value="6">오시 11:30~13:29</option><option value="7">미시 13:30~15:29</option>
        <option value="8">신시 15:30~17:29</option><option value="9">유시 17:30~19:29</option>
        <option value="10">술시 19:30~21:29</option><option value="11">해시 21:30~23:29</option>
      </select>
      <button class="primary" id="go">내 사주 보기</button>
      <p class="sub" style="font-size:.8rem;color:var(--muted);margin:10px 0 0">절기 경계는 평균 날짜로 계산합니다. 입춘·절입일 근처 생일은 실제와 한 칸 다를 수 있습니다.</p>
    </div>
    <div id="out" hidden></div>
  </main>
  <script>
    Lab.init({ id: "saju", title: "사주 오행 풀이" });
    const STEM = ["갑","을","병","정","무","기","경","신","임","계"];
    const STEM_H = ["甲","乙","丙","丁","戊","己","庚","辛","壬","癸"];
    const BRANCH = ["자","축","인","묘","진","사","오","미","신","유","술","해"];
    const BRANCH_H = ["子","丑","寅","卯","辰","巳","午","未","申","酉","戌","亥"];
    const STEM_EL = ["목","목","화","화","토","토","금","금","수","수"];
    const BRANCH_EL = ["수","토","목","목","토","화","화","토","금","금","토","수"];
    const EL_LABEL = { 목: "목(나무)", 화: "화(불)", 토: "토(흙)", 금: "금(쇠)", 수: "수(물)" };
    // 절입일(월지가 바뀌는 날) 평균치: [월, 일] 순서로 인월(2월)부터
    const TERMS = [[2,4],[3,6],[4,5],[5,6],[6,6],[7,7],[8,8],[9,8],[10,8],[11,7],[12,7],[1,6]];

    function jdn(y, m, d) { const a = Math.floor((14 - m) / 12); const yy = y + 4800 - a; const mm = m + 12 * a - 3; return d + Math.floor((153 * mm + 2) / 5) + 365 * yy + Math.floor(yy / 4) - Math.floor(yy / 100) + Math.floor(yy / 400) - 32045; }
    function monthIndex(m, d) { // 인월=0 … 축월=11
      for (let i = 11; i >= 0; i--) { const [tm, td] = TERMS[i]; if (i === 11) { if (m === 1 && d >= td) return 11; if (m === 1) return 10; } else if (m > tm || (m === tm && d >= td)) return i; }
      return 10; // 1월 절입 전 = 자월
    }
    function pillars(y, m, d, h) {
      const mi = monthIndex(m, d);
      const sy = (m === 1 || (m === 2 && d < TERMS[0][1])) ? y - 1 : y; // 입춘 전은 전년
      const ys = ((sy - 4) % 10 + 10) % 10, yb = ((sy - 4) % 12 + 12) % 12;
      const mb = (mi + 2) % 12, ms = ((ys % 5) * 2 + 2 + mi) % 10;
      const n = jdn(y, m, d) - 2415021; // 1900-01-01 = 갑술일
      const ds = ((n % 10) + 10) % 10, db = (((n + 10) % 12) + 12) % 12;
      const out = { year: [ys, yb], month: [ms, mb], day: [ds, db], hour: null };
      if (h !== "") { const hb = +h; out.hour = [((ds % 5) * 2 + hb) % 10, hb]; }
      return out;
    }
    const DAYMASTER = {
      갑: ["큰 나무", "곧게 위로 자라는 큰 나무입니다. 리더 기질과 책임감이 있고, 한번 정한 방향을 잘 바꾸지 않습니다. 융통성을 조금 더하면 사람이 모입니다."],
      을: ["풀과 꽃", "바람에 휘어도 꺾이지 않는 풀입니다. 적응이 빠르고 사람 마음을 잘 읽습니다. 다만 남 눈치에 내 뜻을 접는 일을 줄여야 합니다."],
      병: ["태양", "환하게 비추는 해입니다. 밝고 솔직하며 주변을 데웁니다. 열정이 과하면 금방 지치니 쉬는 날을 미리 정해 두세요."],
      정: ["촛불", "가까운 곳을 따뜻하게 밝히는 불입니다. 섬세하고 배려가 깊으며 한 사람에게 오래 집중합니다. 혼자 삭이는 버릇을 조심하세요."],
      무: ["큰 산", "묵직한 산입니다. 믿음직하고 포용력이 커 사람들이 기댑니다. 변화에 느린 편이니 작은 변화를 먼저 받아들여 보세요."],
      기: ["논밭", "무엇이든 키워 내는 기름진 땅입니다. 실속이 있고 현실 감각이 좋습니다. 걱정이 많아지면 몸부터 움직이는 것이 약입니다."],
      경: ["바위와 쇠", "단단한 쇠입니다. 결단이 빠르고 의리가 있으며 원칙을 지킵니다. 말이 날카로워질 때 한 박자 쉬면 관계가 오래갑니다."],
      신: ["보석", "다듬어진 보석입니다. 감각이 예리하고 완성도를 중시합니다. 스스로에게 엄격한 만큼 자신에게도 칭찬을 주세요."],
      임: ["큰 강과 바다", "넓고 깊은 물입니다. 생각이 크고 포용적이며 멀리 봅니다. 방향이 많으면 흩어지니 올해 한 줄기를 정하세요."],
      계: ["이슬비", "조용히 스며드는 비입니다. 직관이 좋고 섬세하며 조용한 영향력이 있습니다. 감정을 말로 꺼내는 연습이 도움이 됩니다."]
    };
    const EL_TEXT = {
      목: ["성장과 시작의 기운이 강합니다. 새로 벌이는 일에 강하고, 배우는 것을 좋아합니다.", "마무리보다 시작이 많아질 수 있습니다. 끝낸 일 목록을 적어 보세요."],
      화: ["표현과 열정의 기운이 강합니다. 사람 앞에 서는 일, 알리는 일에 힘이 납니다.", "급하게 결론 내리기 쉽습니다. 하루 재우고 보내는 습관이 좋습니다."],
      토: ["안정과 신뢰의 기운이 강합니다. 꾸준함으로 믿음을 얻고, 중재를 잘합니다.", "변화 앞에서 머뭇거릴 수 있습니다. 작은 실험을 자주 하세요."],
      금: ["결단과 정리의 기운이 강합니다. 기준이 분명하고 일을 깔끔하게 끝냅니다.", "엄격함이 관계를 차갑게 만들 수 있습니다. 칭찬을 먼저 건네 보세요."],
      수: ["지혜와 유연함의 기운이 강합니다. 흐름을 읽고 상황에 맞게 움직입니다.", "생각이 깊어지다 멈출 수 있습니다. 결정 마감일을 정해 두세요."]
    };
    const LACK = {
      목: "시작하는 힘을 보태면 좋습니다. 초록색, 아침 산책, 새 배움이 어울립니다.",
      화: "표현하는 힘을 보태면 좋습니다. 붉은 계열, 햇빛, 사람 만나는 자리가 어울립니다.",
      토: "중심을 잡는 힘을 보태면 좋습니다. 노란색·베이지, 규칙적인 식사, 흙 밟기가 어울립니다.",
      금: "맺고 끊는 힘을 보태면 좋습니다. 흰색·금속 소품, 정리 정돈, 마감 정하기가 어울립니다.",
      수: "쉬어 가는 힘을 보태면 좋습니다. 검정·남색, 물 가까이, 충분한 잠이 어울립니다."
    };
    function gz(p) { return STEM[p[0]] + BRANCH[p[1]]; }
    function gzH(p) { return STEM_H[p[0]] + BRANCH_H[p[1]]; }

    document.getElementById("go").onclick = () => {
      const b = document.getElementById("birth").value; const h = document.getElementById("hour").value;
      if (!b) { Lab.toast("생년월일을 넣어 주세요"); return; }
      const [y, m, d] = b.split("-").map(Number);
      const p = pillars(y, m, d, h);
      const cnt = { 목: 0, 화: 0, 토: 0, 금: 0, 수: 0 };
      [p.year, p.month, p.day, p.hour].filter(Boolean).forEach(x => { cnt[STEM_EL[x[0]]]++; cnt[BRANCH_EL[x[1]]]++; });
      const sorted = Object.keys(cnt).sort((a, c) => cnt[c] - cnt[a]);
      const strong = sorted[0], weak = sorted[sorted.length - 1];
      const dm = STEM[p.day[0]];
      const cell = (label, x) => '<div><small>' + label + '</small><b>' + (x ? gzH(x) : "－") + '</b><span>' + (x ? gz(x) : "모름") + "</span></div>";
      const html =
        '<span class="badge">' + b.replace(/-/g, ".") + (h !== "" ? " " + BRANCH[+h] + "시" : "") + "</span>" +
        '<h2>나의 일간은 ' + dm + "(" + STEM_H[p.day[0]] + "), " + DAYMASTER[dm][0] + "</h2>" +
        '<div class="pillars">' + cell("시주", p.hour) + cell("일주", p.day) + cell("월주", p.month) + cell("년주", p.year) + "</div>" +
        "<p>" + DAYMASTER[dm][1] + "</p>" +
        Lab.bars(cnt, EL_LABEL) +
        "<p><b>가장 강한 기운 " + EL_LABEL[strong] + "</b><br>" + EL_TEXT[strong][0] + " " + EL_TEXT[strong][1] + "</p>" +
        "<p><b>" + (cnt[weak] === 0 ? "비어 있는 기운 " : "가장 약한 기운 ") + EL_LABEL[weak] + "</b><br>" + LACK[weak] + "</p>" +
        '<p class="sub">일간(태어난 날의 천간)은 사주에서 "나"를 뜻합니다. 오행 비율은 여덟 글자 중 각 기운이 몇 개인지 센 것입니다.</p>';
      const share = "내 사주 일간은 " + dm + "(" + DAYMASTER[dm][0] + "), 가장 강한 기운은 " + EL_LABEL[strong] + "\n" + [p.year, p.month, p.day, p.hour].filter(Boolean).map(gzH).reverse().join(" ");
      document.getElementById("form").hidden = true;
      Lab.result("out", html, share, () => { document.getElementById("form").hidden = false; document.getElementById("out").hidden = true; });
    };
    try { const saved = localStorage.getItem("lab.birth"); if (saved) document.getElementById("birth").value = saved; } catch (e) {}
    document.getElementById("birth").addEventListener("change", e => { try { localStorage.setItem("lab.birth", e.target.value); } catch (x) {} });
  </script>
</body>
</html>
